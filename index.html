<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Vault</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/subscribe.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">🎮 Game Vault</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Game Vault</h1>
      <p>A collection of AI-generated video games</p>
    </section>

    <section class="controls">
      <div class="filter-bar">
        <label for="category-filter">Category:</label>
        <select id="category-filter">
          <option value="all">All</option>
        </select>
        <label for="sort-select">Sort:</label>
        <select id="sort-select">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="name">A–Z</option>
        </select>
      </div>
    </section>

    <section class="game-grid" id="game-grid">
    </section>

    <section class="subscribe-section">
      <h2>📬 Get Notified</h2>
      <p>Subscribe to hear about our next big release.</p>
      <form class="subscribe-form" id="subscribe-form">
        <input type="email" name="email" placeholder="your@email.com" required>
        <button type="submit">Subscribe</button>
      </form>
      <p class="subscribe-success" style="display:none;">🎮 You're in! We'll reach out when something big drops.</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Game Vault</p>
  </footer>
  <script src="js/subscribe.js"></script>
  <script src="js/games.js"></script>
</body>
</html>
