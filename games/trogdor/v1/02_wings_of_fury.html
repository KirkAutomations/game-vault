<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TROGDOR: WINGS OF FURY</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; image-rendering: pixelated; cursor: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ============================================================
// TROGDOR: WINGS OF FURY
// A side-scrolling flight game with epic chiptune soundtrack
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Responsive sizing
function resize() {
  const aspect = 16/9;
  let w = window.innerWidth, h = window.innerHeight;
  if (w/h > aspect) { w = h * aspect; } else { h = w / aspect; }
  canvas.width = 960; canvas.height = 540;
  canvas.style.width = Math.floor(w) + 'px';
  canvas.style.height = Math.floor(h) + 'px';
}
resize();
window.addEventListener('resize', resize);

const W = 960, H = 540;

// ============================================================
// AUDIO ENGINE
// ============================================================
let audioCtx = null;
let masterGain = null;
let musicPlaying = false;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.35;
  masterGain.connect(audioCtx.destination);
}

// Sound effects
function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const g = audioCtx.createGain();
  g.connect(masterGain);

  if (type === 'flap') {
    const o = audioCtx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(300, now);
    o.frequency.exponentialRampToValueAtTime(600, now + 0.05);
    o.frequency.exponentialRampToValueAtTime(200, now + 0.12);
    g.gain.setValueAtTime(0.15, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    o.connect(g); o.start(now); o.stop(now + 0.15);
  }
  else if (type === 'fire') {
    const bufSize = audioCtx.sampleRate * 0.3;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/bufSize, 2);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.setValueAtTime(2000, now);
    filt.frequency.exponentialRampToValueAtTime(200, now + 0.3);
    g.gain.setValueAtTime(0.2, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    src.connect(filt); filt.connect(g); src.start(now); src.stop(now + 0.35);
  }
  else if (type === 'explosion') {
    const bufSize = audioCtx.sampleRate * 0.5;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/bufSize, 1.5);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.setValueAtTime(1500, now);
    filt.frequency.exponentialRampToValueAtTime(100, now + 0.5);
    g.gain.setValueAtTime(0.3, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    src.connect(filt); filt.connect(g); src.start(now); src.stop(now + 0.5);
    // Sub bass thud
    const sub = audioCtx.createOscillator();
    sub.type = 'sine'; sub.frequency.setValueAtTime(80, now);
    sub.frequency.exponentialRampToValueAtTime(30, now + 0.4);
    const sg = audioCtx.createGain();
    sg.gain.setValueAtTime(0.3, now);
    sg.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    sub.connect(sg); sg.connect(masterGain); sub.start(now); sub.stop(now + 0.4);
  }
  else if (type === 'arrow') {
    const o = audioCtx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(1200, now);
    o.frequency.exponentialRampToValueAtTime(400, now + 0.15);
    g.gain.setValueAtTime(0.08, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    o.connect(g); o.start(now); o.stop(now + 0.18);
  }
  else if (type === 'hit') {
    const bufSize = audioCtx.sampleRate * 0.4;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/bufSize, 1);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    g.gain.setValueAtTime(0.4, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    src.connect(g); src.start(now); src.stop(now + 0.4);
    // Pain tone
    const o = audioCtx.createOscillator();
    o.type = 'square';
    o.frequency.setValueAtTime(200, now);
    o.frequency.exponentialRampToValueAtTime(80, now + 0.3);
    const og = audioCtx.createGain();
    og.gain.setValueAtTime(0.15, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    o.connect(og); og.connect(masterGain); o.start(now); o.stop(now + 0.35);
  }
  else if (type === 'score') {
    const notes = [523, 659, 784];
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator();
      o.type = 'square';
      o.frequency.value = f;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0, now + i*0.06);
      ng.gain.linearRampToValueAtTime(0.1, now + i*0.06 + 0.02);
      ng.gain.exponentialRampToValueAtTime(0.001, now + i*0.06 + 0.15);
      o.connect(ng); ng.connect(masterGain);
      o.start(now + i*0.06); o.stop(now + i*0.06 + 0.15);
    });
  }
}

// ============================================================
// EPIC CHIPTUNE MUSIC ENGINE
// ============================================================
class ChiptuneEngine {
  constructor() {
    this.bpm = 150;
    this.beatLen = 60 / this.bpm;
    this.barLen = this.beatLen * 4;
    this.schedulerTimer = null;
    this.nextNoteTime = 0;
    this.currentBeat = 0;
    this.currentBar = 0;
    this.currentSection = 0;
    this.oscs = [];
  }

  // Note frequencies
  noteFreq(note, octave) {
    const notes = { C:0,Cs:1,D:2,Ds:3,E:4,F:5,Fs:6,G:7,Gs:8,A:9,As:10,B:11 };
    const n = notes[note];
    return 440 * Math.pow(2, (n - 9) / 12 + (octave - 4));
  }

  nf(str) {
    // Parse note string like "C4", "Fs3", "As5"
    const match = str.match(/^([A-G]s?)(\d)$/);
    if (!match) return 0;
    return this.noteFreq(match[1], parseInt(match[2]));
  }

  // Create a note with envelope
  playNote(freq, startTime, duration, type, volume, dest) {
    if (!audioCtx || freq <= 0) return;
    const o = audioCtx.createOscillator();
    o.type = type;
    o.frequency.value = freq;
    const g = audioCtx.createGain();
    const attack = 0.01;
    const release = Math.min(0.05, duration * 0.3);
    g.gain.setValueAtTime(0, startTime);
    g.gain.linearRampToValueAtTime(volume, startTime + attack);
    g.gain.setValueAtTime(volume, startTime + duration - release);
    g.gain.linearRampToValueAtTime(0, startTime + duration);
    o.connect(g);
    g.connect(dest || masterGain);
    o.start(startTime);
    o.stop(startTime + duration + 0.01);
  }

  // Arpeggio helper
  playArp(notes, startTime, totalDur, type, volume, dest) {
    const noteLen = totalDur / notes.length;
    notes.forEach((n, i) => {
      if (n) this.playNote(this.nf(n), startTime + i * noteLen, noteLen * 0.9, type, volume, dest);
    });
  }

  // Drum sounds
  playKick(time) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, time);
    o.frequency.exponentialRampToValueAtTime(30, time + 0.15);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.35, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
    o.connect(g); g.connect(masterGain);
    o.start(time); o.stop(time + 0.2);
  }

  playSnare(time) {
    if (!audioCtx) return;
    const bufSize = audioCtx.sampleRate * 0.12;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/bufSize, 1.5);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'highpass'; filt.frequency.value = 1000;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.2, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
    src.connect(filt); filt.connect(g); g.connect(masterGain);
    src.start(time); src.stop(time + 0.12);
    // Tone
    const o = audioCtx.createOscillator();
    o.type = 'triangle'; o.frequency.value = 180;
    const og = audioCtx.createGain();
    og.gain.setValueAtTime(0.12, time);
    og.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
    o.connect(og); og.connect(masterGain);
    o.start(time); o.stop(time + 0.08);
  }

  playHiHat(time, open) {
    if (!audioCtx) return;
    const dur = open ? 0.15 : 0.05;
    const bufSize = audioCtx.sampleRate * dur;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/bufSize, open ? 1 : 3);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'highpass'; filt.frequency.value = 7000;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.08, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + dur);
    src.connect(filt); filt.connect(g); g.connect(masterGain);
    src.start(time); src.stop(time + dur);
  }

  playTom(time, freq) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, time);
    o.frequency.exponentialRampToValueAtTime(freq * 0.5, time + 0.2);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.2, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.25);
    o.connect(g); g.connect(masterGain);
    o.start(time); o.stop(time + 0.25);
  }

  // Schedule one beat of music
  scheduleBeat(time) {
    const beat = this.currentBeat;
    const bar = this.currentBar % 8;
    const section = Math.floor(this.currentBar / 8) % 4;
    const sixteenth = this.beatLen / 4;

    // ---- CHORD PROGRESSIONS ----
    // Section 0 & 2: I - V - vi - IV (C major: C - G - Am - F) - Heroic
    // Section 1: vi - IV - I - V (Am - F - C - G) - Soaring
    // Section 3: IV - V - vi - I (F - G - Am - C) - Triumphant climax
    const progressions = [
      [['C3','E3','G3'], ['G2','B2','D3'], ['A2','C3','E3'], ['F2','A2','C3']],
      [['A2','C3','E3'], ['F2','A2','C3'], ['C3','E3','G3'], ['G2','B2','D3']],
      [['C3','E3','G3'], ['G2','B2','D3'], ['A2','C3','E3'], ['F2','A2','C3']],
      [['F2','A2','C3'], ['G2','B2','D3'], ['A2','C3','E3'], ['C3','E3','G3']]
    ];

    // Key modulation: sections 2&3 shift up to D major
    const modProgressions = [
      [['C3','E3','G3'], ['G2','B2','D3'], ['A2','C3','E3'], ['F2','A2','C3']],
      [['A2','C3','E3'], ['F2','A2','C3'], ['C3','E3','G3'], ['G2','B2','D3']],
      [['D3','Fs3','A3'], ['A2','Cs3','E3'], ['B2','D3','Fs3'], ['G2','B2','D3']],
      [['G2','B2','D3'], ['A2','Cs3','E3'], ['B2','D3','Fs3'], ['D3','Fs3','A3']]
    ];

    const chordBar = bar % 4;
    const prog = this.currentBar >= 16 ? modProgressions[section] : progressions[section];
    const chord = prog[chordBar];

    // ---- ARPEGGIATED CHORDS (signature sound) ----
    // Fast arpeggios on pulse wave - creates the "flight" feeling
    const arpOctUp = chord.map(n => {
      const m = n.match(/^([A-G]s?)(\d)$/);
      return m[1] + (parseInt(m[2]) + 1);
    });
    const arpPattern = [...chord, ...arpOctUp, ...chord.slice().reverse(), ...arpOctUp.slice().reverse()];

    // Different arp rhythms per section
    if (section === 0 || section === 2) {
      // Sixteenth note arps
      for (let i = 0; i < 4; i++) {
        const noteIdx = (beat * 4 + i) % arpPattern.length;
        this.playNote(this.nf(arpPattern[noteIdx]), time + i * sixteenth, sixteenth * 0.8, 'square', 0.06);
      }
    } else if (section === 1) {
      // Eighth note arps with wider range
      for (let i = 0; i < 2; i++) {
        const noteIdx = (beat * 2 + i) % arpPattern.length;
        this.playNote(this.nf(arpPattern[noteIdx]), time + i * sixteenth * 2, sixteenth * 1.6, 'square', 0.07);
      }
    } else {
      // Climax: double arps
      for (let i = 0; i < 4; i++) {
        const noteIdx = (beat * 4 + i) % arpPattern.length;
        this.playNote(this.nf(arpPattern[noteIdx]), time + i * sixteenth, sixteenth * 0.7, 'square', 0.05);
        // Harmony arp a fifth up
        this.playNote(this.nf(arpPattern[(noteIdx + 2) % arpPattern.length]), time + i * sixteenth, sixteenth * 0.7, 'square', 0.04);
      }
    }

    // ---- HEROIC MELODY (triangle wave lead) ----
    const melodies = [
      // Section 0: Rising heroic theme
      [
        ['E4','E4','G4','G4', 'A4','A4','G4',null, 'F4','F4','E4','E4', 'D4','D4','C4',null],
        ['E4','E4','G4','G4', 'A4','A4','B4',null, 'C5','C5','B4','B4', 'A4','A4','G4',null],
        ['C5',null,'B4','A4', 'G4',null,'A4','G4', 'E4',null,'D4','E4', 'C4',null,null,null],
        ['C5',null,'D5','C5', 'B4',null,'A4','G4', 'A4',null,'G4',null, 'E4',null,null,null],
        ['E4','G4','A4','G4', 'E4','G4','A4','B4', 'C5','B4','A4','G4', 'A4','G4','E4',null],
        ['G4','A4','B4','C5', 'D5','C5','B4','A4', 'G4','A4','B4','C5', 'D5',null,'E5',null],
        ['E5','D5','C5','B4', 'A4','B4','C5','D5', 'E5',null,'D5',null, 'C5',null,null,null],
        ['C5','D5','E5','D5', 'C5','B4','A4','G4', 'A4',null,'B4',null, 'C5',null,null,null]
      ],
      // Section 1: Soaring exploration
      [
        ['A4',null,'C5','B4', 'A4',null,'G4',null, 'F4',null,'A4','G4', 'F4',null,'E4',null],
        ['A4',null,'C5','B4', 'A4',null,'B4',null, 'C5',null,'E5','D5', 'C5',null,'B4',null],
        ['C5','D5','E5',null, 'D5','C5','B4',null, 'A4','B4','C5',null, 'A4',null,null,null],
        ['E5',null,'D5','C5', 'B4',null,'A4','G4', 'A4',null,'B4',null, 'C5',null,null,null],
        ['A4','C5','E5','C5', 'A4','C5','E5','D5', 'C5','B4','A4','G4', 'A4',null,null,null],
        ['F4','A4','C5','A4', 'F4','A4','C5','D5', 'E5','D5','C5','B4', 'C5',null,null,null],
        ['C5','E5','G4','C5', 'E5','G4','C5','E5', 'D5','C5','B4','A4', 'G4',null,null,null],
        ['G4','B4','D5','B4', 'G4','B4','D5','E5', 'D5','C5','B4','A4', 'G4',null,null,null]
      ],
      // Section 2: Modulated heroic (D major)
      [
        ['Fs4','Fs4','A4','A4', 'B4','B4','A4',null, 'G4','G4','Fs4','Fs4', 'E4','E4','D4',null],
        ['Fs4','Fs4','A4','A4', 'B4','B4','Cs5',null, 'D5','D5','Cs5','Cs5', 'B4','B4','A4',null],
        ['D5',null,'Cs5','B4', 'A4',null,'B4','A4', 'Fs4',null,'E4','Fs4', 'D4',null,null,null],
        ['D5',null,'E5','D5', 'Cs5',null,'B4','A4', 'B4',null,'A4',null, 'Fs4',null,null,null],
        ['Fs4','A4','B4','A4', 'Fs4','A4','B4','Cs5', 'D5','Cs5','B4','A4', 'B4','A4','Fs4',null],
        ['A4','B4','Cs5','D5', 'E5','D5','Cs5','B4', 'A4','B4','Cs5','D5', 'E5',null,'Fs5',null],
        ['Fs5','E5','D5','Cs5', 'B4','Cs5','D5','E5', 'Fs5',null,'E5',null, 'D5',null,null,null],
        ['D5','E5','Fs5','E5', 'D5','Cs5','B4','A4', 'B4',null,'Cs5',null, 'D5',null,null,null]
      ],
      // Section 3: Triumphant climax
      [
        ['G4','B4','D5',null, 'D5','E5','D5',null, 'B4','D5','G5',null, 'G5','Fs5','E5',null],
        ['A4','Cs5','E5',null, 'E5','Fs5','E5',null, 'Cs5','E5','A5',null, 'A5','G5','Fs5',null],
        ['B4','D5','Fs5',null, 'Fs5','E5','D5',null, 'Cs5','D5','E5',null, 'Fs5',null,'G5',null],
        ['D5','Fs5','A5',null, 'G5','Fs5','E5','D5', 'Cs5','D5','E5','Fs5', 'D5',null,null,null],
        ['G4','A4','B4','D5', 'G5','Fs5','E5','D5', 'B4','D5','G5','Fs5', 'E5','D5','B4',null],
        ['A4','B4','Cs5','E5', 'A5','G5','Fs5','E5', 'Cs5','E5','A5','G5', 'Fs5','E5','Cs5',null],
        ['B4','Cs5','D5','Fs5', 'B5','A5','G5','Fs5', 'D5','Fs5','B5',null, 'A5',null,'G5',null],
        ['D5','E5','Fs5','A5', 'D5','Fs5','A5','D5', 'Fs5',null,'D5',null, 'A5',null,null,null]
      ]
    ];

    const melodyBar = melodies[section][bar];
    const noteIdx = beat * 4;
    for (let i = 0; i < 4; i++) {
      const note = melodyBar[noteIdx + i];
      if (note) {
        this.playNote(this.nf(note), time + i * sixteenth, sixteenth * 0.85, 'triangle', 0.1);
      }
    }

    // ---- BASS LINE ----
    const bassRoot = chord[0];
    const bassOct = bassRoot.match(/^([A-G]s?)(\d)$/);
    const bassNote = bassOct[1] + (parseInt(bassOct[2]) - 1);
    const bassFifth = chord[2] ? chord[2].match(/^([A-G]s?)(\d)$/) : null;
    const bassFifthNote = bassFifth ? bassFifth[1] + (parseInt(bassFifth[2]) - 1) : bassNote;

    if (section < 2) {
      // Steady eighth note bass
      if (beat === 0 || beat === 2) {
        this.playNote(this.nf(bassNote), time, this.beatLen * 0.9, 'sawtooth', 0.09);
      } else {
        this.playNote(this.nf(bassFifthNote), time, this.beatLen * 0.45, 'sawtooth', 0.07);
        this.playNote(this.nf(bassNote), time + this.beatLen * 0.5, this.beatLen * 0.4, 'sawtooth', 0.07);
      }
    } else {
      // Driving sixteenth bass for climax sections
      for (let i = 0; i < 4; i++) {
        const bn = (i % 2 === 0) ? bassNote : bassFifthNote;
        this.playNote(this.nf(bn), time + i * sixteenth, sixteenth * 0.7, 'sawtooth', 0.08);
      }
    }

    // ---- DRUMS ----
    // Kick pattern
    if (beat === 0 || beat === 2) {
      this.playKick(time);
    }
    if (section >= 2 && (beat === 1 || beat === 3)) {
      this.playKick(time + sixteenth * 2); // Double-time kick in climax
    }

    // Snare on 2 and 4
    if (beat === 1 || beat === 3) {
      this.playSnare(time);
    }

    // Hi-hat pattern
    for (let i = 0; i < 4; i++) {
      const open = (beat === 1 && i === 2) || (beat === 3 && i === 2);
      if (section < 2) {
        if (i % 2 === 0) this.playHiHat(time + i * sixteenth, open);
      } else {
        this.playHiHat(time + i * sixteenth, open); // Full 16th hats in climax
      }
    }

    // Tom fills every 8th bar
    if (bar === 7 && beat >= 2) {
      if (beat === 2) {
        this.playTom(time, 200);
        this.playTom(time + sixteenth * 2, 160);
      }
      if (beat === 3) {
        this.playTom(time, 140);
        this.playTom(time + sixteenth, 120);
        this.playTom(time + sixteenth * 2, 100);
        this.playTom(time + sixteenth * 3, 80);
      }
    }

    // ---- COUNTER-MELODY / HARMONY (square wave, soft) ----
    if (section >= 1 && bar % 2 === 0) {
      const harmNote = melodyBar[noteIdx];
      if (harmNote) {
        const hm = harmNote.match(/^([A-G]s?)(\d)$/);
        if (hm) {
          const harmBelow = hm[1] + (parseInt(hm[2]) - 1);
          if (beat % 2 === 0) {
            this.playNote(this.nf(harmBelow), time, this.beatLen * 0.8, 'square', 0.03);
          }
        }
      }
    }
  }

  scheduler() {
    while (this.nextNoteTime < audioCtx.currentTime + 0.1) {
      this.scheduleBeat(this.nextNoteTime);
      this.nextNoteTime += this.beatLen;
      this.currentBeat++;
      if (this.currentBeat >= 4) {
        this.currentBeat = 0;
        this.currentBar++;
        if (this.currentBar >= 32) this.currentBar = 0;
      }
    }
  }

  start() {
    if (!audioCtx) return;
    this.nextNoteTime = audioCtx.currentTime;
    this.currentBeat = 0;
    this.currentBar = 0;
    this.schedulerTimer = setInterval(() => this.scheduler(), 25);
    musicPlaying = true;
  }

  stop() {
    if (this.schedulerTimer) {
      clearInterval(this.schedulerTimer);
      this.schedulerTimer = null;
    }
    musicPlaying = false;
  }
}

const music = new ChiptuneEngine();

// ============================================================
// GAME STATE
// ============================================================
let state = 'title'; // title, playing, gameover
let score = 0;
let distance = 0;
let scrollSpeed = 2;
let difficulty = 1;
let titleAnim = 0;
let gameOverTimer = 0;
let shakeTimer = 0;
let shakeIntensity = 0;

// Input
let inputDown = false;
let fireDown = false;

// ============================================================
// TROGDOR
// ============================================================
const trog = {
  x: 200, y: 250,
  vy: 0, vx: 0,
  wingFrame: 0, wingTimer: 0,
  fireTimer: 0, fireCooldown: 0,
  burnRadius: 0,
  trail: [],
  invincible: 0,
  alive: true
};

// ============================================================
// GAME OBJECTS
// ============================================================
let particles = [];
let fireParticles = [];
let smokeColumns = [];
let obstacles = []; // towers, archers
let arrows = [];
let groundObjects = []; // cottages, peasants, fields
let clouds = [];
let mountains = [];
let stars = [];

// Parallax layers
let bgOffset = 0;
let midOffset = 0;
let fgOffset = 0;

function resetGame() {
  trog.x = 200; trog.y = 250;
  trog.vy = 0; trog.vx = 0;
  trog.wingFrame = 0; trog.wingTimer = 0;
  trog.fireTimer = 0; trog.fireCooldown = 0;
  trog.trail = [];
  trog.invincible = 0;
  trog.alive = true;
  score = 0; distance = 0; scrollSpeed = 2; difficulty = 1;
  particles = []; fireParticles = []; smokeColumns = [];
  obstacles = []; arrows = []; groundObjects = [];
  clouds = []; stars = [];
  shakeTimer = 0;

  // Generate initial clouds
  for (let i = 0; i < 15; i++) {
    clouds.push({ x: Math.random() * W * 2, y: 20 + Math.random() * 200, w: 40 + Math.random() * 80, speed: 0.2 + Math.random() * 0.5, opacity: 0.3 + Math.random() * 0.4 });
  }

  // Generate mountains
  mountains = [];
  for (let i = 0; i < 30; i++) {
    mountains.push({ x: i * 120 - 200, h: 80 + Math.random() * 120, w: 100 + Math.random() * 80 });

  for (let i = 0; i < 15; i++) {
    spawnGroundObject(400 + i * 150 + Math.random() * 100);
  }

  // Stars for background
  for (let i = 0; i < 40; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * 100, size: 1 + Math.random() * 2, twinkle: Math.random() * Math.PI * 2 });
  }
}

function spawnGroundObject(x) {
  const types = ['cottage', 'cottage', 'cottage', 'peasant', 'peasant', 'field', 'tree', 'windmill'];
  const type = types[Math.floor(Math.random() * types.length)];
  groundObjects.push({
    x: x, type: type,
    burning: false, burnTimer: 0, health: type === 'cottage' ? 2 : 1,
    frame: 0, scored: false, color: `hsl(${Math.random()*40+10}, 60%, 40%)`
  });
}

function spawnObstacle() {
  const r = Math.random();
  if (r < 0.4) {
    // Castle tower
    obstacles.push({
      type: 'tower', x: W + 50, y: H - 200,
      w: 50, h: 140 + Math.random() * 80,
      hasArcher: Math.random() < 0.5 + difficulty * 0.1,
      archerTimer: 60 + Math.random() * 60,
      hit: false
    });
  } else if (r < 0.7) {
    // Floating tower (higher up)
    obstacles.push({
      type: 'tower', x: W + 50, y: 150 + Math.random() * 200,
      w: 45, h: 100 + Math.random() * 60,
      hasArcher: true,
      archerTimer: 40 + Math.random() * 40,
      floating: true, hit: false
    });
  } else {
    // Catapult knight
    obstacles.push({
      type: 'catapult', x: W + 50, y: H - 140,
      w: 60, h: 40,
      fireTimer: 90 + Math.random() * 60,
      hit: false
    });
  }
}

// ============================================================
// DRAWING FUNCTIONS
// ============================================================

function drawSky() {
  // Sunset gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1a0533');
  grad.addColorStop(0.15, '#2d1b69');
  grad.addColorStop(0.3, '#6b2fa0');
  grad.addColorStop(0.45, '#c44b6c');
  grad.addColorStop(0.6, '#e8734a');
  grad.addColorStop(0.75, '#f4a832');
  grad.addColorStop(0.85, '#f7d562');
  grad.addColorStop(1, '#f4a832');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars (top portion)
  const t = Date.now() / 1000;
  stars.forEach(s => {
    const twink = 0.5 + 0.5 * Math.sin(t * 2 + s.twinkle);
    ctx.globalAlpha = twink * 0.7;
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.floor(s.x), Math.floor(s.y), Math.ceil(s.size), Math.ceil(s.size));
  });
  ctx.globalAlpha = 1;

  // Sun glow
  const sunX = W * 0.75 - bgOffset * 0.02;
  const sunY = H * 0.55;
  const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 150);
  sunGrad.addColorStop(0, 'rgba(255,240,200,0.6)');
  sunGrad.addColorStop(0.3, 'rgba(255,200,100,0.2)');
  sunGrad.addColorStop(1, 'rgba(255,150,50,0)');
  ctx.fillStyle = sunGrad;
  ctx.fillRect(0, 0, W, H);
}

function drawMountains() {
  // Far mountains (parallax layer 1)
  ctx.fillStyle = '#3d1f5c';
  mountains.forEach(m => {
    const mx = m.x - bgOffset * 0.15;
    const screenX = ((mx % (30*120)) + 30*120) % (30*120) - 200;
    ctx.beginPath();
    ctx.moveTo(screenX - m.w/2, H - 80);
    ctx.lineTo(screenX, H - 80 - m.h);
    ctx.lineTo(screenX + m.w/2, H - 80);
    ctx.fill();
  });

  // Near mountains (parallax layer 2)
  ctx.fillStyle = '#2a1040';
  for (let i = 0; i < 20; i++) {
    const mx = i * 150 - (midOffset * 0.3) % (20*150);
    const screenX = ((mx % (20*150)) + 20*150) % (20*150) - 200;
    const mh = 50 + Math.sin(i * 1.7) * 30;
    ctx.beginPath();
    ctx.moveTo(screenX - 70, H - 80);
    ctx.lineTo(screenX, H - 80 - mh);
    ctx.lineTo(screenX + 70, H - 80);
    ctx.fill();
  }
}

function drawClouds() {
  clouds.forEach(c => {
    const cx = ((c.x - bgOffset * c.speed) % (W + c.w * 2)) ;
    const screenX = cx < -c.w ? cx + W + c.w * 2 : cx;
    ctx.globalAlpha = c.opacity;
    ctx.fillStyle = '#f0d0e0';
    // Pixel cloud shape
    const s = c.w / 4;
    ctx.fillRect(screenX, c.y, c.w, s);
    ctx.fillRect(screenX + s, c.y - s, c.w - s*2, s);
    ctx.fillRect(screenX + s*0.5, c.y + s, c.w - s, s * 0.5);
    ctx.globalAlpha = 1;
  });
}

function drawGround() {
  // Ground layer
  const groundY = H - 80;
  ctx.fillStyle = '#2a5a1a';
  ctx.fillRect(0, groundY, W, 80);

  // Grass detail
  ctx.fillStyle = '#3a7a2a';
  for (let x = 0; x < W; x += 8) {
    const gx = (x + fgOffset * 0.5) % 16;
    if (gx < 8) ctx.fillRect(x, groundY, 4, 3);
  }

  // Path
  ctx.fillStyle = '#8a7a5a';
  ctx.fillRect(0, groundY + 20, W, 12);
  ctx.fillStyle = '#7a6a4a';
  for (let x = 0; x < W; x += 20) {
    const px = (x - fgOffset) % 20;
    ctx.fillRect(x + (px < 0 ? px + 20 : px) % 20, groundY + 22, 8, 2);
  }
}

function drawGroundObjects() {
  groundObjects.forEach(obj => {
    const sx = obj.x - fgOffset;
    if (sx < -80 || sx > W + 80) return;
    const gy = H - 80;

    if (obj.type === 'cottage') {
      // Pixel cottage
      const c = obj.burning ? '#5a2a1a' : '#8b6914';
      const roof = obj.burning ? '#3a1a0a' : '#8b1a1a';
      ctx.fillStyle = c;
      ctx.fillRect(sx, gy - 30, 32, 30);
      ctx.fillStyle = roof;
      // Roof
      for (let i = 0; i < 8; i++) {
        ctx.fillRect(sx - i*2 + 16, gy - 30 - i*2, 32 - (8-i)*(-2) + i*4 - 32 + 32, 2);
      }
      ctx.fillRect(sx - 4, gy - 38, 40, 2);
      ctx.fillRect(sx, gy - 42, 32, 4);
      ctx.fillRect(sx + 4, gy - 46, 24, 4);
      // Door
      ctx.fillStyle = '#4a3a1a';
      ctx.fillRect(sx + 12, gy - 16, 8, 16);
      // Window
      ctx.fillStyle = obj.burning ? '#ff6a1a' : '#aad4ff';
      ctx.fillRect(sx + 4, gy - 24, 6, 6);
      ctx.fillRect(sx + 22, gy - 24, 6, 6);

      if (obj.burning) {
        // Flames
        const t = Date.now() / 100;
        for (let i = 0; i < 5; i++) {
          const fx = sx + 4 + Math.random() * 24;
          const fy = gy - 40 - Math.sin(t + i) * 10 - Math.random() * 15;
          ctx.fillStyle = Math.random() > 0.5 ? '#ff4400' : '#ffaa00';
          ctx.fillRect(fx, fy, 4, 6 + Math.random() * 8);
        }
      }
    }
    else if (obj.type === 'peasant') {
      if (obj.burning) return; // peasant fled or burned
      // Pixel peasant
      ctx.fillStyle = '#ddb896';
      ctx.fillRect(sx + 2, gy - 16, 4, 4); // head
      ctx.fillStyle = '#5577aa';
      ctx.fillRect(sx + 1, gy - 12, 6, 8); // body
      ctx.fillStyle = '#ddb896';
      ctx.fillRect(sx, gy - 10, 2, 4); // arms
      ctx.fillRect(sx + 6, gy - 10, 2, 4);
      ctx.fillStyle = '#553311';
      ctx.fillRect(sx + 1, gy - 4, 2, 4); // legs
      ctx.fillRect(sx + 5, gy - 4, 2, 4);
      // Animate walking
      const walk = Math.sin(Date.now() / 200 + obj.x) > 0;
      if (walk) { ctx.fillRect(sx, gy - 4, 2, 4); ctx.fillRect(sx + 6, gy - 2, 2, 2); }
    }
    else if (obj.type === 'field') {
      // Wheat field
      const fc = obj.burning ? '#4a2a0a' : '#c4a020';
      ctx.fillStyle = fc;
      ctx.fillRect(sx, gy - 8, 48, 8);
      ctx.fillStyle = obj.burning ? '#6a3a1a' : '#d4b830';
      for (let i = 0; i < 12; i++) {
        const h = 6 + Math.sin(Date.now()/300 + i) * 3;
        ctx.fillRect(sx + i*4, gy - 8 - h, 2, h);
      }
      if (obj.burning) {
        for (let i = 0; i < 3; i++) {
          ctx.fillStyle = ['#ff4400','#ffaa00','#ff6600'][i];
          ctx.fillRect(sx + Math.random()*40, gy - 12 - Math.random()*10, 3, 5);
        }
      }
    }
    else if (obj.type === 'tree') {
      // Pine tree
      const tc = obj.burning ? '#4a2a0a' : '#1a6a1a';
      ctx.fillStyle = '#5a3a1a';
      ctx.fillRect(sx + 4, gy - 12, 4, 12);
      ctx.fillStyle = tc;
      for (let i = 0; i < 3; i++) {
        const tw = 16 - i * 2;
        ctx.fillRect(sx + 6 - tw/2, gy - 20 - i*8, tw, 10);
      }
      if (obj.burning) {
        for (let i = 0; i < 4; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? '#ff4400' : '#ffaa00';
          ctx.fillRect(sx + Math.random()*12, gy - 30 - Math.random()*15, 3, 6);
        }
      }
    }
    else if (obj.type === 'windmill') {
      // Windmill
      const wc = obj.burning ? '#5a3a2a' : '#c8b890';
      ctx.fillStyle = wc;
      ctx.fillRect(sx + 6, gy - 40, 16, 40);
      ctx.fillStyle = obj.burning ? '#4a2a1a' : '#8b6914';
      ctx.fillRect(sx + 2, gy - 44, 24, 6);
      // Blades
      if (!obj.burning) {
        ctx.save();
        ctx.translate(sx + 14, gy - 32);
        ctx.rotate(Date.now() / 500);
        ctx.fillStyle = '#a09070';
        for (let i = 0; i < 4; i++) {
          ctx.rotate(Math.PI / 2);
          ctx.fillRect(-2, 0, 4, 20);
        }
        ctx.restore();
      }
      if (obj.burning) {
        for (let i = 0; i < 6; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? '#ff4400' : '#ffaa00';
          ctx.fillRect(sx + 4 + Math.random()*16, gy - 44 - Math.random()*15, 4, 8);
        }
      }
    }
  });
}

function drawObstacles() {
  obstacles.forEach(obs => {
    const sx = obs.x - fgOffset;
    if (sx < -80 || sx > W + 80) return;

    if (obs.type === 'tower') {
      const topY = obs.floating ? obs.y : H - 80 - obs.h;
      const botY = obs.floating ? obs.y + obs.h : H - 80;

      // Tower body
      ctx.fillStyle = '#667788';
      ctx.fillRect(sx, topY, obs.w, obs.h);
      // Stone detail
      ctx.fillStyle = '#778899';
      for (let row = 0; row < obs.h; row += 10) {
        for (let col = 0; col < obs.w; col += 12) {
          const off = (row / 10 % 2) * 6;
          ctx.fillRect(sx + (col + off) % obs.w, topY + row, 10, 8);
        }
      }
      // Battlements
      ctx.fillStyle = '#556677';
      for (let i = 0; i < obs.w; i += 10) {
        if (i % 20 < 10) ctx.fillRect(sx + i, topY - 8, 10, 8);
      }
      // Window
      ctx.fillStyle = '#222';
      ctx.fillRect(sx + obs.w/2 - 4, topY + 12, 8, 12);
      ctx.fillStyle = '#ffa';
      ctx.fillRect(sx + obs.w/2 - 2, topY + 14, 4, 8);

      // Archer
      if (obs.hasArcher) {
        ctx.fillStyle = '#8b1a1a';
        ctx.fillRect(sx + obs.w/2 - 4, topY - 16, 8, 8);
        ctx.fillStyle = '#ddb896';
        ctx.fillRect(sx + obs.w/2 - 3, topY - 20, 6, 5);
        // Bow
        ctx.fillStyle = '#5a3a1a';
        ctx.fillRect(sx + obs.w/2 + 4, topY - 18, 2, 10);
      }

      // Floating tower support (chains)
      if (obs.floating) {
        ctx.fillStyle = '#556';
        ctx.fillRect(sx + 10, botY, 2, 20);
        ctx.fillRect(sx + obs.w - 12, botY, 2, 20);
      }
    }
    else if (obs.type === 'catapult') {
      const topY = obs.y;
      // Base
      ctx.fillStyle = '#5a3a1a';
      ctx.fillRect(sx, topY, obs.w, 12);
      // Wheels
      ctx.fillStyle = '#3a2a1a';
      ctx.fillRect(sx + 4, topY + 10, 10, 10);
      ctx.fillRect(sx + obs.w - 14, topY + 10, 10, 10);
      // Arm
      ctx.fillStyle = '#7a5a3a';
      ctx.fillRect(sx + obs.w/2 - 2, topY - 30, 4, 32);
      // Knight
      ctx.fillStyle = '#888';
      ctx.fillRect(sx + 8, topY - 16, 10, 16);
      ctx.fillStyle = '#ddb896';
      ctx.fillRect(sx + 9, topY - 22, 8, 6);
      ctx.fillStyle = '#666';
      ctx.fillRect(sx + 8, topY - 24, 10, 4);
    }
  });
}

function drawArrows() {
  arrows.forEach(a => {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(Math.atan2(a.vy, a.vx));
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(-8, -1, 16, 2);
    // Arrowhead
    ctx.fillStyle = '#aaa';
    ctx.beginPath();
    ctx.moveTo(8, -3);
    ctx.lineTo(12, 0);
    ctx.lineTo(8, 3);
    ctx.fill();
    // Fletching
    ctx.fillStyle = '#c44';
    ctx.fillRect(-8, -3, 3, 2);
    ctx.fillRect(-8, 1, 3, 2);
    ctx.restore();
  });
}

function drawTrogdor() {
  if (!trog.alive) return;
  const sx = trog.x;
  const sy = trog.y;
  const flash = trog.invincible > 0 && Math.floor(trog.invincible / 4) % 2;
  if (flash) return;

  // Fire trail
  trog.trail.forEach((t, i) => {
    const alpha = i / trog.trail.length;
    ctx.globalAlpha = alpha * 0.6;
    const size = 4 + (1-alpha) * 8;
    ctx.fillStyle = `hsl(${20 + alpha * 30}, 100%, ${50 + alpha * 30}%)`;
    ctx.fillRect(t.x - size/2, t.y - size/2 + Math.random()*4, size, size);
  });
  ctx.globalAlpha = 1;

  // Body
  ctx.fillStyle = '#2a8a2a';
  ctx.fillRect(sx - 12, sy - 6, 28, 14);
  ctx.fillRect(sx - 16, sy - 4, 4, 10);

  // Belly
  ctx.fillStyle = '#4aba4a';
  ctx.fillRect(sx - 8, sy, 20, 6);

  // Head
  ctx.fillStyle = '#2a8a2a';
  ctx.fillRect(sx + 16, sy - 10, 14, 16);
  // Snout
  ctx.fillRect(sx + 28, sy - 6, 8, 8);
  // Eye
  ctx.fillStyle = '#ff0';
  ctx.fillRect(sx + 24, sy - 8, 4, 4);
  ctx.fillStyle = '#000';
  ctx.fillRect(sx + 25, sy - 7, 2, 2);
  // Nostril
  ctx.fillStyle = '#1a6a1a';
  ctx.fillRect(sx + 33, sy - 4, 2, 2);

  // Teeth
  ctx.fillStyle = '#fff';
  ctx.fillRect(sx + 28, sy, 2, 3);
  ctx.fillRect(sx + 32, sy, 2, 3);

  // Beefy arm (THE consummate V!)
  ctx.fillStyle = '#2a8a2a';
  ctx.fillRect(sx + 8, sy + 6, 4, 10);
  ctx.fillRect(sx + 10, sy + 14, 6, 3);
  // Muscles
  ctx.fillStyle = '#3a9a3a';
  ctx.fillRect(sx + 9, sy + 8, 2, 4);

  // Wings (animated)
  const wingUp = trog.wingFrame < 0.5;
  ctx.fillStyle = '#1a7a1a';
  if (wingUp) {
    // Wings up
    ctx.fillRect(sx - 4, sy - 18, 16, 4);
    ctx.fillRect(sx - 2, sy - 22, 12, 4);
    ctx.fillRect(sx, sy - 14, 8, 4);
    // Wing membrane
    ctx.fillStyle = '#3aba3a';
    ctx.fillRect(sx, sy - 16, 10, 2);
    ctx.fillRect(sx + 2, sy - 20, 8, 2);
  } else {
    // Wings down
    ctx.fillRect(sx - 4, sy - 8, 16, 4);
    ctx.fillRect(sx - 2, sy + 2, 12, 4);
    ctx.fillRect(sx, sy - 4, 8, 4);
    ctx.fillStyle = '#3aba3a';
    ctx.fillRect(sx, sy - 6, 10, 2);
    ctx.fillRect(sx + 2, sy + 2, 8, 2);
  }

  // Tail with spikes
  ctx.fillStyle = '#2a8a2a';
  ctx.fillRect(sx - 20, sy - 2, 8, 6);
  ctx.fillRect(sx - 26, sy, 8, 4);
  // Tail spike
  ctx.fillStyle = '#ff4400';
  ctx.fillRect(sx - 30, sy - 2, 6, 3);
  ctx.fillRect(sx - 34, sy - 1, 4, 2);

  // Spines along back
  ctx.fillStyle = '#ff6600';
  for (let i = 0; i < 4; i++) {
    ctx.fillRect(sx - 4 + i*6, sy - 10 - (wingUp ? 2 : 0), 3, 4);
  }

  // Fire breath
  if (fireDown && trog.fireCooldown <= 0) {
    const fireLen = 30 + Math.random() * 20;
    for (let i = 0; i < fireLen; i += 4) {
      const spread = i * 0.3 + Math.random() * 4;
      ctx.fillStyle = i < fireLen * 0.4 ? '#fff' : (i < fireLen * 0.7 ? '#ffaa00' : '#ff4400');
      ctx.fillRect(sx + 36 + i, sy - 4 + Math.random() * spread - spread/2, 4 + Math.random()*3, 3 + Math.random()*3);
    }
    // Down-fire when swooping
    if (trog.vy > 1) {
      for (let i = 0; i < 20; i += 4) {
        ctx.fillStyle = i < 8 ? '#ffaa00' : '#ff4400';
        ctx.fillRect(sx + 30 + Math.random()*10, sy + 8 + i, 4, 4);
      }
    }
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });

  fireParticles.forEach(p => {
    ctx.globalAlpha = p.life / p.maxLife * 0.8;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });

  ctx.globalAlpha = 1;

  // Smoke columns
  smokeColumns.forEach(s => {
    ctx.globalAlpha = 0.3 * (s.life / s.maxLife);
    ctx.fillStyle = '#444';
    for (let i = 0; i < 5; i++) {
      const yy = s.y - i * 12 - Math.sin(Date.now()/300 + i) * 4;
      const size = 6 + i * 3;
      ctx.fillRect(s.x - fgOffset - size/2 + Math.sin(Date.now()/500 + i*2) * 3, yy, size, size);
    }
    ctx.globalAlpha = 1;
  });
}

function drawHUD() {
  // Score
  ctx.fillStyle = '#fff';
  ctx.font = '20px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE: ' + score, 16, 30);
  ctx.fillText('DIST: ' + Math.floor(distance) + 'm', 16, 52);

  // Burnination meter
  const burnCount = groundObjects.filter(o => o.burning).length;
  ctx.fillStyle = '#fff';
  ctx.fillText('BURNINATION', W - 200, 30);
  ctx.fillStyle = '#333';
  ctx.fillRect(W - 200, 36, 180, 10);
  ctx.fillStyle = burnCount > 5 ? '#ff4400' : '#ffaa00';
  ctx.fillRect(W - 200, 36, Math.min(180, burnCount * 18), 10);
}

function drawTitleScreen() {
  drawSky();
  drawClouds();
  drawMountains();
  drawGround();

  titleAnim += 0.02;

  // Title
  ctx.save();
  ctx.textAlign = 'center';

  // Glow effect
  ctx.shadowColor = '#ff4400';
  ctx.shadowBlur = 20 + Math.sin(titleAnim * 3) * 10;

  ctx.font = 'bold 56px monospace';
  ctx.fillStyle = '#ff6600';
  ctx.fillText('TROGDOR', W/2, 140);

  ctx.font = 'bold 36px monospace';
  ctx.fillStyle = '#ffcc00';
  ctx.fillText('WINGS OF FURY', W/2, 190);

  ctx.shadowBlur = 0;

  // Trogdor silhouette on title
  const ty = 280 + Math.sin(titleAnim * 2) * 15;
  ctx.fillStyle = '#2a8a2a';
  ctx.fillRect(W/2 - 20, ty, 40, 20);
  ctx.fillRect(W/2 + 20, ty - 6, 20, 16);
  ctx.fillRect(W/2 + 36, ty - 2, 10, 8);
  // Wings
  ctx.fillRect(W/2 - 10, ty - 16 + Math.sin(titleAnim*6)*6, 24, 6);
  // Fire
  for (let i = 0; i < 30; i += 4) {
    ctx.fillStyle = i < 12 ? '#ffaa00' : '#ff4400';
    ctx.fillRect(W/2 + 46 + i, ty + Math.random()*8 - 4, 4, 4);
  }

  ctx.font = '18px monospace';
  ctx.fillStyle = '#fff';
  const blink = Math.sin(titleAnim * 4) > 0;
  if (blink) ctx.fillText('CLICK or PRESS SPACE to BEGIN', W/2, 400);

  ctx.font = '14px monospace';
  ctx.fillStyle = '#ccc';
  ctx.fillText('SPACE/CLICK = Flap Wings | SHIFT/RIGHT-CLICK = Fire Breath', W/2, 450);
  ctx.fillText('Swoop down to burninate the countryside!', W/2, 475);

  ctx.restore();
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.font = 'bold 48px monospace';
  ctx.fillStyle = '#ff4400';
  ctx.fillText('GAME OVER', W/2, 180);

  ctx.font = '24px monospace';
  ctx.fillStyle = '#ffcc00';
  ctx.fillText('THE BURNINATOR HAS FALLEN', W/2, 230);

  ctx.font = '28px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText('SCORE: ' + score, W/2, 300);
  ctx.fillText('DISTANCE: ' + Math.floor(distance) + 'm', W/2, 340);

  const burned = groundObjects.filter(o => o.scored).length;
  ctx.fillText('THINGS BURNINATED: ' + burned, W/2, 380);

  gameOverTimer++;
  if (gameOverTimer > 60) {
    const blink = Math.sin(Date.now() / 300) > 0;
    ctx.font = '18px monospace';
    if (blink) ctx.fillText('CLICK or PRESS SPACE to TRY AGAIN', W/2, 440);
  }
}

// ============================================================
// UPDATE FUNCTIONS
// ============================================================

function updateTrogdor() {
  // Gravity
  trog.vy += 0.25;

  // Flap
  if (inputDown) {
    trog.vy = -5.5;
    inputDown = false;
    trog.wingFrame = 0;
    trog.wingTimer = 0;
    playSound('flap');
  }

  // Clamp velocity
  trog.vy = Math.max(-8, Math.min(8, trog.vy));

  trog.y += trog.vy;

  // Boundaries
  if (trog.y < 20) { trog.y = 20; trog.vy = 0; }
  if (trog.y > H - 100) { trog.y = H - 100; trog.vy = Math.min(trog.vy, 0); }

  // Wing animation
  trog.wingTimer += 0.08;
  trog.wingFrame = (Math.sin(trog.wingTimer * 3) + 1) / 2;

  // Fire cooldown
  if (trog.fireCooldown > 0) trog.fireCooldown--;

  // Fire breath active
  if (fireDown && trog.fireCooldown <= 0) {
    trog.fireTimer++;
    if (trog.fireTimer % 5 === 0) {
      // Fire particles
      for (let i = 0; i < 3; i++) {
        fireParticles.push({
          x: trog.x + 40 + Math.random()*20,
          y: trog.y - 2 + Math.random()*6,
          vx: 3 + Math.random()*4,
          vy: -1 + Math.random()*2 + (trog.vy > 1 ? trog.vy * 0.5 : 0),
          life: 20, maxLife: 20,
          size: 3 + Math.random()*4,
          color: ['#ff4400','#ffaa00','#ffdd00','#fff'][Math.floor(Math.random()*4)]
        });
      }
    }
    if (trog.fireTimer > 60) {
      trog.fireCooldown = 30;
      trog.fireTimer = 0;
    }

    // Check burning ground objects
    groundObjects.forEach(obj => {
      const ox = obj.x - fgOffset;
      const dist = Math.hypot(trog.x + 30 - ox, trog.y - (H - 90));
      if (dist < 80 && trog.y > H - 180) {
        if (!obj.burning) {
          obj.burning = true;
          if (!obj.scored) {
            obj.scored = true;
            const pts = obj.type === 'cottage' ? 100 : (obj.type === 'windmill' ? 150 : (obj.type === 'field' ? 50 : 25));
            score += pts;
            playSound('explosion');
            // Explosion particles
            for (let i = 0; i < 15; i++) {
              particles.push({
                x: ox + 10, y: H - 90,
                vx: -3 + Math.random()*6, vy: -3 - Math.random()*5,
                life: 30 + Math.random()*20, maxLife: 50,
                size: 2 + Math.random()*4,
                color: ['#ff4400','#ffaa00','#ff6600'][Math.floor(Math.random()*3)]
              });
            }
            // Score popup
            particles.push({
              x: ox, y: H - 110, vx: 0, vy: -1,
              life: 40, maxLife: 40, size: 0,
              color: '#fff', text: '+' + pts
            });
            smokeColumns.push({ x: obj.x, y: H - 100, life: 200, maxLife: 200 });
          }
        }
      }
    });
  } else {
    trog.fireTimer = 0;
  }

  // Trail
  trog.trail.push({ x: trog.x - 10, y: trog.y + 2 });
  if (trog.trail.length > 15) trog.trail.shift();

  // Invincibility
  if (trog.invincible > 0) trog.invincible--;
}

function updateObstacles() {
  // Spawn
  if (Math.random() < 0.005 * difficulty) {
    spawnObstacle();
  }

  obstacles.forEach(obs => {
    // Archer firing
    if (obs.type === 'tower' && obs.hasArcher) {
      obs.archerTimer--;
      if (obs.archerTimer <= 0) {
        obs.archerTimer = 80 - difficulty * 5;
        const sx = obs.x - fgOffset;
        if (sx > 0 && sx < W) {
          const angle = Math.atan2(trog.y - (obs.floating ? obs.y - 15 : H - 80 - obs.h - 15), trog.x - sx);
          arrows.push({
            x: sx + obs.w/2, y: obs.floating ? obs.y - 15 : H - 80 - obs.h - 15,
            vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 4,
            life: 120
          });
          playSound('arrow');
        }
      }
    }

    // Catapult firing
    if (obs.type === 'catapult') {
      obs.fireTimer--;
      if (obs.fireTimer <= 0) {
        obs.fireTimer = 100 - difficulty * 8;
        const sx = obs.x - fgOffset;
        if (sx > 0 && sx < W) {
          // Launch boulder
          arrows.push({
            x: sx + 30, y: obs.y - 30,
            vx: -2 + Math.random(), vy: -6 - Math.random() * 3,
            life: 120, isBoulder: true
          });
          playSound('arrow');
        }
      }
    }
  });

  // Remove off-screen obstacles
  obstacles = obstacles.filter(o => o.x - fgOffset > -100);

  // Update arrows
  arrows.forEach(a => {
    a.x += a.vx;
    a.y += a.vy;
    if (a.isBoulder) a.vy += 0.15; // gravity for boulders
    a.life--;

    // Check collision with Trogdor
    if (trog.invincible <= 0) {
      const dist = Math.hypot(a.x - trog.x, a.y - trog.y);
      if (dist < 20) {
        hitTrogdor();
        a.life = 0;
      }
    }
  });
  arrows = arrows.filter(a => a.life > 0 && a.x > -20 && a.x < W + 20 && a.y < H);

  // Obstacle collision
  if (trog.invincible <= 0) {
    obstacles.forEach(obs => {
      const sx = obs.x - fgOffset;
      const topY = obs.floating ? obs.y : (obs.type === 'tower' ? H - 80 - obs.h : obs.y);
      const botY = obs.type === 'tower' ? (obs.floating ? obs.y + obs.h : H - 80) : obs.y + obs.h;

      if (trog.x + 20 > sx && trog.x - 15 < sx + obs.w &&
          trog.y + 8 > topY && trog.y - 8 < botY) {
        hitTrogdor();
      }
    });
  }
}

function hitTrogdor() {
  playSound('hit');
  shakeTimer = 15;
  shakeIntensity = 8;
  state = 'gameover';
  trog.alive = false;
  gameOverTimer = 0;
  music.stop();

  // Death particles
  for (let i = 0; i < 30; i++) {
    particles.push({
      x: trog.x, y: trog.y,
      vx: -5 + Math.random()*10, vy: -5 + Math.random()*10,
      life: 40 + Math.random()*30, maxLife: 70,
      size: 3 + Math.random()*5,
      color: ['#2a8a2a','#ff4400','#ffaa00','#fff'][Math.floor(Math.random()*4)]
    });
  }
}

function updateParticles() {
  particles.forEach(p => {
    p.x += p.vx || 0;
    p.y += p.vy || 0;
    if (p.vy !== undefined && !p.text) p.vy += 0.05;
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);

  fireParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy -= 0.05;
    p.life--;
    p.size *= 0.97;
  });
  fireParticles = fireParticles.filter(p => p.life > 0);

  smokeColumns.forEach(s => s.life--);
  smokeColumns = smokeColumns.filter(s => s.life > 0);
}

function updateWorld() {
  // Scroll
  distance += scrollSpeed * 0.1;
  difficulty = 1 + distance / 500;
  scrollSpeed = 2 + difficulty * 0.3;

  bgOffset += scrollSpeed * 0.3;
  midOffset += scrollSpeed * 0.6;
  fgOffset += scrollSpeed;

  // Spawn new ground objects
  const lastObj = groundObjects[groundObjects.length - 1];
  if (!lastObj || lastObj.x - fgOffset < W) {
    spawnGroundObject(fgOffset + W + 100 + Math.random() * 200);
  }

  // Clean up off-screen ground objects
  groundObjects = groundObjects.filter(o => o.x - fgOffset > -100);

  // Replenish clouds
  if (clouds.length < 15) {
    clouds.push({ x: W + Math.random() * 200 + bgOffset, y: 20 + Math.random() * 200, w: 40 + Math.random() * 80, speed: 0.2 + Math.random() * 0.5, opacity: 0.3 + Math.random() * 0.4 });
  }

  // Ambient particles
  if (Math.random() < 0.1) {
    particles.push({
      x: W + 10, y: Math.random() * H * 0.7,
      vx: -scrollSpeed - 1, vy: 0,
      life: 100, maxLife: 100,
      size: 1 + Math.random() * 2,
      color: `hsl(${30 + Math.random()*30}, 80%, ${60 + Math.random()*30}%)`
    });
  }
}

// ============================================================
// DRAW TEXT PARTICLES (score popups)
// ============================================================
function drawTextParticles() {
  particles.forEach(p => {
    if (p.text) {
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.font = 'bold 16px monospace';
      ctx.fillStyle = p.color;
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }
  });
}

// ============================================================
// MAIN LOOP
// ============================================================
function gameLoop() {
  // Screen shake
  ctx.save();
  if (shakeTimer > 0) {
    shakeTimer--;
    const sx = (Math.random() - 0.5) * shakeIntensity;
    const sy = (Math.random() - 0.5) * shakeIntensity;
    ctx.translate(sx, sy);
    shakeIntensity *= 0.9;
  }

  if (state === 'title') {
    bgOffset += 0.5;
    midOffset += 0.5;
    drawTitleScreen();
  }
  else if (state === 'playing') {
    updateTrogdor();
    updateObstacles();
    updateParticles();
    updateWorld();

    drawSky();
    drawClouds();
    drawMountains();
    drawGround();
    drawGroundObjects();
    drawObstacles();
    drawArrows();
    drawParticles();
    drawTextParticles();
    drawTrogdor();
    drawHUD();
  }
  else if (state === 'gameover') {
    updateParticles();

    drawSky();
    drawClouds();
    drawMountains();
    drawGround();
    drawGroundObjects();
    drawObstacles();
    drawArrows();
    drawParticles();
    drawTextParticles();
    drawGameOver();
  }

  ctx.restore();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// INPUT HANDLING
// ============================================================
function handleAction(primary) {
  if (state === 'title') {
    initAudio();
    resetGame();
    state = 'playing';
    music.start();
    playSound('flap');
  }
  else if (state === 'playing') {
    if (primary) {
      inputDown = true;
    }
  }
  else if (state === 'gameover' && gameOverTimer > 60) {
    resetGame();
    state = 'playing';
    music.start();
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    handleAction(true);
  }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyF') {
    fireDown = true;
    if (state === 'playing' && trog.fireTimer === 0) playSound('fire');
  }
});

document.addEventListener('keyup', e => {
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyF') {
    fireDown = false;
  }
});

canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  if (e.button === 0) {
    handleAction(true);
  }
  if (e.button === 2) {
    fireDown = true;
    if (state === 'playing' && trog.fireTimer === 0) playSound('fire');
  }
});

canvas.addEventListener('mouseup', e => {
  if (e.button === 2) fireDown = false;
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) handleAction(true);
  if (e.touches.length === 2) {
    fireDown = true;
    if (state === 'playing' && trog.fireTimer === 0) playSound('fire');
  }
});

canvas.addEventListener('touchend', e => {
  if (e.touches.length < 2) fireDown = false;
});

// ============================================================
// START
// ============================================================
resetGame();
gameLoop();

</script>
