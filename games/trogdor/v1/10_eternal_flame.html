<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TROGDOR: ETERNAL FLAME</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; cursor: none; }
canvas { display: block; }
#start-screen {
  position: fixed; inset: 0; background: #000; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: opacity 2s;
}
#start-screen.fade { opacity: 0; pointer-events: none; }
#start-screen h1 {
  font-family: Georgia, serif; color: #f4a460; font-size: 48px;
  text-shadow: 0 0 30px #f4a460, 0 0 60px #ff6600; letter-spacing: 4px;
}
#start-screen p {
  font-family: Georgia, serif; color: #aaa; font-size: 18px; margin-top: 20px;
  animation: pulse 3s ease-in-out infinite;
}
#start-screen .sub {
  font-family: Georgia, serif; color: #666; font-size: 14px; margin-top: 40px;
  max-width: 400px; text-align: center; line-height: 1.6;
}
@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
#cursor {
  position: fixed; width: 20px; height: 20px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,180,60,0.8), transparent);
  pointer-events: none; z-index: 100; transform: translate(-50%,-50%);
  mix-blend-mode: screen;
}
</style>
</head>
<body>
<div id="start-screen">
  <h1>ETERNAL FLAME</h1>
  <p>Click to enter the stillness</p>
  <div class="sub">A meditative experience.<br>Move your fire to paint with light.<br>Click the lake for ripples. Breathe.</div>
</div>
<div id="cursor"></div>
<canvas id="c"></canvas>
<script>
// ============================================================
// TROGDOR: ETERNAL FLAME - A Zen Art Experience
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const cursor = document.getElementById('cursor');
let W, H;
let started = false;
let audioCtx = null;
let time = 0;
let mouseX = 0, mouseY = 0;
let mouseDown = false;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ============================================================
// AUDIO ENGINE
// ============================================================
let masterGain, reverbGain, reverbDelay, reverbDelay2;
let currentChordIndex = 0;
let chordTime = 0;
let lastMelodyTime = 0;
let lastBellTime = 0;
let windNode = null;
let cricketTime = 0;

const chords = [
  { root: 'A', notes: [220.00, 261.63, 329.63], penta: [220,246.94,261.63,329.63,369.99,440,493.88,523.25] },
  { root: 'F', notes: [174.61, 220.00, 261.63], penta: [174.61,196.00,220.00,261.63,293.66,349.23,392.00,440.00] },
  { root: 'C', notes: [261.63, 329.63, 392.00], penta: [261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25] },
  { root: 'G', notes: [196.00, 246.94, 293.66], penta: [196.00,220.00,246.94,293.66,329.63,392.00,440.00,493.88] },
  { root: 'Em', notes: [164.81, 196.00, 246.94], penta: [164.81,196.00,220.00,246.94,329.63,369.99,392.00,440.00] },
  { root: 'Dm', notes: [146.83, 174.61, 220.00], penta: [146.83,164.81,174.61,220.00,246.94,293.66,329.63,349.23] },
  { root: 'Am', notes: [220.00, 261.63, 329.63], penta: [220,246.94,261.63,329.63,369.99,440,493.88,523.25] },
];

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.0;
  masterGain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 4);
  masterGain.connect(audioCtx.destination);

  // Simple reverb via delays
  reverbGain = audioCtx.createGain();
  reverbGain.gain.value = 0.15;
  reverbDelay = audioCtx.createDelay(1.0);
  reverbDelay.delayTime.value = 0.3;
  reverbDelay2 = audioCtx.createDelay(1.0);
  reverbDelay2.delayTime.value = 0.6;
  const reverbFilter = audioCtx.createBiquadFilter();
  reverbFilter.type = 'lowpass';
  reverbFilter.frequency.value = 2000;

  reverbGain.connect(reverbDelay);
  reverbDelay.connect(reverbFilter);
  reverbFilter.connect(masterGain);
  reverbGain.connect(reverbDelay2);
  reverbDelay2.connect(reverbFilter);

  // Sub bass drone
  const sub = audioCtx.createOscillator();
  const subGain = audioCtx.createGain();
  sub.type = 'sine';
  sub.frequency.value = 55;
  subGain.gain.value = 0.06;
  sub.connect(subGain);
  subGain.connect(masterGain);
  sub.start();

  // Wind noise
  startWind();
  startCrickets();
}

function startWind() {
  const bufferSize = audioCtx.sampleRate * 2;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

  windNode = audioCtx.createBufferSource();
  windNode.buffer = buffer;
  windNode.loop = true;
  const windFilter = audioCtx.createBiquadFilter();
  windFilter.type = 'bandpass';
  windFilter.frequency.value = 400;
  windFilter.Q.value = 0.5;
  const windGain = audioCtx.createGain();
  windGain.gain.value = 0.015;

  // LFO for wind variation
  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.frequency.value = 0.1;
  lfoGain.gain.value = 200;
  lfo.connect(lfoGain);
  lfoGain.connect(windFilter.frequency);
  lfo.start();

  windNode.connect(windFilter);
  windFilter.connect(windGain);
  windGain.connect(masterGain);
  windNode.start();
}

function startCrickets() {
  // Synthesized crickets - periodic chirps
  setInterval(() => {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    for (let i = 0; i < 2 + Math.random() * 3; i++) {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 4000 + Math.random() * 2000;
      g.gain.setValueAtTime(0, now + i * 0.06);
      g.gain.linearRampToValueAtTime(0.008, now + i * 0.06 + 0.01);
      g.gain.linearRampToValueAtTime(0, now + i * 0.06 + 0.04);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(now + i * 0.06);
      osc.stop(now + i * 0.06 + 0.05);
    }
  }, 2000 + Math.random() * 4000);
}

function playPad(freq, startTime, duration, vol = 0.04) {
  if (!audioCtx) return;
  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  osc1.type = 'sine';
  osc2.type = 'triangle';
  osc1.frequency.value = freq;
  osc2.frequency.value = freq * 1.002; // slight detune for warmth

  filter.type = 'lowpass';
  filter.frequency.value = 800;
  filter.Q.value = 1;

  g.gain.setValueAtTime(0, startTime);
  g.gain.linearRampToValueAtTime(vol, startTime + 3);
  g.gain.linearRampToValueAtTime(vol * 0.8, startTime + duration - 3);
  g.gain.linearRampToValueAtTime(0, startTime + duration);

  osc1.connect(filter);
  osc2.connect(filter);
  filter.connect(g);
  g.connect(masterGain);
  g.connect(reverbGain);

  osc1.start(startTime);
  osc2.start(startTime);
  osc1.stop(startTime + duration);
  osc2.stop(startTime + duration);
}

function playMelodyNote(freq, time_offset) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime + (time_offset || 0);
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.03, now + 0.1);
  g.gain.exponentialRampToValueAtTime(0.001, now + 3);
  osc.connect(g);
  g.connect(masterGain);
  g.connect(reverbGain);
  osc.start(now);
  osc.stop(now + 3.5);
}

function playBell(freq) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.025, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 5);
  osc.connect(g);
  g.connect(masterGain);
  g.connect(reverbGain);
  osc.start(now);
  osc.stop(now + 5.5);

  // Overtone
  const osc2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  osc2.type = 'sine';
  osc2.frequency.value = freq * 2.756;
  g2.gain.setValueAtTime(0.008, now);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + 3);
  osc2.connect(g2);
  g2.connect(masterGain);
  osc2.start(now);
  osc2.stop(now + 3.5);
}

function updateMusic(dt) {
  if (!audioCtx) return;
  chordTime += dt;

  // Change chord every ~8 seconds
  if (chordTime > 8) {
    chordTime = 0;
    currentChordIndex = (currentChordIndex + 1) % chords.length;
    const chord = chords[currentChordIndex];
    const now = audioCtx.currentTime;
    // Play pad for each note with crossfade
    chord.notes.forEach((f, i) => {
      playPad(f, now, 11, 0.025 + i * 0.005);
      playPad(f / 2, now + 0.5, 10, 0.015); // octave below
    });
  }

  // Random melody notes from pentatonic
  lastMelodyTime += dt;
  if (lastMelodyTime > 1.5 + Math.random() * 3) {
    lastMelodyTime = 0;
    const chord = chords[currentChordIndex];
    const note = chord.penta[Math.floor(Math.random() * chord.penta.length)];
    // Sometimes play an octave up
    const oct = Math.random() > 0.5 ? 2 : 1;
    playMelodyNote(note * oct, 0);
    // Occasional second note for a gentle interval
    if (Math.random() > 0.6) {
      const note2 = chord.penta[Math.floor(Math.random() * chord.penta.length)];
      playMelodyNote(note2 * oct, 0.3 + Math.random() * 0.5);
    }
  }

  // Bell tones
  lastBellTime += dt;
  if (lastBellTime > 12 + Math.random() * 15) {
    lastBellTime = 0;
    const chord = chords[currentChordIndex];
    playBell(chord.penta[Math.floor(Math.random() * chord.penta.length)] * 2);
  }
}

// ============================================================
// SCENE OBJECTS
// ============================================================

// Stars
const stars = [];
for (let i = 0; i < 400; i++) {
  stars.push({
    x: Math.random(), y: Math.random() * 0.55,
    size: Math.random() * 2 + 0.5,
    brightness: Math.random(),
    twinkleSpeed: 0.5 + Math.random() * 3,
    color: Math.random() > 0.9 ? (Math.random() > 0.5 ? '#aaccff' : '#ffccaa') : '#ffffff'
  });
}

// Mountains
const mountains = [];
function generateMountains() {
  mountains.length = 0;
  for (let layer = 0; layer < 3; layer++) {
    const pts = [];
    const baseY = 0.45 + layer * 0.07;
    const amplitude = 0.12 - layer * 0.03;
    const segments = 20 + layer * 10;
    for (let i = 0; i <= segments; i++) {
      const x = i / segments;
      let y = baseY;
      y -= amplitude * Math.sin(x * Math.PI * (2 + layer)) * (0.5 + 0.5 * Math.sin(x * Math.PI));
      y -= (Math.random() * 0.01);
      // Add some peaks
      if (Math.random() > 0.85) y -= 0.03;
      pts.push({ x, y });
    }
    mountains.push({ points: pts, layer });
  }
}
generateMountains();

// Fire particles
const fireParticles = [];
const FIRE_X = 0.5; // fire center X ratio
const FIRE_Y = 0.62; // fire base Y ratio

function spawnFireParticle(x, y, fromMouse) {
  fireParticles.push({
    x: x || FIRE_X * W + (Math.random() - 0.5) * 30,
    y: y || FIRE_Y * H + (Math.random() - 0.5) * 10,
    vx: (Math.random() - 0.5) * 1.5,
    vy: -2 - Math.random() * 4,
    life: 1,
    decay: 0.005 + Math.random() * 0.015,
    size: 3 + Math.random() * 8,
    type: fromMouse ? 'mouse' : (Math.random() > 0.7 ? 'spark' : 'flame'),
    hue: 20 + Math.random() * 30
  });
}

// Embers (slow floating sparks)
const embers = [];
function spawnEmber() {
  embers.push({
    x: FIRE_X * W + (Math.random() - 0.5) * 40,
    y: FIRE_Y * H - Math.random() * 20,
    vx: (Math.random() - 0.5) * 0.5,
    vy: -0.3 - Math.random() * 0.5,
    life: 1,
    decay: 0.002 + Math.random() * 0.004,
    size: 1 + Math.random() * 2
  });
}

// Fireflies
const fireflies = [];
for (let i = 0; i < 20; i++) {
  fireflies.push({
    x: Math.random() * W,
    y: 0.4 * H + Math.random() * 0.35 * H,
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.3,
    phase: Math.random() * Math.PI * 2,
    glowSpeed: 0.5 + Math.random() * 2,
    size: 2 + Math.random() * 2
  });
}

// Shooting stars
const shootingStars = [];
let shootingStarTimer = 5;

// Aurora
const auroraWaves = [];
for (let i = 0; i < 5; i++) {
  auroraWaves.push({
    offset: Math.random() * Math.PI * 2,
    speed: 0.1 + Math.random() * 0.2,
    amplitude: 10 + Math.random() * 20,
    y: 0.08 + Math.random() * 0.15,
    hue: Math.random() > 0.5 ? 140 : 280, // green or purple
    width: 0.3 + Math.random() * 0.5
  });
}

// Moon
const moonX = 0.8;
const moonY = 0.12;

// Peasants
const peasants = [];
let peasantTimer = 15;

// Lake ripples
const ripples = [];

// Trogdor position
const trogX = FIRE_X * W - 60;
const trogY = FIRE_Y * H - 10;

// ============================================================
// DRAWING FUNCTIONS
// ============================================================

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
  grad.addColorStop(0, '#050510');
  grad.addColorStop(0.4, '#0a0a2e');
  grad.addColorStop(0.7, '#111144');
  grad.addColorStop(1, '#1a1a3e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H * 0.65);
}

function drawStars() {
  stars.forEach(s => {
    const twinkle = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time * s.twinkleSpeed + s.x * 100));
    const alpha = s.brightness * twinkle;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI * 2);
    ctx.fill();
    // Subtle glow
    if (s.size > 1.5) {
      ctx.globalAlpha = alpha * 0.15;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.size * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  ctx.globalAlpha = 1;
}

function drawMoon() {
  const mx = moonX * W;
  const my = moonY * H + Math.sin(time * 0.02) * 5;

  // Outer glow
  const glow = ctx.createRadialGradient(mx, my, 15, mx, my, 100);
  glow.addColorStop(0, 'rgba(200,210,255,0.15)');
  glow.addColorStop(0.5, 'rgba(150,170,220,0.05)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(mx - 100, my - 100, 200, 200);

  // Moon body
  ctx.fillStyle = '#e8e8f0';
  ctx.beginPath();
  ctx.arc(mx, my, 25, 0, Math.PI * 2);
  ctx.fill();

  // Craters
  ctx.fillStyle = 'rgba(180,180,200,0.4)';
  ctx.beginPath(); ctx.arc(mx - 8, my - 5, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 6, my + 8, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 3, my - 10, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(180,180,200,0.2)';
  ctx.beginPath(); ctx.arc(mx - 3, my + 6, 6, 0, Math.PI * 2); ctx.fill();
}

function drawAurora() {
  const auroraIntensity = Math.max(0, Math.sin(time * 0.03) * 0.5 + 0.3);
  if (auroraIntensity < 0.05) return;

  ctx.globalAlpha = auroraIntensity * 0.3;
  auroraWaves.forEach(wave => {
    ctx.beginPath();
    const baseY = wave.y * H;
    for (let x = 0; x <= W; x += 4) {
      const xr = x / W;
      const bell = Math.exp(-Math.pow((xr - 0.5) / wave.width, 2));
      const y = baseY + Math.sin(xr * 6 + time * wave.speed + wave.offset) * wave.amplitude * bell
        + Math.sin(xr * 3 + time * wave.speed * 0.7) * wave.amplitude * 0.5 * bell;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    // Draw as thick translucent line
    const hue = wave.hue + Math.sin(time * 0.1) * 20;
    ctx.strokeStyle = `hsla(${hue}, 80%, 60%, 0.4)`;
    ctx.lineWidth = 15 + Math.sin(time * 0.2 + wave.offset) * 8;
    ctx.stroke();

    // Inner brighter line
    ctx.strokeStyle = `hsla(${hue}, 90%, 75%, 0.2)`;
    ctx.lineWidth = 6;
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

function drawMountains() {
  mountains.forEach((m, idx) => {
    const darkness = 0.03 + idx * 0.03;
    ctx.fillStyle = `rgb(${Math.floor(darkness*255)},${Math.floor(darkness*200)},${Math.floor(darkness*255)})`;
    ctx.beginPath();
    ctx.moveTo(0, H);
    m.points.forEach(p => ctx.lineTo(p.x * W, p.y * H));
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  });
}

function drawLake() {
  const lakeTop = 0.65 * H;

  // Lake base
  const lakeGrad = ctx.createLinearGradient(0, lakeTop, 0, H);
  lakeGrad.addColorStop(0, '#0a0a2a');
  lakeGrad.addColorStop(0.3, '#080820');
  lakeGrad.addColorStop(1, '#050515');
  ctx.fillStyle = lakeGrad;
  ctx.fillRect(0, lakeTop, W, H - lakeTop);

  // Moon reflection
  const mx = moonX * W;
  const reflY = lakeTop + 30;
  ctx.globalAlpha = 0.2;
  for (let i = 0; i < 8; i++) {
    const shimmer = Math.sin(time * 2 + i * 0.5) * 3;
    ctx.fillStyle = 'rgba(200,210,255,0.1)';
    ctx.fillRect(mx - 15 + shimmer, reflY + i * 10, 30, 3);
  }

  // Fire reflection on lake
  const fireReflX = FIRE_X * W;
  const fireIntensity = 0.15 + 0.05 * Math.sin(time * 3);
  const fireReflGrad = ctx.createRadialGradient(fireReflX, lakeTop + 40, 5, fireReflX, lakeTop + 80, 120);
  fireReflGrad.addColorStop(0, `rgba(255,140,30,${fireIntensity})`);
  fireReflGrad.addColorStop(0.5, `rgba(255,80,10,${fireIntensity * 0.4})`);
  fireReflGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = fireReflGrad;
  ctx.fillRect(fireReflX - 120, lakeTop, 240, 160);

  // Water lines
  ctx.globalAlpha = 0.06;
  ctx.strokeStyle = '#4466aa';
  ctx.lineWidth = 1;
  for (let y = lakeTop + 5; y < H; y += 12) {
    ctx.beginPath();
    for (let x = 0; x < W; x += 4) {
      const wave = Math.sin(x * 0.01 + time * 0.5 + y * 0.1) * 2;
      if (x === 0) ctx.moveTo(x, y + wave);
      else ctx.lineTo(x, y + wave);
    }
    ctx.stroke();
  }

  // Ripples
  ctx.globalAlpha = 1;
  ripples.forEach(r => {
    ctx.globalAlpha = r.life * 0.4;
    ctx.strokeStyle = `rgba(150,180,255,${r.life * 0.5})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(r.x, r.y, r.radius, r.radius * 0.3, 0, 0, Math.PI * 2);
    ctx.stroke();
    if (r.radius > 10) {
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, r.radius * 0.6, r.radius * 0.18, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  });
  ctx.globalAlpha = 1;
}

function drawGround() {
  // Ground around fire
  const groundY = FIRE_Y * H + 10;
  const grad = ctx.createLinearGradient(0, groundY - 20, 0, groundY + 30);
  grad.addColorStop(0, '#1a1a10');
  grad.addColorStop(1, '#0a0a08');
  ctx.fillStyle = grad;

  ctx.beginPath();
  ctx.moveTo(0, groundY);
  for (let x = 0; x <= W; x += 10) {
    const bump = Math.sin(x * 0.02) * 3 + Math.sin(x * 0.05) * 2;
    ctx.lineTo(x, groundY + bump);
  }
  ctx.lineTo(W, H * 0.65);
  ctx.lineTo(0, H * 0.65);
  ctx.closePath();
  ctx.fill();
}

function drawFire() {
  const fx = FIRE_X * W;
  const fy = FIRE_Y * H;

  // Fire glow on ground
  const groundGlow = ctx.createRadialGradient(fx, fy, 10, fx, fy + 20, 200);
  groundGlow.addColorStop(0, 'rgba(255,120,20,0.15)');
  groundGlow.addColorStop(0.5, 'rgba(255,60,10,0.05)');
  groundGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = groundGlow;
  ctx.fillRect(fx - 200, fy - 100, 400, 250);

  // Fire base glow
  ctx.globalAlpha = 0.6 + 0.2 * Math.sin(time * 5);
  const baseGlow = ctx.createRadialGradient(fx, fy - 30, 5, fx, fy - 20, 60);
  baseGlow.addColorStop(0, 'rgba(255,220,100,0.8)');
  baseGlow.addColorStop(0.3, 'rgba(255,140,20,0.5)');
  baseGlow.addColorStop(0.7, 'rgba(255,60,10,0.2)');
  baseGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = baseGlow;
  ctx.beginPath();
  ctx.arc(fx, fy - 20, 50, 0, Math.PI * 2);
  ctx.fill();

  // Log shapes
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#3a2010';
  ctx.save();
  ctx.translate(fx, fy + 5);
  ctx.rotate(-0.3);
  ctx.fillRect(-25, -4, 50, 8);
  ctx.restore();
  ctx.save();
  ctx.translate(fx, fy + 5);
  ctx.rotate(0.3);
  ctx.fillRect(-25, -4, 50, 8);
  ctx.restore();

  // Draw fire particles
  fireParticles.forEach(p => {
    const alpha = p.life;
    if (p.type === 'spark') {
      ctx.fillStyle = `rgba(255,${180 + Math.floor(p.life * 75)},${Math.floor(p.life * 100)},${alpha})`;
      ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
    } else {
      const r = p.size * p.life;
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      if (p.life > 0.6) {
        grad.addColorStop(0, `rgba(255,255,200,${alpha * 0.8})`);
        grad.addColorStop(0.4, `rgba(255,${150 + p.hue},20,${alpha * 0.6})`);
      } else {
        grad.addColorStop(0, `rgba(255,${100 + p.hue},20,${alpha * 0.5})`);
        grad.addColorStop(0.4, `rgba(200,50,10,${alpha * 0.3})`);
      }
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Embers
  embers.forEach(e => {
    ctx.fillStyle = `rgba(255,${150 + Math.floor(e.life * 100)},50,${e.life * 0.8})`;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size * e.life, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawTrogdor() {
  const tx = FIRE_X * W - 70;
  const ty = FIRE_Y * H - 15;

  // Fire illumination on Trogdor
  const flicker = 0.7 + 0.3 * Math.sin(time * 4);

  ctx.save();
  ctx.translate(tx, ty);

  // Body (sitting pose, facing fire)
  ctx.fillStyle = `rgb(${Math.floor(50 * flicker)},${Math.floor(120 * flicker)},${Math.floor(40 * flicker)})`;

  // Body blob
  ctx.beginPath();
  ctx.ellipse(0, 0, 22, 16, 0, 0, Math.PI * 2);
  ctx.fill();

  // Belly
  ctx.fillStyle = `rgb(${Math.floor(70 * flicker)},${Math.floor(150 * flicker)},${Math.floor(55 * flicker)})`;
  ctx.beginPath();
  ctx.ellipse(5, 4, 12, 10, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Neck & head (looking up slightly)
  ctx.fillStyle = `rgb(${Math.floor(50 * flicker)},${Math.floor(120 * flicker)},${Math.floor(40 * flicker)})`;
  ctx.beginPath();
  ctx.ellipse(18, -15, 7, 5, 0.3, 0, Math.PI * 2);
  ctx.fill();
  // Head
  ctx.beginPath();
  ctx.ellipse(24, -22, 10, 8, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Snout
  ctx.fillStyle = `rgb(${Math.floor(60 * flicker)},${Math.floor(140 * flicker)},${Math.floor(50 * flicker)})`;
  ctx.beginPath();
  ctx.ellipse(32, -20, 6, 4, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Peaceful closed eye (curved line)
  ctx.strokeStyle = `rgba(0,0,0,${0.5 * flicker})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(27, -24, 3, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // Gentle smile
  ctx.beginPath();
  ctx.arc(31, -19, 3, 0.3, Math.PI - 0.3);
  ctx.stroke();

  // Small horn/spike on head
  ctx.fillStyle = `rgb(${Math.floor(60 * flicker)},${Math.floor(130 * flicker)},${Math.floor(45 * flicker)})`;
  ctx.beginPath();
  ctx.moveTo(22, -28);
  ctx.lineTo(20, -35);
  ctx.lineTo(26, -28);
  ctx.closePath();
  ctx.fill();

  // Beefy arm extended toward fire (the one beefy arm)
  ctx.fillStyle = `rgb(${Math.floor(55 * flicker)},${Math.floor(130 * flicker)},${Math.floor(45 * flicker)})`;
  ctx.beginPath();
  ctx.moveTo(10, -3);
  ctx.quadraticCurveTo(30, 0, 40, -8);
  ctx.quadraticCurveTo(45, -10, 42, -5);
  ctx.quadraticCurveTo(30, 5, 10, 3);
  ctx.closePath();
  ctx.fill();

  // Fingers/claws on beefy arm
  ctx.strokeStyle = `rgb(${Math.floor(55 * flicker)},${Math.floor(130 * flicker)},${Math.floor(45 * flicker)})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(42, -8); ctx.lineTo(46, -12);
  ctx.moveTo(41, -6); ctx.lineTo(46, -8);
  ctx.moveTo(42, -5); ctx.lineTo(47, -5);
  ctx.stroke();

  // Tail curled around body
  ctx.strokeStyle = `rgb(${Math.floor(45 * flicker)},${Math.floor(110 * flicker)},${Math.floor(38 * flicker)})`;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-20, 5);
  ctx.quadraticCurveTo(-35, 0, -38, 10);
  ctx.quadraticCurveTo(-40, 18, -30, 15);
  ctx.stroke();

  // Tail spike
  ctx.fillStyle = `rgb(${Math.floor(60 * flicker)},${Math.floor(130 * flicker)},${Math.floor(45 * flicker)})`;
  ctx.beginPath();
  ctx.moveTo(-30, 15);
  ctx.lineTo(-35, 10);
  ctx.lineTo(-28, 12);
  ctx.closePath();
  ctx.fill();

  // Legs (sitting)
  ctx.fillStyle = `rgb(${Math.floor(45 * flicker)},${Math.floor(110 * flicker)},${Math.floor(38 * flicker)})`;
  ctx.beginPath();
  ctx.ellipse(-8, 14, 8, 4, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(8, 14, 8, 4, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Wings (folded, peaceful)
  ctx.fillStyle = `rgba(${Math.floor(40 * flicker)},${Math.floor(100 * flicker)},${Math.floor(35 * flicker)},0.7)`;
  ctx.beginPath();
  ctx.moveTo(-5, -10);
  ctx.quadraticCurveTo(-25, -30, -15, -8);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawFireflies() {
  fireflies.forEach(f => {
    const glow = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time * f.glowSpeed + f.phase));
    if (glow < 0.3) return;

    ctx.globalAlpha = glow * 0.6;
    const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size * 4);
    grad.addColorStop(0, `rgba(180,255,100,${glow})`);
    grad.addColorStop(0.5, `rgba(120,200,60,${glow * 0.3})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size * 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(220,255,150,${glow})`;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size * 0.5, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawShootingStars() {
  shootingStars.forEach(s => {
    const alpha = s.life;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx * 15, s.y - s.vy * 15);
    ctx.stroke();

    // Trail glow
    ctx.globalAlpha = alpha * 0.3;
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#aaddff';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx * 25, s.y - s.vy * 25);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

function drawPeasants() {
  peasants.forEach(p => {
    const px = p.x;
    const py = p.y;
    const flicker = 0.4 + 0.3 * Math.max(0, 1 - Math.abs(px - FIRE_X * W) / 200);
    const scale = p.scale || 1;

    ctx.save();
    ctx.translate(px, py);
    ctx.scale(scale, scale);

    // Body
    ctx.fillStyle = `rgb(${Math.floor(140 * flicker)},${Math.floor(100 * flicker)},${Math.floor(70 * flicker)})`;
    ctx.fillRect(-4, -12, 8, 14);

    // Head
    ctx.fillStyle = `rgb(${Math.floor(200 * flicker)},${Math.floor(170 * flicker)},${Math.floor(140 * flicker)})`;
    ctx.beginPath();
    ctx.arc(0, -16, 5, 0, Math.PI * 2);
    ctx.fill();

    // Walking legs
    const legPhase = time * 2 * p.dir;
    ctx.strokeStyle = `rgb(${Math.floor(120 * flicker)},${Math.floor(80 * flicker)},${Math.floor(50 * flicker)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-2, 2);
    ctx.lineTo(-2 + Math.sin(legPhase) * 4, 10);
    ctx.moveTo(2, 2);
    ctx.lineTo(2 + Math.sin(legPhase + Math.PI) * 4, 10);
    ctx.stroke();

    ctx.restore();
  });
}

function drawConstellationTrogdor() {
  // Constellation that slowly fades in/out
  const consAlpha = Math.max(0, Math.sin(time * 0.015) * 0.5);
  if (consAlpha < 0.02) return;

  ctx.globalAlpha = consAlpha;
  const cx = 0.3 * W;
  const cy = 0.15 * H;
  const s = 3;

  // Simple Trogdor constellation - connect dots
  const points = [
    [0, 0], [3, -2], [6, -1], [8, -3], [10, -1], // body top
    [10, 2], [7, 3], [4, 2], [1, 3], [0, 0], // body bottom
    [10, -1], [13, -3], [14, -5], // neck & head
    [14, -5], [16, -6], // snout
    [7, 1], [9, 5], [12, 3] // beefy arm
  ];

  ctx.strokeStyle = 'rgba(150,180,255,0.6)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  points.forEach((p, i) => {
    const px = cx + p[0] * s * 4;
    const py = cy + p[1] * s * 4;
    if (i === 0 || i === 10 || i === 13 || i === 15) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  });
  ctx.stroke();

  // Stars at constellation points
  ctx.fillStyle = '#aaccff';
  points.forEach(p => {
    const px = cx + p[0] * s * 4;
    const py = cy + p[1] * s * 4;
    ctx.beginPath();
    ctx.arc(px, py, 2, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.globalAlpha = 1;
}

function drawSceneLighting() {
  // Overall ambient fire light
  const fx = FIRE_X * W;
  const fy = FIRE_Y * H;
  const flicker = 0.8 + 0.2 * Math.sin(time * 6);

  const lightGrad = ctx.createRadialGradient(fx, fy - 30, 20, fx, fy, 350);
  lightGrad.addColorStop(0, `rgba(255,140,40,${0.08 * flicker})`);
  lightGrad.addColorStop(0.3, `rgba(255,80,10,${0.04 * flicker})`);
  lightGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = lightGrad;
  ctx.fillRect(0, 0, W, H);
}

function drawCursorGlow() {
  if (!started) return;
  const grad = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 40);
  grad.addColorStop(0, 'rgba(255,180,60,0.08)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(mouseX, mouseY, 40, 0, Math.PI * 2);
  ctx.fill();
}

// ============================================================
// UPDATE
// ============================================================

function update(dt) {
  time += dt;

  // Spawn fire particles
  if (Math.random() < 0.6) spawnFireParticle();
  if (Math.random() < 0.05) spawnEmber();

  // Mouse fire particles
  if (mouseDown && started) {
    for (let i = 0; i < 3; i++) {
      spawnFireParticle(
        mouseX + (Math.random() - 0.5) * 20,
        mouseY + (Math.random() - 0.5) * 20,
        true
      );
    }
  }

  // Update fire particles
  for (let i = fireParticles.length - 1; i >= 0; i--) {
    const p = fireParticles[i];
    p.x += p.vx + Math.sin(time * 3 + p.x * 0.01) * 0.5;
    p.vy -= 0.05; // acceleration upward
    p.y += p.vy;
    p.vx *= 0.99;
    p.life -= p.decay;
    if (p.life <= 0) fireParticles.splice(i, 1);
  }
  // Cap particles
  while (fireParticles.length > 300) fireParticles.shift();

  // Update embers
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i];
    e.x += e.vx + Math.sin(time * 2 + e.x * 0.05) * 0.3;
    e.y += e.vy;
    e.life -= e.decay;
    if (e.life <= 0) embers.splice(i, 1);
  }

  // Update fireflies
  fireflies.forEach(f => {
    f.x += f.vx + Math.sin(time * 0.5 + f.phase) * 0.3;
    f.y += f.vy + Math.cos(time * 0.3 + f.phase) * 0.2;
    // Wander
    f.vx += (Math.random() - 0.5) * 0.02;
    f.vy += (Math.random() - 0.5) * 0.02;
    f.vx *= 0.99;
    f.vy *= 0.99;
    // Keep in bounds
    if (f.x < 0) f.vx += 0.1;
    if (f.x > W) f.vx -= 0.1;
    if (f.y < 0.35 * H) f.vy += 0.05;
    if (f.y > 0.7 * H) f.vy -= 0.05;
  });

  // Shooting stars
  shootingStarTimer -= dt;
  if (shootingStarTimer <= 0) {
    shootingStarTimer = 8 + Math.random() * 20;
    const startX = Math.random() * W * 0.8;
    shootingStars.push({
      x: startX, y: Math.random() * H * 0.3,
      vx: 3 + Math.random() * 4, vy: 1 + Math.random() * 2,
      life: 1
    });
  }
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const s = shootingStars[i];
    s.x += s.vx;
    s.y += s.vy;
    s.life -= 0.02;
    if (s.life <= 0) shootingStars.splice(i, 1);
  }

  // Peasants
  peasantTimer -= dt;
  if (peasantTimer <= 0) {
    peasantTimer = 20 + Math.random() * 40;
    const dir = Math.random() > 0.5 ? 1 : -1;
    peasants.push({
      x: dir > 0 ? -20 : W + 20,
      y: FIRE_Y * H + 5 + Math.random() * 15,
      dir: dir,
      speed: 0.3 + Math.random() * 0.3,
      scale: 0.7 + Math.random() * 0.3
    });
  }
  for (let i = peasants.length - 1; i >= 0; i--) {
    const p = peasants[i];
    p.x += p.dir * p.speed;
    if ((p.dir > 0 && p.x > W + 30) || (p.dir < 0 && p.x < -30)) {
      peasants.splice(i, 1);
    }
  }

  // Ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.radius += 0.8;
    r.life -= 0.008;
    if (r.life <= 0) ripples.splice(i, 1);
  }

  // Music
  updateMusic(dt);
}

// ============================================================
// MAIN LOOP
// ============================================================

let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (started) {
    update(dt);
  }

  // Clear
  ctx.clearRect(0, 0, W, H);

  // Draw scene layers
  drawSky();
  drawStars();
  drawConstellationTrogdor();
  drawAurora();
  drawMoon();
  drawShootingStars();
  drawMountains();
  drawGround();
  drawLake();
  drawPeasants();
  drawTrogdor();
  drawFire();
  drawFireflies();
  drawSceneLighting();
  drawCursorGlow();

  requestAnimationFrame(gameLoop);
}

// ============================================================
// INPUT
// ============================================================

document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  cursor.style.left = mouseX + 'px';
  cursor.style.top = mouseY + 'px';

  // Spawn fire particles along mouse path when moving
  if (started && mouseDown) {
    for (let i = 0; i < 2; i++) {
      spawnFireParticle(mouseX + (Math.random()-0.5)*10, mouseY + (Math.random()-0.5)*10, true);
    }
  }
});

document.addEventListener('mousedown', e => {
  mouseDown = true;
  if (!started) {
    started = true;
    document.getElementById('start-screen').classList.add('fade');
    setTimeout(() => document.getElementById('start-screen').style.display = 'none', 2000);
    initAudio();
    // Play initial chord
    if (audioCtx) {
      const chord = chords[0];
      const now = audioCtx.currentTime;
      chord.notes.forEach((f, i) => {
        playPad(f, now, 11, 0.025);
        playPad(f / 2, now + 0.5, 10, 0.015);
      });
    }
    return;
  }

  // Check if clicking on lake
  const lakeTop = 0.65 * H;
  if (e.clientY > lakeTop) {
    ripples.push({
      x: e.clientX, y: e.clientY,
      radius: 3, life: 1
    });
    // Play gentle water sound
    if (audioCtx) {
      const now = audioCtx.currentTime;
      const noise = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      noise.type = 'sine';
      noise.frequency.value = 300 + Math.random() * 200;
      g.gain.setValueAtTime(0.02, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      noise.connect(g);
      g.connect(masterGain);
      noise.start(now);
      noise.stop(now + 1);
    }
  }
});

document.addEventListener('mouseup', () => mouseDown = false);

// Touch support
document.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouseX = t.clientX;
  mouseY = t.clientY;
  mouseDown = true;

  if (!started) {
    started = true;
    document.getElementById('start-screen').classList.add('fade');
    setTimeout(() => document.getElementById('start-screen').style.display = 'none', 2000);
    initAudio();
    const chord = chords[0];
    const now = audioCtx.currentTime;
    chord.notes.forEach(f => {
      playPad(f, now, 11, 0.025);
      playPad(f / 2, now + 0.5, 10, 0.015);
    });
  }

  const lakeTop = 0.65 * H;
  if (mouseY > lakeTop) {
    ripples.push({ x: mouseX, y: mouseY, radius: 3, life: 1 });
  }
}, { passive: false });

document.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouseX = t.clientX;
  mouseY = t.clientY;
  cursor.style.left = mouseX + 'px';
  cursor.style.top = mouseY + 'px';
  if (started) {
    spawnFireParticle(mouseX + (Math.random()-0.5)*10, mouseY + (Math.random()-0.5)*10, true);
  }
}, { passive: false });

document.addEventListener('touchend', () => mouseDown = false);

// Start loop
requestAnimationFrame(gameLoop);
</script>
