<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TROGDOR: ETERNAL FLAME</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; cursor: none; }
canvas { display: block; }
#start-screen {
  position: fixed; inset: 0; background: #000; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: opacity 2s;
}
#start-screen.fade { opacity: 0; pointer-events: none; }
#start-screen h1 {
  font-family: Georgia, serif; color: #f4a460; font-size: 48px;
  text-shadow: 0 0 30px #f4a460, 0 0 60px #ff6600; letter-spacing: 4px;
}
#start-screen p {
  font-family: Georgia, serif; color: #aaa; font-size: 18px; margin-top: 20px;
  animation: pulse 3s ease-in-out infinite;
}
#start-screen .sub {
  font-family: Georgia, serif; color: #666; font-size: 14px; margin-top: 40px;
  max-width: 400px; text-align: center; line-height: 1.6;
}
@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
#cursor {
  position: fixed; width: 20px; height: 20px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,180,60,0.8), transparent);
  pointer-events: none; z-index: 100; transform: translate(-50%,-50%);
  mix-blend-mode: screen;
}
</style>
</head>
<body>
<div id="start-screen">
  <h1>ETERNAL FLAME</h1>
  <p>Click to enter the stillness</p>
  <div class="sub">A meditative experience.<br>Move your fire to paint with light.<br>Click the lake for ripples. Breathe.</div>
</div>
<div id="cursor"></div>
<canvas id="c"></canvas>
<script>
// ============================================================
// TROGDOR: ETERNAL FLAME - A Zen Art Experience
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const cursor = document.getElementById('cursor');
let W, H;
let started = false;
let audioCtx = null;
let time = 0;
let mouseX = 0, mouseY = 0;
let mouseDown = false;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ============================================================
// AUDIO ENGINE - Trogdor Theme as Ambient/Zen in E MINOR
// Gentle pad chords: Em -> Am -> G -> F#m (or Em -> C -> G -> Am)
// "Burninating" melody E-F#-G as gentle bell tones
// E minor pentatonic sparkles: E, G, A, B, D
// ============================================================
let masterGain, reverbGain, reverbDelay, reverbDelay2, reverbDelay3;
let currentChordIndex = 0;
let chordTime = 0;
let lastMelodyTime = 0;
let lastBellTime = 0;
let lastBridgeTime = 0;
let melodyPhase = 0;
let melodyNoteIndex = 0;
let windNode = null;
let nextChordDuration = 8;
let lastWhisperTime = 0;
let whisperCooldown = 60 + Math.random() * 30;

// E minor chord progression for zen arrangement
// Em -> Am -> G -> F#m, then Em -> C -> G -> Am
const trogdorChords = [
  // Main: Em -> Am -> G -> F#m
  { root: 'Em',  notes: [164.81, 196.00, 246.94], bass: 82.41 },  // E minor (E3, G3, B3)
  { root: 'Am',  notes: [220.00, 261.63, 329.63], bass: 110.00 }, // A minor (A3, C4, E4)
  { root: 'G',   notes: [196.00, 246.94, 293.66], bass: 98.00 },  // G major (G3, B3, D4)
  { root: 'F#m', notes: [185.00, 220.00, 277.18], bass: 92.50 },  // F# minor (F#3, A3, C#4)
  // Extension: Em -> C -> G -> Am
  { root: 'Em',  notes: [164.81, 196.00, 246.94], bass: 82.41 },
  { root: 'C',   notes: [261.63, 329.63, 392.00], bass: 130.81 }, // C major (C4, E4, G4)
  { root: 'G',   notes: [196.00, 246.94, 293.66], bass: 98.00 },
  { root: 'Am',  notes: [220.00, 261.63, 329.63], bass: 110.00 },
];

// E minor pentatonic: E, G, A, B, D (multiple octaves for sparkles)
const eMinPentatonic = [
  164.81, 196.00, 220.00, 246.94, 293.66,  // octave 3
  329.63, 392.00, 440.00, 493.88, 587.33,  // octave 4
  659.26, 783.99, 880.00, 987.77, 1174.66  // octave 5
];

// "Burninating" melody phrases rewritten for E minor
// E-E-E-E-F#-G-G-A (burninating the countryside) etc.
const chorusPhrases = [
  // "Burninating the countryside" - E4 E4 E4 E4 F#4 G4 G4 A4
  { notes: [329.63, 329.63, 329.63, 329.63, 369.99, 392.00, 392.00, 440.00],
    gaps:  [1.8, 1.5, 1.4, 1.6, 1.3, 1.5, 1.8, 2.5] },
  // "Burninating the peasants" - E4 E4 E4 E4 F#4 G4 A4
  { notes: [329.63, 329.63, 329.63, 329.63, 369.99, 392.00, 440.00],
    gaps:  [1.8, 1.5, 1.4, 1.6, 1.3, 1.8, 2.8] },
  // "Thatched roof COTTAGES" - A4 A4 B4 A4 G4 F#4 G4
  { notes: [440.00, 440.00, 493.88, 440.00, 392.00, 369.99, 392.00],
    gaps:  [1.5, 1.3, 1.8, 1.5, 1.6, 1.4, 3.0] },
  // "TROGDOR!" - E4 G4 B4
  { notes: [329.63, 392.00, 493.88],
    gaps:  [2.0, 2.2, 4.0] }
];

// Bridge motif in E minor: E-F#->G
const bridgeMotif = [164.81, 185.00, 196.00];

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.0;
  masterGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 5);
  masterGain.connect(audioCtx.destination);

  // Lush multi-tap reverb
  reverbGain = audioCtx.createGain();
  reverbGain.gain.value = 0.2;
  reverbDelay = audioCtx.createDelay(2.0);
  reverbDelay.delayTime.value = 0.4;
  reverbDelay2 = audioCtx.createDelay(2.0);
  reverbDelay2.delayTime.value = 0.8;
  reverbDelay3 = audioCtx.createDelay(2.0);
  reverbDelay3.delayTime.value = 1.3;

  const reverbFilter = audioCtx.createBiquadFilter();
  reverbFilter.type = 'lowpass';
  reverbFilter.frequency.value = 1800;
  reverbFilter.Q.value = 0.5;

  const reverbFeedback = audioCtx.createGain();
  reverbFeedback.gain.value = 0.25;

  reverbGain.connect(reverbDelay);
  reverbGain.connect(reverbDelay2);
  reverbGain.connect(reverbDelay3);
  reverbDelay.connect(reverbFilter);
  reverbDelay2.connect(reverbFilter);
  reverbDelay3.connect(reverbFilter);
  reverbFilter.connect(reverbFeedback);
  reverbFeedback.connect(reverbDelay);
  reverbFilter.connect(masterGain);

  // Sub bass drone on E (key of Trogdor in E minor)
  const sub = audioCtx.createOscillator();
  const subTri = audioCtx.createOscillator();
  const subGain = audioCtx.createGain();
  const subFilter = audioCtx.createBiquadFilter();
  sub.type = 'sine';
  subTri.type = 'triangle';
  sub.frequency.value = 41.20; // E1 sub
  subTri.frequency.value = 41.28; // slight detune for movement
  subFilter.type = 'lowpass';
  subFilter.frequency.value = 90;
  subGain.gain.value = 0.07;
  sub.connect(subFilter);
  subTri.connect(subFilter);
  subFilter.connect(subGain);
  subGain.connect(masterGain);
  sub.start();
  subTri.start();

  // Second sub layer - gentle E2
  const sub2 = audioCtx.createOscillator();
  const sub2Tri = audioCtx.createOscillator();
  const sub2Gain = audioCtx.createGain();
  const sub2Filter = audioCtx.createBiquadFilter();
  sub2.type = 'sine';
  sub2Tri.type = 'triangle';
  sub2.frequency.value = 82.41; // E2
  sub2Tri.frequency.value = 82.50; // slight detune
  sub2Filter.type = 'lowpass';
  sub2Filter.frequency.value = 150;
  sub2Gain.gain.value = 0.025;
  sub2.connect(sub2Filter);
  sub2Tri.connect(sub2Filter);
  sub2Filter.connect(sub2Gain);
  sub2Gain.connect(masterGain);
  sub2.start();
  sub2Tri.start();

  // Slow LFO to modulate sub bass warmth
  const subLfo = audioCtx.createOscillator();
  const subLfoGain = audioCtx.createGain();
  subLfo.frequency.value = 0.05;
  subLfoGain.gain.value = 0.015;
  subLfo.connect(subLfoGain);
  subLfoGain.connect(subGain.gain);
  subLfo.start();

  startWind();
  startCrickets();
}

function startWind() {
  const bufferSize = audioCtx.sampleRate * 2;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

  windNode = audioCtx.createBufferSource();
  windNode.buffer = buffer;
  windNode.loop = true;
  const windFilter = audioCtx.createBiquadFilter();
  windFilter.type = 'bandpass';
  windFilter.frequency.value = 350;
  windFilter.Q.value = 0.4;
  const windGain = audioCtx.createGain();
  windGain.gain.value = 0.018;

  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.frequency.value = 0.07;
  lfoGain.gain.value = 150;
  lfo.connect(lfoGain);
  lfoGain.connect(windFilter.frequency);
  lfo.start();

  const lfo2 = audioCtx.createOscillator();
  const lfo2Gain = audioCtx.createGain();
  lfo2.frequency.value = 0.03;
  lfo2Gain.gain.value = 0.008;
  lfo2.connect(lfo2Gain);
  lfo2Gain.connect(windGain.gain);
  lfo2.start();

  windNode.connect(windFilter);
  windFilter.connect(windGain);
  windGain.connect(masterGain);
  windNode.start();
}

function startCrickets() {
  function scheduleCricket() {
    if (!audioCtx || audioCtx.state !== 'running') {
      setTimeout(scheduleCricket, 1000);
      return;
    }
    const now = audioCtx.currentTime;
    const chirpCount = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < chirpCount; i++) {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 4200 + Math.random() * 1800;
      g.gain.setValueAtTime(0, now + i * 0.06);
      g.gain.linearRampToValueAtTime(0.006, now + i * 0.06 + 0.01);
      g.gain.linearRampToValueAtTime(0, now + i * 0.06 + 0.04);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(now + i * 0.06);
      osc.stop(now + i * 0.06 + 0.05);
    }
    setTimeout(scheduleCricket, 2500 + Math.random() * 5000);
  }
  scheduleCricket();
}

// Pad chord: soft filtered sine/triangle with chorus effect
function playPad(freq, startTime, duration, vol = 0.03) {
  if (!audioCtx) return;
  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const osc3 = audioCtx.createOscillator();
  const osc4 = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  osc1.type = 'sine';
  osc2.type = 'triangle';
  osc3.type = 'sine';
  osc4.type = 'triangle';
  osc1.frequency.value = freq;
  osc2.frequency.value = freq * 1.002;
  osc3.frequency.value = freq * 0.998;
  osc4.frequency.value = freq * 1.005;

  const chorusLfo = audioCtx.createOscillator();
  const chorusDepth2 = audioCtx.createGain();
  const chorusDepth3 = audioCtx.createGain();
  const chorusDepth4 = audioCtx.createGain();
  chorusLfo.type = 'sine';
  chorusLfo.frequency.value = 0.3 + Math.random() * 0.4;
  chorusDepth2.gain.value = freq * 0.003;
  chorusDepth3.gain.value = freq * 0.004;
  chorusDepth4.gain.value = freq * 0.005;
  chorusLfo.connect(chorusDepth2);
  chorusLfo.connect(chorusDepth3);
  chorusLfo.connect(chorusDepth4);
  chorusDepth2.connect(osc2.frequency);
  chorusDepth3.connect(osc3.frequency);
  chorusDepth4.connect(osc4.frequency);

  filter.type = 'lowpass';
  filter.frequency.value = 600 + Math.random() * 200;
  filter.Q.value = 0.7;

  const attack = 3.0;
  const release = 3.5;
  g.gain.setValueAtTime(0, startTime);
  g.gain.linearRampToValueAtTime(vol, startTime + attack);
  g.gain.setValueAtTime(vol, startTime + duration - release);
  g.gain.linearRampToValueAtTime(0, startTime + duration);

  filter.frequency.setValueAtTime(300, startTime);
  filter.frequency.linearRampToValueAtTime(700 + Math.random() * 200, startTime + attack);

  osc1.connect(filter);
  osc2.connect(filter);
  osc3.connect(filter);
  osc4.connect(filter);
  filter.connect(g);
  g.connect(masterGain);
  g.connect(reverbGain);

  osc1.start(startTime);
  osc2.start(startTime);
  osc3.start(startTime);
  osc4.start(startTime);
  chorusLfo.start(startTime);
  osc1.stop(startTime + duration + 0.1);
  osc2.stop(startTime + duration + 0.1);
  osc3.stop(startTime + duration + 0.1);
  osc4.stop(startTime + duration + 0.1);
  chorusLfo.stop(startTime + duration + 0.1);
}

// Melody note: gentle bell-like tone with shimmer harmonics
function playMelodyNote(freq, time_offset, vol) {
  if (!audioCtx) return;
  const v = vol || (0.018 + Math.random() * 0.012);
  const now = audioCtx.currentTime + (time_offset || 0);

  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(v, now + 0.15);
  g.gain.exponentialRampToValueAtTime(v * 0.3, now + 2.0);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 5.0);
  osc.connect(g);
  g.connect(masterGain);
  g.connect(reverbGain);
  osc.start(now);
  osc.stop(now + 5.5);

  const osc2 = audioCtx.createOscillator();
  const osc2b = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  osc2.type = 'sine';
  osc2b.type = 'sine';
  osc2.frequency.value = freq * 2.0;
  osc2b.frequency.value = freq * 2.003;
  g2.gain.setValueAtTime(0, now);
  g2.gain.linearRampToValueAtTime(v * 0.2, now + 0.05);
  g2.gain.exponentialRampToValueAtTime(v * 0.08, now + 1.5);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + 3.5);
  osc2.connect(g2);
  osc2b.connect(g2);
  g2.connect(masterGain);
  g2.connect(reverbGain);
  osc2.start(now);
  osc2b.start(now);
  osc2.stop(now + 4.0);
  osc2b.stop(now + 4.0);

  const osc3 = audioCtx.createOscillator();
  const osc3b = audioCtx.createOscillator();
  const g3 = audioCtx.createGain();
  osc3.type = 'sine';
  osc3b.type = 'sine';
  osc3.frequency.value = freq * 3.0;
  osc3b.frequency.value = freq * 3.005;
  g3.gain.setValueAtTime(0, now);
  g3.gain.linearRampToValueAtTime(v * 0.1, now + 0.03);
  g3.gain.exponentialRampToValueAtTime(v * 0.04, now + 1.0);
  g3.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);
  osc3.connect(g3);
  osc3b.connect(g3);
  g3.connect(masterGain);
  g3.connect(reverbGain);
  osc3.start(now);
  osc3b.start(now);
  osc3.stop(now + 3.0);
  osc3b.stop(now + 3.0);
}

// Bell tone with rich overtones
function playBell(freq) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const vol = 0.02;

  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 7);
  osc.connect(g);
  g.connect(masterGain);
  g.connect(reverbGain);
  osc.start(now);
  osc.stop(now + 7.5);

  const partials = [2.0, 2.76, 4.07, 5.4];
  const pVols = [0.12, 0.06, 0.03, 0.015];
  const pDecay = [5, 3.5, 2.5, 1.8];
  partials.forEach((p, i) => {
    const o = audioCtx.createOscillator();
    const gp = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = freq * p;
    gp.gain.setValueAtTime(vol * pVols[i], now);
    gp.gain.exponentialRampToValueAtTime(0.0001, now + pDecay[i]);
    o.connect(gp);
    gp.connect(masterGain);
    gp.connect(reverbGain);
    o.start(now);
    o.stop(now + pDecay[i] + 0.5);
  });
}

// Trogdor whisper - ghostly E4->G4->B4 contour (E minor)
function playTrogdorWhisper() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const totalDuration = 2.5;

  // "TROGDOR" pitch contour in E minor: E4 -> G4 -> B4
  const pitchStages = [
    { freq: 329.63, start: 0,   dur: 0.9 },  // "TROG" - E4
    { freq: 392.00, start: 0.8, dur: 0.8 },  // "DOR"  - G4
    { freq: 493.88, start: 1.5, dur: 1.0 },  // "..."  - B4 (trailing off)
  ];

  const formants = [
    { f: 700,  q: 4, g: 1.0 },
    { f: 1200, q: 4, g: 0.7 },
    { f: 2600, q: 4, g: 0.3 },
  ];

  const whisperReverb = audioCtx.createGain();
  whisperReverb.gain.value = 0.6;
  const wDelay1 = audioCtx.createDelay(3.0);
  wDelay1.delayTime.value = 0.3;
  const wDelay2 = audioCtx.createDelay(3.0);
  wDelay2.delayTime.value = 0.7;
  const wDelay3 = audioCtx.createDelay(3.0);
  wDelay3.delayTime.value = 1.2;
  const wDelay4 = audioCtx.createDelay(3.0);
  wDelay4.delayTime.value = 1.8;
  const wFeedback = audioCtx.createGain();
  wFeedback.gain.value = 0.35;
  const wFilter = audioCtx.createBiquadFilter();
  wFilter.type = 'lowpass';
  wFilter.frequency.value = 1200;
  wFilter.Q.value = 0.3;
  const wOut = audioCtx.createGain();
  wOut.gain.value = 0.08;

  whisperReverb.connect(wDelay1);
  whisperReverb.connect(wDelay2);
  whisperReverb.connect(wDelay3);
  whisperReverb.connect(wDelay4);
  wDelay1.connect(wFilter);
  wDelay2.connect(wFilter);
  wDelay3.connect(wFilter);
  wDelay4.connect(wFilter);
  wFilter.connect(wFeedback);
  wFeedback.connect(wDelay1);
  wFilter.connect(wOut);
  wOut.connect(masterGain);

  pitchStages.forEach(stage => {
    const stageStart = now + stage.start;
    const stageDur = stage.dur;

    const bufLen = audioCtx.sampleRate * Math.ceil(stageDur + 1);
    const noiseBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
    const noiseData = noiseBuf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) noiseData[i] = Math.random() * 2 - 1;
    const noiseSource = audioCtx.createBufferSource();
    noiseSource.buffer = noiseBuf;

    const formantGain = audioCtx.createGain();
    formantGain.gain.setValueAtTime(0, stageStart);
    formantGain.gain.linearRampToValueAtTime(0.08, stageStart + 0.15);
    formantGain.gain.setValueAtTime(0.08, stageStart + stageDur * 0.6);
    formantGain.gain.exponentialRampToValueAtTime(0.001, stageStart + stageDur);

    formants.forEach(f => {
      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = f.f * (stage.freq / 329.63); // shift formants with pitch (E4 base)
      bp.Q.value = f.q;
      const fg = audioCtx.createGain();
      fg.gain.value = f.g;
      noiseSource.connect(bp);
      bp.connect(fg);
      fg.connect(formantGain);
    });

    const dryGain = audioCtx.createGain();
    dryGain.gain.value = 0.04;
    formantGain.connect(dryGain);
    dryGain.connect(masterGain);
    formantGain.connect(whisperReverb);

    noiseSource.start(stageStart);
    noiseSource.stop(stageStart + stageDur + 0.5);
  });
}

function updateMusic(dt) {
  if (!audioCtx) return;
  chordTime += dt;

  // Change chord every ~8 seconds
  if (chordTime > nextChordDuration) {
    chordTime = 0;
    nextChordDuration = 7.5 + Math.random() * 2.5;
    currentChordIndex = (currentChordIndex + 1) % trogdorChords.length;
    const chord = trogdorChords[currentChordIndex];
    const now = audioCtx.currentTime;
    const dur = nextChordDuration + 3.5;

    // Play the E minor chord as soft pad voices
    chord.notes.forEach((f, i) => {
      playPad(f, now, dur, 0.022 + i * 0.003);
      playPad(f / 2, now + 0.3 + Math.random() * 0.5, dur - 0.5, 0.012);
    });

    playPad(chord.bass, now + 0.1, dur, 0.015);
  }

  // Trogdor chorus melody - sparse gentle bell-like E-F#-G notes
  lastMelodyTime += dt;
  const melodyInterval = 2.5 + Math.random() * 3.5;
  if (lastMelodyTime > melodyInterval) {
    lastMelodyTime = 0;

    const phrase = chorusPhrases[melodyPhase];
    const noteFreq = phrase.notes[melodyNoteIndex];

    playMelodyNote(noteFreq, 0);

    melodyNoteIndex++;
    if (melodyNoteIndex >= phrase.notes.length) {
      melodyNoteIndex = 0;
      melodyPhase = (melodyPhase + 1) % chorusPhrases.length;
      lastMelodyTime = -2.0;
    }
  }

  // Random E minor pentatonic sparkles (E, G, A, B, D)
  lastBellTime += dt;
  if (lastBellTime > 4 + Math.random() * 6) {
    lastBellTime = 0;
    const sparkleNotes = eMinPentatonic.slice(5); // octaves 4-5
    const note = sparkleNotes[Math.floor(Math.random() * sparkleNotes.length)];
    playMelodyNote(note, 0, 0.01 + Math.random() * 0.008);

    if (Math.random() > 0.65) {
      const note2 = sparkleNotes[Math.floor(Math.random() * sparkleNotes.length)];
      playMelodyNote(note2, 0.8 + Math.random() * 1.2, 0.008);
    }
  }

  // Bridge motif: E-F#->G as gentle recurring figure
  lastBridgeTime += dt;
  if (lastBridgeTime > 20 + Math.random() * 25) {
    lastBridgeTime = 0;
    const now = audioCtx.currentTime;
    bridgeMotif.forEach((freq, i) => {
      playMelodyNote(freq * 2, 1.5 * i + Math.random() * 0.3, 0.022);
    });
  }

  // Rare deep bell on E or B (the key tones of E minor)
  if (Math.random() < 0.0003) {
    const bellNote = Math.random() > 0.5 ? 329.63 : 493.88; // E4 or B4
    playBell(bellNote);
  }

  // Trogdor whisper - subtle ambient easter egg
  lastWhisperTime += dt;
  if (lastWhisperTime > whisperCooldown) {
    lastWhisperTime = 0;
    whisperCooldown = 60 + Math.random() * 30;
    playTrogdorWhisper();
  }
}

// Mountains
const mountains = [];
function generateMountains() {
  mountains.length = 0;
  for (let layer = 0; layer < 3; layer++) {
    const pts = [];
    const baseY = 0.45 + layer * 0.07;
    const amplitude = 0.12 - layer * 0.03;
    const segments = 20 + layer * 10;
    for (let i = 0; i <= segments; i++) {
      const x = i / segments;
      let y = baseY;
      y -= amplitude * Math.sin(x * Math.PI * (2 + layer)) * (0.5 + 0.5 * Math.sin(x * Math.PI));
      y -= (Math.random() * 0.01);
      // Add some peaks
      if (Math.random() > 0.85) y -= 0.03;
      pts.push({ x, y });
    }
    mountains.push({ points: pts, layer });
  }
}

// ============================================================
// DRAWING FUNCTIONS

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
  grad.addColorStop(0, '#050510');
  grad.addColorStop(0.4, '#0a0a2e');
  grad.addColorStop(0.7, '#111144');
  grad.addColorStop(1, '#1a1a3e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H * 0.65);
}

function drawStars() {
  stars.forEach(s => {
    const twinkle = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time * s.twinkleSpeed + s.x * 100));
    const alpha = s.brightness * twinkle;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI * 2);
    ctx.fill();
    // Subtle glow
    if (s.size > 1.5) {
      ctx.globalAlpha = alpha * 0.15;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.size * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  ctx.globalAlpha = 1;
}

function drawMoon() {
  const mx = moonX * W;
  const my = moonY * H + Math.sin(time * 0.02) * 5;

  // Outer glow
  const glow = ctx.createRadialGradient(mx, my, 15, mx, my, 100);
  glow.addColorStop(0, 'rgba(200,210,255,0.15)');
  glow.addColorStop(0.5, 'rgba(150,170,220,0.05)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(mx - 100, my - 100, 200, 200);

  // Moon body
  ctx.fillStyle = '#e8e8f0';
  ctx.beginPath();
  ctx.arc(mx, my, 25, 0, Math.PI * 2);
  ctx.fill();

  // Craters
  ctx.fillStyle = 'rgba(180,180,200,0.4)';
  ctx.beginPath(); ctx.arc(mx - 8, my - 5, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 6, my + 8, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 3, my - 10, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(180,180,200,0.2)';
  ctx.beginPath(); ctx.arc(mx - 3, my + 6, 6, 0, Math.PI * 2); ctx.fill();
}

function drawAurora() {
  const auroraIntensity = Math.max(0, Math.sin(time * 0.03) * 0.5 + 0.3);
  if (auroraIntensity < 0.05) return;

  ctx.globalAlpha = auroraIntensity * 0.3;
  auroraWaves.forEach(wave => {
    ctx.beginPath();
    const baseY = wave.y * H;
    for (let x = 0; x <= W; x += 4) {
      const xr = x / W;
      const bell = Math.exp(-Math.pow((xr - 0.5) / wave.width, 2));
      const y = baseY + Math.sin(xr * 6 + time * wave.speed + wave.offset) * wave.amplitude * bell
        + Math.sin(xr * 3 + time * wave.speed * 0.7) * wave.amplitude * 0.5 * bell;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    // Draw as thick translucent line
    const hue = wave.hue + Math.sin(time * 0.1) * 20;
    ctx.strokeStyle = `hsla(${hue}, 80%, 60%, 0.4)`;
    ctx.lineWidth = 15 + Math.sin(time * 0.2 + wave.offset) * 8;
    ctx.stroke();

    // Inner brighter line
    ctx.strokeStyle = `hsla(${hue}, 90%, 75%, 0.2)`;
    ctx.lineWidth = 6;
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

function drawMountains() {
  mountains.forEach((m, idx) => {
    const darkness = 0.03 + idx * 0.03;
    ctx.fillStyle = `rgb(${Math.floor(darkness*255)},${Math.floor(darkness*200)},${Math.floor(darkness*255)})`;
    ctx.beginPath();
    ctx.moveTo(0, H);
    m.points.forEach(p => ctx.lineTo(p.x * W, p.y * H));
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  });
}

function drawLake() {
  const lakeTop = 0.65 * H;

  // Lake base
  const lakeGrad = ctx.createLinearGradient(0, lakeTop, 0, H);
  lakeGrad.addColorStop(0, '#0a0a2a');
  lakeGrad.addColorStop(0.3, '#080820');
  lakeGrad.addColorStop(1, '#050515');
  ctx.fillStyle = lakeGrad;
  ctx.fillRect(0, lakeTop, W, H - lakeTop);

  // Moon reflection
  const mx = moonX * W;
  const reflY = lakeTop + 30;
  ctx.globalAlpha = 0.2;
  for (let i = 0; i < 8; i++) {
    const shimmer = Math.sin(time * 2 + i * 0.5) * 3;
    ctx.fillStyle = 'rgba(200,210,255,0.1)';
    ctx.fillRect(mx - 15 + shimmer, reflY + i * 10, 30, 3);
  }

  // Fire reflection on lake
  const fireReflX = FIRE_X * W;
  const fireIntensity = 0.15 + 0.05 * Math.sin(time * 3);
  const fireReflGrad = ctx.createRadialGradient(fireReflX, lakeTop + 40, 5, fireReflX, lakeTop + 80, 120);
  fireReflGrad.addColorStop(0, `rgba(255,140,30,${fireIntensity})`);
  fireReflGrad.addColorStop(0.5, `rgba(255,80,10,${fireIntensity * 0.4})`);
  fireReflGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = fireReflGrad;
  ctx.fillRect(fireReflX - 120, lakeTop, 240, 160);

  // Water lines
  ctx.globalAlpha = 0.06;
  ctx.strokeStyle = '#4466aa';
  ctx.lineWidth = 1;
  for (let y = lakeTop + 5; y < H; y += 12) {
    ctx.beginPath();
    for (let x = 0; x < W; x += 4) {
      const wave = Math.sin(x * 0.01 + time * 0.5 + y * 0.1) * 2;
      if (x === 0) ctx.moveTo(x, y + wave);
      else ctx.lineTo(x, y + wave);
    }
    ctx.stroke();
  }

  // Ripples
  ctx.globalAlpha = 1;
  ripples.forEach(r => {
    ctx.globalAlpha = r.life * 0.4;
    ctx.strokeStyle = `rgba(150,180,255,${r.life * 0.5})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(r.x, r.y, r.radius, r.radius * 0.3, 0, 0, Math.PI * 2);
    ctx.stroke();
    if (r.radius > 10) {
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, r.radius * 0.6, r.radius * 0.18, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  });
  ctx.globalAlpha = 1;
}

function drawGround() {
  // Ground around fire
  const groundY = FIRE_Y * H + 10;
  const grad = ctx.createLinearGradient(0, groundY - 20, 0, groundY + 30);
  grad.addColorStop(0, '#1a1a10');
  grad.addColorStop(1, '#0a0a08');
  ctx.fillStyle = grad;

  ctx.beginPath();
  ctx.moveTo(0, groundY);
  for (let x = 0; x <= W; x += 10) {
    const bump = Math.sin(x * 0.02) * 3 + Math.sin(x * 0.05) * 2;
    ctx.lineTo(x, groundY + bump);
  }
  ctx.lineTo(W, H * 0.65);
  ctx.lineTo(0, H * 0.65);
  ctx.closePath();
  ctx.fill();
}

function drawFire() {
  const fx = FIRE_X * W;
  const fy = FIRE_Y * H;

  // Fire glow on ground
  const groundGlow = ctx.createRadialGradient(fx, fy, 10, fx, fy + 20, 200);
  groundGlow.addColorStop(0, 'rgba(255,120,20,0.15)');
  groundGlow.addColorStop(0.5, 'rgba(255,60,10,0.05)');
  groundGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = groundGlow;
  ctx.fillRect(fx - 200, fy - 100, 400, 250);

  // Fire base glow
  ctx.globalAlpha = 0.6 + 0.2 * Math.sin(time * 5);
  const baseGlow = ctx.createRadialGradient(fx, fy - 30, 5, fx, fy - 20, 60);
  baseGlow.addColorStop(0, 'rgba(255,220,100,0.8)');
  baseGlow.addColorStop(0.3, 'rgba(255,140,20,0.5)');
  baseGlow.addColorStop(0.7, 'rgba(255,60,10,0.2)');
  baseGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = baseGlow;
  ctx.beginPath();
  ctx.arc(fx, fy - 20, 50, 0, Math.PI * 2);
  ctx.fill();

  // Log shapes
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#3a2010';
  ctx.save();
  ctx.translate(fx, fy + 5);
  ctx.rotate(-0.3);
  ctx.fillRect(-25, -4, 50, 8);
  ctx.restore();
  ctx.save();
  ctx.translate(fx, fy + 5);
  ctx.rotate(0.3);
  ctx.fillRect(-25, -4, 50, 8);
  ctx.restore();

  // Draw fire particles
  fireParticles.forEach(p => {
    const alpha = p.life;
    if (p.type === 'spark') {
      ctx.fillStyle = `rgba(255,${180 + Math.floor(p.life * 75)},${Math.floor(p.life * 100)},${alpha})`;
      ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
    } else {
      const r = p.size * p.life;
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      if (p.life > 0.6) {
        grad.addColorStop(0, `rgba(255,255,200,${alpha * 0.8})`);
        grad.addColorStop(0.4, `rgba(255,${150 + p.hue},20,${alpha * 0.6})`);
      } else {
        grad.addColorStop(0, `rgba(255,${100 + p.hue},20,${alpha * 0.5})`);
        grad.addColorStop(0.4, `rgba(200,50,10,${alpha * 0.3})`);
      }
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Embers
  embers.forEach(e => {
    ctx.fillStyle = `rgba(255,${150 + Math.floor(e.life * 100)},50,${e.life * 0.8})`;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size * e.life, 0, Math.PI * 2);
    ctx.fill();
  });
}

  ctx.moveTo(42, -8); ctx.lineTo(46, -12);
  ctx.moveTo(41, -6); ctx.lineTo(46, -8);
  ctx.moveTo(42, -5); ctx.lineTo(47, -5);

  ctx.ellipse(8, 14, 8, 4, 0.2, 0, Math.PI * 2);

  ctx.moveTo(-5, -10);

function drawFireflies() {
  fireflies.forEach(f => {
    const glow = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time * f.glowSpeed + f.phase));
    if (glow < 0.3) return;

    ctx.globalAlpha = glow * 0.6;
    const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size * 4);
    grad.addColorStop(0, `rgba(180,255,100,${glow})`);
    grad.addColorStop(0.5, `rgba(120,200,60,${glow * 0.3})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size * 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(220,255,150,${glow})`;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size * 0.5, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawShootingStars() {
  shootingStars.forEach(s => {
    const alpha = s.life;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx * 15, s.y - s.vy * 15);
    ctx.stroke();

    // Trail glow
    ctx.globalAlpha = alpha * 0.3;
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#aaddff';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx * 25, s.y - s.vy * 25);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

function drawPeasants() {
  peasants.forEach(p => {
    const px = p.x;
    const py = p.y;
    const flicker = 0.4 + 0.3 * Math.max(0, 1 - Math.abs(px - FIRE_X * W) / 200);
    const scale = p.scale || 1;

    ctx.save();
    ctx.translate(px, py);
    ctx.scale(scale, scale);

    // Body
    ctx.fillStyle = `rgb(${Math.floor(140 * flicker)},${Math.floor(100 * flicker)},${Math.floor(70 * flicker)})`;
    ctx.fillRect(-4, -12, 8, 14);

    // Head
    ctx.fillStyle = `rgb(${Math.floor(200 * flicker)},${Math.floor(170 * flicker)},${Math.floor(140 * flicker)})`;
    ctx.beginPath();
    ctx.arc(0, -16, 5, 0, Math.PI * 2);
    ctx.fill();

    // Walking legs
    const legPhase = time * 2 * p.dir;
    ctx.strokeStyle = `rgb(${Math.floor(120 * flicker)},${Math.floor(80 * flicker)},${Math.floor(50 * flicker)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-2, 2);
    ctx.lineTo(-2 + Math.sin(legPhase) * 4, 10);
    ctx.moveTo(2, 2);
    ctx.lineTo(2 + Math.sin(legPhase + Math.PI) * 4, 10);
    ctx.stroke();

    ctx.restore();
  });
}

function drawConstellationTrogdor() {
  // Constellation that slowly fades in/out
  const consAlpha = Math.max(0, Math.sin(time * 0.015) * 0.5);
  if (consAlpha < 0.02) return;

  ctx.globalAlpha = consAlpha;
  const cx = 0.3 * W;
  const cy = 0.15 * H;
  const s = 3;

  // Simple Trogdor constellation - connect dots
  const points = [
    [0, 0], [3, -2], [6, -1], [8, -3], [10, -1], // body top
    [10, 2], [7, 3], [4, 2], [1, 3], [0, 0], // body bottom
    [10, -1], [13, -3], [14, -5], // neck & head
    [14, -5], [16, -6], // snout
    [7, 1], [9, 5], [12, 3] // beefy arm
  ];

  ctx.strokeStyle = 'rgba(150,180,255,0.6)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  points.forEach((p, i) => {
    const px = cx + p[0] * s * 4;
    const py = cy + p[1] * s * 4;
    if (i === 0 || i === 10 || i === 13 || i === 15) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  });
  ctx.stroke();

  // Stars at constellation points
  ctx.fillStyle = '#aaccff';
  points.forEach(p => {
    const px = cx + p[0] * s * 4;
    const py = cy + p[1] * s * 4;
    ctx.beginPath();
    ctx.arc(px, py, 2, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.globalAlpha = 1;
}

function drawSceneLighting() {
  // Overall ambient fire light
  const fx = FIRE_X * W;
  const fy = FIRE_Y * H;
  const flicker = 0.8 + 0.2 * Math.sin(time * 6);

  const lightGrad = ctx.createRadialGradient(fx, fy - 30, 20, fx, fy, 350);
  lightGrad.addColorStop(0, `rgba(255,140,40,${0.08 * flicker})`);
  lightGrad.addColorStop(0.3, `rgba(255,80,10,${0.04 * flicker})`);
  lightGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = lightGrad;
  ctx.fillRect(0, 0, W, H);
}

function drawCursorGlow() {
  if (!started) return;
  const grad = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 40);
  grad.addColorStop(0, 'rgba(255,180,60,0.08)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(mouseX, mouseY, 40, 0, Math.PI * 2);
  ctx.fill();
}

// ============================================================
// UPDATE
// ============================================================

function update(dt) {
  time += dt;

  // Spawn fire particles
  if (Math.random() < 0.6) spawnFireParticle();
  if (Math.random() < 0.05) spawnEmber();

  // Mouse fire particles
  if (mouseDown && started) {
    for (let i = 0; i < 3; i++) {
      spawnFireParticle(
        mouseX + (Math.random() - 0.5) * 20,
        mouseY + (Math.random() - 0.5) * 20,
        true
      );
    }
  }

  // Update fire particles
  for (let i = fireParticles.length - 1; i >= 0; i--) {
    const p = fireParticles[i];
    p.x += p.vx + Math.sin(time * 3 + p.x * 0.01) * 0.5;
    p.vy -= 0.05; // acceleration upward
    p.y += p.vy;
    p.vx *= 0.99;
    p.life -= p.decay;
    if (p.life <= 0) fireParticles.splice(i, 1);
  }
  // Cap particles
  while (fireParticles.length > 300) fireParticles.shift();

  // Update embers
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i];
    e.x += e.vx + Math.sin(time * 2 + e.x * 0.05) * 0.3;
    e.y += e.vy;
    e.life -= e.decay;
    if (e.life <= 0) embers.splice(i, 1);
  }

  // Update fireflies
  fireflies.forEach(f => {
    f.x += f.vx + Math.sin(time * 0.5 + f.phase) * 0.3;
    f.y += f.vy + Math.cos(time * 0.3 + f.phase) * 0.2;
    // Wander
    f.vx += (Math.random() - 0.5) * 0.02;
    f.vy += (Math.random() - 0.5) * 0.02;
    f.vx *= 0.99;
    f.vy *= 0.99;
    // Keep in bounds
    if (f.x < 0) f.vx += 0.1;
    if (f.x > W) f.vx -= 0.1;
    if (f.y < 0.35 * H) f.vy += 0.05;
    if (f.y > 0.7 * H) f.vy -= 0.05;
  });

  // Shooting stars
  shootingStarTimer -= dt;
  if (shootingStarTimer <= 0) {
    shootingStarTimer = 8 + Math.random() * 20;
    const startX = Math.random() * W * 0.8;
    shootingStars.push({
      x: startX, y: Math.random() * H * 0.3,
      vx: 3 + Math.random() * 4, vy: 1 + Math.random() * 2,
      life: 1
    });
    // Whisper on shooting star (~30% chance, with cooldown respect)
    if (Math.random() < 0.3 && lastWhisperTime > 20) {
      lastWhisperTime = 0;
      playTrogdorWhisper();
    }
  }
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const s = shootingStars[i];
    s.x += s.vx;
    s.y += s.vy;
    s.life -= 0.02;
    if (s.life <= 0) shootingStars.splice(i, 1);
  }

  // Peasants
  peasantTimer -= dt;
  if (peasantTimer <= 0) {
    peasantTimer = 20 + Math.random() * 40;
    const dir = Math.random() > 0.5 ? 1 : -1;
    peasants.push({
      x: dir > 0 ? -20 : W + 20,
      y: FIRE_Y * H + 5 + Math.random() * 15,
      dir: dir,
      speed: 0.3 + Math.random() * 0.3,
      scale: 0.7 + Math.random() * 0.3
    });
  }
  for (let i = peasants.length - 1; i >= 0; i--) {
    const p = peasants[i];
    p.x += p.dir * p.speed;
    if ((p.dir > 0 && p.x > W + 30) || (p.dir < 0 && p.x < -30)) {
      peasants.splice(i, 1);
    }
  }

  // Ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.radius += 0.8;
    r.life -= 0.008;
    if (r.life <= 0) ripples.splice(i, 1);
  }

  // Music
  updateMusic(dt);
}

// ============================================================
// MAIN LOOP
// ============================================================

let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (started) {
    update(dt);
  }

  // Clear
  ctx.clearRect(0, 0, W, H);

  // Draw scene layers
  drawSky();
  drawStars();
  drawConstellationTrogdor();
  drawAurora();
  drawMoon();
  drawShootingStars();
  drawMountains();
  drawGround();
  drawLake();
  drawPeasants();
  drawTrogdor();
  drawFire();
  drawFireflies();
  drawSceneLighting();
  drawCursorGlow();

  requestAnimationFrame(gameLoop);
}

// ============================================================
// INPUT
// ============================================================

document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  cursor.style.left = mouseX + 'px';
  cursor.style.top = mouseY + 'px';

  // Spawn fire particles along mouse path when moving
  if (started && mouseDown) {
    for (let i = 0; i < 2; i++) {
      spawnFireParticle(mouseX + (Math.random()-0.5)*10, mouseY + (Math.random()-0.5)*10, true);
    }
  }
});

document.addEventListener('mousedown', e => {
  mouseDown = true;
  if (!started) {
    started = true;
    document.getElementById('start-screen').classList.add('fade');
    setTimeout(() => document.getElementById('start-screen').style.display = 'none', 2000);
    initAudio();
    // Play initial Dm chord (Trogdor's home key)
    if (audioCtx) {
      const chord = trogdorChords[0];
      const now = audioCtx.currentTime;
      chord.notes.forEach((f, i) => {
        playPad(f, now, 12, 0.022 + i * 0.003);
        playPad(f / 2, now + 0.5, 11, 0.012);
      });
      playPad(chord.bass, now + 0.2, 11, 0.015);
    }
    return;
  }

  // Check if clicking near the fire - occasionally whisper
  const fireDx = e.clientX - FIRE_X * W;
  const fireDy = e.clientY - FIRE_Y * H;
  const fireDistSq = fireDx * fireDx + fireDy * fireDy;
  if (fireDistSq < 120 * 120 && Math.random() < 0.15 && lastWhisperTime > 15) {
    lastWhisperTime = 0;
    playTrogdorWhisper();
  }

  // Check if clicking on lake
  const lakeTop = 0.65 * H;
  if (e.clientY > lakeTop) {
    ripples.push({
      x: e.clientX, y: e.clientY,
      radius: 3, life: 1
    });
    // Play gentle water sound
    if (audioCtx) {
      const now = audioCtx.currentTime;
      const noise = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      noise.type = 'sine';
      noise.frequency.value = 300 + Math.random() * 200;
      g.gain.setValueAtTime(0.02, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      noise.connect(g);
      g.connect(masterGain);
      noise.start(now);
      noise.stop(now + 1);
    }
  }
});

document.addEventListener('mouseup', () => mouseDown = false);

// Touch support
document.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouseX = t.clientX;
  mouseY = t.clientY;
  mouseDown = true;

  if (!started) {
    started = true;
    document.getElementById('start-screen').classList.add('fade');
    setTimeout(() => document.getElementById('start-screen').style.display = 'none', 2000);
    initAudio();
    const chord = trogdorChords[0];
    const now = audioCtx.currentTime;
    chord.notes.forEach((f, i) => {
      playPad(f, now, 12, 0.022 + i * 0.003);
      playPad(f / 2, now + 0.5, 11, 0.012);
    });
    playPad(chord.bass, now + 0.2, 11, 0.015);
  }

  const lakeTop = 0.65 * H;
  if (mouseY > lakeTop) {
    ripples.push({ x: mouseX, y: mouseY, radius: 3, life: 1 });
  }
}, { passive: false });

document.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouseX = t.clientX;
  mouseY = t.clientY;
  cursor.style.left = mouseX + 'px';
  cursor.style.top = mouseY + 'px';
  if (started) {
    spawnFireParticle(mouseX + (Math.random()-0.5)*10, mouseY + (Math.random()-0.5)*10, true);
  }
}, { passive: false });

document.addEventListener('touchend', () => mouseDown = false);

// Start loop
requestAnimationFrame(gameLoop);
</script>
</body>
