<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TROGDOR: Quest for Burnination</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { image-rendering: pixelated; cursor: default; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ========== SETUP ==========
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;
canvas.width = W; canvas.height = H;

// Scale to fit window
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
resize();
window.addEventListener('resize', resize);

// Mouse
let mouseX = 0, mouseY = 0, mouseClick = false;
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * (W / r.width);
  mouseY = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * (W / r.width);
  mouseY = (e.clientY - r.top) * (H / r.height);
  mouseClick = true;
});

// ========== AUDIO ENGINE ==========
let audioCtx = null;
let masterGain = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.55;
  masterGain.connect(audioCtx.destination);
}

// Music state
let musicNodes = [];
let musicPlaying = false;

function stopMusic() {
  musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
  musicNodes = [];
  musicPlaying = false;
}

function playNote(freq, type, start, dur, vol = 0.15, detune = 0) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  osc.detune.value = detune;
  gain.gain.value = 0;
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(vol, start + 0.02);
  gain.gain.setValueAtTime(vol, start + dur - 0.05);
  gain.gain.linearRampToValueAtTime(0, start + dur);
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(start);
  osc.stop(start + dur);
  musicNodes.push(osc);
  return osc;
}

function playNoise(start, dur, vol = 0.05) {
  if (!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * dur;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 8000;
  gain.gain.value = vol;
  gain.gain.setValueAtTime(vol, start);
  gain.gain.linearRampToValueAtTime(0, start + dur);
  src.connect(hp);
  hp.connect(gain);
  gain.connect(masterGain);
  src.start(start);
  src.stop(start + dur);
  musicNodes.push(src);
}

// ===== REALISTIC GUITAR ENGINE =====
const _distCurveCache = {};
function createDistortionCurve(amount) {
  if (_distCurveCache[amount]) return _distCurveCache[amount];
  const n = 44100;
  const curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    curve[i] = ((3 + amount) * x * 20 * (Math.PI / 180)) / (Math.PI + amount * Math.abs(x));
  }
  _distCurveCache[amount] = curve;
  return curve;
}

// Guitar cabinet simulation: lowpass 4500Hz + peaking 2500Hz (+5dB, Q=1.5) + highpass 80Hz
function createCabinetSim() {
  if (!audioCtx) return null;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 4500; lp.Q.value = 0.7;
  const peak = audioCtx.createBiquadFilter();
  peak.type = 'peaking'; peak.frequency.value = 2500; peak.gain.value = 5; peak.Q.value = 1.5;
  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 80; hp.Q.value = 0.7;
  lp.connect(peak); peak.connect(hp);
  return { input: lp, output: hp };
}

// Power chord: 2 detuned sawtooths per voice (root + fifth only = 4 oscs total)
function playPowerChord(freqs, start, dur, vol = 0.13, bossDetune = 0) {
  if (!audioCtx) return;
  const detunes = [-4, 4]; // +-4 cents detune per voice

  // Pre-distortion boost + distortion + cabinet chain
  const preBoost = audioCtx.createGain();
  preBoost.gain.value = 1.8;
  const distNode = audioCtx.createWaveShaper();
  distNode.curve = createDistortionCurve(50);
  distNode.oversample = '4x';
  const cab = createCabinetSim();
  const outGain = audioCtx.createGain();
  outGain.gain.setValueAtTime(0, start);
  outGain.gain.linearRampToValueAtTime(vol, start + 0.008);
  outGain.gain.setValueAtTime(vol, start + dur - 0.015);
  outGain.gain.linearRampToValueAtTime(0, start + dur);

  preBoost.connect(distNode);
  distNode.connect(cab.input);
  cab.output.connect(outGain);
  outGain.connect(masterGain);

  // Only root + fifth (first 2 freqs), 2 detuned each
  const voices = freqs.slice(0, 2);
  for (const freq of voices) {
    for (const d of detunes) {
      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      osc.detune.value = d + bossDetune;
      const oscGain = audioCtx.createGain();
      oscGain.gain.value = 0.35;
      osc.connect(oscGain);
      oscGain.connect(preBoost);
      osc.start(start);
      osc.stop(start + dur);
      musicNodes.push(osc);
    }
  }
}

// Palm mute chugs: 2 detuned sawtooths on E2, lowpass 500Hz, attack 0.002, decay 0.05
function playPalmMute(freq, start, dur, vol = 0.5, bossDetune = 0) {
  if (!audioCtx) return;
  const detunes = [-4, 4];
  const preBoost = audioCtx.createGain();
  preBoost.gain.value = 1.8;
  const distNode = audioCtx.createWaveShaper();
  distNode.curve = createDistortionCurve(50);
  distNode.oversample = '2x';
  const muteLP = audioCtx.createBiquadFilter();
  muteLP.type = 'lowpass'; muteLP.frequency.value = 500; muteLP.Q.value = 1.5;
  const cab = createCabinetSim();
  const outGain = audioCtx.createGain();
  outGain.gain.setValueAtTime(0, start);
  outGain.gain.linearRampToValueAtTime(vol, start + 0.002);
  outGain.gain.exponentialRampToValueAtTime(0.001, start + 0.002 + 0.05);

  preBoost.connect(distNode);
  distNode.connect(muteLP);
  muteLP.connect(cab.input);
  cab.output.connect(outGain);
  outGain.connect(masterGain);

  for (const d of detunes) {
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    osc.detune.value = d + bossDetune;
    const oscGain = audioCtx.createGain();
    oscGain.gain.value = 0.35;
    osc.connect(oscGain);
    oscGain.connect(preBoost);
    osc.start(start);
    osc.stop(start + dur);
    musicNodes.push(osc);
  }
}

// Bass: sine(0.7) + saw(0.5), distortion=15, lowpass 800Hz
function playBassNote(freq, start, dur, vol = 0.10, bossDetune = 0) {
  if (!audioCtx) return;
  const distNode = audioCtx.createWaveShaper();
  distNode.curve = createDistortionCurve(15);
  distNode.oversample = '2x';
  const bassLP = audioCtx.createBiquadFilter();
  bassLP.type = 'lowpass'; bassLP.frequency.value = 800; bassLP.Q.value = 0.8;
  const outGain = audioCtx.createGain();
  outGain.gain.setValueAtTime(0, start);
  outGain.gain.linearRampToValueAtTime(vol, start + 0.01);
  outGain.gain.setValueAtTime(vol, start + dur - 0.03);
  outGain.gain.linearRampToValueAtTime(0, start + dur);

  distNode.connect(bassLP);
  bassLP.connect(outGain);
  outGain.connect(masterGain);

  // Sine fundamental (gain 0.7)
  const oscSine = audioCtx.createOscillator();
  oscSine.type = 'sine'; oscSine.frequency.value = freq; oscSine.detune.value = bossDetune;
  const sGain = audioCtx.createGain(); sGain.gain.value = 0.7;
  oscSine.connect(sGain); sGain.connect(distNode);
  oscSine.start(start); oscSine.stop(start + dur);
  musicNodes.push(oscSine);

  // Sawtooth grit (gain 0.5)
  const oscSaw = audioCtx.createOscillator();
  oscSaw.type = 'sawtooth'; oscSaw.frequency.value = freq; oscSaw.detune.value = bossDetune;
  const sawGain = audioCtx.createGain(); sawGain.gain.value = 0.5;
  oscSaw.connect(sawGain); sawGain.connect(distNode);
  oscSaw.start(start); oscSaw.stop(start + dur);
  musicNodes.push(oscSaw);
}

// ===== "TROGDOR!" SCREAM via FORMANT SYNTHESIS =====
function playTrogdorScream(volumeScale = 1.0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + 0.02;
  const totalDur = 1.8;
  const vol = 0.18 * volumeScale;

  // --- Pitched source: sawtooth oscillator with pitch contour ---
  const srcOsc = audioCtx.createOscillator();
  srcOsc.type = 'sawtooth';
  // Pitch: E4(329.63) -> hold -> dip to 310 -> G4(392) -> B4(493.88) -> hold
  srcOsc.frequency.setValueAtTime(329.63, t);
  srcOsc.frequency.linearRampToValueAtTime(329.63, t + 0.25);  // "TR" hold E4
  srcOsc.frequency.linearRampToValueAtTime(310, t + 0.45);     // dip for "OG"
  srcOsc.frequency.linearRampToValueAtTime(392, t + 0.80);     // "D" -> G4
  srcOsc.frequency.linearRampToValueAtTime(493.88, t + 1.10);  // "OR!" -> B4
  srcOsc.frequency.linearRampToValueAtTime(493.88, t + 1.60);  // hold B4
  srcOsc.frequency.linearRampToValueAtTime(470, t + 1.80);     // slight drop at end

  // --- Noise source for breathiness ---
  const noiseBufLen = Math.ceil(audioCtx.sampleRate * totalDur);
  const noiseBuf = audioCtx.createBuffer(1, noiseBufLen, audioCtx.sampleRate);
  const noiseData = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseBufLen; i++) noiseData[i] = Math.random() * 2 - 1;
  const noiseSrc = audioCtx.createBufferSource();
  noiseSrc.buffer = noiseBuf;
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0.15;

  // --- Formant filters (3 bandpass, Q=8) ---
  function makeFormant(freqStart) {
    const f = audioCtx.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 8; f.frequency.value = freqStart;
    return f;
  }
  const f1 = makeFormant(400);
  const f2 = makeFormant(1000);
  const f3 = makeFormant(2500);

  // Formant transitions: "TR" -> "AH/OH" -> "GD" (closure) -> "OR!"
  // F1
  f1.frequency.setValueAtTime(400, t);          // "TR"
  f1.frequency.linearRampToValueAtTime(700, t + 0.25);   // -> "AH/OH"
  f1.frequency.linearRampToValueAtTime(700, t + 0.65);   // hold
  f1.frequency.linearRampToValueAtTime(250, t + 0.75);   // "GD" closure
  f1.frequency.linearRampToValueAtTime(500, t + 0.90);   // "OR!"
  f1.frequency.linearRampToValueAtTime(500, t + 1.80);   // hold
  // F2
  f2.frequency.setValueAtTime(1400, t);         // "TR"
  f2.frequency.linearRampToValueAtTime(1100, t + 0.25);  // "AH/OH"
  f2.frequency.linearRampToValueAtTime(1100, t + 0.65);  // hold
  f2.frequency.linearRampToValueAtTime(1600, t + 0.75);  // "GD"
  f2.frequency.linearRampToValueAtTime(900, t + 0.90);   // "OR!"
  f2.frequency.linearRampToValueAtTime(900, t + 1.80);   // hold
  // F3
  f3.frequency.setValueAtTime(2800, t);         // "TR"
  f3.frequency.linearRampToValueAtTime(2600, t + 0.25);  // "AH/OH"
  f3.frequency.linearRampToValueAtTime(2600, t + 0.65);  // hold
  f3.frequency.linearRampToValueAtTime(3000, t + 0.75);  // "GD"
  f3.frequency.linearRampToValueAtTime(2500, t + 0.90);  // "OR!"
  f3.frequency.linearRampToValueAtTime(2500, t + 1.80);  // hold

  // --- Formant gain mixer ---
  const f1g = audioCtx.createGain(); f1g.gain.value = 0.45;
  const f2g = audioCtx.createGain(); f2g.gain.value = 0.35;
  const f3g = audioCtx.createGain(); f3g.gain.value = 0.20;

  // --- Light distortion for metal quality ---
  const screamDist = audioCtx.createWaveShaper();
  screamDist.curve = createDistortionCurve(12);
  screamDist.oversample = '4x';

  // --- Crescendo envelope ---
  const envGain = audioCtx.createGain();
  envGain.gain.setValueAtTime(0, t);
  envGain.gain.linearRampToValueAtTime(vol * 0.4, t + 0.08);   // quick attack for "TR"
  envGain.gain.linearRampToValueAtTime(vol * 0.6, t + 0.25);   // build
  envGain.gain.linearRampToValueAtTime(vol * 0.3, t + 0.75);   // dip for "GD" closure
  envGain.gain.linearRampToValueAtTime(vol * 1.0, t + 1.10);   // full blast "OR!"
  envGain.gain.linearRampToValueAtTime(vol * 1.0, t + 1.50);   // hold
  envGain.gain.linearRampToValueAtTime(0, t + 1.80);           // fade

  // --- Wiring ---
  // Osc -> each formant -> gain -> distortion -> envelope -> master
  const merger = audioCtx.createGain(); merger.gain.value = 1;
  [f1, f2, f3].forEach((f, i) => {
    srcOsc.connect(f);
    noiseSrc.connect(f);
    const fg = [f1g, f2g, f3g][i];
    f.connect(fg);
    fg.connect(merger);
  });
  // Also route noise directly through formants (already connected above via noiseSrc)
  noiseSrc.connect(noiseGain);
  noiseGain.connect(merger);

  merger.connect(screamDist);
  screamDist.connect(envGain);
  envGain.connect(masterGain);

  srcOsc.start(t);
  srcOsc.stop(t + totalDur);
  noiseSrc.start(t);
  noiseSrc.stop(t + totalDur);
  musicNodes.push(srcOsc, noiseSrc);
}

// Battle music - Trogdor theme arranged as JRPG battle music
// Key: E minor, based on the real Trogdor guitar/bass tabs
// CHORUS: E5-E5-A5---E5-E5-G5---E5-E5-A5-E5-G5-E5-F#5->G5 (x2)
// VERSE: E(chugs)-A5-E-G5-E-A5-E-G5-E-A5x4
// PRE-CHORUS "burninating": E5-F#5-G5 ascending (x3)
// BRIDGE: E-F#->G hammer-ons
function playBattleMusic(isBoss = false) {
  if (!audioCtx) return;
  stopMusic();
  musicPlaying = true;
  const t = audioCtx.currentTime + 0.05;
  const bpm = isBoss ? 170 : 144;
  const beat = 60 / bpm;
  const sixteenth = beat / 4;
  const eighth = beat / 2;
  const bar = beat * 4;
  const loopLen = bar * 16; // 16 bars: riff(4) + verse(4) + prechorus(4) + bridge(4)

  // E minor Trogdor frequencies
  // Power chords: root + fifth (2 detuned saws each = 4 oscs)
  const E2 = 82.41;  // palm mute chugs
  const E3 = 164.81, B3 = 246.94;   // E5 power chord (root+fifth)
  const A2 = 110.00, E3f = 164.81;  // A5 power chord
  const G3 = 196.00, D4 = 293.66;   // G5 power chord
  const Fs3 = 185.00, Cs4 = 277.18; // F#5 power chord
  // Melody notes
  const E4 = 329.63, Fs4 = 369.99, G4 = 392.00, B4 = 493.88;
  // Bass
  const E1 = 41.20;

  // Boss: extra detune for dissonance
  const bossDetune = isBoss ? 25 : 0;
  const bossOctave = isBoss ? 0.5 : 1;
  const distAmount = isBoss ? 70 : 50;

  function scheduleLoop(offset) {
    if (!musicPlaying) return;

    // ===== SECTION 1: MAIN RIFF - CHORUS (bars 1-4) =====
    // E5-E5-A5---E5-E5-G5---E5-E5-A5-E5-G5-E5-F#5->G5 (x2)
    const riffSection = offset;

    // Bar 1: E5-E5-A5(held)
    playPalmMute(E2, riffSection, eighth * 0.85, 0.10, bossDetune);
    playPalmMute(E2, riffSection + eighth, eighth * 0.85, 0.10, bossDetune);
    playPowerChord([A2, E3f], riffSection + 2 * eighth, eighth * 5.5 * 0.85, 0.13, bossDetune);

    // Bar 2: E5-E5-G5(held)
    const b2 = riffSection + bar;
    playPalmMute(E2, b2, eighth * 0.85, 0.10, bossDetune);
    playPalmMute(E2, b2 + eighth, eighth * 0.85, 0.10, bossDetune);
    playPowerChord([G3, D4], b2 + 2 * eighth, eighth * 5.5 * 0.85, 0.13, bossDetune);

    // Bar 3: E5-E5-A5-E5-G5-E5
    const b3 = riffSection + bar * 2;
    playPalmMute(E2, b3, eighth * 0.85, 0.10, bossDetune);
    playPalmMute(E2, b3 + eighth, eighth * 0.85, 0.10, bossDetune);
    playPowerChord([A2, E3f], b3 + 2 * eighth, beat * 0.85, 0.12, bossDetune);
    playPalmMute(E2, b3 + 2 * beat, eighth * 0.85, 0.10, bossDetune);
    playPowerChord([G3, D4], b3 + 2 * beat + eighth, beat * 0.85, 0.12, bossDetune);
    playPalmMute(E2, b3 + 3.5 * beat, eighth * 0.85, 0.10, bossDetune);

    // Bar 4: F#5->G5 resolution
    const b4 = riffSection + bar * 3;
    playPowerChord([Fs3, Cs4], b4, beat * 0.7, 0.11, bossDetune);
    playPowerChord([G3, D4], b4 + beat, beat * 2.5 * 0.85, 0.13, bossDetune);
    // Repeat riff phrase in last beat
    playPalmMute(E2, b4 + 3.5 * beat, eighth * 0.85, 0.10, bossDetune);

    // Riff bass (bars 1-4) - E root throughout with chord-tone movement
    const riffBass = [E1,E1,A2*0.5,A2*0.5, E1,E1,G3*0.5,G3*0.5, E1,E1,A2*0.5,E1, G3*0.5,Fs3*0.5,G3*0.5,E1];
    for (let i = 0; i < 16; i++) {
      playBassNote(riffBass[i], riffSection + i * beat, beat * 0.8, 0.10, bossDetune);
    }

    // ===== SECTION 2: VERSE (bars 5-8) =====
    // E(chugs)-A5-E-G5 repeated pattern
    const verseSection = offset + bar * 4;
    for (let vBar = 0; vBar < 4; vBar++) {
      const vStart = verseSection + vBar * bar;
      // E chugs on 16ths for first beat
      for (let c = 0; c < 4; c++) {
        playPalmMute(E2, vStart + c * sixteenth, sixteenth * 0.8, 0.09, bossDetune);
      }
      // A5 power chord
      playPowerChord([A2, E3f], vStart + beat, beat * 0.85, 0.08, bossDetune);
      // E chugs
      for (let c = 0; c < 4; c++) {
        playPalmMute(E2, vStart + 2 * beat + c * sixteenth, sixteenth * 0.8, 0.09, bossDetune);
      }
      // G5 power chord
      playPowerChord([G3, D4], vStart + 3 * beat, beat * 0.85, 0.08, bossDetune);
      // Triangle pad layer for atmosphere
      playNote(E3 * 2, 'triangle', vStart, bar * 0.92, 0.02, bossDetune);
      if (isBoss) {
        playPowerChord([E3 * 1.06], vStart, bar * 0.92, 0.03, bossDetune);
      }
    }

    // Verse bass
    const verseBass = [E1,E1,A2*0.5,A2*0.5, E1,E1,G3*0.5,G3*0.5, E1,E1,A2*0.5,A2*0.5, E1,E1,G3*0.5,E1];
    for (let i = 0; i < 16; i++) {
      playBassNote(verseBass[i], verseSection + i * beat, beat * 0.8, 0.10, bossDetune);
    }

    // ===== SECTION 3: PRE-CHORUS "burninating" (bars 9-12) =====
    // Lead melody: E5-F#5-G5 ascending (x3), then shout E4->G4->B4
    const pcSection = offset + bar * 8;
    const pcMelody = [
      // "burninating the countryside" - E4 E4 E4 E4 F#4 G4 (ascending)
      [E4, eighth], [E4, eighth], [E4, eighth], [E4, eighth],
      [Fs4, eighth], [G4, beat], [G4, beat + eighth],
      // "burninating the peasants" - repeat
      [E4, eighth], [E4, eighth], [E4, eighth], [E4, eighth],
      [Fs4, eighth], [G4, beat], [G4, beat + eighth],
      // "burninating all the people" - E ascending run
      [E4, eighth], [Fs4, eighth], [G4, beat],
      [E4, eighth], [Fs4, eighth], [G4, beat + eighth],
      // "TROGDOR!" shout: E4->G4->B4
      [E4, beat], [G4, beat], [B4, beat * 2]
    ];
    let cTime = 0;
    for (const [freq, dur] of pcMelody) {
      const f = freq * bossOctave;
      playNote(f, 'square', pcSection + cTime, dur * 0.85, 0.09);
      playNote(f * 1.002, 'square', pcSection + cTime, dur * 0.85, 0.04);
      if (isBoss) {
        playNote(f * 0.5, 'sawtooth', pcSection + cTime, dur * 0.85, 0.05, 15);
      }
      cTime += dur;
    }

    // Trigger "TROGDOR!" scream at the ascending E4->G4->B4 phrase
    const trogdorShoutTime = pcSection + cTime - beat * 4;
    const screamDelay = ((trogdorShoutTime - audioCtx.currentTime) * 1000);
    if (screamDelay > 0) {
      setTimeout(() => {
        if (musicPlaying) playTrogdorScream(0.5);
      }, screamDelay);
    }

    // Pre-chorus power chord pads - E5 and A5 alternating
    const pcPadChords = [
      [E3, A2],
      [G3, E3]
    ];
    for (let i = 0; i < 2; i++) {
      for (let j = 0; j < 2; j++) {
        const root = pcPadChords[i][j];
        const fifth = root * 1.5;
        const start = pcSection + (i * 2 + j) * bar;
        playPowerChord([root, fifth], start, bar * 0.92, 0.06, bossDetune);
      }
    }

    // Pre-chorus bass
    const pcBass = [E1,E1,E1,E1, A2*0.5,A2*0.5,A2*0.5,A2*0.5,
                    G3*0.5,G3*0.5,G3*0.5,G3*0.5, E1,E1,E1,E1];
    for (let i = 0; i < 16; i++) {
      playBassNote(pcBass[i], pcSection + i * beat, beat * 0.8, 0.10, bossDetune);
    }

    // ===== SECTION 4: BRIDGE (bars 13-16) =====
    // E-F#->G hammer-on pattern
    const bridgeSection = offset + bar * 12;
    for (let rep = 0; rep < 16; rep++) {
      const bStart = bridgeSection + rep * beat;
      // E palm mute
      playPalmMute(E2, bStart, eighth * 0.8, 0.10, bossDetune);
      // F#->G hammer-on as power chords
      playPowerChord([Fs3, Cs4], bStart + eighth, eighth * 0.4, 0.08, bossDetune);
      playPowerChord([G3, D4], bStart + eighth + eighth * 0.3, eighth * 0.6, 0.10, bossDetune);
    }
    // Bridge bass
    for (let rep = 0; rep < 16; rep++) {
      const bStart = bridgeSection + rep * beat;
      playBassNote(E1, bStart, eighth * 0.8, 0.10, bossDetune);
      playBassNote(Fs3 * 0.5, bStart + eighth, eighth * 0.35, 0.07, bossDetune);
      playBassNote(G3 * 0.5, bStart + eighth + eighth * 0.3, eighth * 0.55, 0.10, bossDetune);
    }

    // ===== DRUMS (all 16 bars) =====
    const totalBeats = 64; // 16 bars * 4 beats
    const totalSixteenths = totalBeats * 4;

    // Hi-hats: 16th notes, 0.05s, gain 0.30
    for (let i = 0; i < totalSixteenths; i++) {
      const accent = (i % 4 === 0) ? 0.30 : (i % 2 === 0 ? 0.22 : 0.15);
      playNoise(offset + i * sixteenth, 0.05, accent);
    }

    // Kick: 200->35Hz sweep, 0.6 gain. Snare: 0.5 gain
    for (let i = 0; i < totalBeats; i++) {
      if (isBoss) {
        // Boss: double kick on every 8th note
        if (i % 4 === 0 || i % 4 === 2) {
          playNote(200, 'sine', offset + i * beat, 0.15, 0.6);
          playNote(200, 'sine', offset + i * beat + eighth, 0.15, 0.5);
        }
        if (i % 2 === 1) {
          playNote(200, 'sine', offset + i * beat, 0.15, 0.5);
        }
      } else {
        // Normal: kick on 1 and 3
        if (i % 4 === 0 || i % 4 === 2) {
          playNote(200, 'sine', offset + i * beat, 0.15, 0.6);
        }
      }
      // Snare on 2 and 4
      if (i % 4 === 1 || i % 4 === 3) {
        playNoise(offset + i * beat, 0.12, 0.5);
        playNote(200, 'triangle', offset + i * beat, 0.12, 0.5);
      }
    }

    // Cymbal crash on section starts
    for (let i = 0; i < 16; i++) {
      playNoise(offset + i * bar, 0.4, 0.06);
    }

    // Boss: extra dissonant stabs on section transitions
    if (isBoss) {
      const stabs = [0, bar * 4, bar * 8, bar * 12];
      for (const s of stabs) {
        playNote(E3 * 2.06, 'sawtooth', offset + s, beat * 0.5, 0.04, 30);
        playNote(E3 * 4.06, 'sawtooth', offset + s, beat * 0.3, 0.03, 40);
      }
    }

    // Schedule next loop
    setTimeout(() => {
      if (musicPlaying) scheduleLoop(offset + loopLen);
    }, (loopLen - 0.5) * 1000);
  }

  scheduleLoop(t);
}

// Victory fanfare - E minor Trogdor arpeggio: E-F#-G-A-B ascending with triumphant resolution
function playVictoryFanfare() {
  if (!audioCtx) return;
  stopMusic();
  const t = audioCtx.currentTime + 0.05;

  // Quick ascending E-F#-G-A-B arpeggio
  const arp = [329.63, 369.99, 392.00, 440.00, 493.88];
  let time = t;
  for (let i = 0; i < arp.length; i++) {
    const dur = 0.12;
    playNote(arp[i], 'square', time, dur * 0.9, 0.12);
    playNote(arp[i] * 1.5, 'triangle', time, dur * 0.9, 0.06);
    playNote(arp[i] * 0.5, 'sawtooth', time, dur * 0.9, 0.06);
    time += dur;
  }

  // Hold the high B
  time += 0.05;
  playNote(493.88, 'square', time, 0.4, 0.13);
  playNote(493.88 * 1.5, 'triangle', time, 0.4, 0.06);

  // Pause
  time += 0.5;

  // Second arpeggio run: G-A-B-E5-F#5-G5-B5 (higher)
  const arp2 = [392.00, 440.00, 493.88, 659.25, 739.99, 783.99, 987.77];
  for (let i = 0; i < arp2.length; i++) {
    const dur = 0.1;
    playNote(arp2[i], 'square', time, dur * 0.85, 0.1 - i * 0.008);
    playNote(arp2[i] * 0.5, 'triangle', time, dur * 0.85, 0.05);
    time += dur;
  }

  // Final triumphant chord: E5 power chord held
  time += 0.05;
  playNote(659.25, 'square', time, 1.2, 0.1);    // E5
  playNote(987.77, 'square', time, 1.2, 0.07);    // B5
  playNote(329.63, 'sawtooth', time, 1.2, 0.08);  // E4 bass
  playNote(1318.51, 'triangle', time, 1.2, 0.04); // E6 shimmer

  // Snare roll into final hit
  for (let i = 0; i < 6; i++) {
    playNoise(time - 0.3 + i * 0.05, 0.06, 0.04 + i * 0.01);
  }
}

// SFX
function playSFX(type) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  switch(type) {
    case 'fire': {
      for (let i = 0; i < 8; i++) {
        playNoise(t + i * 0.04, 0.15, 0.08 - i * 0.008);
        playNote(300 + i * 50, 'sawtooth', t + i * 0.03, 0.08, 0.06);
      }
      break;
    }
    case 'stomp': {
      playNote(80, 'sine', t, 0.1, 0.25);
      playNote(40, 'sine', t + 0.05, 0.15, 0.2);
      playNoise(t, 0.08, 0.15);
      break;
    }
    case 'roar': {
      for (let i = 0; i < 5; i++) {
        playNote(80 + i * 20, 'sawtooth', t + i * 0.08, 0.3 - i * 0.04, 0.1);
      }
      playNote(60, 'sawtooth', t, 0.5, 0.08);
      break;
    }
    case 'heal': {
      const healNotes = [523.25, 659.25, 783.99, 1046.5];
      healNotes.forEach((f, i) => {
        playNote(f, 'sine', t + i * 0.12, 0.3, 0.08);
        playNote(f * 1.5, 'triangle', t + i * 0.12, 0.2, 0.04);
      });
      break;
    }
    case 'hit': {
      playNoise(t, 0.1, 0.12);
      playNote(150, 'square', t, 0.05, 0.15);
      playNote(80, 'square', t + 0.05, 0.08, 0.1);
      break;
    }
    case 'damage': {
      playNote(400, 'square', t, 0.05, 0.1);
      playNote(200, 'square', t + 0.05, 0.1, 0.08);
      playNoise(t, 0.08, 0.1);
      break;
    }
    case 'select': {
      playNote(600, 'square', t, 0.05, 0.06);
      playNote(800, 'square', t + 0.05, 0.06, 0.06);
      break;
    }
    case 'levelup': {
      const lu = [329.63, 369.99, 392.00, 493.88, 659.25];
      lu.forEach((f, i) => {
        playNote(f, 'square', t + i * 0.1, 0.15, 0.1);
        playNote(f, 'triangle', t + i * 0.1, 0.15, 0.06);
      });
      break;
    }
    case 'death': {
      for (let i = 0; i < 6; i++) {
        playNote(300 - i * 40, 'sawtooth', t + i * 0.12, 0.2, 0.08);
      }
      break;
    }
  }
}

// ========== PARTICLES ==========
let particles = [];
function addParticle(x, y, type, count = 10) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * (type === 'fire' ? 6 : 3),
      vy: -Math.random() * 4 - 1,
      life: 1,
      decay: 0.01 + Math.random() * 0.02,
      size: 2 + Math.random() * 4,
      type
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.type === 'fire') { p.vy -= 0.1; p.vx *= 0.98; }
    else if (p.type === 'magic') { p.vx *= 0.95; p.vy *= 0.95; }
    else if (p.type === 'heal') { p.vy -= 0.05; }
    else { p.vy += 0.1; }
    p.life -= p.decay;
    return p.life > 0;
  });
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    if (p.type === 'fire') {
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      g.addColorStop(0, '#fff');
      g.addColorStop(0.3, '#ff0');
      g.addColorStop(0.6, '#f80');
      g.addColorStop(1, '#f00');
      ctx.fillStyle = g;
    } else if (p.type === 'magic') {
      ctx.fillStyle = `hsl(${260 + Math.random() * 60}, 100%, ${60 + Math.random() * 30}%)`;
    } else if (p.type === 'heal') {
      ctx.fillStyle = `hsl(120, 100%, ${60 + Math.random() * 30}%)`;
    } else if (p.type === 'stomp') {
      ctx.fillStyle = '#a86';
    } else {
      ctx.fillStyle = '#fff';
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ========== FLOATING TEXT ==========
let floatingTexts = [];
function addFloatingText(x, y, text, color = '#fff', size = 24) {
  floatingTexts.push({ x, y, text, color, size, life: 1, vy: -1.5 });
}

function updateFloatingTexts() {
  floatingTexts = floatingTexts.filter(ft => {
    ft.y += ft.vy;
    ft.life -= 0.015;
    return ft.life > 0;
  });
}

function drawFloatingTexts() {
  for (const ft of floatingTexts) {
    ctx.globalAlpha = ft.life;
    ctx.font = `bold ${ft.size}px monospace`;
    ctx.fillStyle = '#000';
    ctx.fillText(ft.text, ft.x + 2, ft.y + 2);
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha = 1;
  }
}

let screenShake = 0;

// ========== DRAWING HELPERS ==========
function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function drawRPGBox(x, y, w, h, bgColor = '#112', borderColor = '#88f') {
  // Shadow
  drawPixelRect(x + 3, y + 3, w, h, 'rgba(0,0,0,0.5)');
  // Border
  drawPixelRect(x, y, w, h, borderColor);
  // Inner
  drawPixelRect(x + 3, y + 3, w - 6, h - 6, bgColor);
  // Highlight edges
  drawPixelRect(x + 3, y + 3, w - 6, 1, '#aaf');
  drawPixelRect(x + 3, y + 3, 1, h - 6, '#aaf');
}

function drawHPBar(x, y, w, h, current, max, color1, color2, label = '') {
  drawPixelRect(x - 1, y - 1, w + 2, h + 2, '#000');
  drawPixelRect(x, y, w, h, '#222');
  const ratio = Math.max(0, current / max);
  const barW = w * ratio;
  if (barW > 0) {
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, color1);
    g.addColorStop(1, color2);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, barW, h);
    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(x, y, barW, h / 3);
  }
  if (label) {
    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x + 3, y + h - 3);
    ctx.fillStyle = '#fff';
    const txt = `${Math.ceil(current)}/${max}`;
    ctx.fillText(txt, x + w - ctx.measureText(txt).width - 3, y + h - 3);
  }
}

// ========== SPRITE DRAWING ==========
function drawTrogdor(x, y, scale = 1, frame = 0) {
  const s = 3 * scale;
  ctx.save();
  ctx.translate(x, y);

  // Body (muscular S-shape)
  const bodyBob = Math.sin(frame * 0.08) * 2;

  // Tail
  ctx.fillStyle = '#2a2';
  for (let i = 0; i < 8; i++) {
    const tx = -20 * s + i * 2 * s;
    const ty = -10 * s + Math.sin(frame * 0.1 + i * 0.5) * 3 * s + bodyBob;
    drawPixelRect(tx, ty, 3 * s, 2 * s, '#2a2');
  }

  // Body
  drawPixelRect(-6 * s, -12 * s + bodyBob, 14 * s, 10 * s, '#2a2');
  drawPixelRect(-4 * s, -14 * s + bodyBob, 10 * s, 3 * s, '#2a2');
  // Belly
  drawPixelRect(-4 * s, -6 * s + bodyBob, 10 * s, 4 * s, '#5d5');

  // Legs
  const legAnim = Math.sin(frame * 0.1) * 1;
  drawPixelRect(-3 * s, -2 * s + bodyBob, 3 * s, 8 * s + legAnim, '#2a2');
  drawPixelRect(4 * s, -2 * s + bodyBob, 3 * s, 8 * s - legAnim, '#2a2');
  // Feet
  drawPixelRect(-4 * s, 6 * s + bodyBob + legAnim, 5 * s, 2 * s, '#2a2');
  drawPixelRect(3 * s, 6 * s + bodyBob - legAnim, 5 * s, 2 * s, '#2a2');

  // BEEFY ARM (the important one!)
  const armWave = Math.sin(frame * 0.12) * 3;
  ctx.fillStyle = '#2a2';
  drawPixelRect(8 * s, -10 * s + bodyBob, 4 * s, 3 * s, '#2a2');
  drawPixelRect(12 * s, -12 * s + bodyBob + armWave, 5 * s, 3 * s, '#2a2');
  drawPixelRect(17 * s, -14 * s + bodyBob + armWave, 3 * s, 2 * s, '#2a2');
  // Fist
  drawPixelRect(16 * s, -15 * s + bodyBob + armWave, 5 * s, 4 * s, '#2a2');
  // Muscles
  drawPixelRect(13 * s, -11 * s + bodyBob + armWave, 2 * s, 1 * s, '#5d5');

  // Neck
  drawPixelRect(4 * s, -18 * s + bodyBob, 5 * s, 6 * s, '#2a2');

  // Head
  drawPixelRect(2 * s, -26 * s + bodyBob, 12 * s, 9 * s, '#2a2');
  // Snout
  drawPixelRect(12 * s, -22 * s + bodyBob, 6 * s, 5 * s, '#2a2');
  // Jaw (open/close)
  const jawOpen = Math.sin(frame * 0.06) * 1.5;
  drawPixelRect(12 * s, -18 * s + bodyBob + jawOpen, 6 * s, 3 * s, '#2a2');
  // Teeth
  drawPixelRect(14 * s, -18 * s + bodyBob, 1.5 * s, 1.5 * s, '#fff');
  drawPixelRect(16 * s, -18 * s + bodyBob, 1.5 * s, 1.5 * s, '#fff');
  // Eye
  drawPixelRect(8 * s, -24 * s + bodyBob, 3 * s, 3 * s, '#fff');
  drawPixelRect(9 * s, -23 * s + bodyBob, 2 * s, 2 * s, '#f00');
  drawPixelRect(10 * s, -23 * s + bodyBob, 1 * s, 1 * s, '#000');
  // Nostril
  drawPixelRect(16 * s, -22 * s + bodyBob, 1.5 * s, 1.5 * s, '#181');
  // Spines
  for (let i = 0; i < 5; i++) {
    drawPixelRect((3 + i * 2) * s, -27 * s + bodyBob - i * 0.3 * s, 2 * s, 2 * s, '#f80');
    drawPixelRect((3.5 + i * 2) * s, -29 * s + bodyBob - i * 0.3 * s, 1 * s, 2 * s, '#f80');
  }

  // Wings
  const wingFlap = Math.sin(frame * 0.15) * 4;
  ctx.fillStyle = '#396';
  // Left wing
  drawPixelRect(-8 * s, -22 * s + bodyBob - wingFlap, 8 * s, 2 * s, '#396');
  drawPixelRect(-14 * s, -26 * s + bodyBob - wingFlap * 1.5, 8 * s, 6 * s, '#396');
  drawPixelRect(-12 * s, -24 * s + bodyBob - wingFlap * 1.5, 6 * s, 4 * s, '#5b8');
  // Wing membrane
  drawPixelRect(-16 * s, -28 * s + bodyBob - wingFlap * 1.5, 4 * s, 3 * s, '#396');

  ctx.restore();
}

// ========== BACKGROUNDS ==========
function drawCountryside(frame) {
  // Sky gradient
  const skyG = ctx.createLinearGradient(0, 0, 0, 300);
  skyG.addColorStop(0, '#4488cc');
  skyG.addColorStop(1, '#88ccff');
  ctx.fillStyle = skyG;
  ctx.fillRect(0, 0, W, 300);

  // Clouds
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 4; i++) {
    const cx = ((frame * 0.2 + i * 220) % (W + 100)) - 50;
    const cy = 40 + i * 30;
    ctx.beginPath();
    ctx.arc(cx, cy, 25, 0, Math.PI * 2);
    ctx.arc(cx + 30, cy - 5, 20, 0, Math.PI * 2);
    ctx.arc(cx + 50, cy, 22, 0, Math.PI * 2);
    ctx.fill();
  }

  // Sun
  ctx.fillStyle = '#ff0';
  ctx.beginPath();
  ctx.arc(680, 60, 30, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,0,0.2)';
  ctx.beginPath();
  ctx.arc(680, 60, 45, 0, Math.PI * 2);
  ctx.fill();

  // Hills
  ctx.fillStyle = '#3a7';
  ctx.beginPath();
  ctx.moveTo(0, 300);
  for (let x = 0; x <= W; x += 20) {
    ctx.lineTo(x, 260 + Math.sin(x * 0.008) * 30 + Math.sin(x * 0.003) * 20);
  }
  ctx.lineTo(W, 400);
  ctx.lineTo(0, 400);
  ctx.fill();

  // Ground
  const groundG = ctx.createLinearGradient(0, 300, 0, H);
  groundG.addColorStop(0, '#4a4');
  groundG.addColorStop(0.3, '#3a3');
  groundG.addColorStop(1, '#293');
  ctx.fillStyle = groundG;
  ctx.fillRect(0, 300, W, H - 300);

  // Grass tufts
  ctx.fillStyle = '#5c5';
  for (let i = 0; i < 20; i++) {
    const gx = (i * 41 + 13) % W;
    const gy = 310 + (i * 17) % 60;
    drawPixelRect(gx, gy, 3, 4, '#5c5');
    drawPixelRect(gx + 3, gy + 1, 3, 3, '#4b4');
  }

  // Cottages in distance
  drawPixelRect(100, 260, 30, 20, '#864');
  drawPixelRect(95, 250, 40, 12, '#a44');
  drawPixelRect(300, 270, 25, 15, '#864');
  drawPixelRect(295, 262, 35, 10, '#a44');
}

function drawThroneRoom(frame) {
  // Dark stone walls
  const wallG = ctx.createLinearGradient(0, 0, 0, H);
  wallG.addColorStop(0, '#333');
  wallG.addColorStop(1, '#222');
  ctx.fillStyle = wallG;
  ctx.fillRect(0, 0, W, H);

  // Stone bricks
  for (let row = 0; row < 15; row++) {
    for (let col = 0; col < 12; col++) {
      const bx = col * 70 + (row % 2) * 35;
      const by = row * 40;
      const shade = 50 + ((row * 7 + col * 13) % 20);
      ctx.fillStyle = `rgb(${shade},${shade},${shade+5})`;
      ctx.fillRect(bx + 1, by + 1, 68, 38);
    }
  }

  // Red carpet
  drawPixelRect(320, 0, 160, H, '#800');
  drawPixelRect(330, 0, 140, H, '#a22');
  // Carpet gold trim
  drawPixelRect(325, 0, 3, H, '#aa0');
  drawPixelRect(472, 0, 3, H, '#aa0');

  // Pillars
  for (let side = 0; side < 2; side++) {
    const px = side === 0 ? 200 : 560;
    drawPixelRect(px, 0, 30, H, '#555');
    drawPixelRect(px + 3, 0, 24, H, '#666');
    drawPixelRect(px + 6, 0, 3, H, 'rgba(255,255,255,0.1)');
    // Capital
    drawPixelRect(px - 5, 0, 40, 20, '#777');
  }

  // Floor
  const floorG = ctx.createLinearGradient(0, 350, 0, H);
  floorG.addColorStop(0, '#444');
  floorG.addColorStop(1, '#333');
  ctx.fillStyle = floorG;
  ctx.fillRect(0, 350, W, H - 350);

  // Floor tiles
  for (let x = 0; x < W; x += 50) {
    for (let y = 350; y < H; y += 50) {
      const shade = ((x + y) / 50) % 2 === 0 ? '#3a3a3a' : '#404040';
      drawPixelRect(x, y, 49, 49, shade);
    }
  }

  // Torches
  for (let i = 0; i < 2; i++) {
    const tx = i === 0 ? 140 : 620;
    drawPixelRect(tx, 100, 8, 30, '#862');
    // Flame
    const flicker = Math.sin(frame * 0.2 + i * 3) * 3;
    ctx.fillStyle = '#f80';
    ctx.beginPath();
    ctx.arc(tx + 4, 95 + flicker, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff0';
    ctx.beginPath();
    ctx.arc(tx + 4, 92 + flicker, 4, 0, Math.PI * 2);
    ctx.fill();
    // Glow
    ctx.fillStyle = 'rgba(255,150,50,0.05)';
    ctx.beginPath();
    ctx.arc(tx + 4, 95, 60, 0, Math.PI * 2);
    ctx.fill();
  }

  // Banners
  for (const bx of [250, 510]) {
    drawPixelRect(bx, 20, 30, 80, '#800');
    drawPixelRect(bx + 3, 23, 24, 74, '#a00');
    // Crown symbol
    drawPixelRect(bx + 8, 45, 14, 3, '#ff0');
    drawPixelRect(bx + 8, 42, 3, 3, '#ff0');
    drawPixelRect(bx + 13, 40, 4, 5, '#ff0');
    drawPixelRect(bx + 19, 42, 3, 3, '#ff0');
  }
}

// ========== COMBAT LOGIC ==========
const ACTIONS = [
  { name: 'BURN', desc: 'Fire attack', mpCost: 5, color: '#f80' },
  { name: 'STOMP', desc: 'Physical hit', mpCost: 0, color: '#a86' },
  { name: 'ROAR', desc: 'Buff ATK +50%', mpCost: 8, color: '#ff0' },
  { name: 'CONSUME', desc: 'Heal HP+MP', mpCost: 3, color: '#0f0' }
];

function executePlayerAction(idx) {
  const action = ACTIONS[idx];
  if (trogdor.mp < action.mpCost) {
    battleMessage = 'Not enough MP!';
    messageTimer = 60;
    gameState = 'playerTurn';
    return;
  }
  trogdor.mp -= action.mpCost;
  animType = action.name.toLowerCase();
  animTimer = 60;
  gameState = 'playerAnim';

  const atkPower = trogdor.atk + (trogdor.buffTurns > 0 ? trogdor.buffAmount : 0);

  switch(idx) {
    case 0: { // BURN
      const dmg = Math.max(1, Math.floor(atkPower * 1.3 - enemy.def * 0.5 + Math.random() * 6));
      enemy.hp = Math.max(0, enemy.hp - dmg);
      battleMessage = `Trogdor breathes fire! ${dmg} damage!`;
      playSFX('fire');
      playTrogdorScream(1.0); // Full scream on BURN attack
      addParticle(250, 350, 'fire', 25);
      addFloatingText(250, 300, `-${dmg}`, '#f80', 28);
      break;
    }
    case 1: { // STOMP
      const dmg = Math.max(1, Math.floor(atkPower * 1.0 - enemy.def * 0.7 + Math.random() * 8));
      enemy.hp = Math.max(0, enemy.hp - dmg);
      battleMessage = `Trogdor stomps mightily! ${dmg} damage!`;
      playSFX('stomp');
      screenShake = 15;
      addParticle(250, 400, 'stomp', 15);
      addFloatingText(250, 300, `-${dmg}`, '#fa0', 28);
      break;
    }
    case 2: { // ROAR
      trogdor.buffTurns = 3;
      trogdor.buffAmount = Math.floor(trogdor.atk * 0.5);
      battleMessage = `Trogdor ROARS! ATK up for 3 turns!`;
      playSFX('roar');
      playTrogdorScream(1.0); // Scream during ROAR buff activation
      screenFlash = 10;
      screenFlashColor = '#ff0';
      addFloatingText(580, 300, 'ATK UP!', '#ff0', 24);
      break;
    }
    case 3: { // CONSUME
      const healAmt = 25 + trogdor.level * 5;
      const mpHeal = 10 + trogdor.level * 2;
      trogdor.hp = Math.min(trogdor.maxHp, trogdor.hp + healAmt);
      trogdor.mp = Math.min(trogdor.maxMp, trogdor.mp + mpHeal);
      battleMessage = `Trogdor consumes a peasant! +${healAmt}HP +${mpHeal}MP!`;
      playSFX('heal');
      addParticle(580, 350, 'heal', 20);
      addFloatingText(580, 300, `+${healAmt}`, '#0f0', 24);
      addFloatingText(620, 320, `+${mpHeal}`, '#08f', 20);
      break;
    }
  }
  messageTimer = 90;
}

function executeEnemyAction() {
  const atkIdx = Math.floor(Math.random() * enemy.attacks.length);
  const atkName = enemy.attacks[atkIdx];
  const atkPower = enemy.atk * (0.8 + Math.random() * 0.4);
  const dmg = Math.max(1, Math.floor(atkPower - trogdor.def * 0.5));

  trogdor.hp = Math.max(0, trogdor.hp - dmg);
  battleMessage = `${enemy.name} uses ${atkName}! ${dmg} damage to Trogdor!`;
  playSFX('damage');
  screenShake = 10;
  screenFlash = 8;
  screenFlashColor = '#f00';
  addFloatingText(580, 300, `-${dmg}`, '#f44', 28);
  addParticle(580, 350, 'fire', 12);
  messageTimer = 90;
  animType = 'enemyAttack';
  animTimer = 50;
  gameState = 'enemyAnim';
}

function checkLevelUp() {
  if (trogdor.xp >= trogdor.xpToNext) {
    trogdor.level++;
    trogdor.xp -= trogdor.xpToNext;
    trogdor.xpToNext = Math.floor(trogdor.xpToNext * 1.5);
    trogdor.maxHp += 15;
    trogdor.maxMp += 5;
    trogdor.atk += 4;
    trogdor.def += 2;
    trogdor.hp = trogdor.maxHp;
    trogdor.mp = trogdor.maxMp;
    trogdor.displayHp = trogdor.hp;
    trogdor.displayMp = trogdor.mp;
    return true;
  }
  return false;
}

// ========== MAIN UPDATE ==========
function update() {
  frame++;
  updateParticles();
  updateFloatingTexts();

  // Smooth HP/MP bars
  trogdor.displayHp += (trogdor.hp - trogdor.displayHp) * 0.1;
  trogdor.displayMp += (trogdor.mp - trogdor.displayMp) * 0.1;
  if (enemy) enemyDisplayHp += (enemy.hp - enemyDisplayHp) * 0.1;

  if (screenShake > 0) screenShake *= 0.9;
  if (screenShake < 0.5) screenShake = 0;
  if (screenFlash > 0) screenFlash--;
  if (messageTimer > 0) messageTimer--;

  switch(gameState) {
    case 'title': {
      titleBlink++;
      if (mouseClick) {
        initAudio();
        playSFX('select');
        resetTrogdor();
        currentEnemy = 0;
        startBattle(0);
      }
      break;
    }
    case 'battle': {
      if (messageTimer <= 0) {
        gameState = 'playerTurn';
      }
      break;
    }
    case 'playerTurn': {
      // Menu interaction
      if (mouseClick) {
        for (let i = 0; i < 4; i++) {
          const bx = 20 + (i % 2) * 190;
          const by = 460 + Math.floor(i / 2) * 55;
          if (mouseX >= bx && mouseX <= bx + 180 && mouseY >= by && mouseY <= by + 48) {
            if (trogdor.mp >= ACTIONS[i].mpCost) {
              playSFX('select');
              executePlayerAction(i);
            }
          }
        }
      }
      break;
    }
    case 'playerAnim': {
      animTimer--;
      if (animTimer <= 0) {
        if (enemy.hp <= 0) {
          // Enemy defeated
          playSFX('death');
          stopMusic();
          battleMessage = `${enemy.name} defeated! +${enemy.xp} XP!`;
          messageTimer = 120;
          trogdor.xp += enemy.xp;
          if (trogdor.buffTurns > 0) trogdor.buffTurns--;
          setTimeout(() => {
            playVictoryFanfare();
            playTrogdorScream(0.5); // Half volume scream on victory
          }, 300);
          gameState = 'victory';
        } else {
          // Enemy turn
          gameState = 'enemyTurn';
          setTimeout(() => executeEnemyAction(), 500);
        }
      }
      break;
    }
    case 'enemyTurn': {
      break;
    }
    case 'enemyAnim': {
      animTimer--;
      if (animTimer <= 0) {
        if (trogdor.hp <= 0) {
          stopMusic();
          playSFX('death');
          battleMessage = 'Trogdor has fallen...';
          messageTimer = 180;
          gameState = 'gameover';
        } else {
          if (trogdor.buffTurns > 0) trogdor.buffTurns--;
          gameState = 'playerTurn';
          battleMessage = 'Choose your action!';
          messageTimer = 60;
        }
      }
      break;
    }
    case 'victory': {
      if (messageTimer <= 0) {
        if (checkLevelUp()) {
          playSFX('levelup');
          gameState = 'levelup';
          messageTimer = 180;
          battleMessage = `LEVEL UP! Trogdor is now level ${trogdor.level}!`;
        } else {
          if (currentEnemy >= ENEMIES.length - 1) {
            gameState = 'gamewin';
            messageTimer = 300;
          } else {
            // Next battle after click
            gameState = 'victory';
            messageTimer = -1; // waiting for click
          }
        }
      }
      if (messageTimer === -1 && mouseClick) {
        playSFX('select');
        startBattle(currentEnemy + 1);
      }
      break;
    }
    case 'levelup': {
      if (messageTimer <= 0) {
        if (currentEnemy >= ENEMIES.length - 1) {
          gameState = 'gamewin';
          messageTimer = 300;
        } else {
          gameState = 'victory';
          messageTimer = -1;
        }
      }
      break;
    }
    case 'gameover': {
      if (messageTimer <= 0 && mouseClick) {
        gameState = 'title';
      }
      break;
    }
    case 'gamewin': {
      if (messageTimer <= 0 && mouseClick) {
        gameState = 'title';
      }
      break;
    }
  }

  mouseClick = false;
}

// ========== MAIN DRAW ==========
function draw() {
  ctx.save();

  // Screen shake
  if (screenShake > 0) {
    ctx.translate(
      (Math.random() - 0.5) * screenShake * 2,
      (Math.random() - 0.5) * screenShake * 2
    );
  }

  if (gameState === 'title') {
    drawTitleScreen();
  } else if (gameState === 'gameover') {
    drawBattleScene();
    drawGameOver();
  } else if (gameState === 'gamewin') {
    drawGameWin();
  } else {
    drawBattleScene();
  }

  // Screen flash
  if (screenFlash > 0) {
    ctx.globalAlpha = screenFlash / 15;
    ctx.fillStyle = screenFlashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  drawParticles();
  drawFloatingTexts();

  ctx.restore();
}

function drawTitleScreen() {
  // Dramatic background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#100');
  bg.addColorStop(0.5, '#300');
  bg.addColorStop(1, '#000');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Fire particles in background
  for (let i = 0; i < 30; i++) {
    const fx = (i * 67 + frame * 0.5) % W;
    const fy = H - ((frame * (0.5 + i * 0.03) + i * 40) % H);
    const size = 2 + Math.sin(frame * 0.05 + i) * 2;
    ctx.globalAlpha = 0.3 + Math.sin(frame * 0.03 + i * 0.7) * 0.2;
    ctx.fillStyle = i % 3 === 0 ? '#f80' : (i % 3 === 1 ? '#f00' : '#ff0');
    ctx.beginPath();
    ctx.arc(fx, fy, size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Trogdor sprite (large)
  drawTrogdor(400, 350, 2.5, frame);

  // Title text
  ctx.font = 'bold 52px monospace';
  ctx.textAlign = 'center';
  // Shadow
  ctx.fillStyle = '#000';
  ctx.fillText('TROGDOR', W/2 + 3, 103);
  // Glow
  ctx.fillStyle = '#f80';
  ctx.fillText('TROGDOR', W/2, 100);

  ctx.font = 'bold 24px monospace';
  ctx.fillStyle = '#ff0';
  ctx.fillText('QUEST FOR BURNINATION', W/2, 140);

  // Subtitle
  ctx.font = '14px monospace';
  ctx.fillStyle = '#aaa';
  ctx.fillText('A Turn-Based RPG of Fire and Fury', W/2, 170);

  // Blink prompt
  if (Math.floor(frame / 30) % 2 === 0) {
    ctx.font = 'bold 20px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('~ CLICK TO START ~', W/2, H - 60);
  }

  ctx.textAlign = 'left';
}

function drawBattleScene() {
  // Background
  if (!enemy) return;
  if (enemy.bg === 'throne') drawThroneRoom(frame);
  else if (enemy.bg === 'castle') drawCastle(frame);
  else drawCountryside(frame);

  // Battle platform / ground line
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(250, 420, 80, 15, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(580, 420, 80, 15, 0, 0, Math.PI * 2);
  ctx.fill();

  // Enemy sprite (left side)
  const enemyShake = (gameState === 'playerAnim' && animTimer > 30) ? (Math.random() - 0.5) * 6 : 0;
  const enemyAlpha = (enemy.hp <= 0 && gameState === 'victory') ? Math.max(0, messageTimer / 120) : 1;
  ctx.globalAlpha = enemyAlpha;
  enemy.draw(250 + enemyShake, 400, 1.2, frame);
  ctx.globalAlpha = 1;

  // Trogdor (right side)
  const trogShake = (gameState === 'enemyAnim' && animTimer > 20) ? (Math.random() - 0.5) * 6 : 0;
  // Attack animation - lunge forward
  let trogX = 580 + trogShake;
  if (gameState === 'playerAnim') {
    if (animType === 'burn' || animType === 'stomp') {
      const progress = 1 - animTimer / 60;
      if (progress < 0.3) trogX -= progress * 100;
      else if (progress < 0.5) trogX -= (0.3 - (progress - 0.3)) * 100;
    }
  }
  drawTrogdor(trogX, 400, 1.2, frame);

  // Fire breath animation
  if (gameState === 'playerAnim' && animType === 'burn' && animTimer > 20) {
    for (let i = 0; i < 5; i++) {
      const progress = (60 - animTimer) / 60;
      const fx = 520 - progress * 300 + Math.random() * 30;
      const fy = 360 + Math.random() * 40;
      addParticle(fx, fy, 'fire', 3);
    }
  }

  // Stomp effect
  if (gameState === 'playerAnim' && animType === 'stomp' && animTimer === 40) {
    screenShake = 20;
  }

  // Roar visual
  if (gameState === 'playerAnim' && animType === 'roar') {
    const rSize = (60 - animTimer) * 3;
    ctx.strokeStyle = `rgba(255,255,0,${animTimer/60})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(580, 370, rSize, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Enemy attack animation
  if (gameState === 'enemyAnim' && animTimer > 20) {
    const progress = (50 - animTimer) / 50;
    // Projectile from enemy to trogdor
    const px = 250 + progress * 330;
    const py = 370 + Math.sin(progress * Math.PI) * -50;
    ctx.fillStyle = enemy.name === 'WIZARD' ? '#f0f' : (enemy.name === 'ARCHER' ? '#888' : '#aaa');
    ctx.beginPath();
    ctx.arc(px, py, 5, 0, Math.PI * 2);
    ctx.fill();
    if (enemy.name === 'WIZARD') addParticle(px, py, 'magic', 2);
  }

  // Enemy HP bar
  drawRPGBox(50, 30, 300, 60, '#112', '#88f');
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText(enemy.name, 65, 52);
  drawHPBar(65, 58, 270, 16, enemyDisplayHp, enemy.maxHp, '#f44', '#a00', 'HP');

  // Trogdor stats
  drawRPGBox(450, 30, 330, 80, '#112', '#88f');
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText(`TROGDOR  Lv.${trogdor.level}`, 465, 52);
  drawHPBar(465, 58, 300, 14, trogdor.displayHp, trogdor.maxHp, '#4f4', '#080', 'HP');
  drawHPBar(465, 78, 300, 14, trogdor.displayMp, trogdor.maxMp, '#48f', '#008', 'MP');

  // Buff indicator
  if (trogdor.buffTurns > 0) {
    ctx.font = 'bold 12px monospace';
    ctx.fillStyle = '#ff0';
    ctx.fillText(`ATK UP (${trogdor.buffTurns})`, 465, 105);
  }

  // Action menu
  if (gameState === 'playerTurn') {
    drawActionMenu();
  }

  // Message box
  if (battleMessage && messageTimer > 0) {
    drawRPGBox(100, 440, 600, 50, '#112', '#88f');
    ctx.font = 'bold 16px monospace';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(battleMessage, 400, 472);
    ctx.textAlign = 'left';
  }

  // Victory overlay
  if (gameState === 'victory' && messageTimer === -1) {
    drawVictoryScreen();
  }

  // Level up overlay
  if (gameState === 'levelup') {
    drawLevelUpScreen();
  }
}

function drawActionMenu() {
  drawRPGBox(10, 450, 400, 140, '#112', '#88f');
  ctx.font = 'bold 13px monospace';
  ctx.fillStyle = '#aaf';
  ctx.fillText('ACTIONS', 25, 470);

  for (let i = 0; i < 4; i++) {
    const bx = 20 + (i % 2) * 190;
    const by = 478 + Math.floor(i / 2) * 52;
    const action = ACTIONS[i];
    const canUse = trogdor.mp >= action.mpCost;

    // Button bg
    const hover = mouseX >= bx && mouseX <= bx + 180 && mouseY >= by && mouseY <= by + 44;
    drawPixelRect(bx, by, 180, 44, hover && canUse ? '#334' : '#223');
    drawPixelRect(bx, by, 180, 1, '#556');
    drawPixelRect(bx, by + 43, 180, 1, '#111');

    // Icon color bar
    drawPixelRect(bx + 2, by + 2, 4, 40, canUse ? action.color : '#444');

    ctx.globalAlpha = canUse ? 1 : 0.4;
    ctx.font = 'bold 15px monospace';
    ctx.fillStyle = action.color;
    ctx.fillText(action.name, bx + 12, by + 18);
    ctx.font = '11px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText(action.desc, bx + 12, by + 32);
    if (action.mpCost > 0) {
      ctx.fillStyle = '#48f';
      ctx.fillText(`${action.mpCost}MP`, bx + 135, by + 18);
    }
    ctx.globalAlpha = 1;
  }
}

function drawVictoryScreen() {
  // Semi-transparent overlay
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  drawRPGBox(150, 180, 500, 240, '#112', '#ff0');

  ctx.textAlign = 'center';
  ctx.font = 'bold 32px monospace';
  ctx.fillStyle = '#ff0';
  ctx.fillText('VICTORY!', 400, 230);

  ctx.font = 'bold 18px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText(`${ENEMIES[currentEnemy].name} defeated!`, 400, 270);

  ctx.font = '16px monospace';
  ctx.fillStyle = '#0f0';
  ctx.fillText(`+${ENEMIES[currentEnemy].xp} Experience Points`, 400, 310);

  // XP bar
  const xpRatio = trogdor.xp / trogdor.xpToNext;
  drawHPBar(230, 330, 340, 16, trogdor.xp, trogdor.xpToNext, '#ff0', '#a80', 'XP');

  ctx.font = '14px monospace';
  ctx.fillStyle = '#aaa';
  ctx.fillText(`Level ${trogdor.level}  |  HP: ${trogdor.hp}/${trogdor.maxHp}  |  ATK: ${trogdor.atk}  |  DEF: ${trogdor.def}`, 400, 370);

  if (Math.floor(frame / 25) % 2 === 0) {
    ctx.font = 'bold 16px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('~ Click for next battle ~', 400, 400);
  }

  ctx.textAlign = 'left';
}

function drawLevelUpScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  drawRPGBox(180, 150, 440, 300, '#112', '#ff0');

  ctx.textAlign = 'center';
  ctx.font = 'bold 36px monospace';
  ctx.fillStyle = '#ff0';
  const bounce = Math.sin(frame * 0.1) * 5;
  ctx.fillText('LEVEL UP!', 400, 200 + bounce);

  ctx.font = 'bold 24px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText(`Level ${trogdor.level}`, 400, 250);

  ctx.font = '16px monospace';
  const stats = [
    `Max HP: ${trogdor.maxHp}`,
    `Max MP: ${trogdor.maxMp}`,
    `ATK: ${trogdor.atk}`,
    `DEF: ${trogdor.def}`
  ];
  stats.forEach((s, i) => {
    ctx.fillStyle = '#0f0';
    ctx.fillText(s, 400, 290 + i * 28);
  });

  ctx.font = '14px monospace';
  ctx.fillStyle = '#aaa';
  ctx.fillText('HP & MP fully restored!', 400, 430);

  ctx.textAlign = 'left';
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.font = 'bold 48px monospace';
  ctx.fillStyle = '#f00';
  ctx.fillText('GAME OVER', W/2, H/2 - 30);

  ctx.font = '20px monospace';
  ctx.fillStyle = '#aaa';
  ctx.fillText('The burnination has ended...', W/2, H/2 + 20);

  if (messageTimer <= 0 && Math.floor(frame / 25) % 2 === 0) {
    ctx.font = '18px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('Click to try again', W/2, H/2 + 70);
  }

  ctx.textAlign = 'left';
}

function drawGameWin() {
  // Epic victory background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#000');
  bg.addColorStop(0.3, '#210');
  bg.addColorStop(0.6, '#420');
  bg.addColorStop(1, '#000');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Fire rain
  for (let i = 0; i < 40; i++) {
    const fx = (i * 53 + frame * 0.8) % W;
    const fy = (frame * (1 + i * 0.05) + i * 30) % H;
    ctx.fillStyle = i % 2 === 0 ? '#f80' : '#f00';
    ctx.globalAlpha = 0.5;
    drawPixelRect(fx, fy, 3, 6, ctx.fillStyle);
  }
  ctx.globalAlpha = 1;

  // Trogdor victorious
  drawTrogdor(400, 380, 2, frame);

  ctx.textAlign = 'center';

  ctx.font = 'bold 44px monospace';
  ctx.fillStyle = '#f80';
  const bounce = Math.sin(frame * 0.05) * 5;
  ctx.fillText('BURNINATION', W/2, 100 + bounce);
  ctx.font = 'bold 32px monospace';
  ctx.fillStyle = '#ff0';
  ctx.fillText('COMPLETE!', W/2, 145 + bounce);

  ctx.font = '18px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText('The King has fallen! The countryside burns!', W/2, 200);
  ctx.fillText('Trogdor reigns supreme!', W/2, 230);

  ctx.font = '16px monospace';
  ctx.fillStyle = '#aaa';
  ctx.fillText(`Final Level: ${trogdor.level}  |  ATK: ${trogdor.atk}  |  DEF: ${trogdor.def}`, W/2, 520);

  if (messageTimer <= 0 && Math.floor(frame / 25) % 2 === 0) {
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('~ Click to play again ~', W/2, 560);
  }

  ctx.textAlign = 'left';
}

// ========== GAME LOOP ==========
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
