<!DOCTYPE html>
<html>
<head><title>TROGDOR: The Multi-Track Epic</title></head>
<body>
    <h2>Check your downloads folder for trogdor_duet.mid!</h2>
    <p>You should see two separate tracks when you import this into your DAW: Guitar and Drums.</p>
    <a id="dl" href="#">Click here if the download didn't start automatically</a>
    
    <script>
        // MIDI Header: Format 1 (Multi-track), 2 Tracks, 96 Ticks per quarter note
        const header = [
            0x4D, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 
            0x00, 0x01, 0x00, 0x02, 0x00, 0x60 
        ];

        const guitarNotes = [];
        const drumNotes = [];

        // --- 1. GUITAR ARRANGEMENT ---
        const addVocalIntro = () => {
            guitarNotes.push(
                [62, 96], [62, 96], [60, 48], [60, 48], [62, 192], [-1, 192],
                [62, 48], [62, 48], [62, 48], [62, 48], [60, 48], [60, 48], [62, 192], [-1, 192],
                [65, 48], [65, 48], [65, 48], [65, 48], [65, 48], [65, 48], [64, 48], [62, 192], [-1, 192],
                [60, 96], [60, 48], [60, 48], [60, 192], [-1, 96],
                [50, 48], [50, 384], [-1, 192],
                [50, 48], [50, 384], [-1, 192]
            );
        };

        const addGuitarRiff = () => {
            guitarNotes.push(
                [50, 24], [50, 24], [50, 24], [50, 24], [58, 192], [-1, 96],
                [50, 24], [50, 24], [50, 24], [50, 24], [55, 192], [-1, 96],
                [50, 24], [50, 24], [50, 24], [50, 24], [58, 96], 
                [50, 48], [55, 48], [50, 48],                     
                [53, 96], [55, 96],                               
                [-1, 240]                                         
            );
        };

        // --- 2. THE USER'S DRUM GROOVE ---
        const addDrumRiff = () => {
            drumNotes.push(
                // Measure 1: "Du do do, do do do do, do do do,"
                [36, 96], [38, 48], [38, 48],             
                [38, 24], [38, 24], [38, 24], [38, 24],   
                [38, 48], [38, 24], [38, 24],             

                // Measure 2: "do do doooo dooo doooo."
                [38, 48], [38, 48],                       
                [49, 96], [49, 96], [49, 96],             

                // Measure 3: "Doo do do doo doo doo doo do do do do do dooo doo doo du."
                [45, 48], [38, 24], [38, 24],             
                [45, 24], [45, 24], [45, 24], [45, 24],   
                [38, 24], [38, 24], [38, 24], [38, 24],   
                [49, 48], [45, 24], [36, 24]              
            );
        };

        // --- 3. SONG BUILDER ---

        // Intro: Guitar speaks, Drums rest (3456 ticks)
        addVocalIntro();
        drumNotes.push([-1, 3456]);

        // Verses: 4 loops of the Main Riff
        for(let i=0; i<4; i++) {
            addGuitarRiff();
            addDrumRiff();
        }

        // Chorus: "Burninating the countryside!" 
        guitarNotes.push([53, 384], [55, 384], [50, 768]); 
        guitarNotes.push([53, 384], [55, 384], [50, 768]); 
        guitarNotes.push([53, 384], [55, 384], [57, 768]); 
        guitarNotes.push([58, 384], [60, 384], [62, 768]); 
        
        // Chorus Drums: Heavy 4-on-the-floor (16 measures)
        for(let i=0; i<16; i++) {
            drumNotes.push([36, 96], [38, 96], [36, 96], [49, 96]); 
        }

        // THATCHED ROOF COTTAGES!
        addGuitarRiff();
        addDrumRiff();

        // Guitar Solo (Squeedly-vers!) 
        const soloScale = [62, 65, 67, 69, 72, 74, 72, 69, 67, 65, 62, 65, 67, 69, 72, 74];
        for(let i=0; i<4; i++) { 
            for(let n of soloScale) guitarNotes.push([n, 24]);
        }
        // Solo Drums: Fast punk beat
        for(let i=0; i<4; i++) {
            drumNotes.push(
                [36, 48], [46, 48], [38, 48], [46, 48],
                [36, 48], [46, 48], [38, 48], [46, 48]
            );
        }

        // Outro Build & Final Note
        addGuitarRiff(); 
        guitarNotes.push([55, 96], [53, 96], [50, 768]);

        addDrumRiff();
        drumNotes.push([49, 96], [49, 96], [36, 768]);


        // --- 4. MIDI COMPILATION ENGINE ---

        function pushVLQ(arr, value) {
            let bytes = [value & 0x7F];
            while ((value >>= 7) > 0) {
                bytes.unshift((value & 0x7F) | 0x80);
            }
            arr.push(...bytes);
        }

        function compileTrackChunk(notes, isDrumTrack) {
            let trackData = [];
            
            // If it's the guitar track, set Tempo and Overdriven Guitar Program (0x1E)
            if (!isDrumTrack) {
                trackData.push(0x00, 0xFF, 0x51, 0x03, 0x06, 0xCB, 0x56);
                trackData.push(0x00, 0xC0, 0x1E);
            }

            let isFirstNote = true;
            let prevRestTime = 0;

            for (let [pitch, duration] of notes) {
                if (pitch === -1) {
                    prevRestTime += duration;
                    continue;
                }

                // Drums aren't palm muted, so they ring out cleanly
                let gateRatio = isDrumTrack ? 0.90 : (duration <= 48 ? 0.60 : 0.95); 
                let playTime = Math.floor(duration * gateRatio); 
                let restTime = duration - playTime;
                
                let onsetDelta = isFirstNote ? 96 : prevRestTime; 
                isFirstNote = false;

                // Channel 0 (0x90) for Guitar, Channel 10 (0x99) for Drums
                let noteOnCmd = isDrumTrack ? 0x99 : 0x90;
                let noteOffCmd = isDrumTrack ? 0x89 : 0x80;

                pushVLQ(trackData, onsetDelta);
                trackData.push(noteOnCmd, pitch, 0x7F);
                
                pushVLQ(trackData, playTime);
                trackData.push(noteOffCmd, pitch, 0x00);

                prevRestTime = restTime;
            }
            
            trackData.push(0x00, 0xFF, 0x2F, 0x00); // End of track
            
            // Wrap in MTrk header with calculated length
            let trackChunk = [0x4D, 0x54, 0x72, 0x6B];
            let len = trackData.length;
            trackChunk.push((len >> 24) & 0xFF, (len >> 16) & 0xFF, (len >> 8) & 0xFF, len & 0xFF);
            return trackChunk.concat(trackData);
        }

        // Compile both tracks
        const guitarChunk = compileTrackChunk(guitarNotes, false);
        const drumChunk = compileTrackChunk(drumNotes, true);
        
        // Force the download
        const binaryData = new Uint8Array(header.concat(guitarChunk).concat(drumChunk));
        const blob = new Blob([binaryData], { type: "audio/midi" });
        const link = document.getElementById("dl");
        
        link.href = URL.createObjectURL(blob);
        link.download = "trogdor_duet.mid";
        link.click(); 
    </script>
</body>
</html>
