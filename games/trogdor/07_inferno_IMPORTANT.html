<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TROGDOR: INFERNO</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; cursor: none; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ============================================================
// TROGDOR: INFERNO - Bullet Hell Shoot-em-up
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const W = 480, H = 720;
canvas.width = W;
canvas.height = H;

function resizeCanvas() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================================
// AUDIO ENGINE
// ============================================================
let audioCtx = null;
let masterGain = null;
let musicPlaying = false;
let musicNodes = [];

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.55;
    masterGain.connect(audioCtx.destination);
}

// --- Guitar amp distortion curve ---
function makeDistortionCurve(amount) {
    const n = 44100;
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
        const x = (i * 2) / n - 1;
        curve[i] = ((3 + amount) * x * 20 * (Math.PI / 180)) / (Math.PI + amount * Math.abs(x));
    }
    return curve;
}

// --- Cabinet simulation chain ---
function createCabinetSim(ctx) {
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 4500;

    const peak = ctx.createBiquadFilter();
    peak.type = 'peaking';
    peak.frequency.value = 2500;
    peak.gain.value = 5;
    peak.Q.value = 1.5;

    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 80;

    lp.connect(peak).connect(hp);
    return { input: lp, output: hp };
}

// --- Play a distorted power chord (detuned saws + WaveShaper + cab) ---
function playPowerChord(freq, t, dur, gain, palmMute) {
    if (!audioCtx) return [];
    const nodes = [];
    const detuneCents = [-4, 4]; // 2 detuned per voice, +-4 cents
    const mixGain = audioCtx.createGain();
    mixGain.gain.value = 0.4;

    // Pre-distortion boost
    const preBoost = audioCtx.createGain();
    preBoost.gain.value = 1.8;

    // Distortion (amount=50)
    const distortion = audioCtx.createWaveShaper();
    distortion.curve = makeDistortionCurve(50);
    distortion.oversample = '4x';

    // Cabinet sim
    const cab = createCabinetSim(audioCtx);

    // Palm mute filter (500Hz for chugs)
    let pmFilter = null;
    if (palmMute) {
        pmFilter = audioCtx.createBiquadFilter();
        pmFilter.type = 'lowpass';
        pmFilter.frequency.value = 500;
    }

    // Envelope
    const env = audioCtx.createGain();
    if (palmMute) {
        // attack 0.002, decay 0.05
        env.gain.setValueAtTime(0, t);
        env.gain.linearRampToValueAtTime(gain * 5, t + 0.002);
        env.gain.exponentialRampToValueAtTime(0.001, t + 0.002 + 0.05);
    } else {
        env.gain.setValueAtTime(gain, t);
        env.gain.setValueAtTime(gain * 0.85, t + dur * 0.6);
        env.gain.linearRampToValueAtTime(0, t + dur);
    }

    // Create 2 detuned oscillators per voice (root only, fifth added separately)
    for (const cents of detuneCents) {
        const osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, t);
        osc.detune.setValueAtTime(cents, t);
        osc.connect(mixGain);
        osc.start(t);
        osc.stop(t + dur + 0.01);
        nodes.push(osc);
        // Add fifth
        const osc5 = audioCtx.createOscillator();
        osc5.type = 'sawtooth';
        osc5.frequency.setValueAtTime(freq * 1.5, t);
        osc5.detune.setValueAtTime(cents, t);
        const fifthGain = audioCtx.createGain();
        fifthGain.gain.value = 0.35;
        osc5.connect(fifthGain);
        fifthGain.connect(mixGain);
        osc5.start(t);
        osc5.stop(t + dur + 0.01);
        nodes.push(osc5);
    }

    // Signal chain: mix -> preBoost -> distortion -> palmMute? -> cab -> env -> master
    mixGain.connect(preBoost);
    preBoost.connect(distortion);
    if (pmFilter) {
        distortion.connect(pmFilter);
        pmFilter.connect(cab.input);
    } else {
        distortion.connect(cab.input);
    }
    cab.output.connect(env).connect(masterGain);

    return nodes;
}

// --- Play improved bass note (sine + sawtooth, light distortion, lowpass) ---
function playBassNote(freq, t, dur, gain) {
    if (!audioCtx) return [];
    const nodes = [];

    const oscSine = audioCtx.createOscillator();
    oscSine.type = 'sine';
    oscSine.frequency.setValueAtTime(freq, t);

    const oscSaw = audioCtx.createOscillator();
    oscSaw.type = 'sawtooth';
    oscSaw.frequency.setValueAtTime(freq, t);

    const sineGain = audioCtx.createGain();
    sineGain.gain.value = 0.7;

    const sawGain = audioCtx.createGain();
    sawGain.gain.value = 0.5;

    const mix = audioCtx.createGain();
    mix.gain.value = 1.0;

    oscSine.connect(sineGain).connect(mix);
    oscSaw.connect(sawGain).connect(mix);

    // Light distortion (amount=15)
    const dist = audioCtx.createWaveShaper();
    dist.curve = makeDistortionCurve(15);
    dist.oversample = '2x';

    // Lowpass at 800Hz
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(800, t);

    // Envelope
    const env = audioCtx.createGain();
    env.gain.setValueAtTime(gain, t);
    env.gain.setValueAtTime(gain * 0.75, t + dur * 0.7);
    env.gain.linearRampToValueAtTime(0, t + dur);

    mix.connect(dist).connect(lp).connect(env).connect(masterGain);

    oscSine.start(t);
    oscSine.stop(t + dur + 0.01);
    oscSaw.start(t);
    oscSaw.stop(t + dur + 0.01);
    nodes.push(oscSine, oscSaw);
    return nodes;
}

// --- TROGDOR! Scream via formant synthesis (E minor) ---
function playTrogdorScream(volumeScale) {
    if (!audioCtx) return;
    const vol = (volumeScale !== undefined) ? volumeScale : 1.0;
    const t = audioCtx.currentTime;
    const totalDur = 1.8;

    // Sawtooth source oscillator - pitch contour E4->G4->B4
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    // E4 -> hold -> dip -> G4 -> B4 -> hold
    osc.frequency.setValueAtTime(329.63, t);            // E4
    osc.frequency.setValueAtTime(329.63, t + 0.25);     // hold
    osc.frequency.linearRampToValueAtTime(311, t + 0.4);  // dip
    osc.frequency.linearRampToValueAtTime(392, t + 0.7);  // G4
    osc.frequency.linearRampToValueAtTime(493.88, t + 1.1); // B4
    osc.frequency.setValueAtTime(493.88, t + totalDur);      // hold

    // Noise source for breathiness
    const noiseBufSize = audioCtx.sampleRate * 2;
    const noiseBuf = audioCtx.createBuffer(1, noiseBufSize, audioCtx.sampleRate);
    const noiseData = noiseBuf.getChannelData(0);
    for (let i = 0; i < noiseBufSize; i++) noiseData[i] = Math.random() * 2 - 1;
    const noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = noiseBuf;
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.value = 0.15;

    // 3 bandpass formant filters
    const formants = [];
    const formantFreqs = [
        [400, 1800, 3200],   // "TR" - consonant onset
        [700, 1100, 2600],   // "AH/OH" - open vowel
        [300, 1600, 3000],   // "GD" - closure
        [500, 900, 2500]     // "OR!" - final
    ];
    for (let f = 0; f < 3; f++) {
        const bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.Q.value = 8;
        bp.frequency.setValueAtTime(formantFreqs[0][f], t);
        bp.frequency.linearRampToValueAtTime(formantFreqs[1][f], t + 0.3);
        bp.frequency.setValueAtTime(formantFreqs[1][f], t + 0.7);
        bp.frequency.linearRampToValueAtTime(formantFreqs[2][f], t + 0.9);
        bp.frequency.linearRampToValueAtTime(formantFreqs[3][f], t + 1.1);
        bp.frequency.setValueAtTime(formantFreqs[3][f], t + totalDur);
        formants.push(bp);
    }

    // Formant mixer
    const formantMix = audioCtx.createGain();
    formantMix.gain.value = 0.45;

    for (const bp of formants) {
        osc.connect(bp);
        noiseSrc.connect(noiseGain).connect(bp);
        bp.connect(formantMix);
    }

    // Light distortion for metal quality
    const dist = audioCtx.createWaveShaper();
    dist.curve = makeDistortionCurve(25);
    dist.oversample = '2x';

    // Crescendo envelope
    const env = audioCtx.createGain();
    env.gain.setValueAtTime(0.15 * vol, t);
    env.gain.linearRampToValueAtTime(0.55 * vol, t + 0.5);
    env.gain.linearRampToValueAtTime(0.8 * vol, t + 1.1);
    env.gain.setValueAtTime(0.8 * vol, t + 1.4);
    env.gain.linearRampToValueAtTime(0.001, t + totalDur);

    formantMix.connect(dist).connect(env).connect(masterGain);

    osc.start(t);
    osc.stop(t + totalDur + 0.05);
    noiseSrc.start(t);
    noiseSrc.stop(t + totalDur + 0.05);
}

// Sound effects
function playShoot() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.08);
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.connect(g).connect(masterGain);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
}

function playExplosion() {
    if (!audioCtx) return;
    const bufferSize = audioCtx.sampleRate * 0.3;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(2000, audioCtx.currentTime);
    filt.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
    src.connect(filt).connect(g).connect(masterGain);
    src.start();
}

function playPowerUp() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    for (let i = 0; i < 4; i++) {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440 * Math.pow(2, i * 0.25), t + i * 0.06);
        g.gain.setValueAtTime(0, t);
        g.gain.setValueAtTime(0.1, t + i * 0.06);
        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.15);
        osc.connect(g).connect(masterGain);
        osc.start(t + i * 0.06);
        osc.stop(t + i * 0.06 + 0.15);
    }
}

function playBossWarning() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    for (let i = 0; i < 6; i++) {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(i % 2 === 0 ? 220 : 330, t + i * 0.2);
        g.gain.setValueAtTime(0.12, t + i * 0.2);
        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.2 + 0.18);
        osc.connect(g).connect(masterGain);
        osc.start(t + i * 0.2);
        osc.stop(t + i * 0.2 + 0.2);
    }
}

function playBombSound() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    // deep boom
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(80, t);
    osc.frequency.exponentialRampToValueAtTime(20, t + 0.8);
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    osc.connect(g).connect(masterGain);
    osc.start(t);
    osc.stop(t + 0.8);
    // noise layer
    const bufferSize = audioCtx.sampleRate * 0.6;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.5);
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const g2 = audioCtx.createGain();
    g2.gain.setValueAtTime(0.2, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    src.connect(g2).connect(masterGain);
    src.start(t);
}

function playDeathSound() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(440, t);
    osc.frequency.exponentialRampToValueAtTime(55, t + 0.6);
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    osc.connect(g).connect(masterGain);
    osc.start(t);
    osc.stop(t + 0.6);
    // noise
    const bufferSize = audioCtx.sampleRate * 0.5;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const g2 = audioCtx.createGain();
    g2.gain.setValueAtTime(0.2, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    src.connect(g2).connect(masterGain);
    src.start(t);
}

// ============================================================
// MUSIC ENGINE - Trogdor Theme arranged as driving electronic shmup music
// Key of E minor, ~144 BPM, 36 bars looping
// Based on real guitar tabs: E5-E5-A5---E5-E5-G5---E5-E5-A5-E5-G5-E5-F#5->G5
// ============================================================
function startMusic() {
    if (!audioCtx || musicPlaying) return;
    musicPlaying = true;

    const bpm = 144;
    const beatLen = 60 / bpm;
    const sixteenth = beatLen / 4;
    const barLen = beatLen * 4;
    const totalBars = 36;
    const loopLen = barLen * totalBars;

    // Frequencies - Trogdor is in E minor
    const E2 = 82.41, Fs2 = 92.50, G2 = 98.00, A2 = 110.00, B2 = 123.47;
    const E3 = 164.81, Fs3 = 185.00, G3 = 196.00, A3 = 220.00, B3 = 246.94;
    const E4 = 329.63, Fs4 = 369.99, G4 = 392.00, A4 = 440.00, B4 = 493.88, E5 = 659.26;

    function scheduleLoop() {
        const startTime = audioCtx.currentTime + 0.05;

        // === KICK DRUM (4-on-the-floor, 200->35Hz sweep, gain 0.6) ===
        for (let bar = 0; bar < totalBars; bar++) {
            for (let beat = 0; beat < 4; beat++) {
                const t = startTime + bar * barLen + beat * beatLen;
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, t);
                osc.frequency.exponentialRampToValueAtTime(35, t + 0.15);
                g.gain.setValueAtTime(0.6, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
                osc.connect(g).connect(masterGain);
                osc.start(t);
                osc.stop(t + 0.16);
                musicNodes.push(osc);
            }
        }

        // === SNARE on beats 2 & 4 (gain 0.5) ===
        for (let bar = 0; bar < totalBars; bar++) {
            for (let beat = 0; beat < 4; beat += 2) {
                const t = startTime + bar * barLen + (beat + 1) * beatLen;
                const bufSz = audioCtx.sampleRate * 0.1;
                const buf = audioCtx.createBuffer(1, bufSz, audioCtx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < bufSz; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSz, 2);
                const src = audioCtx.createBufferSource();
                src.buffer = buf;
                const g = audioCtx.createGain();
                g.gain.setValueAtTime(0.5, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
                const bp = audioCtx.createBiquadFilter();
                bp.type = 'bandpass';
                bp.frequency.value = 3000;
                bp.Q.value = 1;
                src.connect(bp).connect(g).connect(masterGain);
                src.start(t);
                musicNodes.push(src);
                // Tonal snap
                const osc = audioCtx.createOscillator();
                const g2 = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, t);
                g2.gain.setValueAtTime(0.5, t);
                g2.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
                osc.connect(g2).connect(masterGain);
                osc.start(t);
                osc.stop(t + 0.06);
                musicNodes.push(osc);
            }
        }

        // === 16TH NOTE HI-HATS (gain 0.3) ===
        for (let bar = 0; bar < totalBars; bar++) {
            for (let s = 0; s < 16; s++) {
                const t = startTime + bar * barLen + s * sixteenth;
                const bufSz = audioCtx.sampleRate * 0.025;
                const buf = audioCtx.createBuffer(1, bufSz, audioCtx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < bufSz; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSz, 6);
                const src = audioCtx.createBufferSource();
                src.buffer = buf;
                const g = audioCtx.createGain();
                const vol = (s % 4 === 0) ? 0.30 : (s % 2 === 0) ? 0.22 : 0.15;
                g.gain.setValueAtTime(vol, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
                const hp = audioCtx.createBiquadFilter();
                hp.type = 'highpass';
                hp.frequency.value = 10000;
                src.connect(hp).connect(g).connect(masterGain);
                src.start(t);
                musicNodes.push(src);
            }
        }

        // === BASS LINE - E minor Trogdor bass tab ===
        // E-E-E-A---E-E-E-G---E-E-E-A-G-F#->G pattern
        const bassRiff = [
            [E2, E2, E2, A2, 0, 0, 0, 0],
            [E2, E2, E2, G2, 0, 0, 0, 0],
            [E2, E2, E2, A2, G2, Fs2, G2, 0],
            [E2, 0, E2, 0, E2, 0, 0, 0]
        ];
        // Verse bass: E chugs with A5 and G5 accents
        const bassVerse = [
            [E2, E2, A2, A2, E2, E2, G2, G2],
            [E2, E2, A2, A2, E2, E2, G2, G2],
            [E2, E2, A2, A2, E2, E2, G2, G2],
            [E2, E2, A2, A2, G2, G2, Fs2, G2]
        ];
        // Bridge bass: E-F#->G hammer-on driven
        const bassBridge = [
            [E2, E2, Fs2, G2, E2, E2, Fs2, G2],
            [E2, E2, Fs2, G2, A2, A2, G2, Fs2],
            [E2, E2, Fs2, G2, E2, E2, Fs2, G2],
            [G2, G2, A2, A2, E2, 0, E2, 0]
        ];

        function getBassBar(bar) {
            if (bar < 8) return bassRiff[bar % 4];
            if (bar < 16) return bassVerse[bar % 4];
            if (bar < 24) return bassRiff[bar % 4];
            if (bar < 32) return bassVerse[bar % 4];
            return bassBridge[bar % 4];
        }

        for (let bar = 0; bar < totalBars; bar++) {
            const pattern = getBassBar(bar);
            for (let n = 0; n < 8; n++) {
                const freq = pattern[n];
                if (freq === 0) continue;
                const t = startTime + bar * barLen + n * beatLen * 0.5;
                const dur = beatLen * 0.45;
                const nodes = playBassNote(freq, t, dur, 0.14);
                musicNodes.push(...nodes);
            }
        }

        // === POWER CHORDS - E minor: E5=E+B, A5=A+E, G5=G+D, F#5=F#+C# ===
        const chordE = [E3, B3];      // E5 power chord (164.81 + 246.94)
        const chordA = [A3, E4];      // A5 power chord (110 + 164.81... using 220+329.63)
        const chordG = [G3, 293.66];  // G5 power chord (196 + 293.66)
        const chordFs = [Fs3, 277.18]; // F#5 power chord (185 + 277.18)

        // Main riff: E5-E5-A5---E5-E5-G5---E5-E5-A5-E5-G5-E5-F#5->G5
        const chordRiff = [
            [chordE, chordE, chordA, null, null, null, null, null],
            [chordE, chordE, chordG, null, null, null, null, null],
            [chordE, chordE, chordA, chordE, chordG, chordE, chordFs, chordG],
            [chordE, null, null, null, chordE, null, null, null]
        ];
        // Verse chords: E chugs with A5 and G5 accents
        const chordVerse = [
            [chordE, null, chordE, null, chordA, null, chordE, null],
            [chordE, null, chordE, null, chordG, null, chordFs, chordG],
            [chordE, null, chordE, null, chordA, null, chordE, null],
            [chordE, null, chordA, null, chordG, null, chordFs, chordG]
        ];
        // Bridge: E-F#->G hammer-ons
        const chordBridge = [
            [chordE, null, chordFs, chordG, chordE, null, chordFs, chordG],
            [chordE, null, chordFs, chordG, chordA, null, chordG, chordFs],
            [chordE, null, chordFs, chordG, chordE, null, chordFs, chordG],
            [chordG, null, chordA, null, chordE, null, chordE, null]
        ];

        function getChordBar(bar) {
            if (bar < 8) return chordRiff[bar % 4];
            if (bar < 16) return chordVerse[bar % 4];
            if (bar < 24) return chordRiff[bar % 4];
            if (bar < 32) return chordVerse[bar % 4];
            return chordBridge[bar % 4];
        }

        for (let bar = 0; bar < totalBars; bar++) {
            const pattern = getChordBar(bar);
            for (let n = 0; n < 8; n++) {
                const chord = pattern[n];
                if (!chord) continue;
                const t = startTime + bar * barLen + n * beatLen * 0.5;
                const dur = beatLen * 0.4;
                const isRiffSection = (bar < 8) || (bar >= 16 && bar < 24);
                const nextIsNull = (n < 7 && pattern[n + 1] === null);
                const palmMute = isRiffSection && !nextIsNull && dur < beatLen * 0.45;
                for (const freq of chord) {
                    const nodes = playPowerChord(freq, t, dur, 0.04, palmMute);
                    musicNodes.push(...nodes);
                }
            }
        }

        // === FAST 16TH NOTE ARPEGGIOS on E minor (E-G-B) ===
        const arpEm = [E4, G4, B4, E5, B4, G4, E4, G4, B4, E5, B4, G4, E4, G4, B4, E5];
        const arpA  = [A3, E4, A4, E5, A4, E4, A3, E4, A4, E5, A4, E4, A3, E4, A4, E5];
        const arpG  = [G3, B3, G4, B4, G4, B3, G3, B3, G4, B4, G4, B3, G3, B3, G4, B4];
        const arpFs = [Fs3, A3, Fs4, A4, Fs4, A3, Fs3, A3, Fs4, A4, Fs4, A3, Fs3, A3, Fs4, A4];

        function getArpPattern(bar) {
            const b = bar % 4;
            if (b === 0 || b === 3) return arpEm;
            if (b === 1) return arpA;
            if (b === 2) return arpG;
            return arpEm;
        }

        for (let bar = 0; bar < totalBars; bar++) {
            const isArpSection = (bar < 8) || (bar >= 16 && bar < 24) || (bar >= 32);
            if (!isArpSection) continue;
            const pattern = getArpPattern(bar);
            for (let s = 0; s < 16; s++) {
                const t = startTime + bar * barLen + s * sixteenth;
                const freq = pattern[s];
                const dur = sixteenth * 0.7;
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, t);
                g.gain.setValueAtTime(0.025, t);
                g.gain.setValueAtTime(0.02, t + dur * 0.5);
                g.gain.linearRampToValueAtTime(0, t + dur);
                osc.connect(g).connect(masterGain);
                osc.start(t);
                osc.stop(t + dur);
                musicNodes.push(osc);
            }
        }

        // === LEAD MELODY (square wave, 0.35 gain, light distortion) ===
        // Pre-chorus "burninating": E4-F#4-G4 ascending x3
        // Chorus: E5-E5-A5---E5-E5-G5---E5-E5-A5-E5-G5-E5-F#5->G5 (as melody)
        const chorusMelody = [
            // "burninating the countryside" - E4-E4-E4-E4-F#4-G4-G4-A4
            { n: E4, d: 0.5 }, { n: E4, d: 0.5 }, { n: E4, d: 0.5 }, { n: E4, d: 0.5 },
            { n: Fs4, d: 0.75 }, { n: G4, d: 0.75 }, { n: G4, d: 0.75 }, { n: A4, d: 1.25 },
            { n: 0, d: 0.5 },
            // "burninating the peasants" - E4-E4-E4-E4-F#4-G4-A4
            { n: E4, d: 0.5 }, { n: E4, d: 0.5 }, { n: E4, d: 0.5 }, { n: E4, d: 0.5 },
            { n: Fs4, d: 0.75 }, { n: G4, d: 1.0 }, { n: A4, d: 1.25 },
            { n: 0, d: 0.5 },
            // "thatched roof COTTAGES" - A4-B4-E5-A4-G4-F#4-G4
            { n: A4, d: 0.5 }, { n: B4, d: 0.5 }, { n: E5, d: 1.0 },
            { n: A4, d: 0.5 }, { n: G4, d: 0.5 }, { n: Fs4, d: 0.5 }, { n: G4, d: 1.5 },
            { n: 0, d: 0.5 },
            // "TROGDOR!" - E4->G4->B4
            { n: E4, d: 0.75 }, { n: G4, d: 0.75 }, { n: B4, d: 2.5 },
            { n: 0, d: 2.0 }
        ];

        // Main riff lead: E-E-A---E-E-G---E-E-A-E-G-E-F#->G
        const riffLead = [
            { n: E4, d: 0.5 }, { n: E4, d: 0.5 }, { n: A4, d: 3.0 },
            { n: E4, d: 0.5 }, { n: E4, d: 0.5 }, { n: G4, d: 3.0 },
            { n: E4, d: 0.5 }, { n: E4, d: 0.5 }, { n: A4, d: 0.5 },
            { n: G4, d: 0.5 }, { n: Fs4, d: 0.25 }, { n: G4, d: 1.25 },
            { n: E5, d: 2.0 }, { n: 0, d: 2.0 }
        ];

        // Verse melody: E chugs with melodic accents
        const verseLead = [
            { n: E4, d: 0.5 }, { n: E4, d: 0.5 }, { n: Fs4, d: 0.5 }, { n: G4, d: 1.0 },
            { n: Fs4, d: 0.5 }, { n: E4, d: 0.5 }, { n: 0, d: 0.5 },
            { n: E4, d: 0.5 }, { n: E4, d: 0.5 }, { n: A3, d: 0.5 }, { n: B3, d: 1.0 },
            { n: E4, d: 1.0 }, { n: 0, d: 0.5 },
            { n: E4, d: 0.5 }, { n: E4, d: 0.5 }, { n: Fs4, d: 0.5 }, { n: G4, d: 1.0 },
            { n: A4, d: 0.5 }, { n: G4, d: 0.5 }, { n: 0, d: 0.5 },
            { n: A4, d: 0.5 }, { n: G4, d: 0.5 }, { n: Fs4, d: 0.25 }, { n: G4, d: 1.25 },
            { n: E4, d: 1.5 }, { n: 0, d: 1.0 }
        ];

        // Bridge lead: E-F#->G hammer-on riff
        const bridgeLead = [
            { n: E4, d: 0.5 }, { n: Fs4, d: 0.25 }, { n: G4, d: 0.75 },
            { n: E4, d: 0.5 }, { n: Fs4, d: 0.25 }, { n: G4, d: 0.75 },
            { n: A4, d: 0.5 }, { n: G4, d: 0.5 }, { n: Fs4, d: 0.25 }, { n: G4, d: 0.75 },
            { n: E5, d: 1.0 }, { n: 0, d: 0.5 },
            { n: E4, d: 0.5 }, { n: Fs4, d: 0.25 }, { n: G4, d: 0.75 },
            { n: E4, d: 0.5 }, { n: Fs4, d: 0.25 }, { n: G4, d: 0.75 },
            { n: G4, d: 0.5 }, { n: A4, d: 0.75 }, { n: B4, d: 2.25 },
            { n: 0, d: 1.0 }
        ];

        function playLead(melody, barOffset) {
            let noteTime = startTime + barOffset * barLen;
            for (const m of melody) {
                if (m.n > 0) {
                    const dur = m.d * beatLen;
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    const filt = audioCtx.createBiquadFilter();
                    // Square wave lead with light distortion
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(m.n, noteTime);
                    filt.type = 'lowpass';
                    filt.frequency.setValueAtTime(4000, noteTime);
                    filt.frequency.linearRampToValueAtTime(1200, noteTime + dur * 0.8);
                    filt.Q.value = 3;
                    // Light distortion on lead
                    const dist = audioCtx.createWaveShaper();
                    dist.curve = makeDistortionCurve(15);
                    dist.oversample = '2x';
                    g.gain.setValueAtTime(0.035, noteTime);
                    g.gain.setValueAtTime(0.03, noteTime + dur * 0.6);
                    g.gain.linearRampToValueAtTime(0, noteTime + dur);
                    osc.connect(filt);
                    filt.connect(dist);
                    dist.connect(g).connect(masterGain);
                    osc.start(noteTime);
                    osc.stop(noteTime + dur);
                    musicNodes.push(osc);
                }
                noteTime += m.d * beatLen;
            }
        }

        // Structure: riff(8) -> verse(8) -> riff(8) -> chorus(8) -> bridge(4)
        playLead(riffLead, 0);
        playLead(riffLead, 4);
        playLead(verseLead, 8);
        playLead(verseLead, 12);
        playLead(riffLead, 16);
        playLead(riffLead, 20);
        playLead(chorusMelody, 24);
        // "TROGDOR!" scream during E4->G4->B4 ascending (at half volume)
        const trogdorScreamTime = startTime + 24 * barLen + 17.0 * beatLen;
        const screamDelay = (trogdorScreamTime - audioCtx.currentTime) * 1000;
        if (screamDelay > 0) {
            const screamTimeout = setTimeout(() => {
                if (musicPlaying) playTrogdorScream(0.5);
            }, screamDelay);
            musicNodes._screamTimeout = screamTimeout;
        }
        playLead(bridgeLead, 32);

        // Schedule next loop
        const loopTimeout = setTimeout(() => {
            musicNodes = [];
            if (musicPlaying) scheduleLoop();
        }, (loopLen - 0.1) * 1000);
        musicNodes._timeout = loopTimeout;
    }

    scheduleLoop();
}

function stopMusic() {
    musicPlaying = false;
    if (musicNodes._timeout) clearTimeout(musicNodes._timeout);
    if (musicNodes._screamTimeout) clearTimeout(musicNodes._screamTimeout);
    musicNodes = [];
}

function drawTrogdor(x, y, frame) {
    ctx.save();
    ctx.translate(x, y);
    // Body (dark green)
    ctx.fillStyle = '#228B22';
    ctx.fillRect(-10, -14, 20, 28);
    // Belly
    ctx.fillStyle = '#90EE90';
    ctx.fillRect(-7, -4, 14, 16);
    // Head
    ctx.fillStyle = '#228B22';
    ctx.fillRect(-8, -22, 16, 10);
    // Eyes (menacing)
    ctx.fillStyle = '#FF0';
    ctx.fillRect(-6, -20, 4, 3);
    ctx.fillRect(2, -20, 4, 3);
    ctx.fillStyle = '#F00';
    ctx.fillRect(-5, -19, 2, 2);
    ctx.fillRect(3, -19, 2, 2);
    // Horns
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(-10, -26, 3, 6);
    ctx.fillRect(7, -26, 3, 6);
    // Wings
    const wingFlap = Math.sin(frame * 0.3) * 4;
    ctx.fillStyle = '#2E8B57';
    // Left wing
    ctx.beginPath();
    ctx.moveTo(-10, -8);
    ctx.lineTo(-24, -14 + wingFlap);
    ctx.lineTo(-18, -2 + wingFlap * 0.5);
    ctx.lineTo(-10, 2);
    ctx.fill();
    // Right wing
    ctx.beginPath();
    ctx.moveTo(10, -8);
    ctx.lineTo(24, -14 + wingFlap);
    ctx.lineTo(18, -2 + wingFlap * 0.5);
    ctx.lineTo(10, 2);
    ctx.fill();
    // Muscular arm (THE BEEFY ARM)
    ctx.fillStyle = '#228B22';
    ctx.fillRect(10, -6, 12, 5);
    ctx.fillRect(18, -10, 5, 8);
    // Fist
    ctx.fillStyle = '#90EE90';
    ctx.fillRect(18, -12, 6, 4);
    // Legs/claws
    ctx.fillStyle = '#228B22';
    ctx.fillRect(-8, 14, 5, 6);
    ctx.fillRect(3, 14, 5, 6);
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(-9, 18, 3, 3);
    ctx.fillRect(7, 18, 3, 3);
    // Fire trail
    for (let i = 0; i < 5; i++) {
        const flicker = Math.random() * 4;
        ctx.fillStyle = i < 2 ? '#FF4500' : (i < 4 ? '#FF6600' : '#FFAA00');
        ctx.fillRect(-4 + Math.random() * 8, 20 + i * 5 + flicker, 4 + Math.random() * 4, 5);
    }
    ctx.restore();
}

function drawPeasant(x, y, frame) {
    ctx.save();
    ctx.translate(x, y);
    // Body
    ctx.fillStyle = '#8B6914';
    ctx.fillRect(-6, -4, 12, 14);
    // Head
    ctx.fillStyle = '#FFDAB9';
    ctx.fillRect(-5, -12, 10, 9);
    // Hat
    ctx.fillStyle = '#654321';
    ctx.fillRect(-7, -16, 14, 5);
    // Eyes (scared)
    ctx.fillStyle = '#000';
    ctx.fillRect(-3, -9, 2, 2);
    ctx.fillRect(1, -9, 2, 2);
    // Mouth (O shape)
    ctx.fillRect(-1, -6, 2, 2);
    // Pitchfork
    ctx.fillStyle = '#888';
    ctx.fillRect(6, -8, 2, 20);
    ctx.fillRect(4, 10, 6, 2);
    ctx.fillRect(4, 10, 2, 4);
    ctx.fillRect(8, 10, 2, 4);

}

function drawKnight(x, y, frame) {
    ctx.save();

    // Armor body
    ctx.fillStyle = '#707070';
    ctx.fillRect(-8, -6, 16, 16);
    // Helmet
    ctx.fillStyle = '#888';
    ctx.fillRect(-7, -16, 14, 11);
    ctx.fillStyle = '#555';
    ctx.fillRect(-5, -10, 10, 3);
    // Visor slit
    ctx.fillStyle = '#222';
    ctx.fillRect(-4, -9, 8, 1);

    ctx.fillStyle = '#FF0000';

function drawWizard(x, y, frame) {
    ctx.save();
    ctx.translate(x, y);
    // Robe
    ctx.fillStyle = '#4B0082';
    ctx.fillRect(-8, -4, 16, 18);
    // Head
    ctx.fillStyle = '#FFDAB9';
    ctx.fillRect(-5, -12, 10, 9);
    // Hat
    ctx.fillStyle = '#4B0082';
    ctx.beginPath();
    ctx.moveTo(-8, -12);
    ctx.lineTo(0, -28);
    ctx.lineTo(8, -12);
    ctx.fill();
    // Stars on hat
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(-2, -22, 2, 2);
    ctx.fillRect(2, -18, 2, 2);
    // Eyes (glowing)
    ctx.fillStyle = '#0FF';
    ctx.fillRect(-3, -9, 2, 2);
    ctx.fillRect(1, -9, 2, 2);
    // Beard
    ctx.fillStyle = '#CCC';
    ctx.fillRect(-4, -5, 8, 6);
    ctx.fillRect(-2, 1, 4, 4);
    // Staff
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(8, -20, 3, 34);
    // Orb
    const glow = Math.sin(frame * 0.15) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(0, 255, 255, ${0.5 + glow * 0.5})`;
    ctx.beginPath();
    ctx.arc(9, -22, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawBoss(x, y, hp, maxHp, frame) {
    ctx.save();
    ctx.translate(x, y);
    const pulse = Math.sin(frame * 0.1) * 3;

    // Dark aura
    const grad = ctx.createRadialGradient(0, 0, 20, 0, 0, 50 + pulse);
    grad.addColorStop(0, 'rgba(128, 0, 128, 0.4)');
    grad.addColorStop(1, 'rgba(128, 0, 128, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, 50 + pulse, 0, Math.PI * 2);
    ctx.fill();

    // Body - large armored figure
    ctx.fillStyle = '#2C0854';
    ctx.fillRect(-20, -15, 40, 35);
    // Shoulder armor
    ctx.fillStyle = '#4A0080';
    ctx.fillRect(-28, -18, 12, 15);
    ctx.fillRect(16, -18, 12, 15);
    // Spikes
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(-30, -24, 4, 8);
    ctx.fillRect(26, -24, 4, 8);
    ctx.fillRect(-26, -22, 4, 6);
    ctx.fillRect(22, -22, 4, 6);
    // Head
    ctx.fillStyle = '#1A0033';
    ctx.fillRect(-14, -32, 28, 18);
    // Crown
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(-16, -38, 32, 7);
    ctx.fillRect(-16, -42, 4, 5);
    ctx.fillRect(-6, -44, 4, 7);
    ctx.fillRect(4, -42, 4, 5);
    ctx.fillRect(12, -42, 4, 5);
    // Eyes (evil glowing)
    const eyeGlow = Math.sin(frame * 0.2) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255, 0, 0, ${eyeGlow})`;
    ctx.fillRect(-10, -28, 6, 4);
    ctx.fillRect(4, -28, 6, 4);
    ctx.fillStyle = '#FF0';
    ctx.fillRect(-8, -27, 2, 2);
    ctx.fillRect(6, -27, 2, 2);
    // Mouth
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(-8, -21, 16, 3);
    // Teeth
    ctx.fillStyle = '#FFF';
    for (let i = -6; i <= 6; i += 3) {
        ctx.fillRect(i, -21, 2, 2);
    }
    // Cape
    ctx.fillStyle = '#800080';
    ctx.beginPath();
    ctx.moveTo(-20, -10);
    ctx.lineTo(-30, 30 + pulse);
    ctx.lineTo(30, 30 + pulse);
    ctx.lineTo(20, -10);
    ctx.fill();
    // Weapon - dark staff
    ctx.fillStyle = '#333';
    ctx.fillRect(-32, -30, 4, 50);
    // Skull on staff
    ctx.fillStyle = '#DDD';
    ctx.fillRect(-35, -38, 10, 9);
    ctx.fillStyle = '#000';
    ctx.fillRect(-34, -36, 3, 3);
    ctx.fillRect(-29, -36, 3, 3);
    ctx.fillRect(-33, -32, 6, 2);

    ctx.restore();

    // Health bar
    const barW = 120, barH = 8;
    const bx = x - barW / 2, by = y - 55;
    ctx.fillStyle = '#333';
    ctx.fillRect(bx, by, barW, barH);
    ctx.fillStyle = hp > maxHp * 0.3 ? '#F00' : '#FF4500';
    ctx.fillRect(bx, by, barW * (hp / maxHp), barH);
    ctx.strokeStyle = '#FFF';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, barW, barH);
}

// ============================================================
// GAME STATE
// ============================================================
const STATE = { TITLE: 0, PLAYING: 1, GAMEOVER: 2, BOSS_WARNING: 3 };
let gameState = STATE.TITLE;
let score = 0;
let lives = 3;
let wave = 1;
let waveTimer = 0;
let waveEnemiesSpawned = 0;
let waveEnemiesTotal = 0;
let frame = 0;
let screenFlash = 0;
let bossWarningTimer = 0;
let titlePulse = 0;
let bombs = 1;

// Player
const player = {
    x: W / 2, y: H - 80, w: 20, h: 28,
    speed: 4, fireRate: 8, fireTimer: 0,
    tripleFire: 0, shield: 0, invincible: 0,
    dx: 0, dy: 0
};

// Arrays
let playerBullets = [];
let enemyBullets = [];
let enemies = [];
let particles = [];
let powerUps = [];
let stars = [];
let explosions = [];

// Input
const keys = {};
let mouseX = W / 2, mouseY = H - 80;
let useMouseControl = false;

document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (gameState === STATE.TITLE && (e.key === ' ' || e.key === 'Enter')) {
        startGame();
    }
    if (gameState === STATE.GAMEOVER && (e.key === ' ' || e.key === 'Enter')) {
        gameState = STATE.TITLE;
    }
    if (gameState === STATE.PLAYING && (e.key === 'x' || e.key === 'X' || e.key === 'z' || e.key === 'Z')) {
        useBomb();
    }
    useMouseControl = false;
    e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    mouseX = (e.clientX - rect.left) * scaleX;
    mouseY = (e.clientY - rect.top) * scaleY;
    useMouseControl = true;
});
canvas.addEventListener('click', e => {
    if (gameState === STATE.TITLE) startGame();
    if (gameState === STATE.GAMEOVER) gameState = STATE.TITLE;
});
canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (gameState === STATE.PLAYING) useBomb();
});

// Stars init
for (let i = 0; i < 100; i++) {
    stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        speed: 0.5 + Math.random() * 2,
        size: Math.random() < 0.3 ? 2 : 1,
        brightness: 0.3 + Math.random() * 0.7
    });
}

function startGame() {
    initAudio();
    gameState = STATE.PLAYING;
    score = 0;
    lives = 3;
    wave = 1;
    bombs = 1;
    waveTimer = 0;
    waveEnemiesSpawned = 0;
    waveEnemiesTotal = 8;
    player.x = W / 2;
    player.y = H - 80;
    player.tripleFire = 0;
    player.shield = 0;
    player.invincible = 0;
    playerBullets = [];
    enemyBullets = [];
    enemies = [];
    particles = [];
    powerUps = [];
    explosions = [];
    startMusic();
}

function useBomb() {
    if (bombs <= 0) return;
    bombs--;
    screenFlash = 20;
    playBombSound();
    playTrogdorScream(1.0);
    // Destroy all enemies and bullets
    for (const e of enemies) {
        if (!e.isBoss) {
            score += e.points || 100;
            spawnExplosion(e.x, e.y, e.color || '#FF4500');
        } else {
            e.hp -= 30;
        }
    }
    enemies = enemies.filter(e => e.isBoss && e.hp > 0);
    enemyBullets = [];
    // Big particle burst
    for (let i = 0; i < 50; i++) {
        particles.push({
            x: W / 2, y: H / 2,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12,
            life: 40 + Math.random() * 30,
            color: ['#FF4500', '#FFAA00', '#FF0', '#FFF'][Math.floor(Math.random() * 4)],
            size: 2 + Math.random() * 4
        });
    }
}

function spawnExplosion(x, y, color) {
    explosions.push({ x, y, radius: 5, maxRadius: 30 + Math.random() * 15, alpha: 1, color });
    for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 / 12) * i;
        const speed = 1.5 + Math.random() * 3;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 20 + Math.random() * 20,
            color: color,
            size: 1.5 + Math.random() * 2.5
        });
    }
}

function isBossWave() { return wave % 5 === 0; }

function getEnemyCountForWave() {
    if (isBossWave()) return 1;
    return Math.min(6 + wave * 2, 30);
}

function spawnEnemy() {
    if (isBossWave()) {
        // Boss
        const boss = {
            x: W / 2, y: -60, targetY: 80,
            w: 40, h: 50,
            hp: 80 + wave * 20, maxHp: 80 + wave * 20,
            speed: 1.2,
            fireTimer: 0, firePattern: 0,
            patternTimer: 0,
            isBoss: true,
            points: 2000 + wave * 500,
            color: '#800080',
            phase: 0, phaseTimer: 0,
            moveDir: 1
        };
        enemies.push(boss);
        return;
    }

    const type = Math.random();
    let enemy;
    const x = 30 + Math.random() * (W - 60);

    if (wave < 3 || type < 0.45) {
        // Peasant
        enemy = {
            x, y: -20, w: 12, h: 16,
            hp: 1 + Math.floor(wave / 4), speed: 1 + wave * 0.08,
            type: 'peasant', fireTimer: 60 + Math.random() * 60,
            fireRate: 80 - Math.min(wave * 3, 40),
            points: 100, color: '#8B6914',
            movePattern: Math.random() < 0.5 ? 'straight' : 'sine',
            moveOffset: Math.random() * Math.PI * 2, moveAmp: 30 + Math.random() * 30
        };
    } else if (wave < 6 || type < 0.8) {
        // Knight
        enemy = {
            x, y: -20, w: 16, h: 20,
            hp: 3 + Math.floor(wave / 3), speed: 0.8 + wave * 0.05,
            type: 'knight', fireTimer: 40 + Math.random() * 40,
            fireRate: 60 - Math.min(wave * 2, 30),
            points: 250, color: '#707070',
            movePattern: Math.random() < 0.5 ? 'zigzag' : 'sweep',
            moveOffset: Math.random() * Math.PI * 2, moveDir: Math.random() < 0.5 ? -1 : 1
        };
    } else {
        // Wizard
        enemy = {
            x, y: -20, w: 16, h: 28,
            hp: 2 + Math.floor(wave / 3), speed: 0.6 + wave * 0.04,
            type: 'wizard', fireTimer: 30 + Math.random() * 30,
            fireRate: 50 - Math.min(wave * 2, 25),
            points: 400, color: '#4B0082',
            movePattern: 'float',
            moveOffset: Math.random() * Math.PI * 2, targetY: 60 + Math.random() * 150
        };
    }
    enemies.push(enemy);
}

function spawnFormation() {
    const count = 4 + Math.min(Math.floor(wave / 2), 4);
    const spacing = W / (count + 1);
    for (let i = 0; i < count; i++) {
        const enemy = {
            x: spacing * (i + 1), y: -20 - i * 30, w: 12, h: 16,
            hp: 1 + Math.floor(wave / 5), speed: 0.8 + wave * 0.05,
            type: 'peasant', fireTimer: 60 + i * 10,
            fireRate: 90 - Math.min(wave * 2, 40),
            points: 100, color: '#8B6914',
            movePattern: 'formation',
            moveOffset: 0, moveAmp: 0, formationX: spacing * (i + 1)
        };
        enemies.push(enemy);
        waveEnemiesSpawned++;
    }
}

// ============================================================
// UPDATE
// ============================================================
function update() {
    frame++;

    if (gameState === STATE.TITLE) {
        titlePulse += 0.05;
        // Update stars
        for (const s of stars) {
            s.y += s.speed;
            if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        }
        return;
    }

    if (gameState === STATE.GAMEOVER) {
        for (const s of stars) {
            s.y += s.speed * 0.3;
            if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        }
        return;
    }

    if (gameState === STATE.BOSS_WARNING) {
        bossWarningTimer--;
        if (bossWarningTimer <= 0) {
            gameState = STATE.PLAYING;
            waveEnemiesSpawned = 0;
            waveEnemiesTotal = 1;
            spawnEnemy();
        }
        for (const s of stars) {
            s.y += s.speed;
            if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        }
        return;
    }

    // Stars
    for (const s of stars) {
        s.y += s.speed;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }

    // Screen flash
    if (screenFlash > 0) screenFlash--;

    // Player timers
    if (player.tripleFire > 0) player.tripleFire--;
    if (player.shield > 0) player.shield--;
    if (player.invincible > 0) player.invincible--;

    // Player movement
    if (useMouseControl) {
        const dx = mouseX - player.x;
        const dy = mouseY - player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 2) {
            const speed = Math.min(player.speed * 1.5, dist);
            player.x += (dx / dist) * speed;
            player.y += (dy / dist) * speed;
        }
    } else {
        if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
        if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
        if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
        if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;
    }
    player.x = Math.max(15, Math.min(W - 15, player.x));
    player.y = Math.max(30, Math.min(H - 30, player.y));

    // Auto-fire
    player.fireTimer++;
    if (player.fireTimer >= player.fireRate) {
        player.fireTimer = 0;
        if (frame % 3 === 0) playShoot();
        playerBullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -8, size: 4, color: '#FF4500' });
        if (player.tripleFire > 0) {
            playerBullets.push({ x: player.x - 8, y: player.y - 16, vx: -1.5, vy: -7.5, size: 3, color: '#FFAA00' });
            playerBullets.push({ x: player.x + 8, y: player.y - 16, vx: 1.5, vy: -7.5, size: 3, color: '#FFAA00' });
        }
    }

    // Player bullets
    for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.y < -10 || b.x < -10 || b.x > W + 10) {
            playerBullets.splice(i, 1);
            continue;
        }
        // Check collision with enemies
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (Math.abs(b.x - e.x) < e.w && Math.abs(b.y - e.y) < e.h) {
                e.hp--;
                playerBullets.splice(i, 1);
                // Hit particle
                particles.push({
                    x: b.x, y: b.y, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
                    life: 8, color: '#FF0', size: 2
                });
                if (e.hp <= 0) {
                    score += e.points;
                    playExplosion();
                    spawnExplosion(e.x, e.y, e.color);
                    if (e.isBoss) playTrogdorScream(1.0);
                    // Drop power-up chance
                    if (Math.random() < 0.15) {
                        const types = ['triple', 'shield', 'bomb'];
                        const t = types[Math.floor(Math.random() * types.length)];
                        powerUps.push({ x: e.x, y: e.y, type: t, vy: 1.5 });
                    }
                    enemies.splice(j, 1);
                }
                break;
            }
        }
    }

    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];

        if (e.isBoss) {
            // Boss AI
            if (e.y < e.targetY) {
                e.y += 1;
            } else {
                // Movement
                e.x += e.speed * e.moveDir;
                if (e.x < 60 || e.x > W - 60) e.moveDir *= -1;

                // Attack patterns
                e.phaseTimer++;
                e.fireTimer++;

                const phase = Math.floor(e.phaseTimer / 180) % 4;

                if (phase === 0) {
                    // Radial burst
                    if (e.fireTimer % 20 === 0) {
                        const numBullets = 12 + Math.floor(wave / 5) * 4;
                        for (let k = 0; k < numBullets; k++) {
                            const angle = (Math.PI * 2 / numBullets) * k + frame * 0.02;
                            enemyBullets.push({
                                x: e.x, y: e.y + 20,
                                vx: Math.cos(angle) * 2.5,
                                vy: Math.sin(angle) * 2.5,
                                size: 5, color: '#FF00FF'
                            });
                        }
                    }
                } else if (phase === 1) {
                    // Aimed streams
                    if (e.fireTimer % 8 === 0) {
                        const dx = player.x - e.x;
                        const dy = player.y - e.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const spread = 0.2;
                        for (let k = -1; k <= 1; k++) {
                            const angle = Math.atan2(dy, dx) + k * spread;
                            enemyBullets.push({
                                x: e.x, y: e.y + 20,
                                vx: Math.cos(angle) * 3.5,
                                vy: Math.sin(angle) * 3.5,
                                size: 4, color: '#FF4444'
                            });
                        }
                    }
                } else if (phase === 2) {
                    // Spiral
                    if (e.fireTimer % 5 === 0) {
                        const angle = e.fireTimer * 0.15;
                        enemyBullets.push({
                            x: e.x, y: e.y + 20,
                            vx: Math.cos(angle) * 3,
                            vy: Math.sin(angle) * 3,
                            size: 5, color: '#00FFFF'
                        });
                        enemyBullets.push({
                            x: e.x, y: e.y + 20,
                            vx: Math.cos(angle + Math.PI) * 3,
                            vy: Math.sin(angle + Math.PI) * 3,
                            size: 5, color: '#00FFFF'
                        });
                    }
                } else {
                    // Wall pattern
                    if (e.fireTimer % 30 === 0) {
                        for (let k = 0; k < 10; k++) {
                            const gap = Math.floor(Math.random() * 10);
                            if (k !== gap && k !== gap + 1) {
                                enemyBullets.push({
                                    x: k * (W / 10) + W / 20, y: e.y + 30,
                                    vx: 0, vy: 2.5,
                                    size: 6, color: '#FFFF00'
                                });
                            }
                        }
                    }
                }
            }

            // Boss off-screen check
            if (e.y > H + 100) { enemies.splice(i, 1); continue; }

        } else {
            // Regular enemy movement
            if (e.movePattern === 'straight') {
                e.y += e.speed;
            } else if (e.movePattern === 'sine') {
                e.y += e.speed;
                e.x += Math.sin(frame * 0.05 + e.moveOffset) * 1.5;
            } else if (e.movePattern === 'zigzag') {
                e.y += e.speed;
                e.x += e.moveDir * 1.5;
                if (e.x < 20 || e.x > W - 20) e.moveDir *= -1;
            } else if (e.movePattern === 'sweep') {
                e.y += e.speed * 0.7;
                e.x += e.moveDir * 2;
                if (e.x < 20 || e.x > W - 20) e.moveDir *= -1;
            } else if (e.movePattern === 'float') {
                if (e.y < e.targetY) {
                    e.y += e.speed;
                } else {
                    e.x += Math.sin(frame * 0.03 + e.moveOffset) * 1.2;
                    e.y += Math.cos(frame * 0.02 + e.moveOffset) * 0.5;
                }
            } else if (e.movePattern === 'formation') {
                e.y += e.speed;
            }

            // Enemy fire
            e.fireTimer--;
            if (e.fireTimer <= 0) {
                e.fireTimer = e.fireRate;

                if (e.type === 'peasant') {
                    enemyBullets.push({
                        x: e.x, y: e.y + 10,
                        vx: 0, vy: 3,
                        size: 3, color: '#FF8C00'
                    });
                } else if (e.type === 'knight') {
                    // Spread shot
                    for (let k = -1; k <= 1; k++) {
                        enemyBullets.push({
                            x: e.x, y: e.y + 10,
                            vx: k * 1.5, vy: 3,
                            size: 4, color: '#4169E1'
                        });
                    }
                } else if (e.type === 'wizard') {
                    // Aimed shot + ring
                    const dx = player.x - e.x;
                    const dy = player.y - e.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    enemyBullets.push({
                        x: e.x, y: e.y + 10,
                        vx: (dx / dist) * 3.5, vy: (dy / dist) * 3.5,
                        size: 5, color: '#00FFFF'
                    });
                    if (wave > 6) {
                        // ring burst
                        for (let k = 0; k < 6; k++) {
                            const angle = (Math.PI * 2 / 6) * k;
                            enemyBullets.push({
                                x: e.x, y: e.y,
                                vx: Math.cos(angle) * 2, vy: Math.sin(angle) * 2,
                                size: 3, color: '#9400D3'
                            });
                        }
                    }
                }
            }

            // Off screen
            if (e.y > H + 30) { enemies.splice(i, 1); continue; }
        }

        // Collision with player
        if (player.invincible <= 0 &&
            Math.abs(player.x - e.x) < (player.w / 2 + e.w / 2) &&
            Math.abs(player.y - e.y) < (player.h / 2 + e.h / 2)) {
            if (player.shield > 0) {
                player.shield = 0;
                if (!e.isBoss) {
                    e.hp = 0;
                    score += e.points;
                    spawnExplosion(e.x, e.y, e.color);
                    enemies.splice(i, 1);
                }
            } else {
                playerHit();
            }
        }
    }

    // Enemy bullets
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.y > H + 10 || b.y < -10 || b.x < -10 || b.x > W + 10) {
            enemyBullets.splice(i, 1);
            continue;
        }
        // Collision with player
        if (player.invincible <= 0 &&
            Math.abs(b.x - player.x) < 8 &&
            Math.abs(b.y - player.y) < 12) {
            if (player.shield > 0) {
                player.shield = 0;
                enemyBullets.splice(i, 1);
                spawnExplosion(b.x, b.y, '#0FF');
            } else {
                enemyBullets.splice(i, 1);
                playerHit();
            }
        }
    }

    // Power-ups
    for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        p.y += p.vy;
        if (p.y > H + 20) { powerUps.splice(i, 1); continue; }
        if (Math.abs(p.x - player.x) < 18 && Math.abs(p.y - player.y) < 18) {
            playPowerUp();
            if (p.type === 'triple') player.tripleFire = 600; // 10 seconds
            else if (p.type === 'shield') player.shield = 600;
            else if (p.type === 'bomb') bombs = Math.min(bombs + 1, 3);
            powerUps.splice(i, 1);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        p.vx *= 0.96;
        p.vy *= 0.96;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Explosions
    for (let i = explosions.length - 1; i >= 0; i--) {
        const e = explosions[i];
        e.radius += 2;
        e.alpha -= 0.04;
        if (e.alpha <= 0) explosions.splice(i, 1);
    }

    // Wave management
    if (!isBossWave()) {
        waveTimer++;
        const spawnInterval = Math.max(20, 60 - wave * 3);
        if (waveTimer >= spawnInterval && waveEnemiesSpawned < waveEnemiesTotal) {
            waveTimer = 0;
            // Occasionally spawn formations
            if (wave > 2 && Math.random() < 0.25 && waveEnemiesSpawned < waveEnemiesTotal - 4) {
                spawnFormation();
            } else {
                spawnEnemy();
                waveEnemiesSpawned++;
            }
        }
    }

    // Check wave complete
    if (waveEnemiesSpawned >= waveEnemiesTotal && enemies.length === 0) {
        wave++;
        waveTimer = 0;
        waveEnemiesSpawned = 0;
        waveEnemiesTotal = getEnemyCountForWave();

        if (isBossWave()) {
            // Boss warning
            gameState = STATE.BOSS_WARNING;
            bossWarningTimer = 120;
            playBossWarning();
        }
    }
}

function playerHit() {
    lives--;
    playDeathSound();
    player.invincible = 120; // 2 seconds
    spawnExplosion(player.x, player.y, '#FF4500');
    screenFlash = 10;

    if (lives <= 0) {
        gameState = STATE.GAMEOVER;
        stopMusic();
    }
}

// ============================================================
// RENDER
// ============================================================
function render() {
    // Background
    ctx.fillStyle = '#0A0A1A';
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (const s of stars) {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.brightness})`;
        ctx.fillRect(Math.floor(s.x), Math.floor(s.y), s.size, s.size);
    }

    if (gameState === STATE.TITLE) {
        renderTitle();
        return;
    }
    if (gameState === STATE.GAMEOVER) {
        renderGameOver();
        return;
    }
    if (gameState === STATE.BOSS_WARNING) {
        renderBossWarning();
        return;
    }

    // Screen flash
    if (screenFlash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${screenFlash / 20 * 0.6})`;
        ctx.fillRect(0, 0, W, H);
    }

    // Power-ups
    for (const p of powerUps) {
        ctx.save();
        ctx.translate(p.x, p.y);
        const bob = Math.sin(frame * 0.1) * 3;
        ctx.translate(0, bob);
        if (p.type === 'triple') {
            ctx.fillStyle = '#FF4500';
            ctx.fillRect(-8, -8, 16, 16);
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('3', 0, 4);
        } else if (p.type === 'shield') {
            ctx.strokeStyle = '#0FF';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
            ctx.fill();
        } else if (p.type === 'bomb') {
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(-8, -8, 16, 16);
            ctx.fillStyle = '#000';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('B', 0, 4);
        }
        ctx.restore();
    }

    // Enemy bullets (colorful orbs)
    for (const b of enemyBullets) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();
        // Glow
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size + 2, 0, Math.PI * 2);
        ctx.fillStyle = b.color.replace(')', ', 0.3)').replace('rgb', 'rgba').replace('#', '');
        // simple glow
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size + 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        // white center
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // Enemies
    for (const e of enemies) {
        if (e.isBoss) {
            drawBoss(e.x, e.y, e.hp, e.maxHp, frame);
        } else if (e.type === 'peasant') {
            drawPeasant(e.x, e.y, frame);
        } else if (e.type === 'knight') {
            drawKnight(e.x, e.y, frame);
        } else if (e.type === 'wizard') {
            drawWizard(e.x, e.y, frame);
        }
    }

    // Player bullets (fireballs)
    for (const b of playerBullets) {
        ctx.save();
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FF0';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
        // Trail
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y + 6, b.size * 0.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.25;
        ctx.beginPath();
        ctx.arc(b.x, b.y + 11, b.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
    }

    // Player
    if (player.invincible <= 0 || Math.floor(frame / 4) % 2 === 0) {
        // Shield visual
        if (player.shield > 0) {
            ctx.strokeStyle = player.shield < 120 && Math.floor(frame / 6) % 2 === 0 ? 'transparent' : '#0FF';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(player.x, player.y, 22, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.fill();
        }
        drawTrogdor(player.x, player.y, frame);
    }

    // Explosions
    for (const e of explosions) {
        ctx.save();
        ctx.globalAlpha = e.alpha;
        ctx.strokeStyle = e.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = '#FFF';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius * 0.6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    // Particles
    for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life / 40;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        ctx.restore();
    }

    // HUD
    renderHUD();
}

function renderHUD() {
    // Score
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 10, 24);

    // Wave
    ctx.textAlign = 'center';
    ctx.fillText(`WAVE ${wave}`, W / 2, 24);

    // Lives
    ctx.textAlign = 'right';
    for (let i = 0; i < lives; i++) {
        ctx.fillStyle = '#FF4500';
        ctx.fillRect(W - 30 - i * 22, 10, 16, 16);
        ctx.fillStyle = '#228B22';
        ctx.fillRect(W - 28 - i * 22, 12, 12, 12);
    }

    // Bombs
    ctx.textAlign = 'left';
    ctx.fillStyle = '#FFD700';
    ctx.font = '14px monospace';
    ctx.fillText(`BOMB: ${bombs} [Z/RClick]`, 10, H - 12);

    // Power-up indicators
    if (player.tripleFire > 0) {
        ctx.fillStyle = '#FF4500';
        const barW = 60 * (player.tripleFire / 600);
        ctx.fillRect(10, 32, barW, 6);
        ctx.fillStyle = '#FFF';
        ctx.font = '10px monospace';
        ctx.fillText('TRIPLE', 10, 50);
    }
    if (player.shield > 0) {
        ctx.fillStyle = '#0FF';
        const barW = 60 * (player.shield / 600);
        ctx.fillRect(80, 32, barW, 6);
        ctx.fillStyle = '#FFF';
        ctx.font = '10px monospace';
        ctx.fillText('SHIELD', 80, 50);
    }
}

function renderTitle() {
    // Dramatic background glow
    const glow = Math.sin(titlePulse) * 0.15 + 0.15;
    const grad = ctx.createRadialGradient(W / 2, H / 3, 50, W / 2, H / 3, 300);
    grad.addColorStop(0, `rgba(255, 69, 0, ${glow})`);
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Title
    ctx.save();
    ctx.textAlign = 'center';

    // TROGDOR
    ctx.font = 'bold 52px monospace';
    ctx.fillStyle = '#FF4500';
    ctx.shadowColor = '#FF0';
    ctx.shadowBlur = 20;
    ctx.fillText('TROGDOR', W / 2, H / 3 - 20);

    // INFERNO
    ctx.font = 'bold 36px monospace';
    ctx.fillStyle = '#FFD700';
    ctx.shadowColor = '#FF4500';
    ctx.shadowBlur = 15;
    ctx.fillText('INFERNO', W / 2, H / 3 + 25);
    ctx.shadowBlur = 0;

    // Trogdor sprite on title
    drawTrogdor(W / 2, H / 2 + 20, frame);

    // Subtitle
    ctx.font = '14px monospace';
    ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + Math.sin(titlePulse * 2) * 0.5})`;
    ctx.fillText('CLICK or PRESS ENTER TO START', W / 2, H / 2 + 100);

    // Controls
    ctx.font = '12px monospace';
    ctx.fillStyle = '#AAA';
    ctx.fillText('ARROWS/WASD or MOUSE to move', W / 2, H - 100);
    ctx.fillText('Auto-fire fireballs upward', W / 2, H - 80);
    ctx.fillText('Z / Right-Click = Burnination Bomb', W / 2, H - 60);
    ctx.fillText('Survive the bullet hell!', W / 2, H - 35);

    ctx.restore();
}

function renderBossWarning() {
    // Red pulsing overlay
    const pulse = Math.sin(frame * 0.15) * 0.15 + 0.15;
    ctx.fillStyle = `rgba(255, 0, 0, ${pulse})`;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 40px monospace';
    ctx.fillStyle = '#FF0000';
    ctx.shadowColor = '#FF0';
    ctx.shadowBlur = 20;
    ctx.fillText('WARNING', W / 2, H / 2 - 30);

    ctx.font = 'bold 24px monospace';
    ctx.fillStyle = '#FFD700';
    ctx.fillText('BOSS APPROACHING', W / 2, H / 2 + 10);

    ctx.font = '16px monospace';
    ctx.fillStyle = '#FFF';
    ctx.shadowBlur = 0;
    ctx.fillText(`WAVE ${wave}`, W / 2, H / 2 + 50);
    ctx.restore();

    renderHUD();
}

function renderGameOver() {
    // Dark overlay
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.textAlign = 'center';

    ctx.font = 'bold 44px monospace';
    ctx.fillStyle = '#FF0000';
    ctx.shadowColor = '#FF4500';
    ctx.shadowBlur = 15;
    ctx.fillText('GAME OVER', W / 2, H / 3);
    ctx.shadowBlur = 0;

    ctx.font = '22px monospace';
    ctx.fillStyle = '#FFD700';
    ctx.fillText(`FINAL SCORE: ${score}`, W / 2, H / 2 - 20);

    ctx.font = '18px monospace';
    ctx.fillStyle = '#FFF';
    ctx.fillText(`REACHED WAVE ${wave}`, W / 2, H / 2 + 20);

    ctx.font = '14px monospace';
    ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + Math.sin(frame * 0.08) * 0.5})`;
    ctx.fillText('CLICK or PRESS ENTER', W / 2, H / 2 + 80);

    ctx.restore();
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
