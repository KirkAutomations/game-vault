<!DOCTYPE html>
<html>
<head><title>TROGDOR: The Perfected Groove</title></head>
<body>
    <h2>Check your downloads folder for trogdor_perfected.mid!</h2>
    <a id="dl" href="#">Click here if the download didn't start automatically</a>
    
    <script>
        // Standard MIDI Header: Format 0, 1 Track, 96 Ticks per quarter note
        const header = [
            0x4D, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 
            0x00, 0x00, 0x00, 0x01, 0x00, 0x60, 
            0x4D, 0x54, 0x72, 0x6B, 
            0x00, 0x00, 0x00, 0x00 
        ];
        
        // Track setup: Tempo 135, Overdriven Guitar (Program 30 / 0x1E)
        const track = [
            0x00, 0xFF, 0x51, 0x03, 0x06, 0xCB, 0x56, // Tempo ~135 BPM for better energy
            0x00, 0xC0, 0x1E 
        ];

        const notes = [];

        // PERFECTED RIFF TIMING (Exactly 3 measures of 4/4 time per loop)
        const addRiff = () => {
            notes.push(
                // Measure 1: 4 sixteenths (24 each), 1 dotted half note (288) = 384 ticks
                [50, 24], [50, 24], [50, 24], [50, 24], [58, 288], 
                // Measure 2: 4 sixteenths, 1 dotted half note = 384 ticks
                [50, 24], [50, 24], [50, 24], [50, 24], [55, 288], 
                // Measure 3: Syncopated tail ending = 384 ticks
                [50, 24], [50, 24], [50, 24], [50, 24], [58, 96], // Beat 1 & 2
                [50, 48], [55, 48],                               // Beat 3 (Eighth notes)
                [50, 48], [53, 24], [55, 24]                      // Beat 4 (Eighth, sixteenth, sixteenth)
            );
        };

        // --- SONG ARRANGEMENT ---

        // 1. Intro & Verses (Play the main riff 6 times)
        for(let i=0; i<6; i++) addRiff();

        // 2. Chorus: "Burninating the countryside!" 
        // Whole notes (384) and Double Whole Notes (768)
        notes.push([53, 384], [55, 384], [50, 768]); // F, G, D
        notes.push([53, 384], [55, 384], [50, 768]); // F, G, D 
        notes.push([53, 384], [55, 384], [57, 768]); // F, G, A
        notes.push([58, 384], [60, 384], [62, 768]); // Bb, C, High D

        // 3. THATCHED ROOF COTTAGES!
        addRiff(); addRiff();

        // 4. Guitar Solo (Squeedly-vers!) 
        // 4 straight measures of 16th note shredding
        const soloScale = [62, 65, 67, 69, 72, 74, 72, 69, 67, 65, 62, 65, 67, 69, 72, 74];
        for(let i=0; i<4; i++) { 
            for(let n of soloScale) notes.push([n, 24]);
        }

        // 5. Outro Build-up
        addRiff(); addRiff();

        // 6. Outro: "And the Trogdor comes in the NIIIIIGHT!"
        notes.push([55, 96], [53, 96], [50, 768]);

        // --- MIDI COMPILATION ---

        function pushVLQ(arr, value) {
            let bytes = [value & 0x7F];
            while ((value >>= 7) > 0) {
                bytes.unshift((value & 0x7F) | 0x80);
            }
            arr.push(...bytes);
        }

        let isFirstNote = true;
        let prevRestTime = 0;

        for (let [pitch, duration] of notes) {
            // DYNAMIC GATING: 
            // Short notes (<=48 ticks) get a 70% playtime for staccato palm-muting
            // Long notes get a 99% playtime to ring out naturally
            let gateRatio = duration <= 48 ? 0.70 : 0.99;
            let playTime = Math.floor(duration * gateRatio); 
            let restTime = duration - playTime;
            
            // The time before THIS note plays is the rest time of the PREVIOUS note
            let onsetDelta = isFirstNote ? 96 : prevRestTime; 
            isFirstNote = false;

            // Note On
            pushVLQ(track, onsetDelta);
            track.push(0x90, pitch, 0x7F);
            
            // Note Off
            pushVLQ(track, playTime);
            track.push(0x80, pitch, 0x00);

            prevRestTime = restTime;
        }
        
        track.push(0x00, 0xFF, 0x2F, 0x00); // End of track
        
        // Inject final track length
        header[18] = (track.length >> 24) & 0xFF;
        header[19] = (track.length >> 16) & 0xFF;
        header[20] = (track.length >> 8) & 0xFF;
        header[21] = track.length & 0xFF;
        
        // Force the download
        const binaryData = new Uint8Array(header.concat(track));
        const blob = new Blob([binaryData], { type: "audio/midi" });
        const link = document.getElementById("dl");
        
        link.href = URL.createObjectURL(blob);
        link.download = "trogdor_perfected.mid";
        link.click(); 
    </script>
</body>
</html>
