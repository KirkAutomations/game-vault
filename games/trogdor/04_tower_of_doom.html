<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TROGDOR: TOWER OF DOOM</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: monospace; }
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ============================================================
// TROGDOR: TOWER OF DOOM - Vertical Platformer
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 480, H = 640;
canvas.width = W; canvas.height = H;

function resizeCanvas() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================================
// GAME STATE
// ============================================================
let gameState = 'title'; // title, playing, gameover
let score = 0;
let highScore = parseInt(localStorage.getItem('trogdorTowerHigh') || '0');
let cameraY = 0;
let targetCameraY = 0;
let maxHeightReached = 0;
let trogdor, platforms, enemies, particles, powerUps, projectiles;
let backgroundStars = [];
let torches = [];
let banners = [];
let clouds = [];
let frameCount = 0;
let shakeTimer = 0;
let shakeIntensity = 0;
let musicStarted = false;

// Zone thresholds (in world Y, going upward means more negative)
const ZONE_DUNGEON_END = -3000;
const ZONE_CASTLE_END = -7000;
// Above castle end is sky

function getZone(y) {
    if (y > ZONE_DUNGEON_END) return 'dungeon';
    if (y > ZONE_CASTLE_END) return 'castle';
    return 'sky';
}

function getZoneProgress() {
    const y = cameraY;
    if (y > ZONE_DUNGEON_END) {
        return { zone: 'dungeon', progress: Math.max(0, Math.min(1, (0 - y) / (0 - ZONE_DUNGEON_END))) };
    }
    if (y > ZONE_CASTLE_END) {
        return { zone: 'castle', progress: (ZONE_DUNGEON_END - y) / (ZONE_DUNGEON_END - ZONE_CASTLE_END) };
    }
    return { zone: 'sky', progress: Math.min(1, (ZONE_CASTLE_END - y) / 3000) };
}

// ============================================================
// INPUT
// ============================================================
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    if (gameState === 'title' && e.code === 'Space') {
        startGame();
    }
    if (gameState === 'gameover' && e.code === 'Space') {
        gameState = 'title';
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ============================================================
// AUDIO ENGINE - Trogdor Theme (E MINOR) zone arrangements
// ============================================================
let audioCtx = null;
let masterGain, musicGain, sfxGain;
let dungeonGain, castleGain, skyGain;
let currentMusicZone = 'dungeon';

// Trogdor frequencies - Key of E minor (THE REAL KEY)
const FREQ = {
    E2: 82.41, Fs2: 92.50, G2: 98.00, A2: 110.00, B2: 123.47,
    E3: 164.81, Fs3: 185.00, G3: 196.00, A3: 220.00, B3: 246.94,
    E4: 329.63, Fs4: 369.99, G4: 392.00, A4: 440.00, B4: 493.88,
    E5: 659.25, G5: 783.99, A5: 880.00
};

// CHORUS RIFF bass line: E-E-A---E-E-G---E-E-A-E-G-E-F#->G
const BASS_LINE = [
    FREQ.E3, FREQ.E3, FREQ.A3, FREQ.A3, FREQ.A3, FREQ.A3,
    FREQ.E3, FREQ.E3, FREQ.G3, FREQ.G3, FREQ.G3, FREQ.G3,
    FREQ.E3, FREQ.E3, FREQ.A3, FREQ.E3, FREQ.G3, FREQ.Fs3, FREQ.G3, FREQ.G3
];

// Verse pattern: E(palm mute)-A-E-G-E-A-E-G-E-A-A-A
const VERSE_CHORDS = [
    FREQ.E3, FREQ.E3, FREQ.A3, FREQ.E3, FREQ.E3, FREQ.G3,
    FREQ.E3, FREQ.E3, FREQ.A3, FREQ.E3, FREQ.E3, FREQ.G3
];

// Burninating melody: E4-F#4-G4 pattern
const CHORUS_MELODY = [
    FREQ.E4, FREQ.Fs4, FREQ.G4, FREQ.E4, FREQ.Fs4, FREQ.G4, FREQ.G4, FREQ.A4,
    FREQ.A4, FREQ.B4, FREQ.E4, FREQ.A4, FREQ.G4, FREQ.Fs4, FREQ.G4,
    FREQ.G4, FREQ.A4, FREQ.B4
];

// Bridge: E-F#->G hammer-on pattern
const BRIDGE_PATTERN = [
    FREQ.E3, FREQ.E3, FREQ.Fs3, FREQ.G3,
    FREQ.E3, FREQ.E3, FREQ.Fs3, FREQ.G3
];

// Power chord fifths (root + fifth)
const FIFTH_OF = {};
FIFTH_OF[FREQ.E3] = FREQ.B3;   // E + B
FIFTH_OF[FREQ.A3] = FREQ.E3;   // A + E (inverted fifth)
FIFTH_OF[FREQ.G3] = 293.66;    // G + D
FIFTH_OF[FREQ.Fs3] = 277.18;   // F# + C#
FIFTH_OF[FREQ.B3] = FREQ.Fs3;  // B + F#

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.55;
    masterGain.connect(audioCtx.destination);

    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.5;
    musicGain.connect(masterGain);

    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 0.6;
    sfxGain.connect(masterGain);

    dungeonGain = audioCtx.createGain();
    dungeonGain.gain.value = 1.0;
    dungeonGain.connect(musicGain);

    castleGain = audioCtx.createGain();
    castleGain.gain.value = 0.0;
    castleGain.connect(musicGain);

    skyGain = audioCtx.createGain();
    skyGain.gain.value = 0.0;
    skyGain.connect(musicGain);
}

function startMusic() {
    if (!audioCtx || musicStarted) return;
    musicStarted = true;

    // --- REVERB for dungeon (delay-like effect) ---
    const convolver = audioCtx.createConvolver();
    const rate = audioCtx.sampleRate;
    const irLength = rate * 2.5;
    const impulse = audioCtx.createBuffer(2, irLength, rate);
    for (let ch = 0; ch < 2; ch++) {
        const data = impulse.getChannelData(ch);
        for (let i = 0; i < irLength; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLength, 2.0);
        }
    }
    convolver.buffer = impulse;
    const reverbGain = audioCtx.createGain();
    reverbGain.gain.value = 0.25;
    convolver.connect(reverbGain);
    reverbGain.connect(dungeonGain);

    // ===== DUNGEON ZONE (~80 BPM, 5/10 intensity) =====
    // Slow E2 drone bass + single melody notes E-F#-G with reverb-like delays
    const dBass = audioCtx.createOscillator();
    dBass.type = 'triangle';
    dBass.frequency.value = FREQ.E3;
    const dBassGain = audioCtx.createGain();
    dBassGain.gain.value = 0.18;
    const dBassFilter = audioCtx.createBiquadFilter();
    dBassFilter.type = 'lowpass';
    dBassFilter.frequency.value = 250;
    dBass.connect(dBassFilter);
    dBassFilter.connect(dBassGain);
    dBassGain.connect(dungeonGain);
    dBassGain.connect(convolver);
    dBass.start();

    // Haunting single melody notes: E-F#-G played very slowly
    const dMelody = audioCtx.createOscillator();
    dMelody.type = 'sine';
    dMelody.frequency.value = FREQ.E4;
    const dMelGain = audioCtx.createGain();
    dMelGain.gain.value = 0.0;
    const dMelFilter = audioCtx.createBiquadFilter();
    dMelFilter.type = 'lowpass';
    dMelFilter.frequency.value = 600;
    dMelody.connect(dMelFilter);
    dMelFilter.connect(dMelGain);
    dMelGain.connect(dungeonGain);
    dMelGain.connect(convolver);
    dMelody.start();

    // Dungeon dark pad (E2 drone)
    const dPad = audioCtx.createOscillator();
    dPad.type = 'sine';
    dPad.frequency.value = FREQ.E2;
    const dPadGain = audioCtx.createGain();
    dPadGain.gain.value = 0.10;
    dPad.connect(dPadGain);
    dPadGain.connect(dungeonGain);
    dPadGain.connect(convolver);
    dPad.start();

    // Dungeon fifth drone (B2 = fifth of E)
    const dPad5 = audioCtx.createOscillator();
    dPad5.type = 'sine';
    dPad5.frequency.value = FREQ.B2; // B2 = 123.47
    const dPad5Gain = audioCtx.createGain();
    dPad5Gain.gain.value = 0.06;
    dPad5.connect(dPad5Gain);
    dPad5Gain.connect(dungeonGain);
    dPad5.start();

    // ===== TUBE AMP DISTORTION CURVE =====
    function makeTubeDistCurve(amount, samples) {
        const k = amount;
        const curve = new Float32Array(samples || 44100);
        for (let i = 0; i < curve.length; i++) {
            const x = (i * 2) / curve.length - 1;
            curve[i] = ((3 + k) * x * 20 * (Math.PI / 180)) / (Math.PI + k * Math.abs(x));
        }
        return curve;
    }

    // ===== CABINET SIM: lowpass 4500 + peaking 2500 (+4dB Q1.5) + highpass 80 =====
    function createCabinetSim(dest) {
        const lp = audioCtx.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 4500;
        const peak = audioCtx.createBiquadFilter();
        peak.type = 'peaking'; peak.frequency.value = 2500; peak.gain.value = 4; peak.Q.value = 1.5;
        const hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = 80;
        lp.connect(peak); peak.connect(hp); hp.connect(dest);
        return lp; // input node
    }

    // ===== DETUNED GUITAR CHAIN: 3-4 sawtooth oscs -> tube distortion -> cabinet =====
    // Returns { oscs[], gain, setFreq(f,t) }
    function createGuitarChain(freq, gainVal, distAmount, dest) {
        const detunes = [-3, 3]; // 2 detuned sawtooths per voice
        const oscs = [];
        const merge = audioCtx.createGain();
        merge.gain.value = 0.4;
        for (let i = 0; i < 2; i++) {
            const o = audioCtx.createOscillator();
            o.type = 'sawtooth';
            o.frequency.value = freq;
            o.detune.value = detunes[i];
            o.connect(merge);
            o.start();
            oscs.push(o);
        }
        const preBoost = audioCtx.createGain();
        preBoost.gain.value = 1.5;
        const dist = audioCtx.createWaveShaper();
        dist.curve = makeTubeDistCurve(distAmount < 10 ? distAmount : 40);
        dist.oversample = '4x';
        const outGain = audioCtx.createGain();
        outGain.gain.value = gainVal;
        const cab = createCabinetSim(outGain);
        merge.connect(preBoost);
        preBoost.connect(dist);
        dist.connect(cab);
        outGain.connect(dest);
        return {
            oscs, gain: outGain,
            setFreq(f, t, glide) {
                oscs.forEach(o => o.frequency.setTargetAtTime(f, t, glide || 0.02));
            }
        };
    }

    // ===== BETTER BASS: sine+sawtooth, light distortion, lowpass 1000 =====
    function createBassChain(freq, gainVal, dest) {
        const sine = audioCtx.createOscillator();
        sine.type = 'sine'; sine.frequency.value = freq;
        const saw = audioCtx.createOscillator();
        saw.type = 'sawtooth'; saw.frequency.value = freq;
        const merge = audioCtx.createGain();
        merge.gain.value = 0.5;
        const sawGain = audioCtx.createGain();
        sawGain.gain.value = 0.6; // sawtooth louder for FAT bass
        sine.connect(merge);
        saw.connect(sawGain); sawGain.connect(merge);
        const dist = audioCtx.createWaveShaper();
        dist.curve = makeTubeDistCurve(4); // light distortion
        dist.oversample = '2x';
        const lp = audioCtx.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 1000;
        const outGain = audioCtx.createGain();
        outGain.gain.value = gainVal;
        merge.connect(dist); dist.connect(lp); lp.connect(outGain);
        outGain.connect(dest);
        sine.start(); saw.start();
        return {
            oscs: [sine, saw], gain: outGain,
            setFreq(f, t, glide) {
                sine.frequency.setTargetAtTime(f, t, glide || 0.03);
                saw.frequency.setTargetAtTime(f, t, glide || 0.03);
            }
        };
    }

    // ===== CASTLE ZONE (~130 BPM) =====
    // Power chord riff - detuned sawtooth guitar + tube amp + cabinet sim
    const cGuitarRoot = createGuitarChain(FREQ.D3, 0.14, 8, castleGain);
    const cGuitarFifth = createGuitarChain(FREQ.A3, 0.10, 8, castleGain);

    // Castle bass - sine+sawtooth with light distortion
    const cBassChain = createBassChain(FREQ.D2, 0.12, castleGain);

    // Palm mute filter for castle accents (short envelope + lowpass 800)
    const cPalmMuteFilter = audioCtx.createBiquadFilter();
    cPalmMuteFilter.type = 'lowpass';
    cPalmMuteFilter.frequency.value = 4500; // opens up, drops to 800 on palm mute

    // Castle melody (chorus melody at medium register)
    const cMelody = audioCtx.createOscillator();
    cMelody.type = 'square';
    cMelody.frequency.value = FREQ.D4;
    const cMelGain = audioCtx.createGain();
    cMelGain.gain.value = 0.0;
    const cMelFilter = audioCtx.createBiquadFilter();
    cMelFilter.type = 'lowpass';
    cMelFilter.frequency.value = 1200;
    cMelody.connect(cMelFilter);
    cMelFilter.connect(cMelGain);
    cMelGain.connect(castleGain);
    cMelody.start();

    // ===== SKY ZONE (~160 BPM) =====
    // Full Trogdor theme - heavy detuned power chords with tube amp + cabinet
    const sGuitarRoot = createGuitarChain(FREQ.D3, 0.16, 12, skyGain);
    const sGuitarFifth = createGuitarChain(FREQ.A3, 0.12, 12, skyGain);

    // Sky bass - heavy sine+saw bass with distortion
    const sBassChain = createBassChain(FREQ.D2, 0.14, skyGain);

    // Sky lead melody (full chorus melody) - through its own guitar chain for lead tone
    const sLead = audioCtx.createOscillator();
    sLead.type = 'square';
    sLead.frequency.value = FREQ.D4;
    const sLeadGain = audioCtx.createGain();
    sLeadGain.gain.value = 0.0;
    const sLeadDist = audioCtx.createWaveShaper();
    sLeadDist.curve = makeTubeDistCurve(6);
    sLeadDist.oversample = '2x';
    const sLeadCab = createCabinetSim(sLeadGain);
    sLead.connect(sLeadDist);
    sLeadDist.connect(sLeadCab);
    sLeadGain.connect(skyGain);
    sLead.start();

    // Sky octave lead (doubles melody up an octave for brightness)
    const sOctave = audioCtx.createOscillator();
    sOctave.type = 'sine';
    sOctave.frequency.value = FREQ.D5;
    const sOctaveGain = audioCtx.createGain();
    sOctaveGain.gain.value = 0.0;
    sOctave.connect(sOctaveGain);
    sOctaveGain.connect(skyGain);
    sOctave.start();

    // ===== SEQUENCER STATE =====
    let dBassStep = 0;    // dungeon bass line position
    let dMelStep = 0;     // dungeon melody position (slow)
    let dMelSubCount = 0; // counts beats between melody note changes
    let cVerseStep = 0;   // castle verse chord position
    let cMelStep = 0;     // castle melody position
    let cMelSubCount = 0;
    let sRiffStep = 0;    // sky main riff position
    let sMelStep = 0;     // sky melody position
    let beatCount = 0;

    // BPM to ms per 16th note: (60000 / BPM) / 4
    const DUNGEON_TICK = (60000 / 90) / 4;  // ~167ms per 16th
    const CASTLE_TICK = (60000 / 130) / 4;  // ~115ms per 16th
    const SKY_TICK = (60000 / 160) / 4;     // ~94ms per 16th

    // --- DUNGEON SEQUENCER ---
    function dungeonTick() {
        if (!audioCtx || gameState !== 'playing') return;
        const t = audioCtx.currentTime;

        // Bass line - advance every 2 ticks (8th notes at 90 BPM)
        if (beatCount % 2 === 0) {
            dBassStep = (dBassStep + 1) % BASS_LINE.length;
            const note = BASS_LINE[dBassStep];
            dBass.frequency.setTargetAtTime(note, t, 0.08);
            // Subtle pulse on bass
            dBassGain.gain.setTargetAtTime(0.20, t, 0.01);
            dBassGain.gain.setTargetAtTime(0.14, t + 0.15, 0.1);
        }

        // Haunting melody - one note every 8 ticks (half notes)
        dMelSubCount++;
        if (dMelSubCount >= 8) {
            dMelSubCount = 0;
            dMelStep = (dMelStep + 1) % CHORUS_MELODY.length;
            const note = CHORUS_MELODY[dMelStep];
            dMelody.frequency.setTargetAtTime(note, t, 0.05);
            // Swell in and fade out
            dMelGain.gain.setTargetAtTime(0.10, t, 0.05);
            dMelGain.gain.setTargetAtTime(0.0, t + 0.6, 0.3);
        }

        // Pad shifts on riff chord changes (every 6 bass steps ~ every 12 ticks)
        if (beatCount % 12 === 0) {
            const chordRoot = BASS_LINE[dBassStep];
            dPad.frequency.setTargetAtTime(chordRoot / 2, t, 0.2);
            const fifth = FIFTH_OF[chordRoot] || chordRoot * 1.5;
            dPad5.frequency.setTargetAtTime(fifth / 2, t, 0.2);
        }

        beatCount++;
        const zp = getZoneProgress();
        const tick = zp.zone === 'dungeon'
            ? DUNGEON_TICK - (DUNGEON_TICK - CASTLE_TICK) * zp.progress * 0.3
            : DUNGEON_TICK;
        setTimeout(dungeonTick, tick);
    }

    // --- CASTLE SEQUENCER ---
    let cBeatCount = 0;
    function castleTick() {
        if (!audioCtx || gameState !== 'playing') return;
        const t = audioCtx.currentTime;

        // Verse chord pattern - change every 2 ticks (8th notes)
        if (cBeatCount % 2 === 0) {
            cVerseStep = (cVerseStep + 1) % VERSE_CHORDS.length;
            const root = VERSE_CHORDS[cVerseStep];
            cGuitarRoot.setFreq(root, t);
            const fifth = FIFTH_OF[root] || root * 1.5;
            cGuitarFifth.setFreq(fifth, t);
            cBassChain.setFreq(root / 2, t);

            // Accent on downbeats
            if (cBeatCount % 8 === 0) {
                cGuitarRoot.gain.gain.setTargetAtTime(0.18, t, 0.01);
                cGuitarRoot.gain.gain.setTargetAtTime(0.14, t + 0.08, 0.05);
                cGuitarFifth.gain.gain.setTargetAtTime(0.14, t, 0.01);
                cGuitarFifth.gain.gain.setTargetAtTime(0.10, t + 0.08, 0.05);
            }
            // Palm mute on off-beats (short envelope + lowpass 800Hz feel)
            if (cBeatCount % 8 === 4) {
                cGuitarRoot.gain.gain.setTargetAtTime(0.16, t, 0.005);
                cGuitarRoot.gain.gain.setTargetAtTime(0.06, t + 0.03, 0.02);
                cGuitarFifth.gain.gain.setTargetAtTime(0.12, t, 0.005);
                cGuitarFifth.gain.gain.setTargetAtTime(0.04, t + 0.03, 0.02);
            }
        }

        // Melody - advance every 3 ticks (dotted 8th feel)
        cMelSubCount++;
        if (cMelSubCount >= 3) {
            cMelSubCount = 0;
            cMelStep = (cMelStep + 1) % CHORUS_MELODY.length;
            const note = CHORUS_MELODY[cMelStep];
            cMelody.frequency.setTargetAtTime(note, t, 0.02);
            cMelGain.gain.setTargetAtTime(0.12, t, 0.01);
            cMelGain.gain.setTargetAtTime(0.04, t + 0.1, 0.08);
        }

        cBeatCount++;
        const zp = getZoneProgress();
        const tick = zp.zone === 'castle'
            ? CASTLE_TICK - (CASTLE_TICK - SKY_TICK) * zp.progress * 0.3
            : CASTLE_TICK;
        setTimeout(castleTick, tick);
    }

    // --- SKY SEQUENCER ---
    let sBeatCount = 0;
    function skyTick() {
        if (!audioCtx || gameState !== 'playing') return;
        const t = audioCtx.currentTime;

        // Main riff - every tick (16th notes at 160 BPM for driving feel)
        sRiffStep = (sRiffStep + 1) % BASS_LINE.length;
        const riffNote = BASS_LINE[sRiffStep];
        sGuitarRoot.setFreq(riffNote, t);
        const riffFifth = FIFTH_OF[riffNote] || riffNote * 1.5;
        sGuitarFifth.setFreq(riffFifth, t);
        sBassChain.setFreq(riffNote / 2, t);

        // Power chord accent pattern: strong on beat, palm muted off-beat
        if (sBeatCount % 4 === 0) {
            sGuitarRoot.gain.gain.setTargetAtTime(0.20, t, 0.005);
            sGuitarRoot.gain.gain.setTargetAtTime(0.14, t + 0.04, 0.03);
            sGuitarFifth.gain.gain.setTargetAtTime(0.16, t, 0.005);
            sGuitarFifth.gain.gain.setTargetAtTime(0.10, t + 0.04, 0.03);
        } else if (sBeatCount % 4 === 2) {
            // Palm mute on off-beats
            sGuitarRoot.gain.gain.setTargetAtTime(0.16, t, 0.003);
            sGuitarRoot.gain.gain.setTargetAtTime(0.05, t + 0.02, 0.015);
            sGuitarFifth.gain.gain.setTargetAtTime(0.12, t, 0.003);
            sGuitarFifth.gain.gain.setTargetAtTime(0.04, t + 0.02, 0.015);
        }

        // Full chorus melody - advance every 2 ticks
        if (sBeatCount % 2 === 0) {
            sMelStep = (sMelStep + 1) % CHORUS_MELODY.length;
            const note = CHORUS_MELODY[sMelStep];
            sLead.frequency.setTargetAtTime(note, t, 0.01);
            sOctave.frequency.setTargetAtTime(note * 2, t, 0.01);
            // Melody envelope
            sLeadGain.gain.setTargetAtTime(0.13, t, 0.005);
            sLeadGain.gain.setTargetAtTime(0.06, t + 0.06, 0.04);
            sOctaveGain.gain.setTargetAtTime(0.05, t, 0.005);
            sOctaveGain.gain.setTargetAtTime(0.02, t + 0.06, 0.04);
        }

        // Bridge pattern interjection every 80 ticks
        if (sBeatCount > 0 && sBeatCount % 80 < 8) {
            const bNote = BRIDGE_PATTERN[sBeatCount % 8];
            sGuitarRoot.setFreq(bNote, t, 0.005);
            const bFifth = FIFTH_OF[bNote] || bNote * 1.5;
            sGuitarFifth.setFreq(bFifth, t, 0.005);
        }

        // "TROGDOR!" scream during ascending melody notes (D4->G4->Bb4->D5)
        if (sBeatCount % 2 === 0) {
            const mNote = CHORUS_MELODY[sMelStep % CHORUS_MELODY.length];
            if (mNote >= FREQ.Bb4 && sMelStep > 0 && CHORUS_MELODY[(sMelStep - 1) % CHORUS_MELODY.length] < mNote) {
                if (sBeatCount % 160 < 4) { // limit frequency of screams
                    playTrogdorScream(0.5); // half volume during music
                }
            }
        }

        sBeatCount++;
        setTimeout(skyTick, SKY_TICK);
    }

    // ===== DRUMS =====
    function playDrum(type) {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;

        if (type === 'kick') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.exponentialRampToValueAtTime(30, t + 0.15);
            gain.gain.setValueAtTime(0.4, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
            osc.connect(gain);
            gain.connect(musicGain);
            osc.start(t);
            osc.stop(t + 0.2);
        } else if (type === 'snare') {
            const noise = audioCtx.createBufferSource();
            const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buf;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 1000;
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(musicGain);
            noise.start(t);
            noise.stop(t + 0.1);
        } else if (type === 'hihat') {
            const noise = audioCtx.createBufferSource();
            const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buf;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.08, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 5000;
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(musicGain);
            noise.start(t);
            noise.stop(t + 0.05);
        } else if (type === 'militarySnare') {
            // Tighter military snare roll for castle
            const noise = audioCtx.createBufferSource();
            const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.08, audioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buf;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 2000;
            filter.Q.value = 1;
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(musicGain);
            noise.start(t);
            noise.stop(t + 0.08);
        }
    }

    let drumBeat = 0;
    function drumTick() {
        if (!audioCtx || gameState !== 'playing') return;
        const zp = getZoneProgress();

        if (zp.zone === 'dungeon') {
            // Sparse: kick on 1, soft hihat on 3, ghostly
            if (drumBeat % 16 === 0) playDrum('kick');
            if (drumBeat % 16 === 8) playDrum('hihat');
            if (drumBeat % 32 === 24) playDrum('snare'); // rare snare ghost
        } else if (zp.zone === 'castle') {
            // Military march: kick-snare-kick-snare with 8th note hihats
            if (drumBeat % 8 === 0) playDrum('kick');
            if (drumBeat % 8 === 4) playDrum('militarySnare');
            if (drumBeat % 4 === 0) playDrum('hihat');
            // Snare roll fill every 32 beats
            if (drumBeat % 32 >= 28) playDrum('militarySnare');
        } else {
            // Full driving rock: kick on 1&3, snare on 2&4, constant hihats
            if (drumBeat % 4 === 0) playDrum('kick');
            if (drumBeat % 4 === 2) playDrum('snare');
            playDrum('hihat');
            // Double kick fills
            if (drumBeat % 16 >= 14) playDrum('kick');
        }

        drumBeat++;
        let drumTempo;
        if (zp.zone === 'dungeon') drumTempo = DUNGEON_TICK * 2;  // 8th notes
        else if (zp.zone === 'castle') drumTempo = CASTLE_TICK;    // 16th notes
        else drumTempo = SKY_TICK;                                  // 16th notes

        setTimeout(drumTick, drumTempo);
    }

    dungeonTick();
    castleTick();
    skyTick();
    drumTick();
}

let previousMusicZone = 'dungeon';
function updateMusicZones() {
    if (!audioCtx || !musicStarted) return;
    const zp = getZoneProgress();
    const t = audioCtx.currentTime;
    const fadeTime = 0.5;

    // Trigger TROGDOR scream when entering sky zone
    if (zp.zone === 'sky' && previousMusicZone !== 'sky') {
        playTrogdorScream(1.0);
    }
    previousMusicZone = zp.zone;

    if (zp.zone === 'dungeon') {
        dungeonGain.gain.setTargetAtTime(1.0 - zp.progress * 0.3, t, fadeTime);
        castleGain.gain.setTargetAtTime(zp.progress * 0.5, t, fadeTime);
        skyGain.gain.setTargetAtTime(0, t, fadeTime);
    } else if (zp.zone === 'castle') {
        dungeonGain.gain.setTargetAtTime(Math.max(0, 0.3 - zp.progress * 0.3), t, fadeTime);
        castleGain.gain.setTargetAtTime(1.0 - zp.progress * 0.3, t, fadeTime);
        skyGain.gain.setTargetAtTime(zp.progress * 0.5, t, fadeTime);
    } else {
        dungeonGain.gain.setTargetAtTime(0, t, fadeTime);
        castleGain.gain.setTargetAtTime(Math.max(0, 0.3 - zp.progress * 0.3), t, fadeTime);
        skyGain.gain.setTargetAtTime(0.7 + zp.progress * 0.3, t, fadeTime);
    }
}

// Sound effects
function playSound(type) {

        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(gain); gain.connect(sfxGain);
        osc.start(t); osc.stop(t + 0.15);
    } else if (type === 'land') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(60, t + 0.08);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.connect(gain); gain.connect(sfxGain);
        osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'fire') {
        const noise = audioCtx.createBufferSource();
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        noise.buffer = buf;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2000, t);
        filter.frequency.exponentialRampToValueAtTime(500, t + 0.3);
        filter.Q.value = 2;
        noise.connect(filter); filter.connect(gain); gain.connect(sfxGain);
        noise.start(t); noise.stop(t + 0.3);
    } else if (type === 'enemyDeath') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.3);
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.connect(gain); gain.connect(sfxGain);
        osc.start(t); osc.stop(t + 0.3);
    } else if (type === 'crumble') {
        const noise = audioCtx.createBufferSource();
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.4, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        noise.buffer = buf;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 800;
        noise.connect(filter); filter.connect(gain); gain.connect(sfxGain);
        noise.start(t); noise.stop(t + 0.4);
    } else if (type === 'powerup') {
        for (let i = 0; i < 4; i++) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 400 + i * 200;
            gain.gain.setValueAtTime(0, t + i * 0.08);
            gain.gain.linearRampToValueAtTime(0.12, t + i * 0.08 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.15);
            osc.connect(gain); gain.connect(sfxGain);
            osc.start(t + i * 0.08); osc.stop(t + i * 0.08 + 0.15);
        }
    } else if (type === 'hurt') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.2);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.connect(gain); gain.connect(sfxGain);
        osc.start(t); osc.stop(t + 0.25);
    }
}

// ============================================================
// TROGDOR SCREAM - Formant synthesis: "TROGDOR!"
// ============================================================
let lastScreamTime = 0;
function playTrogdorScream(volumeScale) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    // Debounce: no more than one scream per 2 seconds
    if (t - lastScreamTime < 2.0) return;
    lastScreamTime = t;
    const vol = (volumeScale || 1.0) * 0.25;

    // --- Sawtooth oscillator for vocal source ---
    const vox = audioCtx.createOscillator();
    vox.type = 'sawtooth';
    // Pitch contour: G4 -> hold -> dip to 370Hz -> Bb4 -> D5 -> hold (~1.8s)
    vox.frequency.setValueAtTime(FREQ.G4, t);              // "TR-" attack
    vox.frequency.setValueAtTime(FREQ.G4, t + 0.25);       // hold G4
    vox.frequency.linearRampToValueAtTime(370, t + 0.5);    // dip on "OG"
    vox.frequency.linearRampToValueAtTime(FREQ.Bb4, t + 0.9); // "D-"
    vox.frequency.linearRampToValueAtTime(FREQ.D5, t + 1.2);  // "-OR!"
    vox.frequency.setValueAtTime(FREQ.D5, t + 1.8);        // hold high

    // --- Noise source for breathiness ---
    const noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
    const noiseData = noiseBuf.getChannelData(0);
    for (let i = 0; i < noiseData.length; i++) noiseData[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuf;
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.value = 0.15;
    noise.connect(noiseGain);

    // --- Merge vocal + noise ---
    const voxMerge = audioCtx.createGain();
    voxMerge.gain.value = 1.0;
    vox.connect(voxMerge);
    noiseGain.connect(voxMerge);

    // --- 3 Bandpass formant filters (Q=8) ---
    const f1 = audioCtx.createBiquadFilter();
    f1.type = 'bandpass'; f1.Q.value = 8;
    const f2 = audioCtx.createBiquadFilter();
    f2.type = 'bandpass'; f2.Q.value = 8;
    const f3 = audioCtx.createBiquadFilter();
    f3.type = 'bandpass'; f3.Q.value = 8;

    // Formant transitions: "TR" -> "AH/OH" -> "GD" closure -> "OR!"
    // F1 (low formant)
    f1.frequency.setValueAtTime(400, t);                    // "TR" - closed
    f1.frequency.linearRampToValueAtTime(700, t + 0.2);     // open to "AH/OH"
    f1.frequency.setValueAtTime(700, t + 0.5);
    f1.frequency.linearRampToValueAtTime(200, t + 0.7);     // "GD" closure
    f1.frequency.linearRampToValueAtTime(500, t + 0.9);     // "OR!"
    f1.frequency.setValueAtTime(500, t + 1.8);

    // F2 (mid formant)
    f2.frequency.setValueAtTime(800, t);
    f2.frequency.linearRampToValueAtTime(1100, t + 0.2);
    f2.frequency.setValueAtTime(1100, t + 0.5);
    f2.frequency.linearRampToValueAtTime(400, t + 0.7);     // closure
    f2.frequency.linearRampToValueAtTime(900, t + 0.9);
    f2.frequency.setValueAtTime(900, t + 1.8);

    // F3 (high formant)
    f3.frequency.setValueAtTime(1800, t);
    f3.frequency.linearRampToValueAtTime(2600, t + 0.2);
    f3.frequency.setValueAtTime(2600, t + 0.5);
    f3.frequency.linearRampToValueAtTime(1200, t + 0.7);    // closure
    f3.frequency.linearRampToValueAtTime(2500, t + 0.9);
    f3.frequency.setValueAtTime(2500, t + 1.8);

    // Connect source to all 3 formants in parallel, then merge
    const formantMerge = audioCtx.createGain();
    formantMerge.gain.value = 0.45;
    voxMerge.connect(f1); f1.connect(formantMerge);
    voxMerge.connect(f2); f2.connect(formantMerge);
    voxMerge.connect(f3); f3.connect(formantMerge);

    // --- Light distortion for metal quality ---
    const screamDist = audioCtx.createWaveShaper();
    const screamCurve = new Float32Array(512);
    for (let i = 0; i < 512; i++) {
        const x = (i / 256) - 1;
        screamCurve[i] = ((3 + 6) * x * 20 * (Math.PI / 180)) / (Math.PI + 6 * Math.abs(x));
    }
    screamDist.curve = screamCurve;
    screamDist.oversample = '2x';

    // --- Crescendo envelope ---
    const screamGain = audioCtx.createGain();
    screamGain.gain.setValueAtTime(0.0, t);
    screamGain.gain.linearRampToValueAtTime(vol * 0.5, t + 0.1);   // quick attack
    screamGain.gain.linearRampToValueAtTime(vol * 0.8, t + 0.5);   // crescendo
    screamGain.gain.linearRampToValueAtTime(vol * 1.0, t + 1.0);   // peak
    screamGain.gain.setValueAtTime(vol * 1.0, t + 1.4);
    screamGain.gain.linearRampToValueAtTime(0.0, t + 1.8);         // fade out

    formantMerge.connect(screamDist);
    screamDist.connect(screamGain);
    screamGain.connect(sfxGain);

    vox.start(t);
    noise.start(t);
    vox.stop(t + 1.9);
    noise.stop(t + 1.9);
}
