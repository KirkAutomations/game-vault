<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Hug</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    touch-action: none;
    background: linear-gradient(to top, #a1c4fd, #c2e9fb);
    font-family: sans-serif;
  }
  canvas { display: block; }
  .floating-text {
    position: absolute;
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    pointer-events: none;
    user-select: none;
    animation: floatUp 1s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-50px); }
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
// ==== Setup ====
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

// ==== Pet ====
const petImg = new Image();
petImg.src = 'https://i.imgur.com/L1jXv1V.png'; // cute flying pet placeholder

let pet = {
    x: canvas.width/2,
    y: canvas.height/2,
    size: 80
};

// ==== Clouds ====
class Cloud {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random()*60 + 40;
        this.color = 'white';
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size/2, 0, Math.PI*2);
        ctx.arc(this.x+this.size/2, this.y+10, this.size/3, 0, Math.PI*2);
        ctx.arc(this.x-this.size/2, this.y+10, this.size/3, 0, Math.PI*2);
        ctx.fill();
    }
}

let clouds = [];
for(let i=0;i<7;i++){
    clouds.push(new Cloud(Math.random()*canvas.width, Math.random()*canvas.height/2));
}

// ==== Touch / Mouse Tracking ====
let target = {x: pet.x, y: pet.y};

function movePetTo(x,y){
    target.x = x;
    target.y = y;
}

canvas.addEventListener('mousemove', e => movePetTo(e.clientX, e.clientY));
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    movePetTo(e.touches[0].clientX, e.touches[0].clientY);
});

// ==== Interaction ====
canvas.addEventListener('click', e => createSparkle(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    createSparkle(e.touches[0].clientX, e.touches[0].clientY);
});

// ==== Sparkles ====
let sparkles = [];
function createSparkle(x, y){
    for(let i=0;i<10;i++){
        sparkles.push({
            x: x,
            y: y,
            vx: (Math.random()-0.5)*4,
            vy: (Math.random()-1.5)*4,
            alpha: 1,
            size: Math.random()*6 + 4
        });
    }
}

// ==== Floating Text ====
function showFloatingText(text, x, y){
    const div = document.createElement('div');
    div.className = 'floating-text';
    div.style.left = x + 'px';
    div.style.top = y + 'px';
    div.textContent = text;
    document.body.appendChild(div);
    setTimeout(()=>div.remove(),1000);
}

// ==== Animation Loop ====
function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Move pet smoothly
    pet.x += (target.x - pet.x) * 0.05;
    pet.y += (target.y - pet.y) * 0.05;

    // Draw clouds
    clouds.forEach(c => c.draw());

    // Draw sparkles
    for(let i=sparkles.length-1;i>=0;i--){
        let s = sparkles[i];
        s.x += s.vx;
        s.y += s.vy;
        s.alpha -= 0.02;
        ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fill();
        if(s.alpha <= 0) sparkles.splice(i,1);
    }

    // Draw pet
    ctx.drawImage(petImg, pet.x - pet.size/2, pet.y - pet.size/2, pet.size, pet.size);

    requestAnimationFrame(animate);
}
animate();

// ==== Audio ====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playPing(){
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.type = 'sine';
    oscillator.frequency.value = 440 + Math.random()*220;
    gainNode.gain.value = 0.1;
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.2);
}

// Bind sparkles to sound
canvas.addEventListener('click', e=>playPing());
canvas.addEventListener('touchstart', e=>playPing());

</script>
</body>
</html>
