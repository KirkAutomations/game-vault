<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwirlyBrew - Idle Drink Tycoon</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');

html, body {
  height: auto;
  overflow-y: auto !important;
  overflow-x: hidden;
}
body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0a1628 100%);
  color: #e0e0e0;
  min-height: 100vh;
}

/* ===== LOADING SCREEN ===== */
#loading-screen {
  position: fixed; inset: 0;
  background: linear-gradient(135deg, #0d0221, #1a0533, #2d1b69);
  z-index: 1000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.8s;
}
#loading-screen.fade-out { opacity: 0; pointer-events: none; }
#loading-screen h1 {
  font-family: 'Fredoka One', cursive;
  font-size: 2.5rem;
  background: linear-gradient(90deg, #ff6b9d, #c44dff, #6bbaff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
}
#loading-bar-container {
  width: 300px; height: 20px;
  background: #1a1a3e; border-radius: 10px;
  overflow: hidden; margin-bottom: 30px;
  border: 2px solid #3a2a6e;
}
#loading-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #ff6b9d, #c44dff);
  border-radius: 10px;
  transition: width 0.3s;
}
#loading-text {
  color: #a080d0; margin-bottom: 20px; font-size: 0.9rem;
}

/* Mini game area */
#mini-game-area {
  margin-top: 10px; text-align: center; width: 440px; max-width: 95vw;
}
#mini-game-area h3 {
  color: #c44dff; margin-bottom: 8px; font-size: 1.1rem;
  font-family: 'Fredoka One', cursive;
}
#mini-game-info { color: #8a8aaa; font-size: 0.85rem; margin-bottom: 10px; }
#mini-canvas {
  border: 2px solid #3a2a6e;
  border-radius: 12px;
  background: #0d0d2b;
  cursor: crosshair;
  width: 420px; height: 300px;
  display: block; margin: 0 auto;
  max-width: 95vw;
}
#mini-score { color: #6bbaff; margin-top: 8px; font-size: 1rem; }
#mini-bonus { color: #ffda6b; margin-top: 4px; font-size: 0.85rem; }
/* Quiz / typing mini-game UI */
#mini-ui {
  display: none; width: 100%;
}
#mini-question {
  font-size: 1.3rem; color: #fff; margin: 12px 0 10px;
  font-weight: 700; min-height: 40px;
}
.mini-answers {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin: 0 auto; max-width: 380px;
}
.mini-ans-btn {
  padding: 12px 8px; border-radius: 10px; border: 2px solid #3a2a6e;
  background: rgba(255,255,255,0.05); color: #e0e0e0;
  font-size: 0.95rem; font-weight: 700; cursor: pointer;
  transition: all 0.15s;
}
.mini-ans-btn:hover { background: rgba(196,77,255,0.2); border-color: #c44dff; }
.mini-ans-btn.correct { background: rgba(0,200,80,0.3); border-color: #00c850; color: #00ff64; }
.mini-ans-btn.wrong { background: rgba(200,0,0,0.3); border-color: #c80000; color: #ff4444; }
#mini-typing-input {
  display: none; width: 80%; max-width: 300px;
  padding: 10px 16px; border-radius: 10px;
  border: 2px solid #3a2a6e; background: #0d0d2b;
  color: #fff; font-size: 1.1rem; text-align: center;
  outline: none; margin: 0 auto;
  font-family: 'Nunito', sans-serif;
}
#mini-typing-input:focus { border-color: #c44dff; }
#mini-typing-word {
  font-size: 1.8rem; color: #c44dff; margin: 10px 0;
  font-family: 'Fredoka One', cursive; letter-spacing: 2px;
  display: none;
}
#mini-streak {
  color: #ff6b9d; font-size: 0.85rem; margin-top: 4px;
  display: none;
}

/* ===== MAIN GAME ===== */
#game-container {
  display: none;
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

/* Header */
#header {
  text-align: center;
  padding: 20px 0;
}
#header h1 {
  font-family: 'Fredoka One', cursive;
  font-size: 2.2rem;
  background: linear-gradient(90deg, #ff6b9d, #c44dff, #6bbaff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

/* Stats bar */
#stats-bar {
  display: flex; justify-content: space-around; flex-wrap: wrap;
  background: rgba(255,255,255,0.05);
  border-radius: 16px; padding: 15px;
  margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.08);
}
.stat-box {
  text-align: center; padding: 8px 16px;
}
.stat-label { font-size: 0.75rem; color: #8a8aaa; text-transform: uppercase; letter-spacing: 1px; }
.stat-value { font-size: 1.4rem; font-weight: 700; color: #fff; }
.stat-value.gold { color: #ffd700; }
.stat-value.level { color: #c44dff; }
.stat-value.drinks { color: #6bbaff; }

/* Drink button */
#drink-section {
  text-align: center;
  margin-bottom: 25px;
}
#drink-btn {
  width: 160px; height: 160px;
  border-radius: 50%;
  border: 4px solid #c44dff;
  background: radial-gradient(circle at 35% 35%, #6b3fa0, #2d1b69);
  color: white;
  font-size: 3rem;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 0 30px rgba(196,77,255,0.3), inset 0 -4px 10px rgba(0,0,0,0.3);
  position: relative;
}
#drink-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 50px rgba(196,77,255,0.5), inset 0 -4px 10px rgba(0,0,0,0.3);
}
#drink-btn:active { transform: scale(0.95); }
#drink-btn .label {
  display: block; font-size: 0.8rem; margin-top: 4px;
  font-family: 'Nunito', sans-serif;
}
#per-click-info { color: #8a8aaa; font-size: 0.85rem; margin-top: 8px; }
#per-sec-info { color: #6bbaff; font-size: 0.85rem; }

/* Floating numbers */
.float-num {
  position: fixed;
  font-weight: 700; font-size: 1.2rem;
  color: #ffd700;
  pointer-events: none;
  animation: floatUp 1s ease-out forwards;
  z-index: 100;
  text-shadow: 0 0 6px rgba(255,215,0,0.5);
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
}

/* Tabs */
#tabs {
  display: flex; gap: 4px; margin-bottom: 15px;
}
.tab-btn {
  flex: 1; padding: 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-bottom: none;
  border-radius: 12px 12px 0 0;
  color: #8a8aaa; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
  font-size: 0.9rem;
}
.tab-btn.active {
  background: rgba(196,77,255,0.15);
  color: #c44dff;
  border-color: rgba(196,77,255,0.3);
}
.tab-btn:hover { color: #fff; }

.tab-panel {
  display: none;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 0 0 16px 16px;
  padding: 15px;
}
.tab-panel.active { display: block; }

/* Upgrade / Sell cards */
.card {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 12px;
  padding: 14px 18px;
  margin-bottom: 10px;
  transition: all 0.2s;
}
.card:hover { background: rgba(255,255,255,0.07); }
.card-left { flex: 1; }
.card-name { font-weight: 700; font-size: 1rem; color: #e0e0e0; }
.card-desc { font-size: 0.8rem; color: #8a8aaa; margin-top: 2px; }
.card-owned { font-size: 0.75rem; color: #6bbaff; margin-top: 2px; }
.card-btn {
  padding: 8px 20px;
  border-radius: 8px; border: none;
  font-weight: 700; cursor: pointer;
  transition: all 0.2s;
  font-size: 0.85rem;
}
.card-btn.buy {
  background: linear-gradient(135deg, #c44dff, #8b2fc9);
  color: #fff;
}
.card-btn.buy:hover { transform: scale(1.05); }
.card-btn.buy:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.card-btn.sell {
  background: linear-gradient(135deg, #ffd700, #e6a800);
  color: #1a0a2e;
}
.card-btn.sell:hover { transform: scale(1.05); }
.card-btn.sell:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* Level up */
#level-section {
  text-align: center;
  margin-bottom: 20px;
}
#xp-bar-container {
  width: 100%; height: 14px;
  background: #1a1a3e; border-radius: 7px;
  overflow: hidden; margin-top: 8px;
  border: 1px solid #3a2a6e;
}
#xp-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #c44dff, #ff6b9d);
  border-radius: 7px;
  transition: width 0.3s;
}
#xp-text { font-size: 0.8rem; color: #8a8aaa; margin-top: 4px; }

/* Drink inventory */
#inventory {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px; margin-top: 10px;
}
.inv-item {
  text-align: center;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 12px;
  padding: 12px 8px;
}
.inv-icon { font-size: 2rem; }
.inv-name { font-size: 0.8rem; color: #c0c0c0; margin-top: 4px; }
.inv-count { font-size: 1.1rem; font-weight: 700; color: #6bbaff; }
.inv-item.special {
  border-color: rgba(255,215,0,0.3);
  background: rgba(255,215,0,0.06);
  box-shadow: 0 0 12px rgba(255,215,0,0.1);
}
.inv-item.special .inv-name { color: #ffd700; }
.inv-recipe { font-size: 0.65rem; color: #e6a800; margin-top: 3px; line-height: 1.3; }
.inv-ingredients { display: flex; justify-content: center; gap: 2px; margin-top: 4px; font-size: 1rem; }
.card.special-card {
  border-color: rgba(255,215,0,0.3);
  background: rgba(255,215,0,0.05);
}

/* Workers area */
#workers-section {
  margin-bottom: 20px;
}
#workers-section h3 {
  text-align: center; color: #c44dff; margin-bottom: 10px;
  font-family: 'Fredoka One', cursive; font-size: 1.1rem;
}
#worker-canvas {
  width: 100%; height: 220px;
  display: block;
  background: linear-gradient(180deg, #0d0d2b 0%, #1a1a3e 60%, #2a1a40 100%);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.08);
}
#worker-count-info {
  text-align: center; color: #8a8aaa; font-size: 0.8rem; margin-top: 6px;
}

/* Save buttons */
#save-section {
  text-align: center; margin-top: 20px; padding: 15px;
}
#save-section button {
  padding: 10px 24px; margin: 5px;
  border-radius: 8px; border: none;
  font-weight: 700; cursor: pointer;
  font-size: 0.85rem;
}
#save-btn { background: #2d8a4e; color: #fff; }
#save-btn:hover { background: #36a35c; }
#reset-btn { background: #8a2d2d; color: #fff; }
#reset-btn:hover { background: #a33636; }
#restart-btn { background: linear-gradient(135deg, #c44dff, #6b3fa0); color: #fff; }
#restart-btn:hover { background: linear-gradient(135deg, #d466ff, #8b5fc0); }
#autosave-note { font-size: 0.75rem; color: #5a5a7a; margin-top: 8px; }

/* Toast */
#toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: rgba(196,77,255,0.9); color: #fff;
  padding: 10px 24px; border-radius: 8px;
  font-weight: 700; font-size: 0.9rem;
  opacity: 0; transition: opacity 0.3s;
  pointer-events: none; z-index: 500;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading-screen">
  <h1>SwirlyBrew</h1>
  <p style="color:#a080d0; margin-bottom:20px;">Idle Drink Tycoon</p>
  <div id="loading-bar-container"><div id="loading-bar"></div></div>
  <div id="loading-text">Loading ingredients...</div>
  <div id="mini-game-area">
    <h3 id="mini-title">Loading...</h3>
    <p id="mini-game-info"></p>
    <canvas id="mini-canvas" width="420" height="300"></canvas>
    <div id="mini-ui">
      <div id="mini-question"></div>
      <div class="mini-answers" id="mini-answers"></div>
      <div id="mini-typing-word"></div>
      <input type="text" id="mini-typing-input" autocomplete="off" placeholder="Type here...">
    </div>
    <div id="mini-score">Score: <span id="caught-count">0</span></div>
    <div id="mini-bonus">Bonus gold: <span id="bonus-gold">0</span></div>
    <div id="mini-streak"></div>
  </div>
</div>

<!-- MAIN GAME -->
<div id="game-container">
  <div id="header">
    <h1>SwirlyBrew</h1>
  </div>

  <!-- Level / XP -->
  <div id="level-section">
    <div id="xp-bar-container"><div id="xp-bar"></div></div>
    <div id="xp-text">XP: 0 / 10</div>
  </div>

  <!-- Stats -->
  <div id="stats-bar">
    <div class="stat-box">
      <div class="stat-label">Gold</div>
      <div class="stat-value gold" id="gold-display">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Level</div>
      <div class="stat-value level" id="level-display">1</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Drinks Made</div>
      <div class="stat-value drinks" id="total-drinks-display">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Drinks/sec</div>
      <div class="stat-value" id="dps-display">0</div>
    </div>
  </div>

  <!-- Drink Button -->
  <div id="drink-section">
    <button id="drink-btn">
      <span id="drink-emoji">&#x1F964;</span>
      <span class="label">DRINK!</span>
    </button>
    <div id="per-click-info">+1 drink per click</div>
    <div id="per-sec-info"></div>
  </div>

  <!-- Workers Visual Area -->
  <div id="workers-section">
    <h3>🧑‍🍳 Your Workers</h3>
    <canvas id="worker-canvas" width="860" height="220"></canvas>
    <div id="worker-count-info">No workers yet — hire some below!</div>
  </div>

  <!-- Tabs -->
  <div id="tabs">
    <button class="tab-btn active" data-tab="upgrades">Upgrades</button>
    <button class="tab-btn" data-tab="workers">Hire Workers</button>
    <button class="tab-btn" data-tab="sell">Sell Drinks</button>
    <button class="tab-btn" data-tab="inventory">Inventory</button>
  </div>

  <!-- Upgrades Panel -->
  <div class="tab-panel active" id="tab-upgrades"></div>

  <!-- Workers Panel -->
  <div class="tab-panel" id="tab-workers"></div>

  <!-- Sell Panel -->
  <div class="tab-panel" id="tab-sell"></div>

  <!-- Inventory Panel -->
  <div class="tab-panel" id="tab-inventory">
    <div id="inventory"></div>
  </div>

  <!-- Save -->
  <div id="save-section">
    <button id="save-btn">Save Game</button>
    <button id="restart-btn">Restart (Play Mini-Games)</button>
    <button id="reset-btn">Reset All Progress</button>
    <div id="autosave-note">Auto-saves every 30 seconds</div>
  </div>
</div>

<div id="toast"></div>

// Live worker sprites for animation
let workerSprites = [];

function rebuildWorkerSprites() {
  workerSprites = [];
  const canvas = document.getElementById("worker-canvas");
  if (!canvas) return;
  const W = canvas.width, H = canvas.height;
  for (const wt of WORKER_TYPES) {
    const count = state.workers[wt.id] || 0;
    for (let i = 0; i < count; i++) {
      workerSprites.push({
        type: wt,
        x: 30 + Math.random() * (W - 60),
        y: 80 + Math.random() * (H - 120),
        targetX: 30 + Math.random() * (W - 60),
        targetY: 80 + Math.random() * (H - 120),
        actionTimer: Math.random() * 200,
        actionPhase: "walk", // walk, work, done
        workProgress: 0,
        drinkEmoji: "",
        floats: [],
        facingRight: true,
        bobOffset: Math.random() * Math.PI * 2,
      });
    }
  }
}

function workerCost(wt) {
  const owned = state.workers[wt.id] || 0;
  return Math.floor(wt.baseCost * Math.pow(wt.costMult, owned));
}

function getTotalWorkerDps() {
  let total = 0;
  for (const wt of WORKER_TYPES) {
    const count = state.workers[wt.id] || 0;
    total += wt.dps * count;
  }
  const mult = 1 + (state.level - 1) * 0.1;
  return Math.floor(total * mult);
}

function getTotalWorkerCount() {
  let total = 0;
  for (const wt of WORKER_TYPES) {
    total += state.workers[wt.id] || 0;
  }
  return total;
}

// ====== HELPERS ======
function formatNum(n) {
  if (n >= 1e12) return (n/1e12).toFixed(1) + "T";
  if (n >= 1e9) return (n/1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n/1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n/1e3).toFixed(1) + "K";
  return Math.floor(n).toString();
}

function xpForLevel(lvl) { return Math.floor(10 * Math.pow(1.5, lvl - 1)); }

function upgradeCost(upg) {
  const owned = state.upgrades[upg.id] || 0;
  return Math.floor(upg.baseCost * Math.pow(upg.costMult, owned));
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1500);
}

function recalcStats() {
  let dpc = 1, dps = 0;
  for (const upg of UPGRADES) {
    const owned = state.upgrades[upg.id] || 0;
    if (upg.effect === "click") dpc += upg.value * owned;
    if (upg.effect === "auto") dps += upg.value * owned;
  }
  // Level bonus: +10% per level
  const mult = 1 + (state.level - 1) * 0.1;
  state.drinksPerClick = Math.floor(dpc * mult);
  state.drinksPerSec = Math.floor((dps + getTotalWorkerDps() / (1 + (state.level - 1) * 0.1)) * mult);
}

// ====== DRINK PRODUCTION ======
function produceDrink(amount) {
  state.totalDrinks += amount;
  state.xp += amount;
  // Distribute into drink types based on level
  const available = DRINK_TYPES.filter(d => state.level >= d.minLevel);
  const chosen = available[Math.floor(Math.random() * available.length)];
  state.drinkInventory[chosen.name] = (state.drinkInventory[chosen.name] || 0) + amount;
  checkLevelUp();
}

function checkLevelUp() {
  const needed = xpForLevel(state.level);
  while (state.xp >= needed) {
    state.xp -= xpForLevel(state.level);
    state.level++;
    recalcStats();
    toast("Level Up! Now level " + state.level + "!");
    const avail = DRINK_TYPES.filter(d => state.level >= d.minLevel);
    const newest = avail[avail.length - 1];
    if (state.level === newest.minLevel) {
      toast("New drink unlocked: " + newest.icon + " " + newest.name + "!");
    }
  }
}

// ====== RENDER ======
function render() {
  document.getElementById("gold-display").textContent = formatNum(state.gold);
  document.getElementById("level-display").textContent = state.level;
  document.getElementById("total-drinks-display").textContent = formatNum(state.totalDrinks);
  document.getElementById("dps-display").textContent = formatNum(state.drinksPerSec);
  document.getElementById("per-click-info").textContent = "+" + formatNum(state.drinksPerClick) + " drink" + (state.drinksPerClick > 1 ? "s" : "") + " per click";
  document.getElementById("per-sec-info").textContent = state.drinksPerSec > 0 ? formatNum(state.drinksPerSec) + " drinks/sec (auto)" : "";

  const needed = xpForLevel(state.level);
  document.getElementById("xp-bar").style.width = (state.xp / needed * 100) + "%";
  document.getElementById("xp-text").textContent = "XP: " + formatNum(state.xp) + " / " + formatNum(needed);

  // Change drink emoji based on level
  const avail = DRINK_TYPES.filter(d => state.level >= d.minLevel);
  document.getElementById("drink-emoji").textContent = avail[avail.length - 1].icon;

  renderUpgrades();
  renderWorkerCards();
  renderSell();
  renderInventory();

  // Worker count info
  const wc = getTotalWorkerCount();
  const wdps = getTotalWorkerDps();
  const wInfo = document.getElementById("worker-count-info");
  if (wInfo) {
    wInfo.textContent = wc === 0 ? "No workers yet — hire some below!" :
      wc + " worker" + (wc > 1 ? "s" : "") + " making " + formatNum(wdps) + " drinks/sec";
  }
}

function renderUpgrades() {
  const panel = document.getElementById("tab-upgrades");
  panel.innerHTML = "";
  for (const upg of UPGRADES) {
    const owned = state.upgrades[upg.id] || 0;
    const cost = upgradeCost(upg);
    const canBuy = state.gold >= cost;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-left">
        <div class="card-name">${upg.name}</div>
        <div class="card-desc">${upg.desc}</div>
        <div class="card-owned">Owned: ${owned} | Cost: ${formatNum(cost)} gold</div>
      </div>
      <button class="card-btn buy" ${canBuy ? "" : "disabled"} data-upg="${upg.id}">Buy</button>
    `;
    panel.appendChild(card);
  }
  panel.querySelectorAll(".card-btn.buy").forEach(btn => {
    btn.addEventListener("click", () => buyUpgrade(btn.dataset.upg));
  });
}

function renderSell() {
  const panel = document.getElementById("tab-sell");
  panel.innerHTML = "";
  for (const item of SELL_ITEMS) {
    if (state.level < item.minLevel) continue;
    const canSell = state.totalDrinks >= item.drinkCost;
    const card = document.createElement("div");
    card.className = "card" + (item.special ? " special-card" : "");
    const specialLabel = item.special ? `<div style="font-size:0.7rem;color:#ffd700;margin-top:2px;">\uD83C\uDF51 Peaches + \uD83E\uDD6D Mango + \uD83C\uDF48 Cantaloupe + \uD83D\uDCA7 Water</div>` : "";

      <div class="card-left">
        <div class="card-name">${item.icon} ${item.name}${item.special ? " \u2B50" : ""}</div>
        <div class="card-desc">Trade ${formatNum(item.drinkCost)} drinks for ${formatNum(item.gold)} gold</div>

      </div>
      <button class="card-btn sell" ${canSell ? "" : "disabled"} data-sell="${item.id}">Sell</button>
    `;
    panel.appendChild(card);
  }
  panel.querySelectorAll(".card-btn.sell").forEach(btn => {
    btn.addEventListener("click", () => sellDrink(btn.dataset.sell));
  });
}

// ====== WORKER CANVAS ANIMATION ======
function startWorkerAnimation() {
  const canvas = document.getElementById("worker-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  const drinkIcons = ["\uD83D\uDCA7","\uD83C\uDF4B","\uD83E\uDDC3","\uD83E\uDD64","\uD83C\uDF53","\uD83E\uDD5B","\uD83C\uDF75","\u2615","\uD83E\uDDCB"];

  // Floor tiles
  function drawFloor() {
    // Counter / bar
    ctx.fillStyle = "#2a1a40";
    ctx.fillRect(0, H - 40, W, 40);
    ctx.fillStyle = "#3a2a55";
    ctx.fillRect(0, H - 42, W, 4);
    // Shelves
    for (let i = 0; i < 4; i++) {
      const sx = 60 + i * 220;
      ctx.fillStyle = "rgba(255,255,255,0.04)";
      ctx.fillRect(sx, 10, 140, 50);
      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.strokeRect(sx, 10, 140, 50);
      // Bottles on shelf
      ctx.font = "20px serif";
      ctx.fillText("\uD83C\uDF76", sx + 15, 42);
      ctx.fillText("\uD83E\uDDEA", sx + 50, 42);
      ctx.fillText("\uD83C\uDF7E", sx + 85, 42);
      ctx.fillText("\uD83E\uDD64", sx + 115, 42);
    }
  }

  function animateWorkers() {
    ctx.clearRect(0, 0, W, H);

    // Background gradient
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#0d0d2b");
    bg.addColorStop(0.6, "#1a1a3e");
    bg.addColorStop(1, "#2a1a40");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawFloor();

    if (workerSprites.length === 0) {
      ctx.fillStyle = "rgba(255,255,255,0.2)";
      ctx.font = "16px Nunito, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Hire workers to see them making drinks!", W / 2, H / 2);
      ctx.textAlign = "start";
    }

    const time = Date.now() / 1000;

    for (const w of workerSprites) {
      w.actionTimer--;

      if (w.actionPhase === "walk") {
        // Move toward target
        const dx = w.targetX - w.x;
        const dy = w.targetY - w.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 3) {
          w.x += (dx / dist) * w.type.speed * 1.5;
          w.y += (dy / dist) * w.type.speed * 1.5;
          w.facingRight = dx > 0;
        } else {
          w.actionPhase = "work";
          w.workProgress = 0;
          w.drinkEmoji = drinkIcons[Math.floor(Math.random() * drinkIcons.length)];
          w.actionTimer = 120 + Math.random() * 80;
        }
      } else if (w.actionPhase === "work") {
        w.workProgress = Math.min(1, w.workProgress + 0.008 * w.type.speed);
        if (w.actionTimer <= 0) {
          w.actionPhase = "done";
          w.actionTimer = 60;
          // Float a drink icon up
          w.floats.push({ emoji: w.drinkEmoji, y: 0, alpha: 1 });
        }
      } else if (w.actionPhase === "done") {
        if (w.actionTimer <= 0) {
          w.actionPhase = "walk";
          w.targetX = 30 + Math.random() * (W - 60);
          w.targetY = 80 + Math.random() * (H - 120);
          w.actionTimer = 100;
        }
      }

      // Bob animation
      const bob = Math.sin(time * 3 + w.bobOffset) * 3;

      // Shadow
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.beginPath();
      ctx.ellipse(w.x, w.y + 18, 14, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Worker emoji
      ctx.save();
      ctx.font = "30px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (!w.facingRight) {
        ctx.scale(-1, 1);
        ctx.fillText(w.type.emoji, -w.x, w.y + bob);
      } else {
        ctx.fillText(w.type.emoji, w.x, w.y + bob);
      }
      ctx.restore();

      // Name tag
      ctx.fillStyle = w.type.color;
      ctx.font = "bold 9px Nunito, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(w.type.name, w.x, w.y + 28);

      // Work progress bar
      if (w.actionPhase === "work") {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(w.x - 16, w.y - 26, 32, 6);
        ctx.fillStyle = w.type.color;
        ctx.fillRect(w.x - 16, w.y - 26, 32 * w.workProgress, 6);
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.strokeRect(w.x - 16, w.y - 26, 32, 6);

        // Shaking animation while working
        const shake = Math.sin(time * 15) * 2;
        ctx.font = "16px serif";
        ctx.fillText(w.drinkEmoji, w.x + shake, w.y - 34);
      }

      // Float completed drinks upward
      for (const f of w.floats) {
        f.y -= 1.2;
        f.alpha -= 0.015;
        if (f.alpha > 0) {
          ctx.globalAlpha = f.alpha;
          ctx.font = "20px serif";
          ctx.fillText(f.emoji, w.x, w.y - 40 + f.y);
          ctx.fillStyle = `rgba(255,215,0,${f.alpha})`;
          ctx.font = "bold 11px Nunito, sans-serif";
          ctx.fillText("+" + w.type.dps, w.x + 14, w.y - 38 + f.y);
          ctx.globalAlpha = 1;
        }
      }
      w.floats = w.floats.filter(f => f.alpha > 0);
    }

    requestAnimationFrame(animateWorkers);
  }

  animateWorkers();
}

// ====== ACTIONS ======
function buyUpgrade(id) {
  const upg = UPGRADES.find(u => u.id === id);
  const cost = upgradeCost(upg);
  if (state.gold < cost) return;
  state.gold -= cost;
  state.upgrades[upg.id] = (state.upgrades[upg.id] || 0) + 1;
  recalcStats();
  render();
  toast("Bought " + upg.name + "!");
}

function hireWorker(id) {
  const wt = WORKER_TYPES.find(w => w.id === id);
  const cost = workerCost(wt);
  if (state.gold < cost) return;
  state.gold -= cost;
  state.workers[wt.id] = (state.workers[wt.id] || 0) + 1;
  recalcStats();
  rebuildWorkerSprites();
  render();
  toast("Hired " + wt.emoji + " " + wt.name + "!");
}

function sellDrink(id) {
  const item = SELL_ITEMS.find(s => s.id === id);
  if (state.totalDrinks < item.drinkCost) return;
  state.totalDrinks -= item.drinkCost;
  // Remove from inventory proportionally
  let toRemove = item.drinkCost;
  for (const key of Object.keys(state.drinkInventory)) {
    if (toRemove <= 0) break;
    const has = state.drinkInventory[key];
    const take = Math.min(has, toRemove);
    state.drinkInventory[key] -= take;
    toRemove -= take;
  }
  state.gold += item.gold;
  render();
  toast("+" + formatNum(item.gold) + " gold!");
}

// Float number on click

// ====== SAVE / LOAD ======
function saveGame() {
  localStorage.setItem("swirlyBrew_save", JSON.stringify(state));
  toast("Game saved!");
}

function loadGame() {
  const raw = localStorage.getItem("swirlyBrew_save");
  if (raw) {
    const loaded = JSON.parse(raw);
    state = { ...JSON.parse(JSON.stringify(DEFAULT_STATE)), ...loaded };
    recalcStats();
    return true;
  }
  return false;
}

function resetGame() {
  if (confirm("Are you sure? All progress will be lost!")) {
    localStorage.removeItem("swirlyBrew_save");
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    recalcStats();
    render();
    toast("Game reset!");
  }
}

// --- MINI-GAME 1: Catch the Drops (drink themed) ---
function initCatchDrops() {
  const canvas = document.getElementById("mini-canvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const dropEmojis = ["\uD83D\uDCA7", "\uD83E\uDD64", "\uD83C\uDF4B", "\u2615", "\uD83E\uDDCB", "\uD83C\uDF51"];
  let drops = [], pops = [];

  document.getElementById("mini-title").textContent = "Catch the Drops!";
  document.getElementById("mini-game-info").textContent = "Click falling drinks for bonus gold!";
  canvas.style.display = "block";
  document.getElementById("mini-ui").style.display = "none";

  function spawnDrop() {
    if (!miniRunning) return;
    drops.push({
      x: Math.random() * (W - 60) + 30, y: -30,
      speed: 1 + Math.random() * 1.5,
      emoji: dropEmojis[Math.floor(Math.random() * dropEmojis.length)],
      size: 32 + Math.random() * 12, alive: true
    });
    setTimeout(spawnDrop, 500 + Math.random() * 700);
  }

  function getCoords(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left) * W / rect.width, y: (e.clientY - rect.top) * H / rect.height };
  }

  function onClick(e) {
    const { x: mx, y: my } = getCoords(e);
    for (const d of drops) {
      if (!d.alive) continue;
      if (Math.hypot(mx - d.x, my - d.y) < d.size + 10) {
        d.alive = false;
        miniScore++;
        pops.push({ x: d.x, y: d.y, radius: 5, alpha: 1 });
        document.getElementById("caught-count").textContent = miniScore;
        document.getElementById("bonus-gold").textContent = miniScore * 5;
        break;
      }
    }
  }
  canvas.addEventListener("click", onClick);

  const stars = Array.from({length: 40}, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: 0.5 + Math.random() * 1.5, b: 0.2 + Math.random() * 0.5
  }));

  function draw() {
    if (!miniRunning) return;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0d0d2b"; ctx.fillRect(0, 0, W, H);
    for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${s.b})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); }
    for (const d of drops) {
      if (!d.alive) continue;
      d.y += d.speed;
      if (d.y > H + 30) { d.alive = false; continue; }
      ctx.shadowColor = "#6bbaff"; ctx.shadowBlur = 12;
      ctx.font = d.size + "px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(d.emoji, d.x, d.y); ctx.shadowBlur = 0;
    }
    for (const p of pops) {
      p.radius += 3; p.alpha -= 0.05;
      if (p.alpha <= 0) continue;
      ctx.strokeStyle = `rgba(255,215,0,${p.alpha})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = `rgba(255,215,0,${p.alpha})`; ctx.font = "bold 18px Nunito, sans-serif";
      ctx.fillText("+5g", p.x, p.y - p.radius - 5);
    }
    pops = pops.filter(p => p.alpha > 0);
    drops = drops.filter(d => d.alive);
    requestAnimationFrame(draw);
  }
  spawnDrop(); draw();
  miniCleanup = () => canvas.removeEventListener("click", onClick);
}

// --- MINI-GAME 2: Math Mixer (educational) ---
function initMathMixer() {
  const canvas = document.getElementById("mini-canvas");
  canvas.style.display = "none";
  const ui = document.getElementById("mini-ui");
  ui.style.display = "block";
  document.getElementById("mini-typing-input").style.display = "none";
  document.getElementById("mini-typing-word").style.display = "none";
  document.getElementById("mini-streak").style.display = "block";
  document.getElementById("mini-title").textContent = "Math Mixer!";
  document.getElementById("mini-game-info").textContent = "Solve math problems to earn gold!";

  let streak = 0;

  function nextQuestion() {
    if (!miniRunning) return;
    const ops = ["+", "-", "*"];
    const op = ops[Math.floor(Math.random() * ops.length)];
    let a, b, answer;
    if (op === "+") { a = Math.floor(Math.random()*50)+1; b = Math.floor(Math.random()*50)+1; answer = a+b; }
    else if (op === "-") { a = Math.floor(Math.random()*50)+10; b = Math.floor(Math.random()*a); answer = a-b; }
    else { a = Math.floor(Math.random()*12)+2; b = Math.floor(Math.random()*12)+2; answer = a*b; }

    document.getElementById("mini-question").textContent = `${a} ${op} ${b} = ?`;

    // Generate wrong answers
    const wrongs = new Set();
    while (wrongs.size < 3) {
      const w = answer + (Math.floor(Math.random()*21) - 10);
      if (w !== answer && w >= 0) wrongs.add(w);
    }
    const choices = [...wrongs, answer].sort(() => Math.random() - 0.5);

    const ansDiv = document.getElementById("mini-answers");
    ansDiv.innerHTML = "";
    choices.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "mini-ans-btn";
      btn.textContent = c;
      btn.addEventListener("click", () => {
        if (c === answer) {
          btn.classList.add("correct");
          miniScore += 2;
          streak++;
          document.getElementById("mini-streak").textContent = "Streak: " + streak + (streak >= 3 ? " (x2 bonus!)" : "");
          if (streak >= 3) miniScore++;
        } else {
          btn.classList.add("wrong");
          ansDiv.querySelector(`.mini-ans-btn:not(.wrong)`);
          // highlight correct
          ansDiv.querySelectorAll(".mini-ans-btn").forEach(b => { if (parseInt(b.textContent) === answer) b.classList.add("correct"); });
          streak = 0;
          document.getElementById("mini-streak").textContent = "Streak: 0";
        }
        document.getElementById("caught-count").textContent = miniScore;
        document.getElementById("bonus-gold").textContent = miniScore * 5;
        setTimeout(nextQuestion, 800);
      });
      ansDiv.appendChild(btn);
    });
  }
  nextQuestion();
  miniCleanup = () => { document.getElementById("mini-ui").style.display = "none"; };
}

    return { x: (e.clientX-rect.left)*W/rect.width, y: (e.clientY-rect.top)*H/rect.height };

  function onClick(e) {
    if (!miniRunning) return;
    const {x, y} = getCoords(e);
    const slotW = W / slots.length;
    if (y < 80 || y > 240) return;

      miniScore += 2;
      document.getElementById("caught-count").textContent = miniScore;
      document.getElementById("bonus-gold").textContent = miniScore * 5;
    }
    newRound();
  }
  canvas.addEventListener("click", onClick);

  newRound();

  function draw() {
    if (!miniRunning) return;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0d0d2b"; ctx.fillRect(0, 0, W, H);

    // Target color bar
    ctx.fillStyle = drinkColors[targetIdx].color;
    ctx.fillRect(W/2 - 80, 15, 160, 40);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.strokeRect(W/2 - 80, 15, 160, 40);

    ctx.textAlign = "center"; ctx.textBaseline = "middle";

    for (let i = 0; i < slots.length; i++) {
      const s = slots[i];
      const cx = slotW * i + slotW/2;
      // Background card
      ctx.fillStyle = "rgba(255,255,255,0.06)";
      ctx.fillRect(slotW*i + 10, 90, slotW - 20, 140);
      ctx.strokeStyle = "rgba(255,255,255,0.15)";
      ctx.strokeRect(slotW*i + 10, 90, slotW - 20, 140);
      // Color swatch
      ctx.fillStyle = s.color;
      ctx.fillRect(cx - 25, 100, 50, 35);

      ctx.font = "36px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";

  miniCleanup = () => canvas.removeEventListener("click", onClick);

function initBubblePop() {
  const canvas = document.getElementById("mini-canvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  canvas.style.display = "block";
  document.getElementById("mini-ui").style.display = "none";
  document.getElementById("mini-title").textContent = "Bubble Pop!";
  document.getElementById("mini-game-info").textContent = "Pop the bubbles before they float away!";

  let bubbles = [];
  function spawnBubble() {
    if (!miniRunning) return;
    const hue = Math.floor(Math.random()*360);
    bubbles.push({
      x: Math.random()*(W-60)+30, y: H+30,
      speed: 0.5+Math.random()*1.5, r: 18+Math.random()*20,
      hue, alive: true, wobble: Math.random()*Math.PI*2
    });
    setTimeout(spawnBubble, 400+Math.random()*500);
  }
  function getCoords(e) {
    const rect = canvas.getBoundingClientRect();
    return { x:(e.clientX-rect.left)*W/rect.width, y:(e.clientY-rect.top)*H/rect.height };
  }
  let pops = [];
  function onClick(e) {
    const {x,y} = getCoords(e);
    for (const b of bubbles) {
      if (!b.alive) continue;
      if (Math.hypot(x-b.x,y-b.y) < b.r+5) {
        b.alive = false; miniScore += 2;
        pops.push({x:b.x,y:b.y,alpha:1,r:b.r});
        document.getElementById("caught-count").textContent = miniScore;
        document.getElementById("bonus-gold").textContent = miniScore*5;
        break;
      }
    }
  }
  canvas.addEventListener("click", onClick);
  spawnBubble();
  function draw() {
    if (!miniRunning) return;
    ctx.clearRect(0,0,W,H);
    const bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,"#0a1628"); bg.addColorStop(1,"#1a2a4e");
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
    const t = Date.now()/1000;
    for (const b of bubbles) {
      if (!b.alive) continue;
      b.y -= b.speed;
      b.x += Math.sin(t*2+b.wobble)*0.5;
      if (b.y < -40) { b.alive = false; continue; }
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.fillStyle = `hsla(${b.hue},70%,65%,0.35)`;
      ctx.fill();
      ctx.strokeStyle = `hsla(${b.hue},80%,75%,0.8)`;
      ctx.lineWidth = 2; ctx.stroke();
      // shine
      ctx.beginPath(); ctx.arc(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.2,0,Math.PI*2);
      ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.fill();
    }
    for (const p of pops) {
      p.alpha -= 0.04; p.r += 2;
      if (p.alpha > 0) {
        ctx.strokeStyle = `rgba(255,255,255,${p.alpha})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle = `rgba(255,215,0,${p.alpha})`; ctx.font = "bold 16px Nunito";
        ctx.textAlign = "center"; ctx.fillText("+2",p.x,p.y);
      }
    }
    pops = pops.filter(p=>p.alpha>0);
    bubbles = bubbles.filter(b=>b.alive);
    requestAnimationFrame(draw);
  }
  draw();
  miniCleanup = () => canvas.removeEventListener("click", onClick);
}

// --- MINI-GAME 8: Reaction Time (fun) ---
function initReactionTime() {
  const canvas = document.getElementById("mini-canvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  canvas.style.display = "block";
  document.getElementById("mini-ui").style.display = "none";
  document.getElementById("mini-title").textContent = "Reaction Time!";
  document.getElementById("mini-game-info").textContent = "Click the circle the instant it turns GREEN!";

  let phase = "wait"; // wait, ready, go, result
  let goTime = 0, timer = null, clickTime = 0;
  let circleColor = "#333";
  let resultText = "";
  let rounds = 0;

  function startRound() {
    if (!miniRunning) return;
    phase = "wait"; circleColor = "#8a2d2d"; resultText = "Wait for green...";
    const delay = 1500 + Math.random()*3000;
    timer = setTimeout(() => {
      if (!miniRunning) return;
      phase = "go"; circleColor = "#2d8a4e"; goTime = Date.now();
      resultText = "CLICK NOW!";
    }, delay);
  }

  function onClick(e) {
    if (!miniRunning) return;
    if (phase === "go") {
      clickTime = Date.now() - goTime;
      phase = "result";
      if (clickTime < 300) { miniScore += 5; resultText = clickTime+"ms - Amazing! +5"; }
      else if (clickTime < 500) { miniScore += 3; resultText = clickTime+"ms - Good! +3"; }
      else { miniScore += 1; resultText = clickTime+"ms - +1"; }
      document.getElementById("caught-count").textContent = miniScore;
      document.getElementById("bonus-gold").textContent = miniScore*5;
      rounds++;
      setTimeout(startRound, 1200);
    } else if (phase === "wait") {
      resultText = "Too early! Wait for green!";
      clearTimeout(timer);
      circleColor = "#8a8a2d";
      setTimeout(startRound, 1000);
    }
  }
  canvas.addEventListener("click", onClick);

  function draw() {
    if (!miniRunning) return;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "#0d0d2b"; ctx.fillRect(0,0,W,H);
    // Circle
    ctx.beginPath(); ctx.arc(W/2,H/2-10,70,0,Math.PI*2);
    ctx.fillStyle = circleColor; ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
    // Text
    ctx.fillStyle = "#fff"; ctx.font = "bold 18px Nunito, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(resultText, W/2, H/2+80);
    ctx.fillStyle = "#8a8aaa"; ctx.font = "14px Nunito";
    ctx.fillText("Round "+(rounds+1), W/2, 25);
    requestAnimationFrame(draw);
  }
  startRound(); draw();
  miniCleanup = () => { canvas.removeEventListener("click", onClick); clearTimeout(timer); };
}

// --- MINI-GAME 9: Memory Match (educational) ---
function initMemoryMatch() {
  const canvas = document.getElementById("mini-canvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  canvas.style.display = "block";
  document.getElementById("mini-ui").style.display = "none";
  document.getElementById("mini-title").textContent = "Memory Match!";
  document.getElementById("mini-game-info").textContent = "Find matching drink pairs!";

  const icons = ["\uD83C\uDF4B","\uD83D\uDCA7","\u2615","\uD83E\uDD64","\uD83C\uDF51","\uD83C\uDF53","\uD83E\uDD5B","\uD83E\uDDCB"];
  const pick = icons.slice(0,6);
  let cards = [...pick,...pick].sort(()=>Math.random()-0.5).map((emoji,i)=>({
    emoji, flipped:false, matched:false,
    x: (i%4)*100+30, y: Math.floor(i/4)*100+30, w:80, h:80
  }));
  let first = null, locked = false;

  function getCoords(e) {
    const rect = canvas.getBoundingClientRect();
    return { x:(e.clientX-rect.left)*W/rect.width, y:(e.clientY-rect.top)*H/rect.height };
  }
  function onClick(e) {
    if (!miniRunning || locked) return;
    const {x,y} = getCoords(e);
    for (const c of cards) {
      if (c.matched || c.flipped) continue;
      if (x>c.x && x<c.x+c.w && y>c.y && y<c.y+c.h) {
        c.flipped = true;
        if (!first) { first = c; }
        else {
          locked = true;
          if (first.emoji === c.emoji) {
            first.matched = true; c.matched = true;
            miniScore += 4;
            document.getElementById("caught-count").textContent = miniScore;
            document.getElementById("bonus-gold").textContent = miniScore*5;
            first = null; locked = false;
            // Check if all matched -> reshuffle
            if (cards.every(c=>c.matched)) {
              setTimeout(()=>{
                cards = [...pick,...pick].sort(()=>Math.random()-0.5).map((emoji,i)=>({
                  emoji, flipped:false, matched:false,
                  x:(i%4)*100+30, y:Math.floor(i/4)*100+30, w:80, h:80
                }));
              }, 600);
            }
          } else {
            setTimeout(()=>{ first.flipped=false; c.flipped=false; first=null; locked=false; }, 700);
          }
        }
        break;
      }
    }
  }
  canvas.addEventListener("click", onClick);

  function draw() {
    if (!miniRunning) return;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "#0d0d2b"; ctx.fillRect(0,0,W,H);
    for (const c of cards) {
      if (c.matched) {
        ctx.fillStyle = "rgba(0,200,80,0.15)";
        ctx.fillRect(c.x,c.y,c.w,c.h);
        ctx.strokeStyle = "rgba(0,200,80,0.3)"; ctx.lineWidth=2; ctx.strokeRect(c.x,c.y,c.w,c.h);
        ctx.font = "36px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(c.emoji, c.x+c.w/2, c.y+c.h/2);
      } else if (c.flipped) {
        ctx.fillStyle = "rgba(196,77,255,0.15)";
        ctx.fillRect(c.x,c.y,c.w,c.h);
        ctx.strokeStyle = "#c44dff"; ctx.lineWidth=2; ctx.strokeRect(c.x,c.y,c.w,c.h);
        ctx.font = "36px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(c.emoji, c.x+c.w/2, c.y+c.h/2);
      } else {
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.fillRect(c.x,c.y,c.w,c.h);
        ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth=2; ctx.strokeRect(c.x,c.y,c.w,c.h);
        ctx.fillStyle = "#555"; ctx.font = "bold 28px Nunito"; ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText("?", c.x+c.w/2, c.y+c.h/2);
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
  miniCleanup = () => canvas.removeEventListener("click", onClick);
}

// --- MINI-GAME 10: Ingredient Catcher (drink themed) ---
function initIngredientCatcher() {
  const canvas = document.getElementById("mini-canvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  canvas.style.display = "block";
  document.getElementById("mini-ui").style.display = "none";
  document.getElementById("mini-title").textContent = "Ingredient Catcher!";
  document.getElementById("mini-game-info").textContent = "Move the cup to catch falling ingredients! (move mouse/touch)";

  let cupX = W/2, cupW = 60;
  let items = [], pops = [];
  const good = ["\uD83C\uDF51","\uD83E\uDD6D","\uD83C\uDF4B","\uD83C\uDF53","\uD83E\uDD5D","\uD83C\uDF48"];
  const bad = ["\uD83D\uDCA3","\u2620\uFE0F","\uD83E\uDD6C"];

  function spawnItem() {
    if (!miniRunning) return;
    const isGood = Math.random() > 0.25;
    const pool = isGood ? good : bad;
    items.push({
      x: Math.random()*(W-40)+20, y:-30,
      speed: 1.5+Math.random()*2,
      emoji: pool[Math.floor(Math.random()*pool.length)],
      good: isGood, alive: true
    });
    setTimeout(spawnItem, 500+Math.random()*600);
  }

  function onMove(e) {
    const rect = canvas.getBoundingClientRect();
    cupX = (e.clientX-rect.left)*W/rect.width;
    cupX = Math.max(cupW/2, Math.min(W-cupW/2, cupX));
  }
  function onTouch(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    cupX = (e.touches[0].clientX-rect.left)*W/rect.width;
    cupX = Math.max(cupW/2, Math.min(W-cupW/2, cupX));
  }
  canvas.addEventListener("mousemove", onMove);
  canvas.addEventListener("touchmove", onTouch, {passive:false});

  spawnItem();
  function draw() {
    if (!miniRunning) return;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "#0d0d2b"; ctx.fillRect(0,0,W,H);

    // Cup
    ctx.fillStyle = "#3a2a6e";
    ctx.beginPath();
    ctx.moveTo(cupX-cupW/2, H-50); ctx.lineTo(cupX+cupW/2, H-50);
    ctx.lineTo(cupX+cupW/2-8, H-15); ctx.lineTo(cupX-cupW/2+8, H-15);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#c44dff"; ctx.lineWidth=2; ctx.stroke();
    ctx.font = "12px Nunito"; ctx.fillStyle="#c44dff"; ctx.textAlign="center";
    ctx.fillText("CUP",cupX,H-28);

    for (const it of items) {
      if (!it.alive) continue;
      it.y += it.speed;
      // Check catch
      if (it.y > H-55 && it.y < H-10 && Math.abs(it.x-cupX) < cupW/2+10) {
        it.alive = false;
        if (it.good) {
          miniScore += 2;
          pops.push({x:it.x,y:it.y,text:"+2",color:"#00ff64",alpha:1});
        } else {
          miniScore = Math.max(0, miniScore-3);
          pops.push({x:it.x,y:it.y,text:"-3!",color:"#ff4444",alpha:1});
        }
        document.getElementById("caught-count").textContent = miniScore;
        document.getElementById("bonus-gold").textContent = miniScore*5;
        continue;
      }
      if (it.y > H+30) { it.alive = false; continue; }
      ctx.font = "28px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(it.emoji, it.x, it.y);
    }
    for (const p of pops) {
      p.alpha -= 0.03; p.y -= 1.5;
      if (p.alpha > 0) {
        ctx.fillStyle = p.color.replace(")", `,${p.alpha})`).replace("rgb","rgba");
        ctx.globalAlpha = p.alpha;
        ctx.font = "bold 18px Nunito"; ctx.textAlign="center";
        ctx.fillText(p.text, p.x, p.y);
        ctx.globalAlpha = 1;
      }
    }
    pops = pops.filter(p=>p.alpha>0);
    items = items.filter(i=>i.alive);
    requestAnimationFrame(draw);
  }
  draw();
  miniCleanup = () => { canvas.removeEventListener("mousemove",onMove); canvas.removeEventListener("touchmove",onTouch); };
}

// --- MINI-GAME 11: Snake Juice ---
function initSnakeJuice() {
  const canvas = document.getElementById("mini-canvas"); const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height; canvas.style.display = "block";
  document.getElementById("mini-ui").style.display = "none";
  document.getElementById("mini-title").textContent = "Snake Juice!";
  document.getElementById("mini-game-info").textContent = "Arrow keys or WASD to collect drinks!";
  const G = 20, cols = Math.floor(W/G), rows = Math.floor(H/G);
  let snake = [{x:Math.floor(cols/2),y:Math.floor(rows/2)}], dir={x:1,y:0}, food={x:5,y:5}, alive=true;
  function placeFood() { food = {x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}; }
  placeFood();
  function onKey(e) {
    if(e.key==="ArrowUp"||e.key==="w") dir={x:0,y:-1};
    if(e.key==="ArrowDown"||e.key==="s") dir={x:0,y:1};
    if(e.key==="ArrowLeft"||e.key==="a") dir={x:-1,y:0};
    if(e.key==="ArrowRight"||e.key==="d") dir={x:1,y:0};
  }
  document.addEventListener("keydown", onKey);
  let tick = 0;
  function draw() {
    if (!miniRunning) return;
    tick++;
    ctx.fillStyle="#0d0d2b"; ctx.fillRect(0,0,W,H);
    if (alive && tick % 8 === 0) {
      const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
      if(head.x<0||head.x>=cols||head.y<0||head.y>=rows||snake.some(s=>s.x===head.x&&s.y===head.y)) { alive=false; }
      else {
        snake.unshift(head);
        if(head.x===food.x&&head.y===food.y) { miniScore+=2; placeFood(); document.getElementById("caught-count").textContent=miniScore; document.getElementById("bonus-gold").textContent=miniScore*5; }
        else snake.pop();
      }
    }
    // Draw food
    ctx.font = "16px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("\uD83C\uDF51", food.x*G+G/2, food.y*G+G/2);
    // Draw snake
    for(let i=0;i<snake.length;i++) {
      ctx.fillStyle = i===0?"#c44dff":"#6b3fa0";
      ctx.fillRect(snake[i].x*G+1,snake[i].y*G+1,G-2,G-2);
    }
    if(!alive) { ctx.fillStyle="#fff"; ctx.font="bold 24px Nunito"; ctx.fillText("Game Over!",W/2,H/2); }
    requestAnimationFrame(draw);
  }
  draw();
  miniCleanup = () => document.removeEventListener("keydown", onKey);
}

  const bw = W/2-70, bh = H/2-30;
  let sequence=[], playerIdx=0, showing=false, showIdx=0, showTimer=0, flash=-1;
  function addToSeq() { sequence.push(Math.floor(Math.random()*4)); }
  function startShow() { showing=true; showIdx=0; showTimer=30; }
  addToSeq(); setTimeout(()=>startShow(),500);
  function getCoords(e) { const r=canvas.getBoundingClientRect(); return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}; }

}

  let items=[], slices=[], mouseDown=false, trail=[];
  function spawn() { if(!miniRunning) return; items.push({x:Math.random()*W,y:H+30,vx:(Math.random()-0.5)*3,vy:-6-Math.random()*3,emoji:fruits[Math.floor(Math.random()*fruits.length)],alive:true,r:22}); setTimeout(spawn,500+Math.random()*500); }

  function onDown(e) { mouseDown=true; trail=[]; const p=getCoords(e); trail.push(p); checkSlice(p); }
  function onUp() { mouseDown=false; trail=[]; }
  function onMov(e) { if(!mouseDown) return; const p=getCoords(e); trail.push(p); if(trail.length>20) trail.shift(); checkSlice(p); }
  function checkSlice(p) { for(const it of items) { if(it.alive&&Math.hypot(p.x-it.x,p.y-it.y)<it.r+12) { it.alive=false; miniScore+=2; slices.push({x:it.x,y:it.y,alpha:1}); document.getElementById("caught-count").textContent=miniScore; document.getElementById("bonus-gold").textContent=miniScore*5; } } }

  function draw() {

    for(const s of slices) { s.alpha-=0.03; if(s.alpha>0){ctx.globalAlpha=s.alpha;ctx.fillStyle="#ffd700";ctx.font="bold 18px Nunito";ctx.textAlign="center";ctx.fillText("+2",s.x,s.y);ctx.globalAlpha=1;} }
    slices=slices.filter(s=>s.alpha>0); items=items.filter(i=>i.alive||i.y<=H+50);
    requestAnimationFrame(draw);
  }
  draw();
  miniCleanup = () => { canvas.removeEventListener("mousedown",onDown); canvas.removeEventListener("mouseup",onUp); canvas.removeEventListener("mousemove",onMov); };
}

// --- MINI-GAME 29: Maze Runner ---
function initMazeRunner() {
  const canvas = document.getElementById("mini-canvas"); const ctx = canvas.getContext("2d");

  document.getElementById("mini-ui").style.display = "none";

  document.getElementById("mini-game-info").textContent = "Arrow keys/WASD to reach the drink!";
  const G=30, cols=Math.floor(W/G), rows=Math.floor(H/G);
  // Simple random maze using walls
  let walls = new Set();
  for(let i=0;i<cols*rows*0.35;i++){const x=Math.floor(Math.random()*cols),y=Math.floor(Math.random()*rows); if(!(x===1&&y===1))walls.add(x+","+y);}
  let px=1,py=1, goalX=cols-2,goalY=rows-2; walls.delete(goalX+","+goalY);
  function onKey(e) {
    let nx=px,ny=py;
    if(e.key==="ArrowUp"||e.key==="w") ny--;
    if(e.key==="ArrowDown"||e.key==="s") ny++;
    if(e.key==="ArrowLeft"||e.key==="a") nx--;
    if(e.key==="ArrowRight"||e.key==="d") nx++;
    if(nx>=0&&nx<cols&&ny>=0&&ny<rows&&!walls.has(nx+","+ny)){px=nx;py=ny;}
    if(px===goalX&&py===goalY){miniScore+=5;document.getElementById("caught-count").textContent=miniScore;document.getElementById("bonus-gold").textContent=miniScore*5;
      px=1;py=1;walls=new Set();for(let i=0;i<cols*rows*0.35;i++){const x=Math.floor(Math.random()*cols),y=Math.floor(Math.random()*rows);if(!(x===1&&y===1))walls.add(x+","+y);}walls.delete(goalX+","+goalY);}
  }
  document.addEventListener("keydown",onKey);
  function draw() {
    if(!miniRunning) return;
    ctx.fillStyle="#0d0d2b"; ctx.fillRect(0,0,W,H);
    for(const w of walls){const[x,y]=w.split(",").map(Number); ctx.fillStyle="rgba(255,255,255,0.1)"; ctx.fillRect(x*G,y*G,G,G);}
    ctx.font=(G-4)+"px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("\uD83C\uDF51",goalX*G+G/2,goalY*G+G/2);
    ctx.fillText("\uD83C\uDFC3",px*G+G/2,py*G+G/2);
    requestAnimationFrame(draw);
  }
  draw();
  miniCleanup = () => document.removeEventListener("keydown",onKey);
}

// --- MINI-GAME 34: Breakout Brew ---
function initBreakout() {
  const canvas = document.getElementById("mini-canvas"); const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height; canvas.style.display = "block";
  document.getElementById("mini-ui").style.display = "none";
  document.getElementById("mini-title").textContent = "Breakout Brew!";
  document.getElementById("mini-game-info").textContent = "Move mouse to bounce the ball and break blocks!";
  let px=W/2, ball={x:W/2,y:H-40,vx:3,vy:-3};
  const bricks=[]; const bw=50,bh=18; const cols=Math.floor((W-20)/bw);
  const colors=["#ff4444","#ff8844","#ffdd44","#44dd44","#4488ff","#c44dff"];
  for(let r=0;r<4;r++) for(let c=0;c<cols;c++) bricks.push({x:10+c*bw,y:10+r*bh,w:bw-2,h:bh-2,alive:true,color:colors[r]});
  function onMove(e) { const r=canvas.getBoundingClientRect(); px=(e.clientX-r.left)*W/r.width; }
  canvas.addEventListener("mousemove",onMove);
  function draw() {
    if(!miniRunning) return;
    ctx.fillStyle="#0d0d2b"; ctx.fillRect(0,0,W,H);
    // Paddle
    ctx.fillStyle="#c44dff"; ctx.fillRect(px-35,H-18,70,10);
    // Ball
    ball.x+=ball.vx; ball.y+=ball.vy;
    if(ball.x<6||ball.x>W-6) ball.vx*=-1;
    if(ball.y<6) ball.vy*=-1;
    if(ball.y>H-22&&Math.abs(ball.x-px)<40) { ball.vy=-Math.abs(ball.vy); ball.vx+=(ball.x-px)*0.05; }
    if(ball.y>H+20) { ball.x=W/2; ball.y=H-40; ball.vx=3; ball.vy=-3; }
    // Bricks
    for(const b of bricks) {
      if(!b.alive) continue;
      ctx.fillStyle=b.color; ctx.fillRect(b.x,b.y,b.w,b.h);
      if(ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h) { b.alive=false; ball.vy*=-1; miniScore+=1; document.getElementById("caught-count").textContent=miniScore; document.getElementById("bonus-gold").textContent=miniScore*5; }
    }
    ctx.fillStyle="#ffd700"; ctx.beginPath(); ctx.arc(ball.x,ball.y,6,0,Math.PI*2); ctx.fill();
    requestAnimationFrame(draw);
  }
  draw();
  miniCleanup = () => canvas.removeEventListener("mousemove",onMove);
}

// --- MINI-GAME 35: Drink Hangman ---
function initHangman() {
  const canvas = document.getElementById("mini-canvas"); canvas.style.display = "none";
  const ui = document.getElementById("mini-ui"); ui.style.display = "block";
  document.getElementById("mini-typing-input").style.display = "block";
  document.getElementById("mini-typing-word").style.display = "block";
  document.getElementById("mini-streak").style.display = "block";
  document.getElementById("mini-answers").innerHTML = "";
  document.getElementById("mini-title").textContent = "Drink Hangman!";
  document.getElementById("mini-game-info").textContent = "Type letters to guess the drink word!";
  const wordBank = ["smoothie","lemonade","milkshake","espresso","cappuccino","cantaloupe","blueberry","pineapple","watermelon","chocolate"];
  let word="", guessed=new Set(), wrong=0, maxWrong=6;
  const input = document.getElementById("mini-typing-input"); input.value="";

  function newWord() {
    word = wordBank[Math.floor(Math.random()*wordBank.length)];
    guessed = new Set(); wrong = 0;
    updateDisplay();
    input.value=""; input.focus();
  }
  function updateDisplay() {
    const display = word.split("").map(c=>guessed.has(c)?c:"_").join(" ");
    document.getElementById("mini-typing-word").textContent = display;
    document.getElementById("mini-question").textContent = "Wrong: "+wrong+"/"+maxWrong+" | Guessed: "+[...guessed].join(",");
    if(!display.includes("_")) { miniScore+=5; document.getElementById("caught-count").textContent=miniScore; document.getElementById("bonus-gold").textContent=miniScore*5; document.getElementById("mini-streak").textContent="Got it! +5"; setTimeout(newWord,800); }
    else if(wrong>=maxWrong) { document.getElementById("mini-streak").textContent="Word was: "+word; setTimeout(newWord,1200); }
  }
  function onInput() {
    if(!miniRunning) return;
    const letter = input.value.toLowerCase().slice(-1);
    input.value = "";
    if(!letter||!/[a-z]/.test(letter)||guessed.has(letter)) return;
    guessed.add(letter);
    if(!word.includes(letter)) wrong++;
    updateDisplay();
  }
  input.addEventListener("input", onInput);
  newWord();
  miniCleanup = () => { input.removeEventListener("input",onInput); ui.style.display="none"; };
}

function makeQuizGame(title, info, questions) {

      if (!miniRunning) return;

// ====== CANVAS CLICKER HELPER ======
function makeClickerGame(title, info, emojis, spawnRate, points, bg) {
  return function() {
    const canvas = document.getElementById("mini-canvas"); const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height; canvas.style.display = "block";
    document.getElementById("mini-ui").style.display = "none";
    document.getElementById("mini-title").textContent = title;
    document.getElementById("mini-game-info").textContent = info;
    let items = [], pops = [];
    function spawn() { if (!miniRunning) return; items.push({ x: 30 + Math.random() * (W - 60), y: -30, speed: 1 + Math.random() * 2, emoji: emojis[Math.floor(Math.random() * emojis.length)], alive: true, r: 22 }); setTimeout(spawn, spawnRate[0] + Math.random() * spawnRate[1]); }
    function getC(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
    function onClick(e) { const { x, y } = getC(e); for (const it of items) { if (it.alive && Math.hypot(x - it.x, y - it.y) < it.r + 12) { it.alive = false; miniScore += points; pops.push({ x: it.x, y: it.y, alpha: 1 }); document.getElementById("caught-count").textContent = miniScore; document.getElementById("bonus-gold").textContent = miniScore * 5; break; } } }
    canvas.addEventListener("click", onClick); spawn();
    function draw() {
      if (!miniRunning) return;
      ctx.fillStyle = bg || "#0d0d2b"; ctx.fillRect(0, 0, W, H);
      for (const it of items) { if (!it.alive) continue; it.y += it.speed; if (it.y > H + 30) { it.alive = false; continue; } ctx.font = "32px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(it.emoji, it.x, it.y); }
      for (const p of pops) { p.alpha -= 0.04; if (p.alpha > 0) { ctx.globalAlpha = p.alpha; ctx.fillStyle = "#ffd700"; ctx.font = "bold 16px Nunito"; ctx.textAlign = "center"; ctx.fillText("+" + points, p.x, p.y - 20); ctx.globalAlpha = 1; } }
      pops = pops.filter(p => p.alpha > 0); items = items.filter(i => i.alive);
      requestAnimationFrame(draw);
    }
    draw();
    miniCleanup = () => canvas.removeEventListener("click", onClick);
  };
}

// ====== DODGE HELPER ======
function makeDodgeGame(title, info, emoji, obstacleEmoji, playerEmoji) {
  return function() {
    const canvas = document.getElementById("mini-canvas"); const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height; canvas.style.display = "block";
    document.getElementById("mini-ui").style.display = "none";
    document.getElementById("mini-title").textContent = title;
    document.getElementById("mini-game-info").textContent = info;
    let px = W / 2, alive = true, obs = [], tick = 0, collectibles = [];
    function onMove(e) { const r = canvas.getBoundingClientRect(); px = (e.clientX - r.left) * W / r.width; }
    canvas.addEventListener("mousemove", onMove);
    function draw() {
      if (!miniRunning) return; tick++;
      ctx.fillStyle = "#0a1628"; ctx.fillRect(0, 0, W, H);
      if (tick % 25 === 0) obs.push({ x: Math.random() * W, y: -20, s: 2 + Math.random() * 2 });
      if (tick % 40 === 0) collectibles.push({ x: Math.random() * W, y: -20, s: 1.5 + Math.random() * 1.5 });
      for (const c of obs) { c.y += c.s; if (alive && Math.abs(c.x - px) < 20 && Math.abs(c.y - (H - 30)) < 20) alive = false; ctx.font = "22px serif"; ctx.textAlign = "center"; ctx.fillText(obstacleEmoji, c.x, c.y); }
      for (const c of collectibles) { c.y += c.s; if (alive && Math.abs(c.x - px) < 22 && Math.abs(c.y - (H - 30)) < 22) { c.y = 9999; miniScore += 2; document.getElementById("caught-count").textContent = miniScore; document.getElementById("bonus-gold").textContent = miniScore * 5; } ctx.font = "22px serif"; ctx.textAlign = "center"; ctx.fillText(emoji, c.x, c.y); }
      obs = obs.filter(c => c.y < H + 30); collectibles = collectibles.filter(c => c.y < H + 30);
      ctx.font = "28px serif"; ctx.textAlign = "center"; ctx.fillText(alive ? playerEmoji : "\uD83D\uDCA5", px, H - 30);
      if (!alive) { ctx.fillStyle = "#fff"; ctx.font = "bold 22px Nunito"; ctx.textAlign = "center"; ctx.fillText("Game Over!", W / 2, H / 2); }
      requestAnimationFrame(draw);
    }
    draw();
    miniCleanup = () => canvas.removeEventListener("mousemove", onMove);
  };
}

// 55: Coin Flip
function initCoinFlip() {
  const canvas = document.getElementById("mini-canvas"); const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height; canvas.style.display = "block";
  document.getElementById("mini-ui").style.display = "none";
  document.getElementById("mini-title").textContent = "Coin Flip!";
  document.getElementById("mini-game-info").textContent = "Guess heads or tails! Click left=Heads, right=Tails";
  let result = "", showing = false, anim = 0;
  function onClick(e) {
    if (showing || !miniRunning) return;
    const r = canvas.getBoundingClientRect(); const x = (e.clientX - r.left) * W / r.width;
    const guess = x < W / 2 ? "H" : "T";
    result = Math.random() > 0.5 ? "H" : "T";
    showing = true; anim = 30;
    setTimeout(() => {
      if (guess === result) { miniScore += 2; document.getElementById("caught-count").textContent = miniScore; document.getElementById("bonus-gold").textContent = miniScore * 5; }
      showing = false;
    }, 1000);
  }
  canvas.addEventListener("click", onClick);
  function draw() {
    if (!miniRunning) return;
    ctx.fillStyle = "#0d0d2b"; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#333"; ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
    ctx.fillStyle = "#6bbaff"; ctx.font = "bold 24px Nunito"; ctx.textAlign = "center";
    ctx.fillText("HEADS", W / 4, H / 2 - 40); ctx.fillText("TAILS", 3 * W / 4, H / 2 - 40);
    ctx.font = "50px serif"; ctx.fillText("\uD83E\uDE99", W / 4, H / 2 + 30); ctx.fillText("\uD83E\uDE99", 3 * W / 4, H / 2 + 30);
    if (showing) {
      ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ffd700"; ctx.font = "bold 36px Nunito"; ctx.textAlign = "center";

// 57: Tic Tac Toe
function initTicTacToe() {
  const canvas = document.getElementById("mini-canvas"); const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height; canvas.style.display = "block";
  document.getElementById("mini-ui").style.display = "none";
  document.getElementById("mini-title").textContent = "Tic Tac Toe!";
  document.getElementById("mini-game-info").textContent = "Beat the computer!";
  let board = Array(9).fill(0), turn = 1, msg = "Your turn (X)";
  const sz = 70, ox = (W - sz * 3) / 2, oy = (H - sz * 3) / 2;
  function win(b, p) { const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; return w.some(l => l.every(i => b[i] === p)); }
  function getC(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
  function cpuMove() {
    const empty = board.map((v, i) => v === 0 ? i : -1).filter(i => i >= 0);
    if (empty.length === 0) return;
    // Try to win, then block, then random
    for (const i of empty) { board[i] = -1; if (win(board, -1)) return; board[i] = 0; }
    for (const i of empty) { board[i] = 1; if (win(board, 1)) { board[i] = -1; return; } board[i] = 0; }
    if (board[4] === 0) { board[4] = -1; return; }
    board[empty[Math.floor(Math.random() * empty.length)]] = -1;
  }
  function onClick(e) {
    if (turn !== 1 || !miniRunning) return;
    const { x, y } = getC(e);
    const col = Math.floor((x - ox) / sz), row = Math.floor((y - oy) / sz);
    if (col < 0 || col > 2 || row < 0 || row > 2) return;
    const idx = row * 3 + col;
    if (board[idx] !== 0) return;
    board[idx] = 1;
    if (win(board, 1)) { msg = "You win! +5"; miniScore += 5; document.getElementById("caught-count").textContent = miniScore; document.getElementById("bonus-gold").textContent = miniScore * 5; setTimeout(() => { board = Array(9).fill(0); turn = 1; msg = "Your turn (X)"; }, 1000); return; }
    if (board.every(v => v !== 0)) { msg = "Tie!"; setTimeout(() => { board = Array(9).fill(0); turn = 1; msg = "Your turn (X)"; }, 1000); return; }
    turn = -1; msg = "CPU thinking...";
    setTimeout(() => { cpuMove(); if (win(board, -1)) { msg = "CPU wins!"; setTimeout(() => { board = Array(9).fill(0); turn = 1; msg = "Your turn (X)"; }, 1000); } else { turn = 1; msg = "Your turn (X)"; } }, 400);
  }
  canvas.addEventListener("click", onClick);
  function draw() {
    if (!miniRunning) return;
    ctx.fillStyle = "#0d0d2b"; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#3a2a6e"; ctx.lineWidth = 3;
    for (let i = 1; i < 3; i++) { ctx.beginPath(); ctx.moveTo(ox + i * sz, oy); ctx.lineTo(ox + i * sz, oy + 3 * sz); ctx.stroke(); ctx.beginPath(); ctx.moveTo(ox, oy + i * sz); ctx.lineTo(ox + 3 * sz, oy + i * sz); ctx.stroke(); }
    for (let i = 0; i < 9; i++) { const cx = ox + (i % 3) * sz + sz / 2, cy = oy + Math.floor(i / 3) * sz + sz / 2;
      if (board[i] === 1) { ctx.strokeStyle = "#6bbaff"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx - 18, cy - 18); ctx.lineTo(cx + 18, cy + 18); ctx.moveTo(cx + 18, cy - 18); ctx.lineTo(cx - 18, cy + 18); ctx.stroke(); }
      if (board[i] === -1) { ctx.strokeStyle = "#ff6b9d"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI * 2); ctx.stroke(); }
    }
    ctx.fillStyle = "#aaa"; ctx.font = "14px Nunito"; ctx.textAlign = "center"; ctx.fillText(msg, W / 2, H - 10);
    requestAnimationFrame(draw);
  }
  draw();
  miniCleanup = () => canvas.removeEventListener("click", onClick);
}

function initCookieClicker() {
  const canvas = document.getElementById("mini-canvas"); const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height; canvas.style.display = "block";
  document.getElementById("mini-ui").style.display = "none";
  document.getElementById("mini-title").textContent = "Cookie Clicker!";
  document.getElementById("mini-game-info").textContent = "Click the cookie as many times as you can!";
  let clicks = 0, scale = 1, pops = [];
  function getC(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
  function onClick(e) {
    if (!miniRunning) return;
    const { x, y } = getC(e);
    if (Math.hypot(x - W / 2, y - H / 2) < 60) {
      clicks++; scale = 0.85; miniScore = Math.floor(clicks / 2);
      pops.push({ x: W / 2 + (Math.random() - 0.5) * 40, y: H / 2 - 60, alpha: 1 });
      document.getElementById("caught-count").textContent = miniScore; document.getElementById("bonus-gold").textContent = miniScore * 5;
    }
  }
  canvas.addEventListener("click", onClick);
  function draw() {
    if (!miniRunning) return;
    ctx.fillStyle = "#0d0d2b"; ctx.fillRect(0, 0, W, H);
    scale += (1 - scale) * 0.15;
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(scale, scale);
    ctx.font = "80px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("\uD83C\uDF6A", 0, 0);
    ctx.restore();
    ctx.fillStyle = "#ffd700"; ctx.font = "bold 24px Nunito"; ctx.textAlign = "center"; ctx.fillText(clicks, W / 2, H / 2 + 70);
    for (const p of pops) { p.alpha -= 0.03; p.y -= 1.5; if (p.alpha > 0) { ctx.globalAlpha = p.alpha; ctx.fillStyle = "#ffd700"; ctx.font = "bold 16px Nunito"; ctx.fillText("+1", p.x, p.y); ctx.globalAlpha = 1; } }
    pops = pops.filter(p => p.alpha > 0);
    requestAnimationFrame(draw);
  }
  draw();
  miniCleanup = () => canvas.removeEventListener("click", onClick);
}

// 79: Gravity Balls
function initGravityBalls() {
  const canvas = document.getElementById("mini-canvas"); const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height; canvas.style.display = "block";
  document.getElementById("mini-ui").style.display = "none";
  document.getElementById("mini-title").textContent = "Gravity Balls!";
  document.getElementById("mini-game-info").textContent = "Click to spawn balls, they bounce and score!";
  let balls = [];
  function onClick(e) {
    if (!miniRunning) return;
    const r = canvas.getBoundingClientRect();
    balls.push({ x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height, vx: (Math.random() - 0.5) * 5, vy: -3, r: 8 + Math.random() * 8, hue: Math.floor(Math.random() * 360), bounces: 0 });
  }
  canvas.addEventListener("click", onClick);
  function draw() {
    if (!miniRunning) return;
    ctx.fillStyle = "rgba(13,13,43,0.3)"; ctx.fillRect(0, 0, W, H);
    for (const b of balls) {
      b.vy += 0.15; b.x += b.vx; b.y += b.vy;
      if (b.x < b.r || b.x > W - b.r) b.vx *= -0.9;
      if (b.y > H - b.r) { b.y = H - b.r; b.vy *= -0.7; b.bounces++; if (b.bounces === 1) { miniScore++; document.getElementById("caught-count").textContent = miniScore; document.getElementById("bonus-gold").textContent = miniScore * 5; } }
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsl(${b.hue},70%,60%)`; ctx.fill();
    }
    balls = balls.filter(b => b.bounces < 8);
    requestAnimationFrame(draw);
  }
  draw();
  miniCleanup = () => canvas.removeEventListener("click", onClick);
}

// 80: Laser Bounce
function initLaserBounce() {
  const canvas = document.getElementById("mini-canvas"); const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height; canvas.style.display = "block";
  document.getElementById("mini-ui").style.display = "none";
  document.getElementById("mini-title").textContent = "Laser Bounce!";
  document.getElementById("mini-game-info").textContent = "Click to place mirrors, watch the laser bounce!";
  let mirrors = [], laser = { x: 0, y: H / 2, dx: 3, dy: -1 }, tick = 0;
  function onClick(e) {
    if (!miniRunning) return;
    const r = canvas.getBoundingClientRect();
    const mx = (e.clientX - r.left) * W / r.width, my = (e.clientY - r.top) * H / r.height;
    mirrors.push({ x: mx, y: my, angle: Math.random() * Math.PI });
    miniScore++; document.getElementById("caught-count").textContent = miniScore; document.getElementById("bonus-gold").textContent = miniScore * 5;
  }
  canvas.addEventListener("click", onClick);
  function draw() {
    if (!miniRunning) return; tick++;
    ctx.fillStyle = "rgba(13,13,43,0.1)"; ctx.fillRect(0, 0, W, H);
    // Laser
    laser.x += laser.dx; laser.y += laser.dy;
    if (laser.x < 0 || laser.x > W) laser.dx *= -1;
    if (laser.y < 0 || laser.y > H) laser.dy *= -1;
    for (const m of mirrors) { if (Math.hypot(laser.x - m.x, laser.y - m.y) < 15) { laser.dx = Math.cos(m.angle) * 3; laser.dy = Math.sin(m.angle) * 3; } }
    ctx.fillStyle = "#ff0000"; ctx.beginPath(); ctx.arc(laser.x, laser.y, 4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,0,0,0.3)"; ctx.lineWidth = 2;
    // Mirrors
    for (const m of mirrors) { ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.angle); ctx.fillStyle = "#aaa"; ctx.fillRect(-12, -2, 24, 4); ctx.restore(); }

// 88: Orbit Catcher
function initOrbitCatcher() {
  const canvas = document.getElementById("mini-canvas"); const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height; canvas.style.display = "block";
  document.getElementById("mini-ui").style.display = "none";
  document.getElementById("mini-title").textContent = "Orbit Catcher!";
  document.getElementById("mini-game-info").textContent = "Click when the orbiting dot passes over the target!";
  let angle = 0, targetAngle = Math.random() * Math.PI * 2, hits = 0;
  function onClick() {
    if (!miniRunning) return;
    const diff = Math.abs(angle % (Math.PI * 2) - targetAngle);
    if (diff < 0.4 || diff > Math.PI * 2 - 0.4) {
      miniScore += 3; hits++;
      targetAngle = Math.random() * Math.PI * 2;
      document.getElementById("caught-count").textContent = miniScore; document.getElementById("bonus-gold").textContent = miniScore * 5;
    }
  }
  canvas.addEventListener("click", onClick);
  function draw() {
    if (!miniRunning) return;
    ctx.fillStyle = "#0d0d2b"; ctx.fillRect(0, 0, W, H);
    angle += 0.04;
    const cx = W / 2, cy = H / 2, r = 90;
    // Orbit ring
    ctx.strokeStyle = "#3a2a6e"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    // Target zone
    ctx.fillStyle = "rgba(0,255,100,0.3)"; ctx.beginPath(); ctx.arc(cx + Math.cos(targetAngle) * r, cy + Math.sin(targetAngle) * r, 18, 0, Math.PI * 2); ctx.fill();
    // Orbiting dot
    const dx = cx + Math.cos(angle) * r, dy = cy + Math.sin(angle) * r;
    ctx.fillStyle = "#ffd700"; ctx.beginPath(); ctx.arc(dx, dy, 10, 0, Math.PI * 2); ctx.fill();
    // Center
    ctx.font = "30px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("\u2615", cx, cy);
    ctx.fillStyle = "#aaa"; ctx.font = "12px Nunito"; ctx.fillText("Hits: " + hits, cx, cy + 50);
    requestAnimationFrame(draw);
  }
  draw();
  miniCleanup = () => canvas.removeEventListener("click", onClick);
}

// 95: Drawing Game
function initDrawGame() {
  const canvas = document.getElementById("mini-canvas"); const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height; canvas.style.display = "block";
  document.getElementById("mini-ui").style.display = "none";
  document.getElementById("mini-title").textContent = "Free Draw!";
  document.getElementById("mini-game-info").textContent = "Draw anything! Earn points for drawing!";
  let drawing = false, hue = 0, strokes = 0;
  ctx.fillStyle = "#0d0d2b"; ctx.fillRect(0, 0, W, H);
  function getC(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
  function onDown(e) { drawing = true; const { x, y } = getC(e); ctx.beginPath(); ctx.moveTo(x, y); }
  function onMove(e) {
    if (!drawing || !miniRunning) return;
    const { x, y } = getC(e); hue = (hue + 2) % 360;
    ctx.strokeStyle = `hsl(${hue},80%,60%)`; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
    strokes++; if (strokes % 30 === 0) { miniScore++; document.getElementById("caught-count").textContent = miniScore; document.getElementById("bonus-gold").textContent = miniScore * 5; }
  }
  function onUp() { drawing = false; }
  canvas.addEventListener("mousedown", onDown); canvas.addEventListener("mousemove", onMove); canvas.addEventListener("mouseup", onUp);
  miniCleanup = () => { canvas.removeEventListener("mousedown", onDown); canvas.removeEventListener("mousemove", onMove); canvas.removeEventListener("mouseup", onUp); };
}

// 100: Grand Finale - Multi-challenge
function initGrandFinale() {
  const canvas = document.getElementById("mini-canvas"); const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height; canvas.style.display = "block";
  document.getElementById("mini-ui").style.display = "none";
  document.getElementById("mini-title").textContent = "Grand Finale!";
  document.getElementById("mini-game-info").textContent = "Click everything! Bonus points everywhere!";
  let items = [], pops = [], tick = 0;
  const emojis = ["\uD83C\uDF51","\u2B50","\uD83D\uDC8E","\uD83C\uDF6A","\uD83C\uDF88","\u2764\uFE0F","\uD83C\uDF1F","\uD83C\uDF4B","\uD83E\uDD64","\u2615","\uD83C\uDFC6","\uD83D\uDCA7"];
  function spawn() {
    if (!miniRunning) return;
    const count = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      items.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
        emoji: emojis[Math.floor(Math.random() * emojis.length)],
        alive: true, life: 120 + Math.random() * 60, r: 20
      });
    }
    setTimeout(spawn, 800 + Math.random() * 400);
  }
  function getC(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
  function onClick(e) {
    const { x, y } = getC(e);
    for (const it of items) {
      if (it.alive && Math.hypot(x - it.x, y - it.y) < it.r + 10) {
        it.alive = false; miniScore += 2;
        pops.push({ x: it.x, y: it.y, alpha: 1, emoji: it.emoji });
        document.getElementById("caught-count").textContent = miniScore; document.getElementById("bonus-gold").textContent = miniScore * 5;
      }
    }
  }
  canvas.addEventListener("click", onClick); spawn();
  function draw() {
    if (!miniRunning) return;
    ctx.fillStyle = "rgba(13,13,43,0.15)"; ctx.fillRect(0, 0, W, H);
    for (const it of items) {
      if (!it.alive) continue;
      it.x += it.vx; it.y += it.vy; it.life--;
      if (it.x < 0 || it.x > W) it.vx *= -1;
      if (it.y < 0 || it.y > H) it.vy *= -1;
      if (it.life <= 0) { it.alive = false; continue; }
      ctx.font = "28px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.globalAlpha = Math.min(1, it.life / 30); ctx.fillText(it.emoji, it.x, it.y); ctx.globalAlpha = 1;
    }
    for (const p of pops) {
      p.alpha -= 0.04;
      if (p.alpha > 0) { ctx.globalAlpha = p.alpha; ctx.font = "bold 16px Nunito"; ctx.fillStyle = "#ffd700"; ctx.textAlign = "center"; ctx.fillText("+2", p.x, p.y - 20); ctx.font = "20px serif"; ctx.fillText(p.emoji, p.x, p.y - 40); ctx.globalAlpha = 1; }
    }
    pops = pops.filter(p => p.alpha > 0); items = items.filter(i => i.alive);
    // Sparkles
    for (let i = 0; i < 3; i++) { ctx.fillStyle = `hsla(${(tick * 5 + i * 120) % 360},80%,70%,0.3)`; ctx.beginPath(); ctx.arc(Math.random() * W, Math.random() * H, 2, 0, Math.PI * 2); ctx.fill(); }
    tick++;
    requestAnimationFrame(draw);
  }
  draw();
  miniCleanup = () => canvas.removeEventListener("click", onClick);
}

  <div id="loading-bar-container"><div id="loading-bar"></div></div>

function showLoadingScreen(isRestart) {
  // Rebuild loading screen
  let ls = document.getElementById("loading-screen");
  if (!ls) {
    ls = document.createElement("div");
    ls.id = "loading-screen";
    document.body.prepend(ls);
  }
  ls.innerHTML = LOADING_HTML;
  ls.style.display = "flex";
  ls.style.opacity = "1";
  ls.classList.remove("fade-out");
  document.getElementById("game-container").style.display = "none";

  if (!isRestart) loadGame();
  pickAndStartMiniGame();

  let progress = 0;
  const loadInterval = setInterval(() => {
    progress += Math.random() * 4 + 1;
    if (progress > 100) progress = 100;
    document.getElementById("loading-bar").style.width = progress + "%";
    const idx = Math.min(Math.floor(progress / 10), LOADING_TEXTS.length - 1);
    document.getElementById("loading-text").textContent = LOADING_TEXTS[idx];

    if (progress >= 100) {
      clearInterval(loadInterval);
      miniRunning = false;
      if (miniCleanup) { miniCleanup(); miniCleanup = null; }
      const bonus = miniScore * 5;
      state.gold += bonus;

      setTimeout(() => {
        ls.classList.add("fade-out");
        setTimeout(() => {
          ls.style.display = "none";
          document.getElementById("game-container").style.display = "block";
          recalcStats();
          render();
          if (bonus > 0) toast("Bonus: +" + bonus + " gold from mini-game!");
          rebuildWorkerSprites();
          startWorkerAnimation();
          if (!gameLoopStarted) startGameLoop();
        }, 800);
      }, 500);
    }
  }, 300);
}

// ====== GAME LOOP ======
let gameLoopStarted = false;

function startGameLoop() {
  if (gameLoopStarted) return;
  gameLoopStarted = true;

  // Click handler
  document.getElementById("drink-btn").addEventListener("click", (e) => {
    produceDrink(state.drinksPerClick);
    spawnFloat(e.clientX, e.clientY - 20, "+" + formatNum(state.drinksPerClick));
    render();
  });

  // Auto production
  setInterval(() => {
    if (state.drinksPerSec > 0) {
      produceDrink(state.drinksPerSec);
      render();
    }
  }, 1000);

  // Auto save
  setInterval(saveGame, 30000);

  // Tabs
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
    });
  });

  // Save / Restart / Reset
  document.getElementById("save-btn").addEventListener("click", saveGame);
  document.getElementById("restart-btn").addEventListener("click", () => {
    saveGame();
    showLoadingScreen(true);
  });
  document.getElementById("reset-btn").addEventListener("click", resetGame);
}

// ====== START ======
window.addEventListener("load", () => showLoadingScreen(false));
</script>
</body>
</html>
