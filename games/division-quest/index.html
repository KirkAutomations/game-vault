<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Division Quest 🚀</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0a2e;
    --card: #1a1440;
    --accent: #ff6b6b;
    --mint: #51e8c2;
    --gold: #ffd166;
    --purple: #a78bfa;
    --blue: #60a5fa;
    --pink: #f472b6;
    --text: #f0eeff;
    --dim: #7c72a8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Fredoka', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Starfield background */
  .stars {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle var(--dur) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1.2); }
  }

  .game-container {
    position: relative; z-index: 1;
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 24px;
    width: 100%;
  }
  .header h1 {
    font-family: 'Lilita One', sans-serif;
    font-size: 3rem;
    background: linear-gradient(135deg, var(--gold), var(--accent), var(--pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 4px 12px rgba(255,107,107,0.3));
    letter-spacing: 1px;
  }
  .header p {
    color: var(--dim);
    font-size: 1rem;
    margin-top: 4px;
  }

  /* STATS BAR */
  .stats {
    display: flex; gap: 12px; justify-content: center;
    width: 100%; margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: var(--card);
    border: 2px solid rgba(255,255,255,0.06);
    border-radius: 50px;
    padding: 8px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .stat-pill .emoji { font-size: 1.2rem; }
  .stat-pill .val { color: var(--gold); }
  .streak-pill .val { color: var(--mint); }
  .level-pill .val { color: var(--purple); }

  /* MAIN CARD */
  .question-card {
    background: var(--card);
    border: 2px solid rgba(255,255,255,0.06);
    border-radius: 28px;
    padding: 40px 32px;
    text-align: center;
    width: 100%;
    box-shadow: 0 12px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
    transition: transform 0.3s;
  }
  .question-card::before {
    content: '';
    position: absolute; top: -60%; left: -20%;
    width: 140%; height: 100%;
    background: radial-gradient(ellipse, rgba(167,139,250,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .question-card.correct { animation: cardCorrect 0.5s ease; }
  .question-card.wrong { animation: cardWrong 0.4s ease; }
  @keyframes cardCorrect {
    0% { transform: scale(1); }
    30% { transform: scale(1.04); box-shadow: 0 0 40px rgba(81,232,194,0.4); }
    100% { transform: scale(1); }
  }
  @keyframes cardWrong {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-12px); }
    40% { transform: translateX(12px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }

  .division-display {
    font-family: 'Lilita One', sans-serif;
    font-size: 3.5rem;
    margin: 12px 0 8px;
    letter-spacing: 2px;
  }
  .dividend { color: var(--blue); }
  .divide-sign { color: var(--dim); margin: 0 8px; }
  .divisor { color: var(--pink); }

  .hint-text {
    color: var(--dim);
    font-size: 0.9rem;
    margin-bottom: 24px;
    min-height: 1.4em;
  }
  .hint-text span { color: var(--mint); font-weight: 600; }

  /* ANSWER OPTIONS */
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 10px;
  }
  .option-btn {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 2px solid rgba(255,255,255,0.1);
    color: var(--text);
    border-radius: 18px;
    padding: 18px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .option-btn:hover {
    border-color: var(--purple);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(167,139,250,0.25);
    background: linear-gradient(145deg, rgba(167,139,250,0.15), rgba(167,139,250,0.05));
  }
  .option-btn:active { transform: translateY(0); }
  .option-btn.correct-answer {
    border-color: var(--mint) !important;
    background: linear-gradient(145deg, rgba(81,232,194,0.25), rgba(81,232,194,0.1)) !important;
    box-shadow: 0 0 30px rgba(81,232,194,0.3) !important;
    color: var(--mint);
  }
  .option-btn.wrong-answer {
    border-color: var(--accent) !important;
    background: linear-gradient(145deg, rgba(255,107,107,0.25), rgba(255,107,107,0.1)) !important;
    color: var(--accent);
  }
  .option-btn:disabled { cursor: default; pointer-events: none; }

  /* FEEDBACK */
  .feedback {
    margin-top: 20px;
    font-size: 1.15rem;
    font-weight: 600;
    min-height: 2em;
    transition: all 0.3s;
  }
  .feedback.correct-fb { color: var(--mint); }
  .feedback.wrong-fb { color: var(--accent); }

  /* XP BAR */
  .xp-section {
    width: 100%;
    margin-top: 20px;
  }
  .xp-label {
    display: flex; justify-content: space-between;
    font-size: 0.85rem; color: var(--dim);
    margin-bottom: 6px;
  }
  .xp-bar-bg {
    width: 100%;
    height: 14px;
    background: rgba(255,255,255,0.06);
    border-radius: 50px;
    overflow: hidden;
  }
  .xp-bar-fill {
    height: 100%;
    border-radius: 50px;
    background: linear-gradient(90deg, var(--purple), var(--pink));
    transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 0 12px rgba(167,139,250,0.5);
  }

  /* LEVEL UP OVERLAY */
  .level-up-overlay {
    position: fixed; inset: 0;
    background: rgba(15,10,46,0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .level-up-overlay.show { display: flex; }
  .level-up-box {
    text-align: center;
    animation: levelPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes levelPop {
    0% { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .level-up-box .big-emoji { font-size: 5rem; display: block; margin-bottom: 16px; }
  .level-up-box h2 {
    font-family: 'Lilita One', sans-serif;
    font-size: 2.5rem;
    background: linear-gradient(135deg, var(--gold), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .level-up-box p { color: var(--dim); margin: 8px 0 24px; font-size: 1.05rem; }
  .level-up-box button {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.1rem; font-weight: 700;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    border: none; color: white;
    padding: 14px 40px;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(167,139,250,0.4);
    transition: transform 0.2s;
  }
  .level-up-box button:hover { transform: scale(1.06); }

  /* START SCREEN */
  .start-screen {
    text-align: center;
  }
  .start-screen .big-emoji { font-size: 5rem; display: block; margin-bottom: 16px; }
  .start-screen h2 {
    font-family: 'Lilita One', sans-serif;
    font-size: 2rem; color: var(--text);
    margin-bottom: 8px;
  }
  .start-screen p { color: var(--dim); margin-bottom: 28px; line-height: 1.6; }
  .start-btn {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.2rem; font-weight: 700;
    background: linear-gradient(135deg, var(--mint), var(--blue));
    border: none; color: var(--bg);
    padding: 16px 48px;
    border-radius: 50px; cursor: pointer;
    box-shadow: 0 8px 32px rgba(81,232,194,0.35);
    transition: transform 0.2s;
  }
  .start-btn:hover { transform: scale(1.06); }

  /* PARTICLE BURST */
  .particle {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    z-index: 99;
    animation: particleFly 0.8s ease-out forwards;
  }
  @keyframes particleFly {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
  }

  /* Difficulty badges */
  .difficulty-badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 50px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .diff-easy { background: rgba(81,232,194,0.15); color: var(--mint); border: 1px solid rgba(81,232,194,0.3); }
  .diff-medium { background: rgba(255,209,102,0.15); color: var(--gold); border: 1px solid rgba(255,209,102,0.3); }
  .diff-hard { background: rgba(255,107,107,0.15); color: var(--accent); border: 1px solid rgba(255,107,107,0.3); }
  .diff-expert { background: rgba(167,139,250,0.15); color: var(--purple); border: 1px solid rgba(167,139,250,0.3); }

  /* Remainder tag */
  .remainder-tag {
    display: inline-block;
    background: rgba(244,114,182,0.12);
    color: var(--pink);
    padding: 3px 12px;
    border-radius: 50px;
    font-size: 0.8rem;
    font-weight: 600;
    margin-top: 4px;
  }

  @media (max-width: 480px) {
    .header h1 { font-size: 2.2rem; }
    .division-display { font-size: 2.5rem; }
    .question-card { padding: 28px 20px; }
    .option-btn { font-size: 1.2rem; padding: 14px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="game-container" id="app">
  <!-- Start Screen -->
  <div class="start-screen" id="startScreen">
    <span class="big-emoji">🚀</span>
    <h2>Division Quest</h2>
    <p>Blast through division problems across<br>the galaxy! Earn XP, level up, and<br>become a Division Master!</p>
    <button class="start-btn" onclick="startGame()">Launch Mission!</button>
  </div>

  <!-- Game Screen (hidden initially) -->
  <div id="gameScreen" style="display:none; width:100%;">
    <div class="header">
      <h1>Division Quest</h1>
      <p id="subtitle">Explore the math galaxy!</p>
    </div>

    <div class="stats">
      <div class="stat-pill">
        <span class="emoji">⭐</span>
        <span>Score: <span class="val" id="score">0</span></span>
      </div>
      <div class="stat-pill streak-pill">
        <span class="emoji">🔥</span>
        <span>Streak: <span class="val" id="streak">0</span></span>
      </div>
      <div class="stat-pill level-pill">
        <span class="emoji">🪐</span>
        <span>Lv <span class="val" id="level">1</span></span>
      </div>
    </div>

    <div class="question-card" id="questionCard">
      <div class="difficulty-badge diff-easy" id="diffBadge">Easy</div>
      <div class="division-display">
        <span class="dividend" id="dividend">12</span>
        <span class="divide-sign">÷</span>
        <span class="divisor" id="divisor">3</span>
      </div>
      <div class="hint-text" id="hint"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="xp-section">
      <div class="xp-label">
        <span id="xpText">XP: 0 / 100</span>
        <span id="xpLevel">Level 2</span>
      </div>
      <div class="xp-bar-bg">
        <div class="xp-bar-fill" id="xpBar" style="width: 0%"></div>
      </div>
    </div>
  </div>
</div>

<!-- Level Up Overlay -->
<div class="level-up-overlay" id="levelOverlay">
  <div class="level-up-box">
    <span class="big-emoji" id="levelEmoji">🌟</span>
    <h2 id="levelTitle">Level Up!</h2>
    <p id="levelDesc">You reached Level 2! Problems get trickier now.</p>
    <button onclick="dismissLevelUp()">Keep Going! 🚀</button>
  </div>
</div>

<script>
  // === STARS BACKGROUND ===
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 3 + 1;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%; top:${Math.random()*100}%;
      --dur:${Math.random()*3+1.5}s;
      animation-delay:${Math.random()*3}s;
    `;
    starsEl.appendChild(s);
  }

  // === GAME STATE ===
  let score = 0, streak = 0, level = 1, xp = 0;
  let xpToNext = 100;
  let currentAnswer = 0;
  let currentDividend = 0, currentDivisor = 0;
  let questionCount = 0;
  let isAnswering = false;

  const levelConfig = {
    1: { name: 'Easy', class: 'diff-easy', maxDiv: 5, maxResult: 10, remainder: false, xpReward: 15 },
    2: { name: 'Easy+', class: 'diff-easy', maxDiv: 6, maxResult: 12, remainder: false, xpReward: 18 },
    3: { name: 'Medium', class: 'diff-medium', maxDiv: 9, maxResult: 12, remainder: false, xpReward: 22 },
    4: { name: 'Medium+', class: 'diff-medium', maxDiv: 12, maxResult: 15, remainder: false, xpReward: 25 },
    5: { name: 'Hard', class: 'diff-hard', maxDiv: 12, maxResult: 20, remainder: false, xpReward: 30 },
    6: { name: 'Hard+', class: 'diff-hard', maxDiv: 12, maxResult: 25, remainder: true, xpReward: 35 },
    7: { name: 'Expert', class: 'diff-expert', maxDiv: 15, maxResult: 30, remainder: true, xpReward: 40 },
    8: { name: 'Expert+', class: 'diff-expert', maxDiv: 20, maxResult: 50, remainder: true, xpReward: 50 },
  };

  const encouragements = [
    "Stellar! 🌟", "Amazing! 🚀", "Perfect! ✨", "Brilliant! 💫",
    "Cosmic! 🪐", "Superb! 🌈", "On fire! 🔥", "Legend! 👑",
    "Nailed it! 💎", "Genius! 🧠"
  ];
  const wrongMessages = [
    "Not quite! 🤔", "Almost there! 💪", "Try the next one! 🌙",
    "Keep going! 🚀", "You've got this! ⭐"
  ];

  const levelEmojis = ["🌟", "🪐", "🌈", "💫", "🔮", "👑", "🏆", "🌌"];
  const levelTitles = [
    "Space Cadet", "Star Pilot", "Asteroid Ace", "Galaxy Explorer",
    "Nebula Navigator", "Cosmic Captain", "Supernova Scholar", "Division Master"
  ];

  function getConfig() {
    const l = Math.min(level, 8);
    return levelConfig[l];
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateQuestion() {
    const cfg = getConfig();
    let divisor, result, dividend;

    if (cfg.remainder) {
      divisor = randInt(2, cfg.maxDiv);
      result = randInt(1, cfg.maxResult);
      const remainder = randInt(0, divisor - 1);
      dividend = divisor * result + remainder;
      currentAnswer = result;
      if (remainder > 0) {
        currentAnswer = result; // quotient (integer part)
      }
    } else {
      divisor = randInt(2, cfg.maxDiv);
      result = randInt(1, cfg.maxResult);
      dividend = divisor * result;
      currentAnswer = result;
    }

    currentDividend = dividend;
    currentDivisor = divisor;
    return { dividend, divisor, answer: currentAnswer };
  }

  function generateOptions(answer) {
    const opts = new Set([answer]);
    while (opts.size < 4) {
      let offset = randInt(1, Math.max(5, Math.floor(answer * 0.5) + 2));
      let fake = answer + (Math.random() > 0.5 ? offset : -offset);
      if (fake < 0) fake = answer + offset;
      if (fake === answer) fake = answer + 1;
      opts.add(fake);
    }
    return [...opts].sort(() => Math.random() - 0.5);
  }

  function showQuestion() {
    isAnswering = false;
    const q = generateQuestion();
    const cfg = getConfig();
    const card = document.getElementById('questionCard');

    document.getElementById('dividend').textContent = q.dividend;
    document.getElementById('divisor').textContent = q.divisor;

    const badge = document.getElementById('diffBadge');
    badge.textContent = cfg.name;
    badge.className = 'difficulty-badge ' + cfg.class;

    // Hint
    const hint = document.getElementById('hint');
    const remainder = q.dividend % q.divisor;
    if (remainder > 0 && cfg.remainder) {
      hint.innerHTML = `What is the <span>whole number</span> result?`;
    } else {
      const hints = [
        `How many groups of <span>${q.divisor}</span> fit in <span>${q.dividend}</span>?`,
        `<span>${q.divisor}</span> × ? = <span>${q.dividend}</span>`,
        `Split <span>${q.dividend}</span> into <span>${q.divisor}</span> equal parts`,
      ];
      hint.innerHTML = hints[randInt(0, hints.length - 1)];
    }

    // Options
    const opts = generateOptions(q.answer);
    const optionsEl = document.getElementById('options');
    optionsEl.innerHTML = '';
    opts.forEach(o => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = o;
      btn.onclick = () => checkAnswer(o, btn);
      optionsEl.appendChild(btn);
    });

    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';
    card.classList.remove('correct', 'wrong');

    questionCount++;
  }

  function checkAnswer(chosen, btn) {
    if (isAnswering) return;
    isAnswering = true;

    const card = document.getElementById('questionCard');
    const feedback = document.getElementById('feedback');
    const cfg = getConfig();
    const allBtns = document.querySelectorAll('.option-btn');

    allBtns.forEach(b => {
      b.disabled = true;
      if (parseInt(b.textContent) === currentAnswer) {
        b.classList.add('correct-answer');
      }
    });

    if (chosen === currentAnswer) {
      card.classList.add('correct');
      btn.classList.add('correct-answer');
      const streakBonus = Math.min(streak, 5);
      const earned = cfg.xpReward + streakBonus * 3;
      score += 10 + streakBonus * 2;
      streak++;
      xp += earned;

      feedback.textContent = encouragements[randInt(0, encouragements.length - 1)] + ` +${earned} XP`;
      feedback.className = 'feedback correct-fb';

      burstParticles(btn);
      checkLevelUp();
    } else {
      card.classList.add('wrong');
      btn.classList.add('wrong-answer');
      const remainder = currentDividend % currentDivisor;
      let explain = `${currentDividend} ÷ ${currentDivisor} = ${currentAnswer}`;
      if (remainder > 0) explain += ` remainder ${remainder}`;
      feedback.innerHTML = wrongMessages[randInt(0, wrongMessages.length-1)] + `<br><span style="font-size:0.9rem;color:var(--dim)">${explain}</span>`;
      feedback.className = 'feedback wrong-fb';
      streak = 0;
    }

    updateUI();
    setTimeout(showQuestion, 1800);
  }

  function checkLevelUp() {
    if (xp >= xpToNext) {
      xp -= xpToNext;
      level++;
      xpToNext = Math.floor(xpToNext * 1.35);

      setTimeout(() => {
        const lvl = Math.min(level, 8);
        document.getElementById('levelEmoji').textContent = levelEmojis[lvl - 1] || '🌌';
        document.getElementById('levelTitle').textContent = `Level ${level}!`;
        document.getElementById('levelDesc').textContent = `You are now a ${levelTitles[Math.min(level-1, 7)]}!`;
        document.getElementById('levelOverlay').classList.add('show');
      }, 600);
    }
  }

  function dismissLevelUp() {
    document.getElementById('levelOverlay').classList.remove('show');
    updateUI();
  }

  function updateUI() {
    document.getElementById('score').textContent = score;
    document.getElementById('streak').textContent = streak;
    document.getElementById('level').textContent = level;
    document.getElementById('xpText').textContent = `XP: ${xp} / ${xpToNext}`;
    document.getElementById('xpLevel').textContent = `Level ${level + 1}`;
    document.getElementById('xpBar').style.width = `${(xp / xpToNext) * 100}%`;
  }

  // === PARTICLE BURST ===
  function burstParticles(el) {
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const colors = ['#51e8c2', '#ffd166', '#a78bfa', '#f472b6', '#60a5fa'];

    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = randInt(5, 12);
      const angle = (Math.PI * 2 * i) / 14 + Math.random() * 0.5;
      const dist = randInt(40, 120);
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${cx}px; top:${cy}px;
        background:${colors[i % colors.length]};
        --tx:${Math.cos(angle)*dist}px;
        --ty:${Math.sin(angle)*dist}px;
      `;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 900);
    }
  }

  // === START ===
  function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'block';
    showQuestion();
  }

  // Keyboard support
  document.addEventListener('keydown', e => {
    if (isAnswering) return;
    const btns = document.querySelectorAll('.option-btn');
    const key = parseInt(e.key);
    if (key >= 1 && key <= 4 && btns[key-1]) {
      btns[key-1].click();
    }
  });
</script>

</body>
</html>
