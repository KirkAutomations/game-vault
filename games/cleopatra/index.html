<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleopatra: The Realist Queen</title>
    <style>
        :root {
            --gold: #d4af37;
            --sand: #f4e4bc;
            --blood: #8b0000;
            --dark: #1a1a1a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--sand);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        #game-container {
            width: 90%;
            max-width: 800px;
            background: #2a2a2a;
            padding: 2rem;
            border-radius: 12px;
            border: 2px solid var(--gold);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-weight: bold;
            color: var(--gold);
        }
        .event-image {
            width: 100%;
            height: 200px;
            background: #333;
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-style: italic;
            border-bottom: 1px solid var(--gold);
        }
        .theory-box {
            background: rgba(212, 175, 55, 0.1);
            border-left: 4px solid var(--gold);
            padding: 1rem;
            margin: 1rem 0;
            font-size: 0.9rem;
        }
        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
            font-size: 1rem;
        }
        button:hover {
            background: var(--gold);
            color: var(--dark);
        }
        .hidden { display: none; }
        h1, h2 { color: var(--gold); margin-top: 0; }
        #log { margin-top: 1rem; font-size: 0.85rem; color: #aaa; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="stats" class="stats-bar">
        <span>Legitimacy: <span id="stat-legitimacy">50</span></span>
        <span>Egypt's Wealth: <span id="stat-wealth">50</span></span>
        <span>Roman Favor: <span id="stat-favor">30</span></span>
    </div>

    <div id="game-content">
        <h2 id="event-title">The Siege of Alexandria</h2>
        <div id="theory-note" class="theory-box"></div>
        <p id="event-desc">Your brother Ptolemy XIII has exiled you. Julius Caesar has arrived in Egypt. To regain your throne, you must navigate the 'Anarchy' of international relations.</p>
        
        <div class="choices" id="choices-container">
            </div>
        <div id="log"></div>
    </div>
</div>

<script>
    const state = {
        legitimacy: 50,
        wealth: 60,
        favor: 30,
        currentStep: 0
    };

    const events = [
        {
            title: "The Carpet Gambit (48 BCE)",
            theory: "REALISM: The State as a Unitary Actor. Cleopatra recognizes that Egypt's survival depends on the primary power of the era: Rome. Personal charisma is a tool of statecraft.",
            desc: "You are in exile. Julius Caesar is in the palace. If you approach openly, your brother's guards will kill you. Do you smuggle yourself in to meet the Roman General?",
            choices: [
                {
                    text: "Smuggle yourself in a laundry bag to meet Caesar.",
                    effect: { favor: 30, legitimacy: 10, wealth: -10 },
                    log: "Caesar is impressed by your boldness. The alliance begins."
                },
                {
                    text: "Stay in exile and build a local Egyptian army.",
                    effect: { favor: -20, legitimacy: 20, wealth: -20 },
                    log: "Without Roman support, your brother's professional army eventually finds and executes you. Game Over.",
                    gameOver: true
                }
            ]
        },
        {
            title: "The Death of Caesar (44 BCE)",
            theory: "REALISM: Balance of Power. The sudden vacuum in Rome creates a 'Security Dilemma.' Helping the wrong side leads to total destruction.",
            desc: "Caesar is dead. Rome is split between his assassins (Brutus/Cassius) and his heirs (Antony/Octavian). Both sides demand Egyptian gold and ships.",
            choices: [
                {
                    text: "Wait and see. Hedge your bets until a winner emerges.",
                    effect: { favor: -10, wealth: 10, legitimacy: 0 },
                    log: "A classic realist move, but both sides now distrust your loyalty."
                },
                {
                    text: "Openly support Mark Antony; he controls the East.",
                    effect: { favor: 40, wealth: -20, legitimacy: 10 },
                    log: "Antony is the 'Strongman' of the East. This is a high-stakes power play."
                }
            ]
        },
        {
            title: "The Donations of Alexandria",
            theory: "REALISM: Rational Choice. You attempt to expand Egypt's borders using Antony's legions. You are trading wealth for 'Hard Power'.",
            desc: "Antony grants you Roman territories in the Levant and Cyprus. This makes Egypt a superpower again, but it infuriates the Roman Senate.",
            choices: [
                {
                    text: "Accept the lands. Egypt must be strong to survive.",
                    effect: { favor: -30, wealth: 30, legitimacy: 40 },
                    log: "Egypt reaches its zenith, but Octavian uses this as propaganda to declare you a foreign threat."
                },
                {
                    text: "Refuse the lands to avoid provoking Rome.",
                    effect: { favor: 10, wealth: -10, legitimacy: -20 },
                    log: "You look weak to your subjects. In Realism, perceived weakness invited aggression."
                }
            ]
        },
        {
            title: "The Battle of Actium (31 BCE)",
            theory: "REALISM: The Melian Dialogue principle. 'The strong do what they can and the weak suffer what they must.' Octavian's fleet is superior.",
            desc: "The final showdown. Octavian's fleet has trapped you and Antony. The winds are shifting. Your ships are being burnt.",
            choices: [
                {
                    text: "Abandon the battle and flee to Egypt to save your treasury.",
                    effect: { favor: -50, wealth: 20, legitimacy: -20 },
                    log: "You saved the gold, but lost the war. Octavian is coming for Alexandria."
                },
                {
                    text: "Fight to the last ship.",
                    effect: { favor: 0, wealth: -50, legitimacy: -50 },
                    log: "Your fleet is annihilated. You have no cards left to play. Game Over.",
                    gameOver: true
                }
            ]
        }
    ];

    function updateStats() {
        document.getElementById('stat-legitimacy').innerText = state.legitimacy;
        document.getElementById('stat-wealth').innerText = state.wealth;
        document.getElementById('stat-favor').innerText = state.favor;
    }

    function renderEvent() {
        if (state.currentStep >= events.length) {
            winGame();
            return;
        }

        const event = events[state.currentStep];
        document.getElementById('event-title').innerText = event.title;
        document.getElementById('theory-note').innerText = event.theory;
        document.getElementById('event-desc').innerText = event.desc;
        
        const container = document.getElementById('choices-container');
        container.innerHTML = '';

        event.choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.innerText = choice.text;
            btn.onclick = () => handleChoice(choice);
            container.appendChild(btn);
        });
    }

    function handleChoice(choice) {
        state.legitimacy += choice.effect.legitimacy;
        state.wealth += choice.effect.wealth;
        state.favor += choice.effect.favor;
        
        document.getElementById('log').innerText = choice.log;
        updateStats();

        if (choice.gameOver || state.wealth <= 0 || state.legitimacy <= 0) {
            endGame(choice.log || "You have been deposed.");
        } else {
            state.currentStep++;
            setTimeout(renderEvent, 1000);
        }
    }

    function endGame(msg) {
        document.getElementById('game-content').innerHTML = `<h2>GAME OVER</h2><p>${msg}</p><button onclick="location.reload()">Try to Rule Again</button>`;
    }

    function winGame() {
        document.getElementById('game-content').innerHTML = `
            <h2>The End of an Era</h2>
            <p>You survived longer than any other Ptolemaic ruler could have. While Octavian eventually conquered Egypt, your realist maneuvers ensured that your dynasty went out in a blaze of glory rather than a whimper of obscurity.</p>
            <div class="theory-box">
                <strong>Final Lesson:</strong> Realism teaches us that the international stage is an "anarchy" with no higher power to protect you. Cleopatra didn't lose because she was "immoral"; she lost because the material power of Rome (Octavian) eventually outweighed the diplomatic and economic power of Egypt.
            </div>
            <button onclick="location.reload()">Restart</button>
        `;
    }

    renderEvent();
</script>

</body>
</html>
