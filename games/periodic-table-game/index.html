<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElementQuest - Periodic Table Dungeon Crawler</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 960px;
            height: 640px;
        }
        canvas {
            display: block;
            border: 2px solid #333;
            border-radius: 4px;
            image-rendering: pixelated;
        }
        #uiOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 960px;
            height: 640px;
            pointer-events: none;
            z-index: 10;
        }
        #uiOverlay.active { pointer-events: auto; }
        .ui-panel {
            display: none;
            position: absolute;
            background: rgba(10, 10, 30, 0.95);
            border: 2px solid #4af;
            border-radius: 8px;
            padding: 20px;
            color: #eee;
        }
        .ui-panel.visible { display: block; }
        .btn {
            background: linear-gradient(180deg, #2a4a6a, #1a2a4a);
            border: 1px solid #4af;
            color: #4af;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .btn:hover {
            background: linear-gradient(180deg, #3a6a9a, #2a4a6a);
            color: #fff;
            box-shadow: 0 0 10px rgba(68, 170, 255, 0.3);
        }
        .btn.primary {
            background: linear-gradient(180deg, #4a2a6a, #2a1a4a);
            border-color: #a4f;
            color: #a4f;
        }
        .btn.primary:hover {
            background: linear-gradient(180deg, #6a3a9a, #4a2a6a);
            color: #fff;
        }
        .btn.danger {
            border-color: #f44;
            color: #f44;
        }
        .element-card {
            display: inline-block;
            width: 60px;
            height: 70px;
            border: 2px solid;
            border-radius: 4px;
            text-align: center;
            padding: 4px;
            margin: 3px;
            font-size: 10px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .element-card:hover { transform: scale(1.1); }
        .element-card .symbol { font-size: 20px; font-weight: bold; }
        .element-card .number { font-size: 9px; }
        .element-card .name { font-size: 8px; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="960" height="640"></canvas>
        <div id="uiOverlay"></div>
    </div>

    <script src="elements.js"></script>
    <script src="sprites.js"></script>
    <script src="engine.js"></script>
    <script src="dungeon.js"></script>
    <script src="combat.js"></script>
    <script src="idle.js"></script>
    <script src="minigames.js"></script>
    <script src="ui.js"></script>
    <script src="main.js"></script>

<script src="../js/inject-toast.js"></script>
</body>
</html>
