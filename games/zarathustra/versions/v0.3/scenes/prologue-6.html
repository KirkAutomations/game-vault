<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>§6 — The Fall · Thus Spoke Zarathustra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #eae4d2;
    --ink-dim: #8a8678;
    --paper: #0b0a08;
    --accent: #d4a017;
    --blood: #9e3a2c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  canvas {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block;
  }
  .topbar {
    position: fixed;
    top: 1rem; left: 1.25rem;
    display: flex; align-items: center; gap: 1rem;
    z-index: 10;
  }
  .topbar a {
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    border: 1px solid var(--ink-dim);
    padding: 0.4rem 0.85rem;
    transition: all 0.3s ease;
  }
  .topbar a:hover { color: var(--accent); border-color: var(--accent); }
  .chapter {
    color: var(--accent);
    font-size: 0.78rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-style: normal;
  }

  /* Narration caption */
  #caption {
    position: fixed;
    left: 50%;
    bottom: 18vh;
    transform: translateX(-50%);
    max-width: 720px;
    width: min(86vw, 720px);
    color: var(--ink);
    font-size: clamp(1.1rem, 2.1vw, 1.45rem);
    line-height: 1.55;
    font-style: italic;
    text-align: center;
    letter-spacing: 0.01em;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
    z-index: 5;
    text-shadow: 0 2px 12px rgba(0,0,0,0.9);
  }
  #caption.visible { opacity: 1; }

  /* Dying man speech bubble */
  #speech {
    position: fixed;
    left: 50%;
    bottom: 42vh;
    transform: translateX(-50%);
    max-width: 620px;
    width: min(86vw, 620px);
    color: var(--ink);
    font-size: clamp(1rem, 1.9vw, 1.3rem);
    line-height: 1.55;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
    z-index: 5;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  }
  #speech.visible { opacity: 1; }
  #speech .tag {
    display: block;
    color: var(--ink-dim);
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    font-style: normal;
  }

  /* Choice panel */
  #choices {
    position: fixed;
    left: 50%;
    bottom: 3vh;
    transform: translateX(-50%);
    width: min(92vw, 820px);
    display: none;
    flex-direction: column;
    gap: 0.55rem;
    z-index: 6;
  }
  #choices.visible { display: flex; }
  .choice {
    background: rgba(11,10,8,0.85);
    border: 1px solid var(--ink-dim);
    color: var(--ink);
    font-family: inherit;
    font-size: 1.05rem;
    padding: 0.85rem 1.2rem;
    text-align: left;
    cursor: pointer;
    font-style: italic;
    line-height: 1.45;
    transition: border-color 0.25s ease, background 0.25s ease, transform 0.15s ease;
  }
  .choice:hover {
    border-color: var(--accent);
    background: rgba(212,160,23,0.07);
    transform: translateX(3px);
  }
  .choice .lead {
    font-style: normal;
    color: var(--accent);
    margin-right: 0.55rem;
    letter-spacing: 0.12em;
    font-size: 0.85rem;
  }
  .choice.taken { opacity: 0.4; pointer-events: none; }
  .choice.correct {
    border-color: var(--accent);
    color: var(--accent);
  }
  .choice.wrong {
    border-color: var(--blood);
    color: var(--blood);
  }

  /* Center prompt (kneel button) */
  #prompt {
    position: fixed;
    left: 50%;
    bottom: 24vh;
    transform: translateX(-50%);
    z-index: 7;
    display: none;
  }
  #prompt.visible { display: block; }
  #prompt button {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: inherit;
    font-size: 1rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 0.75rem 1.8rem;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  #prompt button:hover {
    background: rgba(212,160,23,0.12);
  }

  /* Final overlay */
  #ending {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.94);
    z-index: 50;
    padding: 2rem;
    text-align: center;
    opacity: 0;
    transition: opacity 2s ease;
  }
  #ending.visible { display: flex; opacity: 1; }
  #ending h2 {
    font-weight: 500;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    letter-spacing: 0.05em;
    margin: 0 0 0.8rem;
  }
  #ending .final-line {
    font-style: italic;
    color: var(--ink);
    font-size: clamp(1.1rem, 2vw, 1.45rem);
    line-height: 1.55;
    max-width: 620px;
    margin: 0 0 2rem;
  }
  #ending .final-source {
    color: var(--ink-dim);
    font-size: 0.78rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
  }
  #ending .return {
    color: var(--ink-dim);
    border: 1px solid var(--ink-dim);
    padding: 0.6rem 1.4rem;
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: all 0.3s ease;
  }
  #ending .return:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  /* Begin overlay */
  #begin {
    position: fixed; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    z-index: 40;
    transition: opacity 1.2s ease;
  }
  #begin.hidden { opacity: 0; pointer-events: none; }
  #begin .n {
    color: var(--accent);
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 0.7rem;
  }
  #begin h1 {
    font-weight: 500;
    font-size: clamp(2rem, 6vw, 3.4rem);
    letter-spacing: 0.04em;
    margin: 0 0 2rem;
  }
  #begin button {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: inherit;
    font-size: 1rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 0.7rem 1.6rem;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  #begin button:hover {
    background: rgba(212,160,23,0.12);
  }
  #begin .hint {
    color: var(--ink-dim);
    font-style: italic;
    font-size: 0.95rem;
    margin-top: 1.2rem;
    max-width: 30ch;
    text-align: center;
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="topbar">
    <a href="../index.html">&larr; hub</a>
    <span class="chapter">Prologue · §6 — The Fall</span>
  </div>

  <div id="caption"></div>
  <div id="speech"><span class="tag">the dying man</span><span class="line"></span></div>
  <div id="choices"></div>
  <div id="prompt"><button id="kneelBtn">Kneel beside him</button></div>

  <div id="begin">
    <div class="n">Prologue · §6</div>
    <h1>The Fall</h1>
    <button id="startBtn">Begin</button>
    <div class="hint">The tightrope walker is halfway across.<br/>A jester has emerged from the tower.</div>
  </div>

  <div id="ending">
    <h2 id="endTitle">The body grows cold.</h2>
    <div class="final-line" id="endLine"></div>
    <div class="final-source" id="endSource"></div>
    <a class="return" href="../index.html">Return to the hub</a>
  </div>

<script src="../sdk.js"></script>
<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // Scene state
  const state = {
    phase: 'idle',         // idle | fall | kneel | dialogue | ending
    t: 0,                  // global time (ms since begin)
    startT: 0,             // when we began the fall animation
    walkerX: 0.5,          // normalized rope position (0..1)
    walkerY: 0.22,         // normalized vertical position on rope
    walkerFalling: false,
    walkerFallT: 0,        // ms since fall started
    jesterOnRope: false,
    jesterX: 0.08,
    jesterY: 0.22,
    jesterLeapT: -1,
    bodyLanded: false,
    crowdShock: 0,         // 0..1
    crowdDispersed: 0,     // 0..1
    lanternFlicker: 0,
    pulse: 1,              // heartbeat for dying man
    pulseRate: 1,
    zaraRaised: false,
    heartBeat: 0,
  };

  // Rope endpoints (normalized)
  const rope = {
    leftX: 0.15, rightX: 0.85, y: 0.22,
    sag: 0.02,
  };

  function drawBackground() {
    // deep night sky gradient with dusk remnant on the horizon
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#070609');
    g.addColorStop(0.55, '#0d0a10');
    g.addColorStop(0.78, '#1a0f0c');
    g.addColorStop(1, '#0b0706');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // distant mountains silhouette
    ctx.fillStyle = '#05040a';
    ctx.beginPath();
    ctx.moveTo(0, H * 0.55);
    for (let x = 0; x <= W; x += 30) {
      const h = 0.55 + Math.sin(x * 0.003) * 0.04 + Math.sin(x * 0.017) * 0.02;
      ctx.lineTo(x, H * h);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
    ctx.fill();

    // stars
    ctx.fillStyle = 'rgba(234,228,210,0.5)';
    for (let i = 0; i < 60; i++) {
      const sx = (i * 37.3) % W;
      const sy = ((i * 73.1) % (H * 0.4));
      const tw = 0.3 + 0.7 * Math.abs(Math.sin(state.t * 0.001 + i));
      ctx.globalAlpha = 0.25 * tw;
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
    ctx.globalAlpha = 1;
  }

  function drawTowers() {
    // two stone towers flanking the marketplace
    ctx.fillStyle = '#141014';
    const twW = W * 0.09;
    const twH = H * 0.62;
    // left tower
    ctx.fillRect(W * rope.leftX - twW/2, H * 0.1, twW, twH);
    // right tower
    ctx.fillRect(W * rope.rightX - twW/2, H * 0.1, twW, twH);

    // tower tops
    ctx.fillStyle = '#1c171d';
    ctx.beginPath();
    ctx.moveTo(W * rope.leftX - twW/2 - 6, H * 0.1);
    ctx.lineTo(W * rope.leftX + twW/2 + 6, H * 0.1);
    ctx.lineTo(W * rope.leftX + twW/2, H * 0.07);
    ctx.lineTo(W * rope.leftX - twW/2, H * 0.07);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W * rope.rightX - twW/2 - 6, H * 0.1);
    ctx.lineTo(W * rope.rightX + twW/2 + 6, H * 0.1);
    ctx.lineTo(W * rope.rightX + twW/2, H * 0.07);
    ctx.lineTo(W * rope.rightX - twW/2, H * 0.07);
    ctx.closePath();
    ctx.fill();

    // small tower doors (where walker/jester emerge)
    ctx.fillStyle = '#070608';
    const doorW = twW * 0.3, doorH = twH * 0.08;
    ctx.fillRect(W * rope.leftX - doorW/2, H * 0.19, doorW, doorH);
    ctx.fillRect(W * rope.rightX - doorW/2, H * 0.19, doorW, doorH);
  }

  function drawMarketplace() {
    // stone floor
    const floorY = H * 0.72;
    const grd = ctx.createLinearGradient(0, floorY, 0, H);
    grd.addColorStop(0, '#0d0a08');
    grd.addColorStop(1, '#050403');
    ctx.fillStyle = grd;
    ctx.fillRect(0, floorY, W, H - floorY);

    // cobbles
    ctx.strokeStyle = 'rgba(138,134,120,0.08)';
    ctx.lineWidth = 1;
    for (let y = floorY + 8; y < H; y += 18) {
      for (let x = ((y/18)%2) * 12; x < W; x += 26) {
        ctx.strokeRect(x, y, 24, 16);
      }
    }
  }

  function drawLantern() {
    // one lantern casting warm pool onto the body
    const lx = W * 0.5;
    const ly = H * 0.55;
    state.lanternFlicker = state.lanternFlicker * 0.9 + (0.85 + Math.random() * 0.3) * 0.1;
    const r = Math.min(W, H) * 0.45 * state.lanternFlicker;
    const g = ctx.createRadialGradient(lx, H * 0.78, 5, lx, H * 0.78, r);
    g.addColorStop(0, 'rgba(212,160,23,0.35)');
    g.addColorStop(0.35, 'rgba(180,100,30,0.18)');
    g.addColorStop(1, 'rgba(212,160,23,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // lantern itself (small)
    ctx.fillStyle = '#2a1a0d';
    ctx.fillRect(lx - 4, ly, 8, 22);
    ctx.fillStyle = '#f0b450';
    ctx.beginPath();
    ctx.arc(lx, ly - 4, 5, 0, Math.PI * 2);
    ctx.fill();
    // glow around flame
    const gg = ctx.createRadialGradient(lx, ly - 4, 1, lx, ly - 4, 28);
    gg.addColorStop(0, 'rgba(240,180,80,0.9)');
    gg.addColorStop(1, 'rgba(240,180,80,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(lx, ly - 4, 28, 0, Math.PI * 2); ctx.fill();
  }

  function drawRope() {
    ctx.strokeStyle = '#6e6652';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const x1 = W * rope.leftX, y1 = H * rope.y;
    const x2 = W * rope.rightX, y2 = H * rope.y;
    const xm = (x1 + x2) / 2, ym = (y1 + y2) / 2 + H * rope.sag;
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(xm, ym, x2, y2);
    ctx.stroke();
  }

  function ropePointAt(nx) {
    // nx is 0..1 along left->right
    const x1 = W * rope.leftX, y1 = H * rope.y;
    const x2 = W * rope.rightX, y2 = H * rope.y;
    const xm = (x1 + x2) / 2, ym = (y1 + y2) / 2 + H * rope.sag;
    // quadratic bezier point
    const t = nx;
    const mt = 1 - t;
    const x = mt*mt*x1 + 2*mt*t*xm + t*t*x2;
    const y = mt*mt*y1 + 2*mt*t*ym + t*t*y2;
    return { x, y };
  }

  function drawFigure(x, y, opts) {
    // stylized tiny silhouette
    opts = opts || {};
    const color = opts.color || '#0c0a08';
    const scale = opts.scale || 1;
    const sway = opts.sway || 0;
    const armSpread = opts.armSpread || 0;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(sway);
    ctx.fillStyle = color;
    // head
    ctx.beginPath(); ctx.arc(0, -16 * scale, 3.5 * scale, 0, Math.PI * 2); ctx.fill();
    // body
    ctx.fillRect(-2 * scale, -13 * scale, 4 * scale, 14 * scale);
    // legs
    ctx.fillRect(-2.5 * scale, 1 * scale, 2 * scale, 12 * scale);
    ctx.fillRect(0.5 * scale, 1 * scale, 2 * scale, 12 * scale);
    // arms (balance pole if walker)
    if (opts.pole) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-14 * scale, -6 * scale);
      ctx.lineTo(14 * scale, -6 * scale);
      ctx.stroke();
    } else {
      // arms
      const aw = 4 + armSpread * 8;
      ctx.fillRect(-aw * scale, -10 * scale, aw * scale, 2 * scale);
      ctx.fillRect(0, -10 * scale, aw * scale, 2 * scale);
    }
    // jester hat marker (if jester)
    if (opts.jester) {
      ctx.fillStyle = '#9e3a2c';
      ctx.beginPath();
      ctx.moveTo(-3 * scale, -19 * scale);
      ctx.lineTo(3 * scale, -19 * scale);
      ctx.lineTo(0, -25 * scale);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#d4a017';
      ctx.beginPath(); ctx.arc(0, -25 * scale, 1.3 * scale, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawWalker() {
    if (state.walkerFalling) return;
    const pt = ropePointAt(state.walkerX);
    const sway = Math.sin(state.t * 0.006) * 0.04;
    drawFigure(pt.x, pt.y, { pole: true, sway, scale: 1 });
  }

  function drawJester() {
    if (!state.jesterOnRope) return;
    if (state.jesterLeapT >= 0) {
      // leaping arc over the walker
      const dt = (state.t - state.jesterLeapT) / 1000;   // seconds
      const dur = 0.7;
      if (dt >= dur) return; // has jumped off past frame
      const u = dt / dur;
      const pt = ropePointAt(state.walkerX);
      const arcX = pt.x - 40 + 80 * u;
      const arcY = pt.y - 70 * Math.sin(Math.PI * u);
      drawFigure(arcX, arcY, { jester: true, sway: 0.6, armSpread: 0.8, scale: 1 });
      return;
    }
    const pt = ropePointAt(state.jesterX);
    const sway = Math.sin(state.t * 0.012) * 0.15;
    drawFigure(pt.x, pt.y, { jester: true, sway, armSpread: 0.6, scale: 1 });
  }

  function drawFallingBody() {
    if (!state.walkerFalling || state.bodyLanded) return;
    const pt = ropePointAt(state.walkerX);
    const dt = (state.t - state.walkerFallT) / 1000;
    // free fall with slight tumble
    const y = pt.y + 0.5 * 1400 * dt * dt;
    const x = pt.x + Math.sin(dt * 8) * 8;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(dt * 7);
    drawFigure(0, 0, { armSpread: 1.2, scale: 1 });
    ctx.restore();
    // check landing
    if (y >= H * 0.74) {
      state.bodyLanded = true;
      Zara.thud(0.6);
      setTimeout(() => Zara.thud(0.2), 60);
      onLand();
    }
  }

  function drawCorpse() {
    if (!state.bodyLanded) return;
    // body lies center-left of lantern
    const bx = W * 0.5 + 60;
    const by = H * 0.78;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(0.22);
    ctx.fillStyle = '#0c0a08';
    // torso lying on ground
    ctx.fillRect(-28, -6, 44, 12);
    // head
    ctx.beginPath(); ctx.arc(-32, -2, 5, 0, Math.PI * 2); ctx.fill();
    // legs
    ctx.fillRect(14, -3, 22, 5);
    ctx.fillRect(14, 2, 24, 5);
    // arm flung
    ctx.strokeStyle = '#0c0a08'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-10, -4); ctx.lineTo(-4, -18); ctx.stroke();
    ctx.restore();

    // faint blood pool
    const bg = ctx.createRadialGradient(bx - 10, by + 4, 2, bx - 10, by + 4, 40);
    bg.addColorStop(0, 'rgba(158,58,44,0.35)');
    bg.addColorStop(1, 'rgba(158,58,44,0)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(bx - 10, by + 4, 40, 0, Math.PI * 2); ctx.fill();

    // heartbeat pulse indicator (subtle)
    if (state.phase === 'dialogue' || state.phase === 'kneel') {
      const pulse = 0.5 + 0.5 * Math.sin(state.t * 0.004 * state.pulseRate);
      const pg = ctx.createRadialGradient(bx - 20, by - 2, 3, bx - 20, by - 2, 70 * (0.7 + 0.3 * pulse));
      pg.addColorStop(0, `rgba(212,160,23,${0.08 * pulse})`);
      pg.addColorStop(1, 'rgba(212,160,23,0)');
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.arc(bx - 20, by - 2, 70, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawZarathustra() {
    if (state.phase !== 'kneel' && state.phase !== 'dialogue' && state.phase !== 'ending') return;
    const zx = W * 0.5 - 40;
    const zy = H * 0.78;
    ctx.save();
    ctx.translate(zx, zy);
    ctx.fillStyle = '#1a1612';
    // kneeling posture
    // torso leaning forward
    ctx.save();
    ctx.rotate(-0.25);
    ctx.fillRect(-4, -34, 8, 24);
    // head
    ctx.beginPath(); ctx.arc(0, -40, 5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // legs: one kneeling, one bent
    ctx.fillRect(-6, -10, 6, 12);
    ctx.beginPath();
    ctx.moveTo(2, -10); ctx.lineTo(14, -4); ctx.lineTo(14, 4); ctx.lineTo(2, 0); ctx.closePath();
    ctx.fill();
    // arm reaching toward body
    ctx.strokeStyle = '#1a1612'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(22, -18); ctx.stroke();
    ctx.restore();
  }

  function drawCrowdPanic() {
    if (state.crowdShock <= 0) return;
    // rough silhouettes running outward from lantern
    const n = 22;
    const spread = state.crowdDispersed;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2;
      const dist = 120 + spread * (Math.min(W, H) * 0.6);
      const cx = W * 0.5 + Math.cos(ang) * dist;
      const cy = H * 0.82 + Math.sin(ang) * dist * 0.3;
      if (cy < H * 0.7 || cy > H - 10) continue;
      ctx.globalAlpha = (1 - spread) * 0.9;
      drawFigure(cx, cy, { scale: 0.8, armSpread: 0.5 + spread });
    }
    ctx.globalAlpha = 1;
  }

  function drawCrowdQuiet() {
    // faint remnant of crowd at edges
    if (state.phase === 'fall' || state.phase === 'idle') return;
    // just a handful of onlookers lingering on edges
    const spots = [
      { x: W * 0.08, y: H * 0.78 },
      { x: W * 0.92, y: H * 0.79 },
    ];
    spots.forEach(s => {
      ctx.globalAlpha = 0.35;
      drawFigure(s.x, s.y, { scale: 0.75, armSpread: 0 });
    });
    ctx.globalAlpha = 1;
  }

  function drawVignette() {
    const g = ctx.createRadialGradient(W/2, H*0.75, Math.min(W,H)*0.3, W/2, H*0.5, Math.max(W,H)*0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.65)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  let last = performance.now();
  function frame(now) {
    const dt = now - last; last = now;
    state.t += dt;

    // advance animations
    if (state.phase === 'fall') {
      // phase timeline from fallStart
      const t = (state.t - state.fallStart) / 1000; // seconds
      // walker moves center-ward slowly
      state.walkerX = 0.5 + Math.sin(t * 0.5) * 0.02;

      if (t > 1.5 && !state.jesterOnRope) {
        state.jesterOnRope = true;
        state.jesterX = 0.15;
        Zara.laugh(0.18);
      }
      if (state.jesterOnRope && state.jesterLeapT < 0) {
        // jester chases
        state.jesterX = Math.min(state.walkerX - 0.02, 0.15 + (t - 1.5) * 0.12);
        if (state.jesterX >= state.walkerX - 0.025) {
          // LEAP
          state.jesterLeapT = state.t;
          Zara.scream(0.18);
          // walker falls
          setTimeout(() => {
            state.walkerFalling = true;
            state.walkerFallT = state.t;
            Zara.gasp(0.25);
          }, 280);
        }
      }
      if (state.jesterLeapT >= 0 && state.t - state.jesterLeapT > 800) {
        state.jesterOnRope = false;
      }

      if (state.walkerFalling && !state.bodyLanded) {
        state.crowdShock = Math.min(1, state.crowdShock + dt / 400);
        state.crowdDispersed = Math.min(1, state.crowdDispersed + dt / 1200);
      }
    }

    if (state.phase === 'kneel' || state.phase === 'dialogue') {
      state.crowdDispersed = Math.min(1, state.crowdDispersed + dt / 4000);
    }

    // Render
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawTowers();
    drawMarketplace();
    drawLantern();
    if (state.phase === 'fall' || state.phase === 'idle') drawRope();
    drawCrowdPanic();
    drawCrowdQuiet();
    drawWalker();
    drawJester();
    drawFallingBody();
    drawCorpse();
    drawZarathustra();
    drawVignette();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- Scene orchestration ----

  const captionEl = document.getElementById('caption');
  const speechEl = document.getElementById('speech');
  const speechLineEl = speechEl.querySelector('.line');
  const choicesEl = document.getElementById('choices');
  const promptEl = document.getElementById('prompt');
  const beginEl = document.getElementById('begin');
  const startBtn = document.getElementById('startBtn');
  const kneelBtn = document.getElementById('kneelBtn');
  const endingEl = document.getElementById('ending');
  const endTitleEl = document.getElementById('endTitle');
  const endLineEl = document.getElementById('endLine');
  const endSourceEl = document.getElementById('endSource');

  function showCaption(text, ms) {
    captionEl.textContent = text;
    captionEl.classList.add('visible');
    if (ms) setTimeout(() => captionEl.classList.remove('visible'), ms);
  }
  function hideCaption() { captionEl.classList.remove('visible'); }

  function showSpeech(text) {
    speechLineEl.textContent = '';
    speechEl.classList.add('visible');
    Zara.typewrite(speechLineEl, text, { cps: 36 });
  }
  function hideSpeech() { speechEl.classList.remove('visible'); }

  // ---- The fall sequence ----
  function beginFall() {
    state.phase = 'fall';
    state.fallStart = state.t;
    state.walkerX = 0.5;
    state.walkerY = 0.22;
    state.jesterOnRope = false;
    state.jesterLeapT = -1;
    state.walkerFalling = false;
    state.bodyLanded = false;
    beginEl.classList.add('hidden');
    setTimeout(() => { beginEl.style.display = 'none'; }, 1200);

    Zara.audio();
    Zara.playMurmur(0.06);

    setTimeout(() => {
      showCaption('A jester emerges from the tower.', 3000);
    }, 1200);
    setTimeout(() => {
      showCaption('&ldquo;The tower is where you belong. You block the way for one better than yourself.&rdquo;', 4200);
    }, 3400);
  }

  function onLand() {
    // crowd scatters, narration
    state.phase = 'kneel';
    Zara.stopMurmur();
    setTimeout(() => { state.crowdShock = 0; }, 1500);

    setTimeout(() => {
      showCaption('The market scatters. The body fell beside you. Not yet dead.', 5000);
    }, 900);

    setTimeout(() => {
      hideCaption();
      promptEl.classList.add('visible');
    }, 4500);
  }

  kneelBtn.addEventListener('click', () => {
    promptEl.classList.remove('visible');
    hideCaption();
    startDialogue();
  });

  // ---- Dialogue engine ----

  const EXCHANGES = [
    {
      line: "I have long known that the devil would trip me. Now he will drag me to hell. Would you prevent him?",
      options: [
        { text: "Pray now. God is merciful.", kind: 'christian',
          after: "His eyes shut tight. &ldquo;Then I am already damned.&rdquo;" },
        { text: "By my honor, friend, that of which you speak does not exist: there is no devil and no hell.", kind: 'zarathustra',
          after: "The dying man looks up, suspicious. The fear loosens from his face.",
          quoteId: 'p6-no-hell',
          quoteText: "By my honor, friend, that of which you speak does not exist: there is no devil and no hell.",
          source: "Prologue §6" },
        { text: "The devil tripped you because you were weak.", kind: 'nihilist',
          after: "He turns his head away. A dry laugh, then nothing." },
      ],
    },
    {
      line: "If you speak the truth, I lose nothing when I lose my life. I am not much more than a beast that has been taught to dance by blows and a few meager morsels.",
      options: [
        { text: "Your pain will be rewarded in heaven.", kind: 'christian',
          after: "&ldquo;So even my dying is owed to someone,&rdquo; he whispers." },
        { text: "Then you die as you lived — nothing.", kind: 'nihilist',
          after: "His mouth tightens. He does not speak again this breath." },
        { text: "By no means. You have made danger your vocation; there is nothing contemptible in that.", kind: 'zarathustra',
          after: "Something like gratitude passes over him. He breathes easier.",
          quoteId: 'p6-vocation',
          quoteText: "You have made danger your vocation; there is nothing contemptible in that.",
          source: "Prologue §6" },
      ],
    },
    {
      line: "(He moves his hand. He is searching for yours.)",
      tag: "the dying man",
      options: [
        { text: "Go in peace, child of God.", kind: 'christian',
          after: "His hand finds yours, but he is looking past you, searching for someone else." },
        { text: "Nothing follows. That is all.", kind: 'nihilist',
          after: "His hand closes on air." },
        { text: "Now you perish of your vocation: for that I will bury you with my own hands.", kind: 'zarathustra',
          after: "His fingers grip yours. He does not let go until the breath has gone out of him.",
          quoteId: 'p6-bury',
          quoteText: "You perish of your vocation: for that I will bury you with my own hands.",
          source: "Prologue §6" },
      ],
    },
  ];

  let exchangeIdx = 0;
  let correctCount = 0;
  const chosenKinds = [];

  function startDialogue() {
    state.phase = 'dialogue';
    exchangeIdx = 0;
    correctCount = 0;
    runExchange();
  }

  function runExchange() {
    const ex = EXCHANGES[exchangeIdx];
    if (!ex) { endScene(); return; }

    // label tag switches for parenthetical moments
    const tag = ex.tag || 'the dying man';
    speechEl.querySelector('.tag').textContent = tag;
    state.pulseRate = 1 + exchangeIdx * 0.3;

    showSpeech(ex.line);
    hideChoices();
    setTimeout(() => {
      showChoices(ex);
    }, Math.min(4800, 1200 + ex.line.length * 22));
  }

  function showChoices(ex) {
    choicesEl.innerHTML = '';
    // shuffle order so zarathustran option is not always middle/top
    const order = [0, 1, 2];
    // simple deterministic shuffle per exchangeIdx
    if (exchangeIdx === 0) order.reverse();
    if (exchangeIdx === 2) { order[0] = 2; order[1] = 0; order[2] = 1; }

    order.forEach((oi, i) => {
      const opt = ex.options[oi];
      const b = document.createElement('button');
      b.className = 'choice';
      b.innerHTML = `<span class="lead">${String.fromCharCode(65 + i)}</span><span class="body">${opt.text}</span>`;
      b.addEventListener('click', () => chooseOption(ex, opt, b));
      choicesEl.appendChild(b);
    });
    choicesEl.classList.add('visible');
  }

  function hideChoices() {
    choicesEl.classList.remove('visible');
  }

  function chooseOption(ex, opt, btn) {
    // lock all
    Array.from(choicesEl.children).forEach(c => c.classList.add('taken'));
    btn.classList.remove('taken');
    btn.classList.add(opt.kind === 'zarathustra' ? 'correct' : 'wrong');
    chosenKinds.push(opt.kind);
    if (opt.kind === 'zarathustra') {
      correctCount++;
      if (opt.quoteId) Zara.addQuote(opt.quoteId, opt.quoteText, opt.source);
      Zara.chime(0.05);
    } else {
      // soft thud of failure
      Zara.gasp(0.08);
    }

    // show aftermath narration
    setTimeout(() => {
      hideSpeech();
      hideChoices();
      const aft = document.createElement('div');
      captionEl.innerHTML = opt.after;
      captionEl.classList.add('visible');
    }, 400);

    setTimeout(() => {
      captionEl.classList.remove('visible');
      exchangeIdx++;
      setTimeout(runExchange, 800);
    }, 3800);
  }

  function endScene() {
    state.phase = 'ending';
    state.pulseRate = 0;

    let title, line, source;
    if (correctCount === 3) {
      title = 'The body grows cold.';
      line = '&ldquo;Come, cold, stiff companion! I shall carry you where I may bury you with my own hands.&rdquo;';
      source = 'Prologue §7';
      // Add the companion quote too
      Zara.addQuote('p6-companion',
        "Come, cold, stiff companion! I shall carry you where I may bury you with my own hands.",
        "Prologue §7");
    } else if (correctCount >= 1) {
      title = 'He dies uncertain.';
      line = '&ldquo;Human existence is uncanny and still without meaning: a jester can become man&rsquo;s fatality.&rdquo;';
      source = 'Prologue §7';
      Zara.addQuote('p7-uncanny',
        "Human existence is uncanny and still without meaning: a jester can become man's fatality.",
        "Prologue §7");
    } else {
      title = 'He dies afraid.';
      line = '&ldquo;To men I am still the mean between a fool and a corpse.&rdquo;';
      source = 'Prologue §7';
      Zara.addQuote('p7-fool-corpse',
        "To men I am still the mean between a fool and a corpse.",
        "Prologue §7");
    }

    setTimeout(() => {
      endTitleEl.textContent = title;
      endLineEl.innerHTML = line;
      endSourceEl.textContent = source;
      endingEl.classList.add('visible');
    }, 1500);

    // slow heartbeat to stop
    state.pulseRate = 0.2;
  }

  // Begin
  startBtn.addEventListener('click', () => {
    beginFall();
  });

  // Accessibility: enter begins
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !beginEl.classList.contains('hidden')) {
      startBtn.click();
    }
  });
})();
</script>
</body>
</html>
